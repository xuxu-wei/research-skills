schema_version: 1
plugin: research-skills-openai
inventory_source: workflow-registry.yaml
contract_identity:
  plugin_version_source: .codex-plugin/plugin.json
  registry_version_must_match_manifest: true
  current_idea_schema: research-idea.v3
  current_idea_artifact: idea_dossier
  legacy_idea_schemas:
    - research-idea.v1
    - research-idea.v2
  legacy_behavior: layout_migration_required_read_only_no_automatic_rewrite
license:
  spdx_id: MIT
  plugin_file: LICENSE
  repository_source: ../LICENSE
  resolution_status: resolved
  applies_to:
    - .codex-plugin/**
    - skills/**
    - reports/**
    - AGENTS.md
    - PHASE7-8-RUNBOOK.md
    - PREVIEW-EVIDENCE-CAPTURE.md
    - README.md
    - ROADMAP.md
    - workflow-registry.yaml
    - PROVENANCE.yaml
authorship:
  repository_copyright_notice: Copyright (c) 2026 Xuxu Wei
  per_resource_declared_authors: unknown_not_declared
  policy: Do not infer authorship from Git history or assign third-party authors without a declaration.
resource_groups:
  - name: plugin_profile
    scopes:
      - .codex-plugin/**
      - AGENTS.md
      - PHASE7-8-RUNBOOK.md
      - PREVIEW-EVIDENCE-CAPTURE.md
      - README.md
      - ROADMAP.md
      - workflow-registry.yaml
      - LICENSE
      - PROVENANCE.yaml
    origin: maintained_in_this_repository
    origin_status: resolved
  - name: generated_validation_evidence
    scopes:
      - reports/**
    origin: generated_or_curated_by_repository_validation_workflows
    origin_status: resolved
  - name: openai_native_research_polisher_skills
    scopes:
      - skills/research-polisher-orchestrator/**
      - skills/research-polisher-strategy-reviewer/**
      - skills/research-polisher-plan-assembler/**
      - skills/research-polisher-methodology-publishability-reviewer/**
    origin: maintained_in_this_repository_for_openai_runtime
    origin_status: resolved
skill_resource_derivation:
  registry_fields:
    name: skills[].name
    package: skills[].package
  plugin_scope_template: skills/{name}/**
  hermes_source_template: ../research-skills/{package}/{name}/
  openai_native_package: research-polisher
  openai_native_skills:
    - research-polisher-methodology-publishability-reviewer
    - research-polisher-orchestrator
    - research-polisher-plan-assembler
    - research-polisher-strategy-reviewer
  openai_overlay_scope_template: skills/{name}/agents/**
  content_origin: resolved_by_skill_origin_profile
  origin_profiles:
    hermes_adapted:
      content_origin: adapted_from_corresponding_hermes_source
      source_template: ../research-skills/{package}/{name}/
    openai_native:
      content_origin: maintained_in_this_repository_for_openai_runtime
      source_template: skills/{name}/**
  overlay_origin: maintained_in_this_repository_for_openai_runtime
  origin_status: resolved_when_declared_origin_and_plugin_directories_exist
  license_resolution: repository_root_mit
  per_resource_declared_authors: unknown_not_declared
  unknown_handling: Any missing registry field, declared origin, required source directory, plugin directory, or license mapping is unresolved and fails provenance validation.
declared_third_party_exceptions: []
unresolved_resources: []
