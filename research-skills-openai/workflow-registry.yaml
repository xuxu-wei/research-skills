    source: "research-idea-orchestrator"
    destination: "research-context-builder"
    dispatch_mode: "orchestrated"
    trigger: "context_required"
    input_contract: "user_inputs_and_constraints"
    output_contract: "research_context_brief"
    failure_route: "clarification_required"
  - workflow: "idea"
    source: "research-idea-orchestrator"
    destination: "research-opportunity-mapper"
    dispatch_mode: "orchestrated"
    trigger: "evidence_or_opportunity_map_required"
