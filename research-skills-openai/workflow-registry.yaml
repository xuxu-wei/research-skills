    output_contract: "evidence_and_opportunity_maps"
    failure_route: "evidence_mapping_pending"
  - workflow: "idea"
    source: "research-idea-orchestrator"
    destination: "multi-path-idea-generator"
    dispatch_mode: "orchestrated"
    trigger: "context_and_opportunity_map_ready"
    input_contract: "frozen_context_and_opportunity_artifacts"
    output_contract: "versioned_candidate_set"
    failure_route: "generation_blocked"
  - workflow: "idea"
    source: "research-idea-orchestrator"
    destination: "methodology-statistics-preflight"
    dispatch_mode: "delegated"
    trigger: "method_or_endpoint_fit_needs_review"
    input_contract: "frozen_candidates_and_method_facts"
    output_contract: "preflight_report"
    failure_route: "independent_review_pending"
  - workflow: "idea"
    source: "research-idea-orchestrator"
    destination: "idea-evaluator"
    dispatch_mode: "delegated"
    trigger: "candidate_set_frozen_or_revised"
    input_contract: "frozen_candidates_stable_rubric_and_facts"
    output_contract: "idea_evaluation_report"
    failure_route: "independent_review_pending"
  - workflow: "idea"
    source: "research-idea-orchestrator"
    destination: "idea-adversarial-review-panel"
    dispatch_mode: "delegated"
    trigger: "proposal_handoff_candidate_exists"
    input_contract: "frozen_promoted_candidates_and_role_brief"
    output_contract: "sealed_individual_adversarial_report"
    failure_route: "independent_review_pending"
  - workflow: "idea"
    source: "research-idea-orchestrator"
    destination: "academic-language-assessor"
    dispatch_mode: "delegated"
    trigger: "external_facing_portfolio_language_check"
    input_contract: "frozen_portfolio_text_and_language_scope"
    output_contract: "language_assessment_report"
    failure_route: "independent_review_pending"
  - workflow: "idea"
    source: "research-idea-orchestrator"
    destination: "idea-portfolio-assembler"
    dispatch_mode: "orchestrated"
    trigger: "evaluation_and_adversarial_reports_sealed"
