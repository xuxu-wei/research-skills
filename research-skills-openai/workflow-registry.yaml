    trigger: "human_selected_reposition_only_option"
    input_contract: "selected_evaluator_qualified_repositioning_constraints"
    output_contract: "article_blueprint_state"
    failure_route: "handoff_blocked"
workflow_state_policy:
  state_field: workflow_state
  active_states:
  - initialized
  - preprocessing
  - artifact_frozen
  - revision_required
  - panel_pending
  - packaging_pending
  pause_states:
  - pending_review
  - specialist_review_pending
  - independent_review_pending
  - clarification_stop
  - deep_research_handoff_required
  terminal_states:
  - stopped
  - blocked
  - no_defensible_option
  - human_signoff_required
  - human_strategy_selection_required
  - additional_work_required
  review_unavailable_state: independent_review_pending
  fatal_finding_state: blocked
  final_handoff_state: human_signoff_required
  wildcard_transition_scope: nonterminal_states_only
  resume_policy:
    independent_review_pending: pending_review
    clarification_stop: preprocessing
    deep_research_handoff_required: preprocessing
  version_gate:
    changed_artifact_requires_new_version: true
    evaluator_instance_must_be_fresh: true
    evaluated_version_must_equal_current_version: true
    prior_scores_visible_to_fresh_evaluator: false
    required_before_states:
    - panel_pending
    - packaging_pending
    - human_signoff_required
    - human_strategy_selection_required
  finding_gate:
    fatal_or_blocking_finding_prevents_accept: true
    fatal_or_blocking_finding_prevents_promoted: true
    fatal_or_blocking_finding_prevents_human_signoff: true
    fatal_or_blocking_finding_prevents_human_strategy_selection: true
    panel_dissent_must_remain_visible: true
  concurrency_policy:
    phase_level_delegation_allowed: true
    single_writer_per_source_artifact: true
    concurrent_writes_to_same_source_artifact: false
    reviewer_inputs_read_only: true
    panel_reviewers_may_run_concurrently: true
  lifecycle_transitions:
  - from: initialized
    to: preprocessing
    trigger: entry_gate_passed
  - from: preprocessing
    to: artifact_frozen
    trigger: versioned_artifact_created
  - from: artifact_frozen
    to: pending_review
    trigger: independent_review_dispatched
  - from: pending_review
    to: revision_required
    trigger: fixable_revision_requested
  - from: revision_required
    to: artifact_frozen
    trigger: new_version_created
  - from: pending_review
    to: panel_pending
    trigger: latest_version_accepted
    requires:
    - fresh_evaluation_current
    - no_unresolved_fatal_finding
  - from: pending_review
    to: packaging_pending
    trigger: panel_patch_latest_version_accepted
    requires:
    - prior_panel_complete
    - patch_scope_minor
    - fresh_evaluation_current
    - no_unresolved_fatal_finding
  - from: panel_pending
    to: revision_required
    trigger: panel_requests_substantive_change
    requires:
    - prior_panel_complete
    - fresh_evaluation_current
  - from: panel_pending
    to: packaging_pending
    trigger: panel_gate_passed
    requires:
    - prior_panel_complete
    - fresh_evaluation_current
    - no_unresolved_fatal_finding
  - from: pending_review
    to: packaging_pending
    trigger: latest_strategy_portfolio_accepted
    requires:
    - fresh_evaluation_current
    - no_unresolved_fatal_finding
  - from: pending_review
    to: specialist_review_pending
    trigger: specialist_review_requested
    requires:
    - bounded_specialist_question
    - evaluator_round_available
  - from: specialist_review_pending
    to: pending_review
    trigger: sanitized_specialist_findings_ready
    requires:
    - specialist_reports_current
    - sanitized_findings_bundle_current
    - fresh_evaluator_instance
  - from: packaging_pending
    to: human_signoff_required
    trigger: package_verified
  - from: packaging_pending
    to: human_strategy_selection_required
    trigger: selection_dossier_verified
  - from: human_strategy_selection_required
    to: additional_work_required
    trigger: human_selected_extension_option
    requires:
    - current_selection_dossier
    - selected_option_is_small_or_moderate_extension
  - from: '*'
    to: independent_review_pending
    trigger: required_reviewer_unavailable
  - from: '*'
    to: clarification_stop
    trigger: required_source_facts_missing_or_inconsistent
  - from: '*'
    to: deep_research_handoff_required
    trigger: inactive_deep_research_required
  - from: '*'
    to: blocked
    trigger: fatal_or_blocking_finding
  - from: '*'
    to: no_defensible_option
    trigger: no_defensible_strategy_remains
  - from: '*'
    to: stopped
    trigger: unfixable_no_gain_or_user_stop
  - from: independent_review_pending
    to: pending_review
    trigger: reviewer_delegation_resumed
