schema_version: research-idea-protected-content-register.v2
register_id: "<register-id>"
register_version: "<version>"
source_artifact:
  artifact_id: "<artifact-id>"
  version: "<version>"
  path: "<path>"
identity_anchor:
  primary_research_question: "<copy the frozen dossier value verbatim>"
  primary_objective: "<copy the frozen dossier value verbatim>"
  study_object: "<copy the frozen dossier value verbatim>"
  core_data_or_evidence_base: "<copy the frozen dossier value verbatim>"
  primary_unit_of_inference: "<copy the frozen dossier value verbatim>"
category_coverage:
  - category: identity_and_question
    source_status: source_present
    protected_item_ids: [PCR-001]
    not_applicable_reason: null
  - category: object_scope_and_boundaries
    source_status: source_present
    protected_item_ids: [PCR-002]
    not_applicable_reason: null
  - category: inputs_and_resources
    source_status: source_present
    protected_item_ids: [PCR-003]
    not_applicable_reason: null
  - category: design_analysis_and_inference
    source_status: source_present
    protected_item_ids: [PCR-004]
    not_applicable_reason: null
  - category: claims_and_evidence_status
    source_status: source_present
    protected_item_ids: [PCR-005]
    not_applicable_reason: null
  # Change to source_present and add item IDs only when the source actually
  # contains study-specific assumptions or limitations.
  - category: assumptions_and_limitations
    source_status: source_absent
    protected_item_ids: []
    not_applicable_reason: "<why no source-present assumption or limitation requires preservation>"
  # Do not invent a prohibited-claim statement merely to populate this category.
  - category: unsupported_claim_classes
    source_status: source_absent
    protected_item_ids: []
    not_applicable_reason: "<why the source contains no explicit unsupported-claim class>"
protected_items:
  - protected_id: PCR-001
    category: identity_and_question
    source_locator: "<heading and content anchor>"
    source_context_locator: null
    protected_content: "<identity anchor, core question, and purpose>"
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-002
    category: object_scope_and_boundaries
    source_locator: "<heading and content anchor>"
    protected_content: "<study object, population or system scope, and boundaries>"
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-003
    category: inputs_and_resources
    source_locator: "<heading and content anchor>"
    protected_content: "<irreplaceable inputs, data, materials, or resource status>"
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-004
    category: design_analysis_and_inference
    source_locator: "<heading and content anchor>"
    protected_content: "<design commitments, analysis and inference targets, every protected numerical/temporal rule, and, when present, validation or corroboration logic, eligibility, mutually exclusive analysis alternatives, fallback analyses, design-specific stopping consequences, and failure interpretation; group cohesive rules and split only when one locator becomes unreliable to check>"
    required_revised_disposition: retained_same_meaning_at_method_authority
  - protected_id: PCR-005
    category: claims_and_evidence_status
    source_locator: "<heading and content anchor>"
    protected_content: "<claim scope, strength, and evidence status>"
    required_revised_disposition: retained_same_strength
# When either source-absent category is source_present, add its source-located
# protected item here and reference that ID from category_coverage. Never add a
# placeholder item or locator for a source-absent category.
permitted_editorial_operations:
  - replace
  - define
  - move
  - split
  - merge
  - delete
  - reorder
  - add_bridge
  - consolidate
prohibited_changes:
  - change_study_identity_or_core_question
  - add_unreviewed_scientific_content
  - strengthen_claim_or_evidence_status
  - weaken_assumption_limitation_or_contingency
  - present_planned_work_as_completed
  - conceal_feasibility_finding
