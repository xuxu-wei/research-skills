schema_version: 1
evidence_class: synthetic_routing_boundary_contract
runtime_claim: none
entry_skill: research-polisher-orchestrator
cases:
  - case_id: polisher-route-completed-study-impact
    request_class: completed_research_impact_strategy
    prompt: Use $research-polisher-orchestrator to compare reposition-only, small-extension, and moderate-extension impact strategies for this completed observational study.
    expected_selected: true
    expected_route: research-polisher-orchestrator
    observed_route: research-polisher-orchestrator

  - case_id: polisher-reject-language-polish
    request_class: language_polish
    prompt: Polish the English and grammar of this manuscript without changing its scientific content.
    expected_selected: false
    expected_route: article-orchestrator
    observed_route: article-orchestrator

  - case_id: polisher-reject-ordinary-drafting
    request_class: ordinary_drafting
    prompt: Draft the Results section from these tables and figure legends.
    expected_selected: false
    expected_route: article-orchestrator
    observed_route: article-orchestrator

  - case_id: polisher-reject-new-idea-generation
    request_class: new_idea_generation
    prompt: Generate novel research ideas about wearable sensing for sleep disorders.
    expected_selected: false
    expected_route: research-idea-orchestrator
    observed_route: research-idea-orchestrator

  - case_id: polisher-reject-general-literature-search
    request_class: general_literature_search
    prompt: Map the literature and research gaps on multimodal biomarkers in dementia.
    expected_selected: false
    expected_route: research-opportunity-mapper
    observed_route: research-opportunity-mapper

  - case_id: polisher-reject-bounded-paper-question
    request_class: bounded_academic_question
    prompt: Closely compare how three papers operationalize digital frailty.
    expected_selected: false
    expected_route: academic-deep-search
    observed_route: academic-deep-search

  - case_id: polisher-reject-new-proposal
    request_class: new_proposal
    prompt: Turn this early research idea and funding call into a grant proposal.
    expected_selected: false
    expected_route: proposal-orchestrator
    observed_route: proposal-orchestrator
