schema_version: 2
execution_kind: deterministic_replay
execution_scope: >-
  registry-derived entry-gate and lifecycle contract replay using synthetic
  artifacts, synthetic reviewer receipts, and negative mutation guards
live_model_execution: false
expected_mode_count: 16
expected_workflows:
  - idea
  - proposal
  - article
  - perspective
notice: >-
  These fixtures drive deterministic contract replays with synthetic evidence.
  They do not represent a live model, Search, Deep Research, Codex task, or
  ChatGPT task run, and they provide no live-runtime evidence.

path_profiles:
  full_delivery:
    expected_final_state: human_signoff_required
    mode_scope_completed: true
    transitions:
      - {from: initialized, to: preprocessing, trigger: entry_gate_passed}
      - {from: preprocessing, to: artifact_frozen, trigger: versioned_artifact_created}
      - {from: artifact_frozen, to: pending_review, trigger: independent_review_dispatched}
      - {from: pending_review, to: revision_required, trigger: fixable_revision_requested}
      - {from: revision_required, to: artifact_frozen, trigger: new_version_created}
      - {from: artifact_frozen, to: pending_review, trigger: independent_review_dispatched}
      - {from: pending_review, to: panel_pending, trigger: latest_version_accepted}
      - {from: panel_pending, to: packaging_pending, trigger: panel_gate_passed}
      - {from: packaging_pending, to: human_signoff_required, trigger: package_verified}
  evaluated_package:
    expected_final_state: human_signoff_required
    mode_scope_completed: true
    transitions:
      - {from: initialized, to: preprocessing, trigger: entry_gate_passed}
      - {from: preprocessing, to: artifact_frozen, trigger: versioned_artifact_created}
      - {from: artifact_frozen, to: pending_review, trigger: independent_review_dispatched}
      - {from: pending_review, to: panel_pending, trigger: latest_version_accepted}
      - {from: panel_pending, to: packaging_pending, trigger: panel_gate_passed}
      - {from: packaging_pending, to: human_signoff_required, trigger: package_verified}
  scoped_non_ready_delivery:
    expected_final_state: stopped
    mode_scope_completed: true
    transitions:
      - {from: initialized, to: preprocessing, trigger: entry_gate_passed}
      - {from: preprocessing, to: artifact_frozen, trigger: versioned_artifact_created}
      - {from: artifact_frozen, to: stopped, trigger: unfixable_no_gain_or_user_stop}
  evaluated_scoped_non_ready_delivery:
    expected_final_state: stopped
    mode_scope_completed: true
    transitions:
      - {from: initialized, to: preprocessing, trigger: entry_gate_passed}
      - {from: preprocessing, to: artifact_frozen, trigger: versioned_artifact_created}
      - {from: artifact_frozen, to: pending_review, trigger: independent_review_dispatched}
      - {from: pending_review, to: revision_required, trigger: fixable_revision_requested}
      - {from: revision_required, to: artifact_frozen, trigger: new_version_created}
      - {from: artifact_frozen, to: pending_review, trigger: independent_review_dispatched}
      - {from: pending_review, to: panel_pending, trigger: latest_version_accepted}
      - {from: panel_pending, to: stopped, trigger: unfixable_no_gain_or_user_stop}

cases:
  - case_id: idea-standard
    workflow: idea
    entry_mode: standard
    path_profile: full_delivery
    secondary_mutation: stale_input

  - case_id: idea-resume-candidates
    workflow: idea
    entry_mode: resume_candidates
    path_profile: full_delivery
    secondary_mutation: invalid_lineage

  - case_id: idea-portfolio-only
    workflow: idea
    entry_mode: portfolio_only
    path_profile: evaluated_package
    secondary_mutation: stale_input

  - case_id: proposal-standard
    workflow: proposal
    entry_mode: standard
    path_profile: full_delivery
    secondary_mutation: invalid_lineage

  - case_id: proposal-existing-draft
    workflow: proposal
    entry_mode: existing_draft
    path_profile: full_delivery
    secondary_mutation: stale_input

  - case_id: proposal-draft-and-external-review
    workflow: proposal
    entry_mode: draft_and_external_review
    path_profile: full_delivery
    secondary_mutation: invalid_lineage

  - case_id: proposal-package-only
    workflow: proposal
    entry_mode: package_only
    path_profile: evaluated_package
    secondary_mutation: stale_input

  - case_id: article-standard
    workflow: article
    entry_mode: standard
    path_profile: full_delivery
    secondary_mutation: invalid_lineage

  - case_id: article-fast-track-draft
    workflow: article
    entry_mode: fast_track_draft
    path_profile: full_delivery
    secondary_mutation: stale_input

  - case_id: article-fast-track-draft-and-evaluation
    workflow: article
    entry_mode: fast_track_draft_and_evaluation
    path_profile: full_delivery
    secondary_mutation: invalid_lineage

  - case_id: article-blueprint-only
    workflow: article
    entry_mode: blueprint_only
    path_profile: scoped_non_ready_delivery
    secondary_mutation: stale_input

  - case_id: article-section-specific
    workflow: article
    entry_mode: section_specific
    path_profile: scoped_non_ready_delivery
    secondary_mutation: invalid_lineage

  - case_id: article-submission-only
    workflow: article
    entry_mode: submission_only
    path_profile: evaluated_package
    secondary_mutation: stale_input

  - case_id: perspective-lite
    workflow: perspective
    entry_mode: lite
    path_profile: scoped_non_ready_delivery
    secondary_mutation: invalid_lineage

  - case_id: perspective-standard
    workflow: perspective
    entry_mode: standard
    path_profile: evaluated_scoped_non_ready_delivery
    secondary_mutation: stale_input

  - case_id: perspective-full
    workflow: perspective
    entry_mode: full
    path_profile: full_delivery
    secondary_mutation: invalid_lineage
