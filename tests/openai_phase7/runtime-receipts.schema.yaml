$schema: https://json-schema.org/draft/2020-12/schema
$id: https://xuxu-wei.github.io/research-skills-openai/phase7-runtime-receipts.schema.yaml
title: Phase 7 current-version runtime receipt collection
type: object
required:
  - schema_version
  - evidence_kind
  - platform_trust
  - receipts
properties:
  schema_version:
    const: 1
  evidence_kind:
    const: current_version_durable_runtime_receipts
  platform_trust:
    type: object
    required:
      - adapter_status
      - adapter_id
      - provider_authenticated
      - reason
    properties:
      adapter_status: {enum: [unavailable, configured]}
      adapter_id: {type: [string, 'null']}
      provider_authenticated: {type: boolean}
      reason: {type: string, minLength: 1}
    additionalProperties: false
  receipts:
    type: array
    minItems: 8
    maxItems: 8
    items:
      $ref: '#/$defs/runtime_receipt'
additionalProperties: false

$defs:
  durable_file_binding:
    type: object
    required: [path, sha256]
    properties:
      path: {type: [string, 'null']}
      sha256:
        anyOf:
          - {type: 'null'}
          - {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    additionalProperties: false

  runtime_receipt:
    type: object
    required:
      - receipt_id
      - workflow
      - case_kind
      - expected_final_state
      - status
      - binding
      - file_access
      - lineage
      - review_state
      - control_evidence
      - final_state
      - automatic_external_submission
      - reason
    properties:
      receipt_id: {type: string, minLength: 1}
      workflow: {enum: [idea, proposal, article, perspective]}
      case_kind: {enum: [happy, control]}
      expected_final_state:
        enum:
          - human_signoff_required
          - stopped
          - blocked
          - independent_review_pending
      status: {enum: [pending_live_evidence, verified]}
      binding:
        type: object
        required:
          - plugin_version
          - registry_sha256
          - source_commit
          - task_export
          - actor_manifest
          - artifact_index
        properties:
          plugin_version: {type: [string, 'null']}
          registry_sha256:
            anyOf:
              - {type: 'null'}
              - {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
          source_commit:
            anyOf:
              - {type: 'null'}
              - {type: string, pattern: '^[0-9a-f]{40}$'}
          task_export:
            type: object
            required: [platform, task_id, path, sha256]
            properties:
              platform: {enum: [codex, chatgpt, null]}
              task_id: {type: [string, 'null']}
              path: {type: [string, 'null']}
              sha256:
                anyOf:
                  - {type: 'null'}
                  - {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
            additionalProperties: false
          actor_manifest: {$ref: '#/$defs/durable_file_binding'}
          artifact_index: {$ref: '#/$defs/durable_file_binding'}
      file_access:
        type: object
        required:
          - reads
          - writes
          - source_artifact_hashes_unchanged
        properties:
          reads: {type: array}
          writes: {type: array}
          source_artifact_hashes_unchanged: {type: [boolean, 'null']}
      lineage:
        type: object
        required:
          - complete
          - current_artifact_ref
          - evaluated_artifact_ref
        properties:
          complete: {type: [boolean, 'null']}
          current_artifact_ref: {type: [string, 'null']}
          evaluated_artifact_ref: {type: [string, 'null']}
      review_state:
        type: object
        required:
          - dissent_ids
          - preserved_dissent_ids
          - fatal_finding_ids
          - unresolved_fatal_finding_ids
          - fatal_findings_visible
        properties:
          dissent_ids: {type: array, items: {type: string}}
          preserved_dissent_ids: {type: array, items: {type: string}}
          fatal_finding_ids: {type: array, items: {type: string}}
          unresolved_fatal_finding_ids: {type: array, items: {type: string}}
          fatal_findings_visible: {type: [boolean, 'null']}
      control_evidence:
        type: object
        required: [gate, finding, route, continuation_artifact_ref]
        properties:
          gate: {type: [string, 'null']}
          finding: {type: [string, 'null']}
          route: {type: [string, 'null']}
          continuation_artifact_ref: {type: [string, 'null']}
        additionalProperties: false
      final_state:
        enum:
          - human_signoff_required
          - stopped
          - blocked
          - independent_review_pending
          - null
      automatic_external_submission: {type: [boolean, 'null']}
      reason: {type: string, minLength: 1}
    additionalProperties: false

x-phase7-contract:
  required_workflow_case_pairs:
    - [idea, happy]
    - [idea, control]
    - [proposal, happy]
    - [proposal, control]
    - [article, happy]
    - [article, control]
    - [perspective, happy]
    - [perspective, control]
  verified_receipt_required_bindings:
    - binding.plugin_version
    - binding.registry_sha256
    - binding.source_commit
    - binding.task_export.platform
    - binding.task_export.task_id
    - binding.task_export.path
    - binding.task_export.sha256
    - binding.actor_manifest.path
    - binding.actor_manifest.sha256
    - binding.artifact_index.path
    - binding.artifact_index.sha256
  verified_actor_roles:
    - orchestrator
    - writer
    - evaluator
    - panel
    - builder
    - retrieval
    - controller
    - assembler
    - verifier_compositor
  workflow_case_contracts:
    idea:
      happy:
        expected_final_state: human_signoff_required
        gate: null
        route: null
        continuation_artifact_role: null
      control:
        expected_final_state: stopped
        gate: unfixable_no_gain_or_user_stop
        route: human_review_or_explicit_resume
        continuation_artifact_role: continuation_brief
    proposal:
      happy:
        expected_final_state: human_signoff_required
        gate: null
        route: null
        continuation_artifact_role: null
      control:
        expected_final_state: blocked
        gate: fatal_or_blocking_finding
        route: blocked_for_human_resolution
        continuation_artifact_role: continuation_brief
    article:
      happy:
        expected_final_state: human_signoff_required
        gate: null
        route: null
        continuation_artifact_role: null
      control:
        expected_final_state: independent_review_pending
        gate: required_reviewer_unavailable
        route: resume_in_fresh_delegated_task
        continuation_artifact_role: continuation_brief
    perspective:
      happy:
        expected_final_state: human_signoff_required
        gate: null
        route: null
        continuation_artifact_role: null
      control:
        expected_final_state: stopped
        gate: unfixable_no_gain_or_user_stop
        route: human_review_or_explicit_resume
        continuation_artifact_role: continuation_brief
  actor_manifest_contract:
    schema_version: 1
    required_actor_fields:
      - instance_id
      - skill
      - role
      - allowed_read_roots
      - allowed_write_roots
    panel_actor_required_fields: [panel_tier, panel_role]
    instance_ids_unique: true
    writer_evaluator_panel_finalizer_ids_pairwise_disjoint: true
    panel_roles_exactly_match_registry_default_tier: true
    final_package_actor_matches_registry_skill_and_role: true
    unknown_actor_roles_rejected: true
    actor_role_must_match_registry_skill_role: true
    workflow_orchestrator_actor_required: true
    workflow_orchestrator_skill_matches_registry: true
    finalizer_role_matches_registry_final_package_skill: true
  reviewer_access_contract:
    evaluator_prior_scores_visible: false
    evaluator_may_read_prior_reviewer_outputs: false
    evaluator_forbidden_source_actor_roles:
      - evaluator
      - panel
      - verifier_compositor
  collection_contract:
    receipt_ids_unique: true
    all_eight_runs_are_fresh_tasks: true
    platform_task_ids_unique: true
    task_export_paths_unique: true
    task_export_digests_unique: true
    task_export_binds_receipt_identity: true
    task_export_binds_actor_manifest: true
    task_export_binds_artifact_index: true
    verified_receipts_share_one_release_identity: true
  artifact_index_contract:
    schema_version: 1
    required_artifact_fields:
      - artifact_id
      - version_id
      - artifact_role
      - path
      - sha256
      - source_skill
      - created_by_instance_id
      - based_on
      - change_type
      - status
    artifact_refs_unique: true
    parent_refs_resolve: true
    artifact_paths_and_digests_verified: true
  file_access_contract:
    required_entry_fields: [actor_instance_id, path, sha256]
    access_must_fit_actor_manifest_scope: true
    source_artifact_hashes_unchanged: true
  semantic_checks:
    - schema_workflow_case_contract_matches_declared_and_observed_final_state
    - schema_control_gate_route_and_continuation_type_match_observed_artifacts
    - happy_current_artifact_equals_evaluated_artifact
    - happy_has_final_handoff_package
    - control_has_no_final_handoff_package
    - control_has_gate_finding_route_and_continuation_brief
    - package_creator_matches_registry_final_package_skill
    - package_inputs_satisfy_registry_contract
    - verifier_compositor_writes_only_verification_and_package_outputs
    - writer_skill_belongs_to_current_workflow
    - actor_role_is_allowlisted_and_matches_registry_skill_role
    - orchestrator_skill_matches_current_workflow
    - fresh_evaluator_cannot_read_any_prior_reviewer_output_or_score
    - panel_roles_cannot_read_peer_outputs
    - dissent_ids_are_preserved
    - unresolved_fatal_ids_are_visible_and_indexed
    - blocked_control_has_unresolved_fatal_finding
    - automatic_external_submission_is_false
  durable_path_policy: canonical_posix_repository_relative_existing_file
  digest_policy: sha256_of_actual_file_bytes
  completion_policy: >-
    All eight receipts must be durable and verified against the current plugin
    version, registry digest, immutable release commit, and release ledger. A
    repository file and digest prove integrity but not platform origin; no
    receipt can become verified until a provider-authenticated capture adapter
    is implemented in the validator.
