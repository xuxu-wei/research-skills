$schema: https://json-schema.org/draft/2020-12/schema
$id: https://xuxu-wei.github.io/research-skills-openai/release-evidence.schema.yaml
title: Live-requeried OpenAI Preview release evidence result
type: object
additionalProperties: false
required:
  - schema_version
  - evidence_type
  - verification_level
  - provider_verified
  - observed
  - raw_export
  - source_identity
  - locator
  - integrity_result
  - live_verifier
  - gate_eligibility
properties:
  schema_version:
    const: 3
  evidence_type:
    enum:
      - repository_preview_ci
      - canonical_plugin_validator_ci
      - main_branch_protection
      - marketplace_resolved_commit
      - marketplace_upgrade
      - explicit_reinstall
      - fresh_task_discovery
      - rollback
      - accepted_phase78_closure
  verification_level:
    enum: [preview_attested, provider_verified]
  provider_verified:
    type: boolean
  observed:
    description: >-
      Exact copy of every externally asserted ledger field, excluding status,
      reason, evidence_path, evidence_sha256, and evidence_locator.
    type: object
    minProperties: 1
  raw_export:
    description: Parsed machine-readable raw export fetched from the bound Release asset.
    type: object
    minProperties: 1
  source_identity:
    $ref: '#/$defs/source_identity'
  locator:
    $ref: '#/$defs/external_locator'
  integrity_result:
    type: object
    additionalProperties: false
    required:
      - evidence_id
      - integrity_valid
      - gate_eligible
      - claimed_verification_level
      - claimed_provider_verified
      - claimed_counts_as_preview_acceptance
      - source_identity_bound
      - raw_export_asset_id
      - raw_export_sha256
      - envelope_sha256
      - verifier_report_asset_id
      - verifier_report_sha256
      - release_asset_index_sha256
    properties:
      evidence_id: {type: string, minLength: 1}
      integrity_valid: {const: true}
      gate_eligible: {const: false}
      claimed_verification_level:
        enum: [preview_attested, provider_verified]
      claimed_provider_verified: {type: boolean}
      claimed_counts_as_preview_acceptance: {const: true}
      source_identity_bound: {const: true}
      raw_export_asset_id: {type: integer, minimum: 1}
      raw_export_sha256:
        type: string
        pattern: '^sha256:[0-9a-f]{64}$'
      envelope_sha256:
        type: string
        pattern: '^sha256:[0-9a-f]{64}$'
      verifier_report_asset_id: {type: integer, minimum: 1}
      verifier_report_sha256:
        type: string
        pattern: '^sha256:[0-9a-f]{64}$'
      release_asset_index_sha256:
        type: string
        pattern: '^sha256:[0-9a-f]{64}$'
  live_verifier:
    type: object
    additionalProperties: false
    required:
      - adapter_id
      - adapter_code_sha256
      - live_requery_performed
      - requery_source
      - independent
      - verified_at
      - verifier_workflow_run_id
      - verifier_run_url
    properties:
      adapter_id: {type: string, minLength: 1}
      adapter_code_sha256:
        description: >-
          Bare SHA-256 matching verifier_digest for this adapter in the
          committed provider-verifier registry.
        type: string
        pattern: '^[0-9a-f]{64}$'
      live_requery_performed: {const: true}
      requery_source: {const: github_api}
      independent: {const: true}
      verified_at:
        description: >-
          Timezone-aware ISO timestamp no more than five minutes in the future
          and no more than 90 days old when the ledger validator runs.
        type: string
        format: date-time
      verifier_workflow_run_id: {type: integer, minimum: 1}
      verifier_run_url: {type: string, format: uri}
  gate_eligibility:
    type: object
    additionalProperties: false
    required:
      - eligible
      - level
      - determined_by
      - provider_adapter_id
      - provider_authenticated
    properties:
      eligible: {const: true}
      level:
        enum: [preview_attested, provider_verified]
      determined_by: {const: registered_live_verifier}
      provider_adapter_id:
        type: [string, 'null']
      provider_authenticated: {type: boolean}

allOf:
  - if:
      properties:
        verification_level: {const: preview_attested}
    then:
      properties:
        provider_verified: {const: false}
        gate_eligibility:
          properties:
            level: {const: preview_attested}
            provider_adapter_id: {const: null}
            provider_authenticated: {const: false}
  - if:
      properties:
        verification_level: {const: provider_verified}
    then:
      properties:
        provider_verified: {const: true}
        gate_eligibility:
          properties:
            level: {const: provider_verified}
            provider_adapter_id: {type: string, minLength: 1}
            provider_authenticated: {const: true}
  - if:
      properties:
        evidence_type:
          enum:
            - marketplace_upgrade
            - explicit_reinstall
            - fresh_task_discovery
            - rollback
    then:
      properties:
        raw_export:
          required: [cache_inventory_complete, cache_inventory]
          properties:
            cache_inventory_complete: {const: true}
            cache_inventory:
              type: array
              minItems: 1
              maxItems: 2
              items: {$ref: '#/$defs/cache_artifact'}

$defs:
  digest:
    type: string
    pattern: '^[0-9a-f]{64}$'

  source_identity:
    type: object
    additionalProperties: false
    required:
      - plugin_version
      - source_commit
      - manifest_sha256
      - registry_sha256
      - skill_tree_sha256
    properties:
      plugin_version: {type: string, minLength: 1}
      source_commit:
        type: string
        pattern: '^[0-9a-f]{40}$'
      manifest_sha256: {$ref: '#/$defs/digest'}
      registry_sha256: {$ref: '#/$defs/digest'}
      skill_tree_sha256: {$ref: '#/$defs/digest'}

  release_asset_locator:
    type: object
    additionalProperties: false
    required: [asset_id, name, sha256]
    properties:
      asset_id: {type: integer, minimum: 1}
      name: {type: string, minLength: 1}
      sha256: {$ref: '#/$defs/digest'}

  external_locator:
    type: object
    additionalProperties: false
    required:
      - repository
      - release_id
      - release_tag
      - capture_workflow_run_id
      - verifier_workflow_run_id
      - verifier_run_url
      - envelope_asset
      - release_asset_index_asset
      - raw_export_asset
      - verifier_report_asset
    properties:
      repository:
        type: string
        pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
      release_id: {type: integer, minimum: 1}
      release_tag: {type: string, minLength: 1}
      capture_workflow_run_id: {type: integer, minimum: 1}
      verifier_workflow_run_id: {type: integer, minimum: 1}
      verifier_run_url: {type: string, format: uri}
      envelope_asset: {$ref: '#/$defs/release_asset_locator'}
      release_asset_index_asset: {$ref: '#/$defs/release_asset_locator'}
      raw_export_asset: {$ref: '#/$defs/release_asset_locator'}
      verifier_report_asset: {$ref: '#/$defs/release_asset_locator'}

  cache_artifact:
    type: object
    additionalProperties: false
    required:
      - cache_path
      - cache_instance_id
      - cache_identity_algorithm
      - cache_identity_sha256
      - plugin_version
      - source_commit
      - manifest_sha256
      - registry_sha256
      - skill_tree_algorithm
      - skill_tree_file_count
      - skill_tree_sha256
      - license_sha256
    properties:
      cache_path: {type: string, minLength: 1}
      cache_instance_id: {type: string, minLength: 1}
      cache_identity_algorithm:
        const: sha256_canonical_json_installable_cache_identity_v1
      cache_identity_sha256: {$ref: '#/$defs/digest'}
      plugin_version: {type: string, minLength: 1}
      source_commit:
        type: string
        pattern: '^[0-9a-f]{40}$'
      manifest_sha256: {$ref: '#/$defs/digest'}
      registry_sha256: {$ref: '#/$defs/digest'}
      skill_tree_algorithm: {type: string, minLength: 1}
      skill_tree_file_count: {type: integer, minimum: 1}
      skill_tree_sha256: {$ref: '#/$defs/digest'}
      license_sha256: {$ref: '#/$defs/digest'}

x-evidence-contract:
  result_schema: openai-release-ledger-live-verifier-result/v3
  shared_envelope_schema: openai-preview-evidence-envelope/v1
  shared_asset_index_schema: openai-preview-release-asset-index/v1
  persistence_policy: >-
    Ledger records persist only immutable GitHub Release, Actions run, and asset
    locators plus digests. Repository-relative evidence files are never accepted
    as external evidence.
  live_requery_policy: >-
    Every accepted record requires a registered independent verifier to re-query
    the GitHub API and fetch the identified Release assets during validation.
  adapter_digest_policy: >-
    The live verifier adapter_code_sha256 must equal the verifier_digest for the
    enabled adapter in the committed provider-verifier registry. The production
    verifier separately binds that code to the source commit before returning.
  integrity_boundary: >-
    Shared bundle validation establishes digest and lineage integrity only. The
    Release asset index uniquely locates the actual envelope and verifier report;
    the envelope has no forward references to either later artifact, and the
    verifier report binds the envelope, raw export, source identity, and verifier
    code. Shared envelope claims never make a record gate-eligible.
  preview_acceptance_policy: >-
    preview_attested requires a registered GitHub live-requery verifier result,
    remains provider_verified false, and is never labelled verified.
  provider_verification_policy: >-
    provider_verified additionally requires a separately registered and
    authenticated provider adapter. A provider receipt asset or boolean claim is
    insufficient.
  non_substantive_evidence_policy: >-
    Screenshots, manual notes, manual status text, repository-authored bindings,
    and status fields cannot establish Preview or provider acceptance.
  cache_inventory_policy: >-
    Install, reinstall, discovery, and rollback raw exports must carry the
    complete cache inventory declared by the bound ledger record.
