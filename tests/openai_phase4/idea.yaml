schema_version: 2
fixture_id: idea-independent-loop
execution_kind: deterministic_replay
execution_scope: evaluation_revision_delivery_with_entry_receipts
workflow: idea
workflow_id: wf-phase4-idea-001
entry_mode: standard
plugin_version: 0.6.0-preview.1
registry_schema_version: 5
initial_artifacts:
  - artifact_id: idea-context-v1
    version_id: c001
    workflow_id: wf-phase4-idea-001
    round_id: entry-001
    plugin_version: 0.6.0-preview.1
    source_skill: external-input
    created_by_instance_id: fixture-user-idea-001
    based_on: []
    change_type: supplied
    path: 01_context/research-context-v001.md
    status: final
    content_digest: computed
    frozen: true
    artifact_role: research_context
    content: "frozen research context"
  - artifact_id: idea-evidence-v1
    version_id: e001
    workflow_id: wf-phase4-idea-001
    round_id: entry-001
    plugin_version: 0.6.0-preview.1
    source_skill: external-input
    created_by_instance_id: fixture-user-idea-001
    based_on: []
    change_type: supplied
    path: 02_evidence/evidence-opportunity-map-v001.md
    status: final
    content_digest: computed
    frozen: true
    artifact_role: evidence_map
    content: "frozen evidence and opportunity map"
entry_gate_receipts:
  context_frozen: {artifact_id: idea-context-v1}
  evidence_map_frozen: {artifact_id: idea-evidence-v1}
  candidate_set_versioned: {artifact_id: ideas-v1}
panel:
  mode: blind_handoff_review
  tier: default_three
  required_roles: [novelty-gap, feasibility-method, pi-strategy]
events:
  - event_id: idea-generate-v1
    type: produce
    actor_instance_id: idea-writer-001
    source_skill: research-idea-orchestrator
    destination_skill: multi-path-idea-generator
    dispatch_mode: orchestrated
    trigger: context_and_opportunity_map_ready_or_revision_authorized
    allowed_read_paths: [01_context/research-context-v001.md, 02_evidence/evidence-opportunity-map-v001.md]
    allowed_write_paths: [03_ideas/round-001/generated-idea-set-v001.md]
    input_artifact_ids: [idea-context-v1, idea-evidence-v1]
    input_versions: [c001, e001]
    outputs:
      - artifact_id: ideas-v1
        version_id: v001
        workflow_id: wf-phase4-idea-001
        round_id: round-001
        plugin_version: 0.6.0-preview.1
        source_skill: multi-path-idea-generator
        created_by_instance_id: idea-writer-001
        based_on: [idea-context-v1@c001, idea-evidence-v1@e001]
        change_type: initial
        path: 03_ideas/round-001/generated-idea-set-v001.md
        status: current
        content_digest: computed
        frozen: true
        artifact_role: candidate_idea_set
        content: "idea candidate set v001"
    expected_state_after: initialized
  - event_id: idea-entry-gate
    type: entry_gate
    actor_instance_id: idea-orchestrator-001
    expected_state_after: artifact_frozen
  - event_id: idea-evaluate-v1
    type: review
    actor_instance_id: idea-evaluator-001
    source_skill: research-idea-orchestrator
    destination_skill: idea-evaluator
    dispatch_mode: delegated
    trigger: candidate_set_frozen_or_revised
    allowed_read_paths: [01_context/research-context-v001.md, 02_evidence/evidence-opportunity-map-v001.md, 03_ideas/round-001/generated-idea-set-v001.md]
    allowed_write_paths: [05_evaluations/round-001/idea-evaluation-v001.md]
    input_artifact_ids: [idea-context-v1, idea-evidence-v1, ideas-v1]
    input_versions: [c001, e001, v001]
    review_report:
      review_id: idea-eval-r1
      reviewer_skill: idea-evaluator
      reviewer_instance_id: idea-evaluator-001
      reviewer_role: evaluator
      review_scope: frozen candidate set v001
      workflow_id: wf-phase4-idea-001
      round_id: round-001
      input_artifact_ids: [idea-context-v1, idea-evidence-v1, ideas-v1]
      input_versions: [c001, e001, v001]
      files_read: [01_context/research-context-v001.md, 02_evidence/evidence-opportunity-map-v001.md, 03_ideas/round-001/generated-idea-set-v001.md]
      isolation_mode: fresh_subagent
      prior_scores_visible: false
      source_edits_performed: false
      decision: revise
      findings:
        - finding_id: idea-major-001
          source_review_id: idea-eval-r1
          severity: major
          blocking: false
          fixability: fixable
          status: routed_to_revision
          owner: multi-path-idea-generator
          route: targeted_revision
      unresolved_issues: [idea-major-001]
    outputs:
      - artifact_id: idea-eval-v1
        version_id: r001
        workflow_id: wf-phase4-idea-001
        round_id: round-001
        plugin_version: 0.6.0-preview.1
        source_skill: idea-evaluator
        created_by_instance_id: idea-evaluator-001
        based_on: [idea-context-v1@c001, idea-evidence-v1@e001, ideas-v1@v001]
        change_type: evaluation
        path: 05_evaluations/round-001/idea-evaluation-v001.md
        status: final
        content_digest: computed
        frozen: true
        artifact_role: evaluation_report
    expected_state_after: revision_required
  - event_id: idea-plan-v2
