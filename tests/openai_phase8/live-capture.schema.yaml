schema_version: openai-phase8-live-capture-contract/v2
normalization_schema: openai-preview-normalized-capture/v2
adapter_id: openai_phase8_capture_normalizer_v2
verification_boundary:
  verification_level: capture_only
  provider_verified: false
  counts_as_preview_acceptance: false
  live_collection_requires: live_collection_eligible_true
  task_recorded_platform_claims_count_as_live: false
  registered_platform_origin_adapters: []
  self_labeled_structured_json_is_platform_authority: false
  current_live_eligible_slot_count: 0

common_task_export:
  schema_version: openai-phase8-task-export/v2
  required_fields:
    - platform
    - surface
    - evidence_kind
    - export_id
    - task_id
    - parent_task_or_thread_id
    - observable_child_or_delegate_ids
    - captured_at
    - automatic_external_submission
    - plugin_version
    - source_commit
    - manifest_sha256
    - registry_sha256
    - skill_tree_sha256
    - slot_id
    - profile
    - kind
    - scheduler_input
    - capability
    - supporting_artifacts
    - platform_id_bindings
    - slot_payload
  platform_binding:
    source_format: structured_json
    mechanism: exact_json_pointer
    screenshots_are_id_authority: false
    task_authored_ids_are_id_authority: false

profiles:
  phase8-reviewer-v1:
    slot_kind: reviewer
    required_platform_bindings:
      - capture_export_id
      - task_id
      - parent_task_or_thread_id
      - parent_delegation_child_id
      - delegated_thread_id
      - captured_child_thread_id
      - reviewer_instance_id
      - reviewer_instance_created_at
      - platform_receipt_id
      - captured_at
    delegation_identity_rule: parent_delegation_child_id == delegated_thread_id == captured_child_thread_id
    claimed_scope_authorities: [platform_derived, task_recorded]
    registered_live_scope_authorities: []
    platform_derived_label_counts_as_live: false
    current_status: platform_capture_adapter_pending
    task_recorded_scope_status: task_recorded_scope_pending
    write_scope: reviewer_report_only

  phase8-search-v1:
    slot_kind: search
    required_platform_bindings:
      - capture_export_id
      - task_id
      - captured_at
      - search_tool_id
      - search_tool_run_id
      - search_query
      - opened_sources
      - citation_metadata
      - material_claim_trace
    trace_source: structured_tool_trace
    final_answer_inference_allowed: false
    minimum_opened_primary_or_authoritative_sources: 2
    registered_trace_export_adapters: []
    structured_trace_label_counts_as_live: false
    current_status: platform_capture_adapter_pending

  phase8-deep-research-v1:
    slot_kind: deep_research_completed
    registered_completion_export_adapters: []
    unregistered_export_labels_are_authority: false
    completion_export_format: json
    report_formats_not_completion_evidence: [markdown, word, pdf, screenshot]
    required_completion_bindings:
      - deep_research_session_id
      - deep_research_run_id
      - user_start_event_id
      - user_start_event_at
      - provider_completion_receipt_id
      - provider_completed_at
      - provider_completion_status
    missing_completion_projection_status: provider_completion_projection_pending
    pending_capture_live_eligible: false
    current_completed_slots_status: pending_export_adapter

  phase8-deep-research-inactive-v1:
    slot_kind: deep_research_inactive_control
    required_platform_bindings:
      - capture_export_id
      - task_id
      - captured_at
      - capability_state
      - capability_observed_at
    accepted_capability_states: [inactive, unavailable, cannot_start]
    registered_capability_export_adapters: []
    capability_export_label_counts_as_live: false
    current_status: platform_capture_adapter_pending
    required_stop_state:
      workflow_paused: true
      downstream_evidence_map_created: false
      inline_simulation: false

workspace_manifest:
  schema_version: openai-phase8-workspace-manifest/v1
  asset_ids:
    source: github_api_snapshot_only
    allocated_by_builder: false
  exact_fields:
    - schema_version
    - counts_as_runtime_evidence
    - synthetic_test_only
    - bundle_id
    - slot_kind
    - slot_id
    - collection_anchor
    - collection_witness
    - source_identity
    - files
