      isolation: {fresh_subagent: true, writer_instance_id: idea-writer-002, reviewer_instance_id: idea-reviewer-002, prior_scores_visible: false}
      edit_boundary: {source_edits_performed_by_reviewer: false, reviewer_write_paths: [reviews/idea-fixable-evaluation.md], allowed_prefixes: [reviews/]}
      preserved_dissent_ids: []

