schema_version: 1
evidence_class: synthetic_contract_oracle
runtime_claim: none
description: >-
  Synthetic, non-identifying workflow cases used to exercise Phase 8 routing and
  quality contracts. Oracle observations are deterministic fixture data, not
  model executions or live research evidence.
outcome_classes:
  - happy
  - fixable
  - fatal_or_pending
  - revision_no_gain
anonymization_policy:
  permitted_source_kinds: [synthetic]
  identifying_source_material_committed: false
  required_statement: Synthetic case; no person, institution, unpublished dataset, or user source is represented.
cases:
  - case_id: ph8-idea-happy-001
    workflow: idea
    outcome_class: happy
    risk_tier: low
    scenario: A synthetic pilot signal supports a bounded, testable follow-up study.
    anonymity:
      source_kind: synthetic
      contains_identifying_material: false
      statement: Synthetic case; no person, institution, unpublished dataset, or user source is represented.
    expected:
      route: idea-evaluator -> idea-adversarial-review-panel -> idea-portfolio-assembler
      final_state: human_signoff_required
      required_outputs: [idea_evaluation_report, adversarial_panel_report, idea_portfolio]
      forbidden_outputs: [external_submission_receipt, reviewer_edited_candidate]
      critical_findings: []
      dissent_ids: [idea-dissent-generalizability]
    oracle_observation:
      route: idea-evaluator -> idea-adversarial-review-panel -> idea-portfolio-assembler
      final_state: human_signoff_required
      outputs: [idea_evaluation_report, adversarial_panel_report, idea_portfolio]
      detected_finding_ids: []
      ready_claimed: true
      lineage: {complete: true, artifact_id: idea-portfolio-001, version_id: v001, round_id: r002, plugin_version_binding: manifest_current, source_skill: idea-portfolio-assembler, based_on: [idea-candidate-001@v002], change_type: assembly}
      isolation: {fresh_subagent: true, writer_instance_id: idea-writer-001, reviewer_instance_id: idea-reviewer-001, prior_scores_visible: false}
      edit_boundary: {source_edits_performed_by_reviewer: false, reviewer_write_paths: [reviews/idea-happy-evaluation.md, reviews/idea-happy-panel.md], allowed_prefixes: [reviews/]}
      preserved_dissent_ids: [idea-dissent-generalizability]

  - case_id: ph8-idea-fixable-001
    workflow: idea
    outcome_class: fixable
    risk_tier: medium
    scenario: A synthetic idea is feasible but its novelty claim is broader than the mapped evidence.
    anonymity:
      source_kind: synthetic
      contains_identifying_material: false
      statement: Synthetic case; no person, institution, unpublished dataset, or user source is represented.
    expected:
      route: idea-evaluator -> idea-refinement-controller
      final_state: revision_required
      required_outputs: [idea_evaluation_report, targeted_revision_plan]
      forbidden_outputs: [idea_portfolio, external_submission_receipt, reviewer_edited_candidate]
      critical_findings:
        - {finding_id: idea-major-novelty-overreach, severity: major, blocking: false}
      dissent_ids: []
    oracle_observation:
