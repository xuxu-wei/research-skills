  are internally hash-bound current-task snapshots, but no durable platform
  Search/tool export or executable provider-verifier adapter is available, so
  repository-authored files cannot promote them beyond observed_unverified.
  They are not counted as live passes. The two Deep Research cycles remain
  placeholders.
