question: What are the five ICH E9(R1) estimand attributes, and when was the final guideline adopted?
search_scope: ICH Step 4 guideline and EMA's official Step 5 implementation page.
stop_condition: Stop after the normative PDF and regulator page agree on document identity and dates.
answer_summary: >-
  The five attributes are treatment conditions, target population, variable or
  endpoint, handling of intercurrent events, and the population-level summary.
  ICH Regulatory Members adopted the Step 4 document on 20 November 2019
  (document dated 17 November 2019); the EMA Step 5 version became legally
  effective on 30 July 2020.
