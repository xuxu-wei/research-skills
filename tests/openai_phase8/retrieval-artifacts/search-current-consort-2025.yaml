question_class: current
question: What is the current CONSORT statement for reporting randomised trials?
search_scope: Official CONSORT/SPIRIT site and an open-access primary publication of the statement.
stop_condition: Stop after two independently opened authoritative sources identify the same current statement, year, and checklist scope.
answer_summary: >-
  CONSORT 2025 is the current statement. It was published on 14 April 2025,
  contains a 30-item checklist plus a participant-flow diagram, and supersedes
  CONSORT 2010.
