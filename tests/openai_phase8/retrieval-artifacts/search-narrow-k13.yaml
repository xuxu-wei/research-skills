question_class: narrow_academic
question: >-
  In two primary clinical studies near the China-Myanmar border, was the
  Plasmodium falciparum K13 F446I mutation associated with delayed parasite clearance?
search_scope: Two primary therapeutic-efficacy studies with verifiable DOI/PMID metadata.
stop_condition: Stop after two primary studies directly report the genotype-clearance association and their study settings are verified.
answer_summary: >-
  Yes, within the represented China-Myanmar and Upper Myanmar settings. Wang
  et al. reported F446I and K13 propeller mutations associated with day-3
  parasitaemia and higher ring-stage survival. Tun et al. reported a median
  clearance half-life of 4.7 hours for F446I infections versus 2.7 hours for
  infections without K13 mutations. This is a setting-bounded association, not
  a universal claim for every K13 variant or geography.
