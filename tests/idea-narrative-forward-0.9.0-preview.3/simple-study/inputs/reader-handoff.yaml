schema_version: 1
artifact_id: reader-handoff-simple-001
version: v001
path: tests/idea-narrative-forward-0.9.0-preview.3/simple-study/inputs/reader-handoff.yaml
target_reader_profile:
  primary_readers: [environmental chemistry researchers, laboratory quality investigators]
  reading_purpose: judge whether a bounded measurement-agreement study is coherent and useful
reader_prior_knowledge:
  may_assume: [basic analytical chemistry, agreement and repeatability concepts]
  must_not_assume: [project-internal vocabulary, specialized instrument engineering]
terms_requiring_definition:
  rule: define only nonstandard or cross-disciplinary terms needed for the core question
reader_reasoning_chain:
  - establish the measurement problem
  - state current practice
  - identify the unresolved evidence gap
  - explain its practical importance
  - justify the proposed comparison design
language: en
