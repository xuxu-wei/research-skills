    operation: replace
    current_problem: "总述把主体问题、候选表征定义、验证路线、发表与资源交付以及两项试验的访视和一维摘要操作压入同一句，阶段 III 细节在读者形成阶段 I–II 主线前出现。"
    target_state: "总述先让读者一次提取 24 个月主体研究的对象、核心验证路线和主要贡献，再用一个简短从属分句保留条件性阶段 III；各 Structured abstract 条目只承担其标题承诺的功能。"
    required_content_or_function: "总述必须保留脓毒症发病前、首次发病、发病后演化和结局的连续范围，MIMIC-IV 与 eICU-CRD 数据基础，患者—时间状态及状态转移，数据支持、模拟重建和跨数据库检验，以及阶段 II 完成后才可能开展的分试验次要分析。"
    content_to_preserve:
      - "候选表征的研究对象与患者—时间推断单位"
      - "24 个月阶段 I–II 的数据审计、模拟重建和隔离跨数据库检验"
      - "阶段 III 的条件性、后续性和两项试验不合并的边界"
      - "计划性措辞，不把拟开展工作写成现成结果"
    content_to_remove_or_move:
