      - "从 One-sentence complete-Idea summary 移出 EXIT-SEP 第 7 日、XBJ-SCAP 第 8 日、实际稀疏测量和一维摘要比较的操作细节，保留在方法与分试验产物中"
      - "从摘要的 Approach、Expected result 和 Contribution 中删除已经由相邻条目或阶段 III 技术权威重复承担的资格与解释句"
    destination_if_moved: "交付物归入 Structured abstract 的 Expected result 和 Expected outputs；试验操作细节归入现有阶段 III 方法小节。"
    dependencies:
      - NRP-001
    acceptance_test: "不查看后文的目标读者阅读总述和 Structured abstract 一次后，能够准确复述阶段 I–II 的研究对象、未决问题、验证顺序和贡献，并把阶段 III 识别为从属且有条件的后续分析；总述仍为一个完整句子且未删除任何身份核心要素。"

  - action_id: NRP-003
    addresses_findings:
      - NAR-003
    priority: minor
    dossier_locator:
      section_heading: "Structured abstract"
      subsection_heading: null
      content_anchor: "Background and gap、Objective and hypothesis 及 Contribution and impact 中首次承担核心推理作用的“模拟重建性能”“锚定规则”“合取证据框架”"
    operation: define
    current_problem: "三个跨学科核心概念在摘要中参与假设或贡献陈述，但其通俗含义要到后文才明确。"
    target_state: "每个概念在首次承担核心推理功能时即有一段可由所有声明读者理解的短解释，后续章节只增加技术精度。"
    required_content_or_function: "说明模拟重建是在已知生成情景中检验能否恢复预设状态、转移或关系；说明锚定是用预定测量、符号和尺度限制可解释对象；说明合取判定要求各证据组成项同时达到标准且不能互相补足。"
    content_to_preserve:
      - "后文关于模拟情景、锚定尺度、状态对齐和阶段 II 五项合取标准的全部技术定义"
      - "候选表征、双时间和状态—行动—观察分离已有的首次解释"
    content_to_remove_or_move: []
    destination_if_moved: null
    dependencies:
      - NRP-002
    acceptance_test: "从标题开始顺序阅读时，读者第一次遇到模拟重建性能、锚定规则或合取证据框架即可用相邻文字解释其在研究中的作用，不需要向后查找；定义不引入新的项目标签，也不把术语标准性或替换问题混入本修复。"

