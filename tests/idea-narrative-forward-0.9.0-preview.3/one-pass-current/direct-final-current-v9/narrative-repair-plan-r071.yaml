    priority: major
    dossier_locator:
      section_heading: "Research design and methods"
      subsection_heading: "随机对照试验稀疏随访测量的条件性观测映射与临床状态次要分析"
      content_anchor: "从“两项新访视结局均是在原试验结果之后提出的次要或探索性分析”开始的阶段 III 完整技术逻辑"
    operation: consolidate
    current_problem: "阶段 III 的完整资格条件、观测映射标准、替代分析路径、停止条件和解释边界虽已在方法小节给出，却又在多个必需章节以接近完整的形式重述，使条件性扩展获得与阶段 I–II 接近的叙事权重。"
    target_state: "由该方法小节承担阶段 III 的完整资格、实施、替代和停止逻辑；Limitations and boundary conditions 保留完整限制与假设；其他必需章节只留下完成本节合同功能所需的最小、自足陈述。"
    required_content_or_function: "保留阶段 III 与研究身份的关系、阶段 II 完成后的时间顺序、每项试验独立核验、R0 与 R1、冻结观测映射、观测映射与独立临床状态两条互斥路径、试验特异人群与访视、缺失和死亡处理、多重性、停止条件及允许解释。"
    content_to_preserve:
      - "标题、主要问题和目标中对条件性阶段 III 的可识别但从属的陈述"
      - "方法小节中两项试验的全部资格、计算、误差、分析路径和停止规则"
      - "Evidence chain 中 Input、Method / analysis / processing、Output 和 Supports 四项功能"
      - "Required analyses 的阶段 III 必需证据、Expected outputs 的分试验产物、Claim-Support 的主张审计和风险表的触发—替代—后果功能"
      - "Limitations and boundary conditions 作为唯一完整限制与假设权威位置"
    content_to_remove_or_move:
      - "从顶部总述、摘要、工作计划、数据说明、贡献、资源和收束段落中移出重复的共同资格条件组合：阶段 II 成立、个体数据授权、试验语义核验和共同生理测量合格"
      - "从非技术权威位置移出重复的观测映射失败后改作独立临床状态分析或停止新访视结局分析的完整分支说明"
      - "从不承担解释或限制功能的位置删除重复的“阶段 III 不能补足阶段 II、不能验证整个候选表征”完整说明；确有局部必要时只保留直接连接该处设计决定的自足边界"
    destination_if_moved: "资格、实施、替代与停止逻辑合并到 Research design and methods 的现有阶段 III 小节；完整限制只并入现有 Limitations and boundary conditions，不建立新的限制位置。"
    dependencies: []
    acceptance_test: "逐节检查后，阶段 III 的完整操作逻辑只在现有方法小节出现一次，完整限制只在 Limitations and boundary conditions 出现一次；标题、摘要、问题、目标、工作包、证据链、产物和 Claim-Support 仍各自保留可识别的阶段 III 局部功能；15 个必需 H2、section 3 的五个 H3、五条 Evidence chain 及其四个字段均未删除或改名，也没有用指向限制章节的交叉引用替代必要的局部边界。"

  - action_id: NRP-002
    addresses_findings:
