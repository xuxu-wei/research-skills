  - NRP-002
  - F-01
  - F-02

omitted_reported_nonblocking_findings: []

included_nonblocking_finding_rationale:
  F-01: >-
    Include this localized navigation repair because NRP-002 already requires the
    same evidence-ladder cell to be retained in compressed form. Naming the methods
    subsection directly closes the minor issue without adding a separate revision
    cycle or changing any evidence requirement.
  F-02: >-
    Include this localized grammatical repair because NRP-001 already moves, but
    otherwise preserves, the complete trial-observation-mapping subsection. The
    replacement only makes the fixed explained-energy proportion explicit and can be
    completed in the same concentrated repair without changing the metric or threshold.

identified_overlaps:
  - finding_ids: [NRP-001, NRP-002]
  - finding_ids: [NRP-001, F-02]
  - finding_ids: [NRP-002, F-01]

overlap_dispositions:
  - finding_ids: [NRP-001, NRP-002]
    disposition: >-
      Move the complete Conditional trial-observation mapping and independent
      analysis subsection as one intact technical authority after Secondary
      representation diagnostics, then consolidate only the repeated material in
      other sections. NRP-002 must not shorten the moved authority subsection or
      leave a second complete branch specification elsewhere.
  - finding_ids: [NRP-001, F-02]
    disposition: >-
      NRP-001 controls the subsection's destination. Within the moved and otherwise
      scientifically preserved fidelity sentence, apply F-02's exact grammatical
      clarification to the retained wording; the language edit does not alter the
      move, the matrix, the first singular axis, the 50% threshold, or the requirement
      that every listed criterion be met.
  - finding_ids: [NRP-002, F-01]
    disposition: >-
      NRP-002 controls what remains in the evidence-ladder row and requires the row's
      claim-audit function to remain. Retain a compact evidence requirement and, in
      that retained text, replace the invisible numbered reference with the named
      trial-observation-mapping and independent-analysis subsection as required by
      F-01. F-01 may constrain the retained wording but may not restore method detail
      that NRP-002 removes.

unresolved_overlaps: []
all_overlaps_resolved: true

normalized_repair_actions:
  - repair_item_id: NRP-001
    source_item_ids: [NRP-001, NAR-001]
    addresses_finding_ids: [NAR-001]
    locator: >-
      Research design and methods > Conditional trial-observation mapping and
      independent analysis; Research design and methods > Secondary representation
      diagnostics
    operation: move
    problem: >-
      The complete conditional stage-III method interrupts the stage-I/II methods
      before both secondary representation diagnostics have been presented.
    target: >-
      Keep the stage-I/II route continuous through the two primary tasks, state
      system, observational target, absolute recovery, hospital-primary
      cross-database validation, and both secondary representation diagnostics;
      present the complete conditional trial extension only after that route.
    required_function_or_term: >-
      The stage-I/II methods must read as the uninterrupted primary route, followed
      by one explicitly subordinate and complete conditional trial-analysis branch.
    content_to_preserve:
      protected_ids:
        - PCR-014
        - PCR-027
        - PCR-028
        - PCR-029
        - PCR-030
        - PCR-031
        - PCR-032
        - PCR-043
        - PCR-053
        - PCR-064
      instruction: >-
        Move, rather than regenerate, the full technical logic. Preserve the shared
        prerequisites; separate mapping-eligible, independent-SOFA, and stop branches;
        every threshold and formula; trial-specific population, visit, missing-data,
        multiplicity, and stopping rules; the separate analysis of EXIT-SEP and
        XBJ-SCAP; both stage-II diagnostics; and every claim boundary.
    delete_move_disposition: >-
      Remove the complete Conditional trial-observation mapping and independent
      analysis subsection from between Hospital-primary cross-database validation and
      Secondary representation diagnostics, and insert that complete subsection after
      Secondary representation diagnostics. Do not leave a fragment, summary, or
      duplicate in the old location.
    destination: >-
      Research design and methods, immediately after Secondary representation diagnostics
    dependencies: []
    acceptance_test: >-
      A sequential reading of Research design and methods reaches both complete
      secondary representation diagnostics before any stage-III formula, eligibility
      branch, or trial-specific processing. The moved subsection remains complete,
      EXIT-SEP and XBJ-SCAP remain separate, no scientific condition is deleted or
      changed, and F-02 is applied only to its retained fidelity sentence.

  - repair_item_id: NRP-002
    source_item_ids: [NRP-002, NAR-001]
    addresses_finding_ids: [NAR-001]
    locator: >-
      Objectives; Work packages and minimum route; Evidence chain: conditional
      randomized-trial secondary analysis; Required analyses and evidence; Planned
      outputs; Falsification and stop criteria; Interpretation matrix; Contribution
      and evidence ladder; Verified representative closest-work comparison; Title
      and positioning claim-support table; Feasibility and resources; Working
      assumptions; Risks, alternatives, and stop conditions; Limitations and boundary
      conditions
    operation: consolidate
    problem: >-
      Complete trial-start qualifications, mapping and fallback branches, estimand and
      processing details, stop rules, and claim boundaries are repeated across
      sections whose distinct functions require only a small part of that logic. The
      repetition makes the subordinate extension compete with stages I-II and weakens
      the authority of the methods subsection and the complete limitations section.
    target: >-
      Retain one complete technical authority in Conditional trial-observation mapping
      and independent analysis and one complete limitations authority in Limitations
      and boundary conditions. Every other required section retains only the minimum
      self-contained statement needed for its own objective, work-package, evidence-
      chain, evidence-requirement, output, falsification, interpretation, contribution,
      comparison, claim-audit, feasibility, assumption, or risk-response function.
    required_function_or_term: >-
      Preserve a complete technical authority and a complete limitations authority;
      preserve all required section functions without using a pointer as a substitute
      for a locally necessary boundary, and remove repeated specifications that do not
      perform a distinct local function.
    content_to_preserve:
      protected_ids:
        - PCR-001
        - PCR-002
        - PCR-003
        - PCR-004
        - PCR-005
        - PCR-006
        - PCR-007
        - PCR-008
        - PCR-009
        - PCR-010
        - PCR-011
        - PCR-012
        - PCR-013
        - PCR-014
        - PCR-015
        - PCR-016
        - PCR-017
        - PCR-018
