        - PCR-061
        - PCR-062
        - PCR-063
        - PCR-064
      instruction: >-
        Before condensing, moving, merging, or deleting any passage, reopen every
        affected source locator in the prior dossier and preserve every enumerated
        scientific commitment. Consolidation changes placement and repetition only;
        it may not weaken a threshold, formula, owner, deadline, consequence,
        eligibility branch, evidence status, limitation, stop rule, or prohibited claim.
    delete_move_disposition: >-
      Apply every locator-level disposition below. Narrative placement controls every
      deletion, move, merge, and retained local function. Language instructions apply
      only to wording that remains after these dispositions.
    destination:
      - >-
        Full trial eligibility, mapping, probability-index, fallback, trial-specific,
        missing-data, multiplicity, and stop logic: Conditional trial-observation
        mapping and independent analysis
      - >-
        Full resource, semantic, mapping, timing, regulatory, evidence-status, and
        prohibited-claim limitations: Limitations and boundary conditions
    dependencies: [NRP-001]
    locator_dispositions:
      - locator: Research question, objectives, and core hypothesis > Objectives
        disposition: >-
          Retain Objective 4 as one short identity statement that the per-trial
          secondary analyses occur only after the main study meets its criteria.
          Remove method, threshold, and repeated success-repair detail.
      - locator: Research content and work packages > Work packages and minimum route
        disposition: >-
          Retain WP5 timing, dependency, per-trial output, and the fact that it is not
          part of stage-II success. Retain the precedence consequence that trial
          findings cannot bypass a failed stage-I/II step; do not restate branch methods.
      - locator: "Evidence chain: conditional randomized-trial secondary analysis"
        disposition: >-
          Retain exactly the four required Input, Method / analysis / processing,
          Output, and Supports functions. Compress the method line to the per-trial
          verification, ordered-visit analysis, missing-data/sensitivity, and
          multiplicity roles without repeating thresholds or formulas.
      - locator: Required analyses and evidence
        disposition: >-
          Replace the grouped trial specification with a compact requirement for
          authorization, original semantic verification, trial-specific eligibility,
          and execution of the fixed method. Delete the repeated field list, mapping
          construction, probability-index details, imputation recipe, center rules,
          Holm family, and confirmation sequence from this section; those remain in
          the methods authority and protected assumptions.
      - locator: Expected outputs, falsification criteria, and interpretations > Planned outputs
        disposition: >-
          Retain the output of separate per-trial results when eligible or a record of
          why no new visit-outcome analysis was performed. Do not restate eligibility.
      - locator: Expected outputs, falsification criteria, and interpretations > Falsification and stop criteria
        disposition: >-
          Retain the distinct consequences: mapping failure blocks only the proxy-
          ordered outcome and leaves the independent SOFA branch available when its
          conditions hold; unverified core semantics stop all new visit outcomes;
          discordance or imprecision limits interpretation and cannot be repaired by
          subgroup selection. Delete the repeated full fidelity-threshold list and
          full eligibility tree.
      - locator: Expected outputs, falsification criteria, and interpretations > Interpretation matrix
        disposition: >-
          Retain separate rows for an eligible mapping result and an independent SOFA
          result, with their different permitted and prohibited interpretations. Do
          not reproduce the construction or eligibility method in the matrix.
      - locator: Contribution, innovation, impact, application, and closest-work comparison > Contribution and evidence ladder
        disposition: >-
          Retain the subordinate trial-evidence row and its claim-strength function.
          Compress its required evidence to a direct named reference to the trial-
          observation-mapping and independent-analysis subsection while preserving
          data, semantics, outcome construction, missing-data, center, and multiplicity
          requirements. Apply F-01 to the retained wording.
      - locator: Contribution, innovation, impact, application, and closest-work comparison > Verified representative closest-work comparison
        disposition: >-
          Retain only the precedent comparison and the conditional difference that
          separate per-trial visit outcomes follow the main study. Delete any method
          specification beyond comparison and positioning.
      - locator: Title and positioning claim-support table
        disposition: >-
          Retain the subordinate-extension claim, its evidence-chain support, its
          conditional status, and its non-primary-contribution boundary. Replace any
          repeated method detail with the minimum named technical-authority reference
          needed for claim audit.
      - locator: Feasibility, resources, risks, alternatives, and stop conditions > Feasibility and resources
        disposition: >-
          Retain unverified access, personnel, available-effort, scope, and result
          status. Do not add or repeat the trial branch specification here.
      - locator: Feasibility, resources, risks, alternatives, and stop conditions > Working assumptions
        disposition: >-
          Retain all four assumption rows, including WA-R117-01 and WA-R117-02 owners,
          deadlines, fixed quantities, and consequences. Remove only wording that
          duplicates a full limitation without advancing the assumption's own
          decision, owner, timing, or consequence.
      - locator: Feasibility, resources, risks, alternatives, and stop conditions > Risks, alternatives, and stop conditions
        disposition: >-
          Retain each object-specific trigger, prespecified response, and consequence,
          including the trial-authorization or core-semantics stop. Do not repeat the
          full mutually exclusive trial branch tree.
      - locator: Feasibility, resources, risks, alternatives, and stop conditions > Limitations and boundary conditions
        disposition: >-
          Preserve all 11 numbered limitation families as the sole complete
          limitations authority, including resource, time, trial-data, mapping,
          regulatory, evidence-status, and prohibited-claim boundaries. Do not replace
          any limitation with a cross-section pointer.
    acceptance_test: >-
      The full trial eligibility, thresholds, formula, alternatives, trial-specific
      processing, and stopping logic occurs once in the named methods subsection; all
      11 complete limitation families occur in Limitations and boundary conditions;
      other required sections perform only their distinct local functions. All 15
      required H2 headings, the five Background-to-Rationale H3 headings, all five
      complete evidence chains, Key techniques implementation records, every PCR-001
      through PCR-064 commitment, and every scientific boundary remain. From title to
      primary objective through stage-I/II methods, the reader does not need to reread
      stage-III conditions.

  - repair_item_id: F-01
    source_item_ids: [F-01]
    addresses_finding_ids: [F-01]
    locator: >-
      Contribution and evidence ladder > row "从属的试验访视结局证据" > cell "必需证据"
    operation: replace
    problem: >-
      The phrase "第 7 节规定的" points to a number that is not displayed in the
      dossier and can send a reader to the wrong methods subsection.
    target: >-
      In the compact cell retained by NRP-002, identify the intended methods
      subsection by name and retain the same evidence requirements.
    required_function_or_term: >-
      Replace "第 7 节规定的" with "研究设计与方法中关于试验观测映射和独立分析的小节所规定的".
    content_to_preserve:
      protected_ids: [PCR-040, PCR-043, PCR-062]
      instruction: >-
        Preserve the data, semantics, outcome-construction, missing-data, center, and
        multiplicity requirements and their conditional, subordinate evidence role.
    delete_move_disposition: >-
      NRP-002 first compresses the cell and decides what claim-audit text remains.
      Apply this replacement only to the retained cross-reference; do not restore any
      method detail deleted by NRP-002.
    destination: >-
      Same retained evidence-ladder cell after NRP-002 consolidation
    dependencies: [NRP-002]
    acceptance_test: >-
      The retained cell directly names the trial-observation-mapping and independent-
      analysis subsection without section counting, and all six listed evidence
      requirements and their conditional role remain scientifically unchanged.

  - repair_item_id: F-02
    source_item_ids: [F-02]
    addresses_finding_ids: [F-02]
    locator: >-
      Research design and methods > Conditional trial-observation mapping and
      independent analysis > external-fidelity criteria sentence
    operation: replace
    problem: >-
      "第一奇异轴解释 L_C Frobenius 能量至少 50%" leaves the grammatical relation
      between the explained quantity and its proportion implicit.
    target: >-
      State explicitly that the 50% threshold applies to the proportion of L_C
      Frobenius energy explained by the first singular axis.
    required_function_or_term: >-
      Use "第一奇异轴所解释的 L_C Frobenius 能量比例至少为 50%".
    content_to_preserve:
      protected_ids: [PCR-028]
      instruction: >-
        Preserve L_C, the first singular axis, Frobenius energy, the 50% threshold,
        and the conjunction requiring every listed external-fidelity criterion.
    delete_move_disposition: >-
      Apply the wording replacement inside the complete subsection after NRP-001 has
      moved it. Do not delete, move separately, or otherwise rewrite the surrounding
      criterion list.
    destination: >-
      The same fidelity sentence in the subsection's post-NRP-001 location
    dependencies: [NRP-001]
    acceptance_test: >-
      The moved sentence explicitly states an explained-energy proportion of at least
      50%, and the matrix, metric, threshold, model role, and all-criteria conjunction
      are unchanged.

