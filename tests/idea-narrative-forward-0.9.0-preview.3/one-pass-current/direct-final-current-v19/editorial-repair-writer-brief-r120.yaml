mandatory_whole_dossier_checks:
  not_new_findings: true
  checks:
    - check: Exact structural and plugin-version lint
      instruction: >-
        After all four passes and before freezing the dossier, run exactly:
        python research-skills-openai/skills/multi-path-idea-generator/scripts/lint_idea_dossier.py
        tests/idea-narrative-forward-0.9.0-preview.3/one-pass-current/direct-final-current-v20/idea-dossier-v054.md
        --expected-plugin-version 0.9.0-preview.3. Resolve every error without changing
        science; retain all 15 required H2 headings, all five reasoning H3 headings,
        all five four-field evidence chains, the Key techniques table, and the
        Claim-Support table.
      acceptance: >-
        The exact command exits successfully, reports OK for idea-dossier-v054.md,
        and the dossier frontmatter has plugin_version 0.9.0-preview.3.
    - check: Advisory reader-facing short-form diff
      instruction: >-
        After the dossier text is final, run:
        python research-skills-openai/skills/academic-language-assessor/scripts/diff_reader_facing_short_forms.py
        tests/idea-narrative-forward-0.9.0-preview.3/one-pass-current/direct-final-current-v19/idea-dossier-v053.md
        tests/idea-narrative-forward-0.9.0-preview.3/one-pass-current/direct-final-current-v20/idea-dossier-v054.md.
        For every emitted candidate, inspect every listed occurrence and record exactly
        one disposition in the revision delta: removed, standard_and_defined,
        descriptive_not_label, or fixed_scaffolding. Record an explicit empty receipt
        if the diff emits no candidates. Candidate presence alone is not a failure.
      acceptance: >-
        Every emitted candidate and every occurrence has one permitted, text-grounded
        disposition in the delta; no confirmed unresolved terminology problem remains.
    - check: All 64 protected-content items
      instruction: >-
        Reopen every source_locator and every revised locator for PCR-001 through
        PCR-064. Compare the revised dossier's actual words against every enumerated
        element, including numbers, time rules, formulas, branch eligibility and
        consequences, owners and deadlines, evidence status, claim strength, and
        unsupported claim classes. A heading or delta assertion is not evidence.
      acceptance: >-
        The revision delta contains exactly one compact, text-grounded preservation
        row for every PCR-001 through PCR-064, and every enumerated element remains in
        the dossier at the stated revised locator or locators.
    - check: Verbatim machine-facing identity anchors
      instruction: >-
        Compare all five identity_anchor frontmatter values against the protected
        register: primary_research_question, primary_objective, study_object,
        core_data_or_evidence_base, and primary_unit_of_inference. Copy each value
        verbatim, including punctuation and capitalization.
      acceptance: >-
        All five values are byte-for-byte identical to the protected register and the
        dossier uses artifact_id idea-dossier-I01-001-v054, version_id v054, the v20
        path, plugin_version 0.9.0-preview.3, and change_type editorial_repair.
    - check: Limitations authority and scientific claim boundaries
      instruction: >-
        Confirm that Limitations and boundary conditions remains the sole complete
        limitations authority and preserves all 11 numbered families: resources and
        access; labels, clocks, and leakage; recoverability and structural scope;
        nonrandom missingness and action support; cross-database evidence; timing;
        trial data and semantics; common anchors and mapping; closest-work uncertainty;
        regulatory applicability; and all prohibited claims. Other sections may keep
        only self-contained boundaries needed for their own function and may not use
        pointers as substitutes for a required local boundary.
      acceptance: >-
        All 11 complete families occur once at the limitations authority, none is
        weakened or replaced by a pointer, and no causal, mechanism, control,
        digital-twin, validated-tool, clinical-effectiveness, pooled-effect,
        common-mechanism, or unconditional-promotion claim has been introduced.
    - check: Stop rules, mutually exclusive branches, assumptions, and milestones
      instruction: >-
        Verify every scientific stop and consequence in PCR-014, PCR-015, PCR-021,
        PCR-023 through PCR-038, PCR-044 through PCR-047, PCR-053, PCR-059, PCR-060,
        and PCR-064. Keep mapping eligibility branch-specific rather than a shared
        prerequisite; preserve the independent SOFA alternative when eligible; keep
        failure of core trial semantics as the stop for all new visit outcomes; keep
        WA-R117-01 and WA-R117-02 owners, deadlines, and consequences; and preserve
        month-3, month-6, month-7, month-12, month-20, and month-24 decisions.
      acceptance: >-
        Every trigger has its original consequence, no branch-specific condition has
        become a shared prerequisite, no fallback has disappeared, no missing value
        has been guessed, and stage III cannot bypass, count toward, or repair stage-II
        success.

execution_and_handoff:
  section_passes:
    - >-
      Pass 1 — reader core, sections 1–4: revise the title/summary/positioning,
      structured abstract, Background-to-Rationale chain, and research question,
      objectives, and hypothesis only as needed for concordance with the normalized
      actions; preserve the one-sentence and one-question field cardinalities.
    - >-
      Pass 2 — research plan and technical authority, sections 5–11: execute NRP-001,
      preserve the full moved trial-method authority, apply F-02 to its retained
      sentence, and apply NRP-002 dispositions to work packages, methods-adjacent
      implementation, evidence chains, required evidence, outputs, falsification, and
      interpretations without creating partial artifacts.
    - >-
      Pass 3 — positioning, claim audit, and limitations authority, sections 12–14:
      execute every remaining NRP-002 locator disposition, apply F-01 only to the
      retained evidence-ladder wording, and preserve the complete 11-family
      limitations authority, working assumptions, risks, and scientific claim bounds.
    - >-
      Pass 4 — references and whole-dossier concordance: check reference callouts,
      first use and all occurrences of each required scientific role, run the exact
      plugin-version lint and advisory short-form diff, verify every PCR item, identity
      anchor, limitation, assumption, branch, milestone, and stop condition, then
      freeze the complete dossier.
  single_complete_target_dossier: true
  partial_artifacts_forbidden: true
  delta_after_dossier_freeze_only: true
  delta_requirements:
    - >-
      Create or finalize the delta only after idea-dossier-v054.md has passed all four
      passes, the exact lint, the advisory short-form diff review, and the complete
      preservation scan, and after the dossier has been frozen. Any later dossier edit
      invalidates the delta and requires rerunning the scans and rewriting the delta.
    - >-
      Map each of NRP-001, NRP-002, F-01, and F-02 to its revised locator, executed
      operation, and observable acceptance-test result. Include every locator-level
      NRP-002 disposition in compact form; no included item may be omitted or merely
      declared complete.
    - >-
      Map every PCR-001 through PCR-064 to revised locator or locators and item-level
      evidence in the dossier's actual words. Keep one compact row per protected ID;
      do not reproduce the protected text or long dossier excerpts.
    - >-
      Record the five verbatim identity-anchor comparisons, the 11-family limitations
      check, all assumption and stop-rule checks, and the exact plugin-version lint
      receipt.
    - >-
      Record the advisory short-form diff receipt and one permitted disposition for
      every candidate and occurrence, including an explicit empty receipt when none
      are emitted.
    - >-
      Add a compact reader-facing concordance table for the central study object,
      primary research question, two primary clinical tasks, primary outcomes,
      candidate representation, conditional trial extension, mapping-ordered visit
      outcome, independent SOFA ordered clinical-state endpoint, evidence status, and
      contribution. For each role, record one reader-facing name, first-use locator,
      competing forms removed or reclassified, and an all-occurrence scan result.
