omitted_item_scope_guard: >-
  ALA-003 through ALA-007 are record-only minor observations. Do not repair them,
  reproduce them, add tests for them, or silently incorporate their wording changes
  into ALA-001 or ALA-002. A wording change is permitted only when it is necessary
  to execute an explicit all-occurrence replacement in one of the two major actions;
  do not use that edit as a pretext to address another minor concept cluster.

