overlap_dispositions:
  - finding_ids:
      - ALA-001
      - ALA-002
    disposition: >-
      The two actions share title, summary, abstract, question, objective, milestone,
      methods, evidence-chain, output, interpretation, contribution, claim-audit, and
      section-14 locators but govern different scientific roles. Execute ALA-001
      first to give the overall representation, fitted model, representation output,
      and structural relationship distinct names. Then execute ALA-002 in that
      already-normalized text to name the three validation strata, the isolated
      second-database test data, and the frozen-model external validation. In a
      sentence containing both roles, keep ALA-001's subject and ALA-002's validation
      predicate. Do not collapse the representation into a validation operation or
      turn a validation label into a model name. Neither action authorizes a change
      to a dataset role, split, model-update operation, threshold, claim, or stage.

unresolved_overlaps: []
all_overlaps_resolved: true

normalized_repair_actions:
  - repair_item_id: ALA-001
    source_item_ids:
      - ALA-001
    addresses_finding_ids:
      - ALA-001
    locator: >-
      H1 and Title; One-sentence complete-Idea summary; Structured abstract;
      Primary research question; Objectives 2-3; and every subsequent occurrence
      that names the overall representation, the fitted complex model, its latent
      representation output, or a proposed structural relationship.
    operation: replace
    problem: >-
      The central study object shifts among long modifier stacks and ambiguous forms
      such as “脓毒症全病程候选动态系统表征”, “知识约束、不确定性感知候选动态系统表征”,
      “候选表征”, “候选状态表征”, “候选结构”, “复杂候选”, and
      “最小全病程候选表征”. The wording does not reliably tell a multidisciplinary
      reader whether it denotes the overall study representation, the fitted model,
      an output, or a proposed edge or dependency.
    target: >-
      The title and first summary directly name the ICU time and clinical scope and
      state what the prior knowledge and uncertainty procedures do. Every later use
      has one explicit center noun tied to exactly one role: overall candidate
      dynamic representation, fitted candidate complex model, latent-state
      representation output, or proposed structural relationship.
    required_function_or_term: >-
      Use the exact first-use description “用于描述重症监护期间脓毒症发病前风险、首次发病、
      发病后状态及其转移的候选动态表征”. Replace “知识约束、不确定性感知” with
      the functional wording “受文献和专家先验约束，并报告估计与预测不确定性”.
      Thereafter use “候选动态表征” only for the overall representation,
      “候选复杂模型” only for the fitted complex model, “潜在状态表征” only for
      its representation output, and “待检验结构关系” only for a proposed edge,
      sign, lag, or dependency. Use “简单模型” or the already specified simple
      model class for fallback models; do not call a fallback a complex candidate.
    content_to_preserve:
      protected_ids: &all_protected_ids
        - PCR-001
        - PCR-002
        - PCR-003
        - PCR-004
        - PCR-005
        - PCR-006
        - PCR-007
        - PCR-008
