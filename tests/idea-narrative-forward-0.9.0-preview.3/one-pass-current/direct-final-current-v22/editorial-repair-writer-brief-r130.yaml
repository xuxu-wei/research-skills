machine_identity_anchor_requirement:
  copy_verbatim_from_register: true
  fields:
    - primary_research_question
    - primary_objective
    - study_object
    - core_data_or_evidence_base
    - primary_unit_of_inference
  acceptance: >-
    All five identity_anchor values in v057 are character-for-character identical to
    register v008. Reader-facing terminology may change, but these machine-facing
    values may not be paraphrased.

mandatory_whole_dossier_checks:
  not_new_findings: true
  checks:
    - check: Exact structural and active-plugin-version lint
      instruction: >-
        After all bounded passes and before freezing the dossier, run exactly: python
        research-skills-openai/skills/multi-path-idea-generator/scripts/lint_idea_dossier.py
        tests/idea-narrative-forward-0.9.0-preview.3/one-pass-current/direct-final-current-v23/idea-dossier-v057.md
        --expected-plugin-version 0.10.0. Resolve every error without changing
        science. Preserve all 15 required H2 headings, the five distinct
        Background-to-Rationale H3 functions, all five evidence chains with Input,
        Method / analysis / processing, Output, and Supports, the implementation
        records, and the claim-support table.
      acceptance: >-
        The exact command exits successfully, reports OK for idea-dossier-v057.md,
        and the dossier declares plugin_version 0.10.0.
    - check: Complete protected-content and machine-identity coverage
      instruction: >-
        Reopen every source locator for PCR-001 through PCR-064 before replacing
        wording. Compare the complete candidate against every enumerated number,
        time rule, formula, branch, dependency, eligibility, consequence, owner,
        deadline, evidence status, claim boundary, limitation, and unsupported claim
        class. Compare all five identity-anchor values character for character.
      acceptance: >-
        Every protected item has the same scientific meaning and strength at a
        revised locator, all five anchors are verbatim, and the delta contains one
        compact text-grounded row for every PCR-001 through PCR-064.
    - check: ALA-001 all-occurrence role inventory
      instruction: >-
        Inventory every source and candidate occurrence of “候选”, “表征”,
        “模型”, “结构”, “知识约束”, and “不确定性感知” that names the central
        object or one of its components. Assign each retained candidate occurrence to
        exactly one ALA-001 role, record its locator and final form, and remove every
        forbidden residual form. This is an all-occurrence compliance check, not a
        new terminology assessment.
      acceptance: >-
        Every source occurrence has a recorded revised locator and role or a deletion
        disposition; each candidate term has one role; all forbidden residual forms
        are absent; and title, one-sentence summary, and question meet ALA-001's
        observable acceptance test without changing science.
    - check: ALA-002 all-occurrence validation inventory
      instruction: >-
        Inventory every source and candidate occurrence of “时间外”, “医院外”,
        “未触碰”, “不更新外部检验”, temporal or hospital holdout, isolated test
        data, frozen-model validation, test-result access, and the three later update
        operations. Assign each retained candidate occurrence to exactly one ALA-002
        role and record its locator and final form. This is an action-compliance
        check, not a new validation-method assessment.
      acceptance: >-
        Every source occurrence has a recorded revised locator and role or a deletion
        disposition; the first abstract definition is complete; forbidden residual
        forms are absent; and the split, access, update, evidence, and failure logic
        is unchanged.
    - check: Included-action and omitted-minor scope
      instruction: >-
        Compare the actual candidate text against every clause of ALA-001 and
        ALA-002, including their overlap disposition and acceptance tests. Confirm
        separately that no change was made to execute ALA-003, ALA-004, ALA-005,
        ALA-006, or ALA-007. Preserve all thresholds, equations, branch eligibility,
        stop consequences, planned status, stages, and claim strength.
      acceptance: >-
        Both major actions are fully executed in actual text, their overlap is
        resolved in the stated order, the five minor observations remain record-only,
        no unsupported claim is added, and the only non-editorial metadata update is
        the authorized v057 identity, path, lineage, and plugin-version declaration.

execution_and_handoff:
  section_passes:
    - >-
      Pass 1 — reader core, sections 1-4: execute the exact ALA-001 first-use and role
      names, then the exact ALA-002 first definition and validation labels. Preserve
      title, summary, abstract, question, objective, and hypothesis functions and do
      not touch any omitted minor cluster.
    - >-
      Pass 2 — plan and technical core, sections 5-11: continue the same two
      all-occurrence maps through milestones, work packages, data, methods,
      implementation, evidence chains, required analyses, outputs, falsification,
      and interpretation. Preserve every threshold, formula, split, update branch,
      stop consequence, and evidence role.
    - >-
      Pass 3 — positioning and authority, sections 12-14: apply only the same role
      names in contribution, closest-work comparison, claim support, assumptions,
      limitations, and risk responses. Preserve all eleven full limitation families,
      every working assumption, and all prohibited claim classes.
    - >-
      Pass 4 — references and whole-dossier concordance: run both all-occurrence
      inventories, compare all 64 protected items and five anchors, verify the two
      included actions in actual text, confirm the five omitted minors were not
      executed, run the exact lint, and only then freeze the complete dossier.
  same_writer_instance_required: true
  single_complete_target_dossier: true
  partial_artifacts_forbidden: true
  pre_freeze_action_compliance_required: true
  delta_after_dossier_freeze_only: true
  delta_requirements:
    - >-
      Create or finalize revision-delta-v056-to-v057.md only after the complete v057
      dossier passes all four bounded passes, both all-occurrence inventories, the
      exact lint, the 64-item preservation scan, the identity check, and actual-text
      action compliance. Any later dossier edit invalidates the delta and requires a
      complete rerun and rewritten delta.
    - >-
      Map ALA-001 and ALA-002 to all revised locators, replacement operations, role
      maps, overlap disposition, and text-grounded acceptance-test results. Do not
      report ALA-003 through ALA-007 as executed.
    - >-
      Include the two complete all-occurrence inventories, with source locator,
      candidate locator or deletion disposition, assigned scientific role, and final
      form for every retained occurrence.
    - >-
      Map every PCR-001 through PCR-064 to revised locator or locators and compact
      item-level preservation evidence. Record the five verbatim identity comparisons
      and the exact structural-lint receipt.
    - >-
      Record ALA-003 through ALA-007 only as omitted with
      do_not_repair_reproduce_or_add_testing. Do not reproduce their problem text,
      propose their fixes, or create a new test from them.
    - >-
      Keep the delta concise and text-grounded. Do not include assessor reports,
      source-review instructions, hidden reasoning, or unrelated editorial work.
