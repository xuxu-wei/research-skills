        - PCR-045
        - PCR-046
        - PCR-047
        - PCR-048
        - PCR-049
        - PCR-050
        - PCR-051
        - PCR-052
        - PCR-053
        - PCR-054
        - PCR-055
        - PCR-056
        - PCR-057
        - PCR-058
        - PCR-059
        - PCR-060
        - PCR-061
        - PCR-062
        - PCR-063
        - PCR-064
      instruction: >-
        Reopen every affected source locator and preserve the stage-I/II plan, ICU
        continuum, literature and expert priors, explicit uncertainty reporting,
        state, treatment and measurement roles, fitted-model hierarchy, simulation
        and cross-database tests, fallback models, conditional trial extension,
        planned evidence status, and every claim-strength boundary. A role-specific
        name changes wording only; it must not redefine the scientific object.
    delete_move_disposition: >-
      Replace every ambiguous or centerless form with the role-specific term in the
      mapping below. Do not retain the old form parenthetically, create a new acronym,
      or alternate between old and new forms. Delete only redundant modifiers needed
      to make the center noun unambiguous; retain all scientific content carried by
      the sentence.
    destination: null
    dependencies: []
    all_occurrence_role_map:
      - scientific_role: overall_study_representation
        first_use_form: >-
          用于描述重症监护期间脓毒症发病前风险、首次发病、发病后状态及其转移的候选动态表征
        later_form: 候选动态表征
        applies_to: >-
          H1, Title, first summary, abstract objective, primary question, the overall
          study object, and outputs that denote the complete representation rather
          than one fitted model or one latent output.
      - scientific_role: prior_and_uncertainty_procedures
        required_form: 受文献和专家先验约束，并报告估计与预测不确定性
        applies_to: >-
          Every modifier stack currently using “知识约束” or “不确定性感知” to
          characterize the overall representation.
      - scientific_role: fitted_complex_model
        required_form: 候选复杂模型
        applies_to: >-
          Model selection, simulation admission, fitting, rejection, continuation,
          and any sentence now using “复杂候选” or “复杂切换或非线性候选”.
      - scientific_role: representation_output
        required_form: 潜在状态表征
        applies_to: >-
          A model-derived state representation or aligned latent-state output; do not
          use it for the model itself or the entire study plan.
      - scientific_role: proposed_edge_or_dependency
        required_form: 待检验结构关系
        applies_to: >-
          A proposed edge, sign, lag, dependency, structure comparison, or structural
          stability statement now called “候选结构”.
      - scientific_role: simple_fallback
        required_form: >-
          简单模型，或保留原有明确类别名“竞争风险模型”“多状态模型”“线性状态空间模型”“仅预测表征”
        applies_to: Every fallback route; never use “复杂候选” for it.
    forbidden_residual_forms:
      - 复杂候选
      - 知识约束、不确定性感知候选动态系统表征
      - 候选状态表征
      - 候选结构
      - 最小全病程候选表征
    acceptance_test: >-
      H1 and Title remain one title, the complete-Idea summary remains one sentence,
      and the primary research question remains one question. Each of those three
      identifies the object and ICU temporal scope without consulting later methods.
      An all-occurrence scan assigns every use of “候选” to exactly one role in the
      map; the forbidden residual forms are absent; “候选复杂模型”, “潜在状态表征”,
      and “待检验结构关系” are never interchanged; and no scientific scope, stage,
      threshold, evidence status, fallback, or claim strength changes.

  - repair_item_id: ALA-002
    source_item_ids:
      - ALA-002
    addresses_finding_ids:
      - ALA-002
    locator: >-
      Structured abstract through Objective 3, milestones, WP3-WP4,
      Hospital-primary cross-database validation, trial mapping fidelity,
      Evidence chains, Planned outputs, Interpretation matrix, Contribution,
      claim-support, and section 14; include every occurrence of “时间外”,
      “医院外”, “未触碰”, and “不更新外部检验”.
    operation: replace
    problem: >-
      Three different validation strata and the model-update state are named with
      overlapping or metaphorical labels. “医院外” can mean prehospital or
      out-of-hospital care, “未触碰” does not directly describe data isolation, and
      “不更新” does not initially identify the model parameters that remain frozen.
      Readers may therefore merge temporal holdout, hospital holdout, isolated
      second-database testing, and post-test adaptation into one operation.
    target: >-
      The first abstract occurrence distinguishes temporal holdout, hospital holdout,
      and external validation on the second database's development-isolated test set,
      including the absence of recalibration or parameter updating. Later occurrences
      use one direct name for each split, dataset role, frozen-model validation, and
      post-validation adaptation operation.
    required_function_or_term: >-
      At the first abstract occurrence use the complete definition “验证包括按时间留出的
      验证、按医院留出的验证，以及在第二数据库中未参与开发的隔离测试集上，对冻结模型进行
      不含重新校准或参数更新的外部验证”. Thereafter use “按时间留出的验证”,
      “按医院留出的验证”, “隔离测试集”, and “冻结模型外部验证” for those four
      roles. Preserve the distinct post-validation operations “仅校准适配”,
      “仅观测层适配”, and “全模型重拟合”.
    content_to_preserve:
      protected_ids: *all_protected_ids
      instruction: >-
        Preserve the development-database role, hospital-priority allocation,
        adaptation/test split, deterministic allocation, cross-hospital patient
        exclusion and sensitivity analysis, test-data isolation, single analysis,
        frozen model and parameters, all support thresholds, primary evidence role,
        separate adaptation and refit branches, and the rule that adaptations cannot
        change a failed frozen-model result. Preserve every scientific threshold,
        stage dependency, planned status, interpretation, and limitation.
    delete_move_disposition: >-
      Replace every listed old form according to its scientific role. Do not keep an
      old form as a synonym, use “隔离” to imply an unrecorded split, or shorten the
      first definition before the model-update status is explicit. Replace only the
      label; retain each sentence's split, access, update, result, interpretation, or
      stop-rule content.
    destination: null
    dependencies:
      - ALA-001
    all_occurrence_role_map:
      - scientific_role: temporal_holdout_validation
        old_forms:
          - 时间外
          - 时间外验证
        required_form: 按时间留出的验证
      - scientific_role: hospital_holdout_validation
        old_forms:
          - 医院外
          - 医院外验证
        required_form: 按医院留出的验证
      - scientific_role: isolated_second_database_test_data
        old_forms:
          - 未触碰最终测试区
          - 未触碰测试区
          - 未触碰测试资料
          - 未触碰外部数据库
        first_use_form: 第二数据库中未参与开发的隔离测试集
        later_form: 隔离测试集
      - scientific_role: primary_external_validation
        old_forms:
          - 未触碰数据库检验
          - 未触碰跨数据库检验
          - 不更新外部检验
          - 冻结模型的跨数据库检验
        first_use_form: >-
          在第二数据库中未参与开发的隔离测试集上，对冻结模型进行不含重新校准或参数更新的外部验证
        later_form: 冻结模型外部验证
      - scientific_role: isolated_test_result_or_material
        old_forms:
          - 未触碰跨数据库结果
          - 未触碰外部结果
          - 未触碰跨数据库资料
        required_form_rule: >-
          Use “隔离测试集上的外部验证结果” for results and “隔离测试集资料” for
          data; when describing access control, state directly that the results or
          data remain unavailable before the specified freeze.
      - scientific_role: post_validation_operations
        required_forms:
          - 仅校准适配
          - 仅观测层适配
          - 全模型重拟合
        rule: >-
          Keep these as three separate operations after the primary frozen-model
          external validation. Never absorb one into that primary validation.
    forbidden_residual_forms:
      - 时间外
      - 医院外
      - 未触碰
      - 不更新外部检验
    acceptance_test: >-
      The structured abstract's first list distinguishes all three validation strata
      and explicitly states that the second-database test data did not participate in
      development and that the frozen model receives no recalibration or parameter
      update. A whole-dossier scan finds none of the forbidden residual forms. Every
      former occurrence maps to exactly one role in the map; “按医院留出的验证” is
      never used for an out-of-hospital population; the three post-validation
      operations remain separate; and no dataset role, split, access rule, update
      operation, threshold, evidence hierarchy, or failed-result interpretation is
      changed.

