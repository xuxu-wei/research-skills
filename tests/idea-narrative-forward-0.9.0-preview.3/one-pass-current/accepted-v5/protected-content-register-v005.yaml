  - protected_id: PCR-020
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Trial-specific mapping to observed visits and independent clinical-state analysis; ‘试验语义与共同锚点资格’"
    protected_content: |-
      1. 两项新状态端点均为原试验结果后提出的次要、探索性再分析，原 28 日终点须单独复现，试验不得合并。
      2. 治疗组比较前，须冻结阶段 II 达标后的模型、映射规则、阈值、代码和随机种子。每项试验须有个体数据授权，并以原始 CRF、SAP、数据字典或持有人确认随机化、分析集、中心/分层、D7（EXIT-SEP）或 D8（XBJ-SCAP）相对随机化和首剂的实际窗口，以及死亡、住院、存活出院和转院语义。
      3. 共同锚点仅限阶段 II 判定保留的 Y_t 生理锚点、试验实际访视直接测量且构念与单位一致或可确定转换、采样和结果可用时刻在预定窗口内的指标。治疗、测量频率、SOFA/结局标签和事后派生状态不得进入。每项试验至少两个合格锚点；WBC/CRP 目前仅为候选，单位不明 D-dimer 和不存在字段不得映射。
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-021
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Trial-specific mapping to observed visits and independent clinical-state analysis; ‘预先确定的映射、映射输出和一致程度’ and ‘一致性与误差标准’"
    protected_content: |-
      1. 每项试验以其 C_r 单独映射；标准化使用 MIMIC 开发集均值、标准差与第 1/99 百分位截断。对阶段 II 观测方程 Z_C=a_C+L_CX+e 的 L_C 作 SVD：L_C=UDV'；P_state=V_1'X，P_obs=D_1^(-1)U_1'(Z_C−a_C)。并列奇异值按预定锚点字典序选择；符号在 MIMIC 开发集中设为与同日 SOFA 非负相关，使高值表示较差状态。映射不得使用 RCT 治疗分组、RCT 结局或跨试验合并数据。
      2. 先在 eICU 最终测试集相应发病后 D7/D8 窗评价，且不得按 RCT 结果调整。须同时满足：第一奇异轴解释 L_C Frobenius 能量≥50%；P_state 与 P_obs 相关≥0.70；归一化平均绝对误差≤P_state 标准差的 0.50；P_state=α+βP_obs 中 |α|≤0.20 个标准差、β=0.80–1.20、95% 区间覆盖率 0.90–0.98；每个共同锚点外部校准斜率 0.80–1.20、标准化截距绝对值≤0.20。
      3. 随后在遮蔽治疗分组的试验数据中要求至少 80% 观测锚点处于预定生理合理范围，且至少 60% 的访视时存活住院者有不少于两个实测锚点可直接算 P_obs。任何需要按试验重新估计权重的做法均不满足预定映射。
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-022
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Trial-specific mapping to observed visits and independent clinical-state analysis; ‘映射达到标准时的估计对象’ and ‘独立临床状态分析’"
    protected_content: |-
      1. 映射达标时：D7/D8 前死亡为最差等级；访视时存活住院者按 P_obs 从高（差）到低排序；访视前存活出院者为单独最有利等级。主要比较采用与中心/分层随机化相容的概率指数或胜出概率，估计随机组在实际访视低维摘要上的差异。
      2. 共同锚点或一致性/误差不足但 SOFA、死亡、住院/出院、随机化和中心语义可核实时，改用与候选表征独立的临床端点：死亡最差、存活住院者按 SOFA 高到低、存活出院者最有利。
      3. 若 D7/D8、随机化、中心或生存语义不能核实，则不构造新状态端点；映射失败只允许独立临床状态分支，不得声称低维访视摘要验证了候选动态表征。
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-023
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Trial-specific mapping to observed visits and independent clinical-state analysis; trial-specific table and following paragraph; ## Required analyses and evidence > RCT pre-start paragraph"
    protected_content: |-
      1. EXIT-SEP 目标分析集是全部 1,817 名随机化受试者，1,760 名已知结局者只能称完整结局子集；使用实际 D7，若 D1 在随机化后则不可作为未受干预基线。XBJ-SCAP 目标分析集是全部 710 名随机化受试者；无法重建时才用全分析集 675 例作明确标注的改良意向治疗；617 例符合方案、671 例操作性类脓毒症、658 例严格重叠人群仅为敏感性；使用实际 D8，若 D0 在随机化后则不可作未受干预基线或变化起点。
      2. 两试验均将死亡和存活出院纳入等级；存活住院但锚点/SOFA 缺失时，在每个多重插补数据集中用治疗、中心、确认的随机化前协变量和既往实际访视信息插补并重算摘要，再按 Rubin 规则或聚类 bootstrap 合并；偏移参数 δ 为 ±0.5/±1 个标准差，并作最佳/最差转折点和对转院/未知状态的界限分析。
      3. XBJ-SCAP 不填补结构性不存在的 PaO2/FiO2、乳酸、休克、CRRT 或中枢神经系统变量；D-dimer 单位未核实时排除。两试验主要状态端点组成 Holm 家族错误率 0.05 的检验族；其他访视/模块作探索性 FDR 控制；亚组只报告治疗×亚组交互。
      4. 概率指数的并列处理、中心处理、多重插补后的合并推断、Holm 检验族和亚组交互规则须在启动分析前确定。D1/D4/D7 或 D0/D4/D8 稀疏数据只用于访视特异或离散变化，不插值为伪连续轨迹；人群、访视、锚点或估计对象不同时保持独立分析。
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-024
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Secondary representation diagnostics; ## Evidence chains > ### Evidence chain: 两项主要任务与两项次要诊断; ## Required analyses and evidence > items 5–6"
    protected_content: |-
      1. 次要表征诊断只承担诊断功能：部分状态重建采用伪遮蔽平均绝对误差、均方根误差、对数评分和区间覆盖；未来轨迹采用连续等级概率评分、负对数似然、状态占用与结局校准；结果按变量、状态、医院和观察密度分层。伪遮蔽只在原本已测值上评价，不得被解释为未测值真实性或结构验证。
      2. 两项主要任务和两项次要诊断还须包括标签与缺失敏感性、行动与观测消融、接口缺失、标签误差、时间反转和临床阴性对照，并报告概率评分、绝对校准、覆盖、警报负担及患者与医院聚类区间。
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-025
    category: claims_and_evidence_status
    source_locator: "## Title, summary, audience, and positioning; ## Structured abstract; ## Title and positioning claim-support table"
    protected_content: |-
      1. 本研究是候选表征的证据整合、计划性跨数据库验证、可复用基准资源和可证伪设计；不是普通预测项目，也不是已经完成的模型或结果。所有标签、恢复检验、任务、外部验证和 RCT 输出均为计划产物。
      2. 研究对象“脓毒症全病程 ICU 患者系统的候选动态表征”作为计划对象有设计支持，但不声称已发现真实系统；24 个月跨库验证是有条件支持，访问、审计和结果尚未生成；RCT 是限定范围的条件性计划，个体数据与语义未核实。
      3. 贡献定位可称证据整合、验证和可复用基准资源；实证贡献须由未来结果确认，不声称任何单个模块新颖。基准资源价值须与跨数据库候选系统表征结论分开陈述。
      4. 单项模块已有先例为高置信；截至 2026-07-17 有界检索未发现完整证据组合仅为低至中等置信，不能推出全球不存在、全球首次、新算法或方法首创。
    required_revised_disposition: retained_same_strength

  - protected_id: PCR-026
    category: claims_and_evidence_status
    source_locator: "## Expected outputs, falsification criteria, and interpretations > ### Falsification criteria and result interpretation"
    protected_content: |-
      1. 若结果依赖发病后/尚不可用信息、同格未来治疗、未来测量频率或跨划分插补，则相应标签或任务的时间可实施性被否定。
      2. 若两库缺少预设事件、转移、医院或共同锚点支持，则跨库全病程候选表征经验基础不足；若状态、转移、覆盖、零边或错设未达恢复标准，则复杂结构未恢复，只能报告达标的较简单表征或预测结果。
      3. 若缺失转折点改变结论或行动比例/有效样本量不足，则相应关系对缺失假设或照护政策敏感。若不更新参数外部测试未达评分、校准、状态对齐或符号一致性，则跨库稳定性假设被否定；适配集结果只能说明有限更新后表现。
      4. 若 RCT 共同锚点、单位、时间、低维性、相关、误差、校准或覆盖不足，则低维摘要与保留状态表征关系不足，只能在语义可核实时分析独立临床状态；若随机化、中心、D7/D8、生存、住院或出院语义不可核实，则新状态端点没有可审计估计对象。
      5. 只有阶段 II 五类证据全部达标，才支持一个经过数据审计、模拟恢复、任务评价和外部验证的候选全病程表征。
    required_revised_disposition: retained_same_strength

  - protected_id: PCR-027
    category: inputs_and_resources
    source_locator: "## Feasibility, resources, risks, alternatives, and stop conditions > ### Feasibility and resources"
    protected_content: |-
      1. 最低团队须有具名重症临床/表型、纵向统计、系统辨识、数据工程、模型实现和独立外部测试数据保管负责人；当前只有职责定义，没有可核验人员、承诺或工时。
      2. 计算范围限于两个主数据库、K≤4、状态模式≤3、两项主要任务、两项次要诊断和至多一个复杂候选。数据库存在和版本已核实，但访问凭证、协议、可运行提取、队列支持、人员及任何模型、模拟、外部验证和 RCT 新结果均未核实或未生成。
      3. 24 个月最低交付必须包含双库审计、模拟恢复、两项主要任务、泄漏检查和跨库外部验证。后续 RCT 在最低交付之外，只能在阶段 II 达标且授权、原始语义和实际访视指标合格时开展；任何 RCT 结果均不得补足这些核心资源或证据缺口。
    required_revised_disposition: retained_same_strength

  - protected_id: PCR-028
    category: assumptions_limitations_and_contingencies
    source_locator: "## Feasibility, resources, risks, alternatives, and stop conditions > ### Working assumptions"
    protected_content: |-
      1. 临床尺度到模拟参数范围尚待确定；正确、零边、过拟合、遗漏状态、错误滞后/观测模型及政策反馈、隐藏混杂、非随机缺失、标签误差、访视密度、接口缺失和数据库差异必须纳入。参数须在月 7 模拟前由临床、统计和系统辨识负责人登记，只可依据临床容许误差、开发数据及未使用外部最终结果的先导模拟；未登记则复杂候选不能声称达到恢复标准。
      2. 多类别校准精确估计量、置信界和细化阈值尚待登记；已固定多类别 Brier、有利状态绝对校准、患者/医院聚类不确定性及硬标准只可收紧。具体方法须在查看外部最终结果前，仅依据开发库 bootstrap、临床容许误差和先导模拟登记；未登记则相应任务或状态结论不得参与阶段 II 判定。筛选用事件/参数下限不得替代经验有效样本量和模拟稳定性。
    required_revised_disposition: retained_once_at_authority_location

  - protected_id: PCR-029
    category: assumptions_limitations_and_contingencies
    source_locator: "## Feasibility, resources, risks, alternatives, and stop conditions > ### Limitations and boundary conditions; items 1–5"
    protected_content: |-
      1. 数据库公开存在不等于已获访问、协议、可运行提取或所需事件、转移、医院、锚点支持；当前无人员承诺或新模型结果。
      2. Sepsis-3 EHR 发病时刻依赖感染配对、基线 SOFA、滚动窗和信息可用时刻；后录入信息、同格未来治疗、未来测量频率、重复住院、跨划分处理及结局决定的网格/阈值均可泄漏。
      3. 潜在状态编号与旋转坐标本身不可解释；只有同时满足锚定、模拟恢复、多种子对齐、bootstrap 保留、外部符号一致、状态对齐和区间校准的状态、转移或预设依赖可解释，较好预测不得替代这些证据。
      4. 显式测量过程不能识别真实非随机缺失机制；低行动重叠或低有效样本量时不能估计治疗作用；阴性对照或时间反转无异常不能证明模型正确。
      5. 主要外部证据是不更新参数测试；重新校准、只更新观测模型、完整重拟合/再开发是不同操作，有限更新的好表现不能补救主要测试未达标；跨分区排除可能削弱医院、事件、转移或锚点支持。
    required_revised_disposition: retained_once_at_authority_location

  - protected_id: PCR-030
    category: assumptions_limitations_and_contingencies
    source_locator: "## Feasibility, resources, risks, alternatives, and stop conditions > ### Limitations and boundary conditions; items 6–9"
    protected_content: |-
      1. EXIT-SEP/XBJ-SCAP 仅是潜在个体数据源；衍生材料不能替代授权、原始 CRF/SAP、随机化、中心、D7/D8 相对随机化和首剂时序及死亡、住院、出院、转院语义核验；锚点、单位和映射均未检验。
      2. 两试验因人群、访视、锚点和估计对象不同而分开且不合并；稀疏访视只支持访视特异或离散变化，不支持伪连续轨迹；方向不一致或区间过宽只能报告无支持/跨场景适用性有限，不得以事后亚组改变结论。
      3. 代表性检索不是系统综述，未完成 PRISMA 双人筛选、引文网络穷举、专利、CNKI、万方、Scopus、Web of Science、Embase 或全部注册平台检索，且预印本和术语会变；完整组合缺口仅为低至中等置信。
      4. 观察性数据和预测表现不支持真实因果网络、治疗因果效应、反事实策略、机制、中介、控制或数字孪生；RCT 次要分析最多支持随机组在实际访视低维摘要或独立临床状态上的差异，不能验证未测动力学、转移边或整个系统模型。当前计划不是已验证模型、临床决策工具或药物平台，不支持无条件临床推广。
    required_revised_disposition: retained_once_at_authority_location

  - protected_id: PCR-031
    category: assumptions_limitations_and_contingencies
    source_locator: "## Feasibility, resources, risks, alternatives, and stop conditions > ### Risks, alternatives, and stop conditions; rows ‘公共数据库访问或人员不足’ through ‘标签或数据泄漏’"
    protected_content: |-
      1. 月 3 若无两个可访问数据库或关键职责未具名，启用预先指定且同等审计的 HiRID/AmsterdamUMCdb；仍无两库则停止 24 个月跨库系统表征路线。
      2. 月 6 若事件、转移、医院、共同锚点、时间戳或接口不满足，拟合前统一改用 24 小时网格或事件时间，删除不支持模块/边并评价备份库；仍不能构造两库全病程队列则停止跨库全病程端点。
      3. 跨分区患者排除后若测试医院<20、任一自由风险/转移参数外部事件/转移<10、锚点覆盖<70% 医院或<80% 患者，或排除>原合格测试患者/主要事件的 10%，主要分析排除全部跨分区患者并作最终测试优先连通分量敏感性及备份库评价；支持仍不足只能作数据库层描述，不作医院稳健或完整跨库系统端点结论。
      4. 高严重度泄漏须修正可用信息规则、删变量并重建标签；月 20 前仍未消除则不得访问外部最终测试结果。
    required_revised_disposition: retained_once_at_authority_location

  - protected_id: PCR-032
    category: assumptions_limitations_and_contingencies
    source_locator: "## Feasibility, resources, risks, alternatives, and stop conditions > ### Risks, alternatives, and stop conditions; rows ‘复杂状态不可恢复’ through ‘时间进度不足’"
    protected_content: |-
      1. 任一状态、转移、边、覆盖、零边或错设标准未达，须合并/删除状态与边并改用多状态、线性或仅预测基线；月 12 仍无合格复杂候选则结束复杂扩展，只保留受支持的简单层级。
      2. 若 δ/转折点改变解释、行动比例<5%或>95%、或加权有效样本量<名义样本 20%，则报告敏感区间，合并/删除低支持关系并标注数据库/照护政策特异；不得估计相应治疗作用或解释相应未测状态/行动边。
      3. 不更新参数外部验证若主要任务评分、校准、状态对齐或符号一致性未达，则分报适配集重新校准、仅更新观测模型和完整再开发；有限更新不得改变跨库稳定性未获支持的结论。
      4. 月 20 尚未确定开发分析包则不访问最终测试；月 24 尚无外部最终测试结果则阶段 II 最低端点未完成，只保存简单模型、审计和未达标证据。
    required_revised_disposition: retained_once_at_authority_location

  - protected_id: PCR-033
    category: assumptions_limitations_and_contingencies
    source_locator: "## Feasibility, resources, risks, alternatives, and stop conditions > ### Risks, alternatives, and stop conditions; rows ‘RCT 授权、语义或映射不足’ through ‘文献定位证据不足’"
    protected_content: |-
      1. 若 RCT 授权、随机化、中心、访视、生存/住院语义不完整、每试验合格锚点<2、或任一一致性/误差标准未达，在 SOFA、随机化、中心和生存/住院语义可核实时改用独立的死亡与 SOFA 排序临床状态，否则仅复现原终点或报告审计；不得构造/解释冻结模型相关低维摘要，核心语义不足时停止新状态端点。
      2. 两试验方向相反或不确定区间仍与无组间差异相容时，分试验报告无支持或跨场景适用性有限；不得合并效应或用事后亚组改变结论。
      3. 若需要全球首次、新算法、专利不存在或临床首次主张，须扩展到系统综述、引文与专利网络及非英语数据库；在此之前仅保留有界、条件性的整合与验证定位。
    required_revised_disposition: retained_once_at_authority_location

  - protected_id: PCR-034
    category: unsupported_claim_classes
    source_locator: "## Feasibility, resources, risks, alternatives, and stop conditions > ### Limitations and boundary conditions; items 8–9; ## Title and positioning claim-support table"
    protected_content: |-
      明确不支持且不得通过措辞强化的主张包括：
      1. 已发现或已验证真实脓毒症系统、真实因果网络、治疗因果效应、反事实治疗策略、机制、中介、控制或数字孪生。
      2. RCT 访视次要分析验证了未测潜在动力学、转移边、阶段 II 整个系统模型，或补足了阶段 II 的资源、恢复、主要任务、泄漏和外部验证证据。
      3. 当前已有经过验证的模型、临床决策工具、药物平台、完成结果，或支持无条件临床推广。
      4. 单项模块具有新颖性，或存在全球首次、新算法、方法/临床首创、专利不存在、完整组合在全球不存在；现有检索只能支持低至中等置信的有界、条件性整合与验证定位。
      5. 稀疏 RCT 访视形成伪连续轨迹，有限更新等同不更新参数外部验证，阴性对照无异常证明模型正确，或较好预测表现替代锚定、恢复、对齐、覆盖和结构稳定性证据。
    required_revised_disposition: retained_same_boundary
