protected_items:
  - protected_id: PCR-001
    category: identity_and_question
    source_locator: "YAML frontmatter > identity_anchor; # title; ## Research question, objectives, and core hypothesis > ### Primary research question"
    protected_content: |-
      1. 研究对象是纵向、以脓毒症为中心的 ICU 患者系统，包括可比较的未发病在险时段和发病后轨迹；主要推断单位是尊重患者与医院聚类的患者—时间状态及状态转移。
      2. 核心问题是能否构建知识约束、不确定性感知的候选动态表征，覆盖发病前、首次发病、发病后互斥状态和结局，检验患者状态与候选结构在未参与开发的医院和数据库中的稳定性，并在不混淆预测与因果的前提下，仅于阶段 II 达标且试验实际访视指标支持预定映射后，检验随机分配组的访视特异低维状态摘要差异。
      3. 主要目标是构建并验证该脓毒症复杂系统模型，并在 24 个月内完成阶段 II；核心证据基础限于文献与专家先验、纵向公共 ICU 数据，以及有条件可获得的 EXIT-SEP 和 XBJ-SCAP 个体级 RCT 数据。
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-002
    category: object_scope_and_boundaries
    source_locator: "## Research question, objectives, and core hypothesis > ### Objectives and ### Core hypothesis"
    protected_content: |-
      1. 四项目标须保持：预先确定实时可实施主 Sepsis-3 标签、双时刻、动态风险集、互斥状态与两种标签敏感性；由双数据库审计决定共同模块、时间方案和复杂度，并分离生理、治疗与观测过程；用正确、零边、过拟合和错设生成器检验恢复并在隔离的第二数据库评价两项主要任务和两项次要表征诊断；仅在阶段 II 达标且试验语义合格后，分试验检验阶段 II 后冻结模型到实际 D7/D8 指标的映射，映射不足则改用独立的死亡与 SOFA 排序临床状态。
      2. 复杂候选的前提是两库共同锚点、事件和转移支持充分，且状态数、尺度、锚定方式和滞后均预先确定；至多一个受限复杂候选可以接受检验。
      3. 数据边界、可恢复不变量、两项主要任务、跨数据库验证和条件性 RCT 输出须分别判定。两项次要诊断及后续 RCT 结果均不得改变或补足阶段 II 所需的主要任务、模拟恢复检验和外部验证判定。
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-003
    category: design_analysis_and_validation
    source_locator: "## Research content and work packages > ### Twenty-four-month programme"
    protected_content: |-
      1. 月 0–3：核实 MIMIC-IV v3.1、eICU-CRD v2.0 的访问、协议、存储和算力，落实六类职责，并预先指定 HiRID 或 AmsterdamUMCdb 之一为备份库。
      2. 月 4–6：完成双数据库队列流、事件与转移、医院、跨院患者、共同锚点、接口和缺失审计，并确定主标签、双时刻、多状态系统、医院划分、时间网格、共同模块和参数上限。
      3. 月 7–12：先拟合竞争风险、多状态和线性状态空间基线，完成 Monte Carlo 与半合成恢复实验，只评价至多一个受限复杂候选。
      4. 月 13–18/20：完成开发库内部、时间外和医院外评价，并在看见相应结果前确定标签、锚点、预处理、模型、超参数、更新层级、指标和外部判定标准，形成有校验和的分析包与泄漏核查记录。
      5. 月 21–24：在第二数据库最终测试集进行不更新模型参数的验证，另行报告适配集重新校准和仅更新观测模型；外部最终测试结果由独立数据保管人控制访问。
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-004
    category: design_analysis_and_validation
    source_locator: "## Research content and work packages > ### Prespecified criteria for completing the 24-month validation stage"
    protected_content: |-
      阶段 II 达标须同时满足五类证据，任何一类不得由另一类或后续 RCT 结果补足：
      1. 两库均能构造主发病前风险集和发病后状态队列，并达到预定事件、转移、医院和共同锚点支持。
      2. 若采用复杂候选，其在正确生成、零边和核心错设场景中须达到全部恢复标准；若仅支持线性或多状态模型，结论必须使用相应较简单表征名称。
      3. 两项主要任务在开发和时间外评价中，Brier 或多类别 Brier 相对最强简单基线的差值上侧 95% 界不超过 +0.01，校准斜率为 0.80–1.20，校准截距所对应的绝对风险误差不超过 0.02。
      4. 标签和特征遵守信息可用时刻；患者、医院、重复住院和插补均不跨数据划分；不存在未解决的高严重度泄漏。
      5. 医院优先划分后，外部最终测试集仍至少有 20 个具事件支持的医院；不更新模型参数的两项主要任务满足 Brier 非劣性，对齐后主要状态相关或一致性系数至少 0.70，预设结构符号一致率至少 0.80；适配集结果须与主要验证分开报告。
      6. 依赖数据支持的细化阈值只能在月 6 前，依据临床容许误差、开发库 bootstrap 结果和未使用外部结果的先导模拟登记；方案已有硬性标准只可收紧、不可放宽。
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-005
    category: design_analysis_and_validation
    source_locator: "## Research content and work packages > ### Work packages; paragraph beginning ‘最低分析顺序为’"
    protected_content: |-
      1. WP1 为月 0–6 的标签、队列和双库观测支持；WP2 为月 3–12 的知识结构、基线和恢复检验；WP3 为月 8–18 的两项主要任务与两项次要诊断；WP4 为月 14–24 的隔离跨数据库验证。
      2. 最低分析顺序不可倒置：资源与观测支持审计；标签、状态和医院划分；竞争风险与多状态基线；线性状态空间模型；模拟恢复检验；至多一个复杂候选；两项主要任务和两项次要诊断；确定开发结果；外部最终测试。
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-006
    category: inputs_and_resources
    source_locator: "## Data, materials, and existing evidence base > ### Current resource and evidence status"
    protected_content: |-
      1. MIMIC-IV v3.1 与 eICU-CRD v2.0 的公开存在、版本和文献已核实，但团队访问、数据使用协议、下载、存储、确切提取版本、校验和与项目可执行性尚未核实；实际样本、事件、转移、医院、跨院患者、锚点密度与接口支持尚未生成。
      2. EXIT-SEP 与 XBJ-SCAP 的本地材料仅是衍生清洗或验证报告，可说明稀疏性与字段缺口，不是原始资料审计或独立同行评审；个体数据授权、原始 CRF/SAP、随机化、中心、访视时序及生存、住院、出院语义尚未核实。
      3. WBC、CRP 等仅是候选共同锚点；最终保留、跨源语义、单位和实际访视对应关系尚未证明。团队职责已定义，但人员、承诺和工时尚未核实。
      4. 当前没有已生成的模型、模拟恢复检验、预测、外部测试或 RCT 新分析结果。截止 2026-07-17 的有界检索对单项模块已有先例为高置信，对完整组合缺口仅为低至中等置信。
    required_revised_disposition: retained_same_strength

  - protected_id: PCR-007
    category: inputs_and_resources
    source_locator: "## Data, materials, and existing evidence base > ### Public ICU database roles and observability audit"
    protected_content: |-
      1. MIMIC-IV v3.1 是开发库，用于标签与模型开发、内部和时间外评价；eICU-CRD v2.0 是外部库，按医院划分适配集和最终测试集；HiRID 或 AmsterdamUMCdb 之一须在月 0–3 预先指定并完成同等审计后才可替代。共同层只保留单位、语义、时间戳和信息可见性可审计的变量，数据库特异信息仅用于探索性观测模型。
      2. 月 6 前的支持规则包括：主分析每次住院只用首个合格 ICU 入住记录，可链接重复住院仅保留患者首次合格住院；外部最终测试至少 20 个有事件支持的医院；每个自由风险参数在开发/外部库至少分别有 20/10 个事件，每个自由转移参数至少分别有 20/10 次转移；终止状态分开计数，稀少状态可合并但不可作为普通独立删失。
      3. 时间戳须支持 12 小时排序，否则拟合前统一评价 24 小时或事件时间。每个共同维度至少两个锚点；每锚点在各库至少 30% 合格时间格实测且不可用向前填充达标；锚点须存在于至少 70% 合格医院并覆盖至少 80% 合格患者。
      4. 保留检测指示、实测时刻和距上次实测时间，不采用无条件末次观测值前移。状态维度 K 为通过审计的模块数与 4 的较小值，状态模式不超过 3；事件或转移支持不足时继续简化。主时间方案为 12 小时；仅明确起止的输注、器官支持和静态基线可例外于不作无条件向前填充的规则。
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-008
    category: design_analysis_and_validation
    source_locator: "## Data, materials, and existing evidence base > ### Prespecified variable roles"
    protected_content: |-
      1. Y_t 仅为实测生理测量和审计后锚点，不含治疗启停、剂量或测量频率；同源 SOFA 标签副本与特征分开。
      2. A_t 为抗菌药、液体、血管活性药、机械通气、CRRT、激素的启停和剂量，不作潜在生理锚点；用于恶化标签时生成带事件时戳的独立副本。
      3. M_t 为检测与医嘱、采样、结果可用时刻及医院接口；未检测不等于正常，接口缺失不作患者生理状态。
      4. 疑似感染配对、独立 SOFA 事件、互斥状态、死亡、出院和转院仅用于标签，不进入相同或更早预测时点；抗菌药双重用途须遵守标签信息可用时刻并与行动变量分离。
      5. B 仅为预测时点前固定基线，不随时间复制成伪测量，未知值显式编码。每个字段只有一个主要用途。
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-009
    category: inputs_and_resources
    source_locator: "## Data, materials, and existing evidence base > ### Local RCT evidence; paragraph beginning ‘EXIT-SEP’"
    protected_content: |-
      EXIT-SEP 的现有证据状态必须保持：45 个 ICU、随机化 1,817 例 Sepsis-3 患者；衍生报告中 1,760 例 28 日状态明确、395 例死亡、57 例状态未知；SOFA D1/D4/D7 非缺失数为 1,750/1,542/1,296，乳酸 D1–D7 非缺失数从 855 降至 223。D1 与 D7 相对随机化或首剂的确切时间参照仍须由原始方案核验。
    required_revised_disposition: retained_same_strength

  - protected_id: PCR-010
    category: inputs_and_resources
    source_locator: "## Data, materials, and existing evidence base > ### Local RCT evidence; paragraph beginning ‘XBJ-SCAP’"
    protected_content: |-
      XBJ-SCAP 的现有证据状态必须保持：随机化 710 例重症社区获得性肺炎患者；衍生报告中全分析集 675 例、符合方案集 617 例、全分析集且基线 SOFA≥2 的操作性类脓毒症人群 671 例、严格重叠人群 658 例；SOFA D0/D4/D8 非缺失数 703/628/610，WBC 为 704/634/614，CRP 为 579/503/467，28 日状态明确 675 例。D0/D8 相对随机化或首剂的时间参照仍待核验；SCAP 入组不等于确认 Sepsis-3；PaO2/FiO2、乳酸、休克、CRRT 和中枢神经系统变量在现有材料不可用，D-dimer 单位待核验。
    required_revised_disposition: retained_same_strength

  - protected_id: PCR-011
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Protocol specifications for the two primary clinical tasks; Primary pre-onset task column"
    protected_content: |-
      1. 发病前人群为 ≥18 岁、每次住院首个合格 ICU 入住记录、至少 12 小时可见历史，且预测时点尚未达到主标签。
      2. 主疑似感染配对：标本先采集时，抗菌药首次实际给药须在其后 72 小时内；给药先发生时，标本须在其后 24 小时内；感染时刻取较早者。无已记录慢性器官功能障碍者基线 SOFA=0；有记录者取入 ICU 前 24 小时最低可计算 SOFA；不可审计者不进入主风险集。SOFA 各成分取滚动 24 小时最差值，相对基线增加至少 2 分须发生在感染前 48 小时至后 24 小时，首次可排序满足时刻为发病时刻。
      3. 标签可用时刻取配对较晚事件和必要 SOFA 数据在源系统可见或最终化时刻的最大值，不得把之后可用信息回填至事件时刻。
      4. ICU 第 12 小时起每 12 小时设预测时点，使用此前最多 24 小时且至少 12 小时的按时可用历史，预测未来 12 小时首次发病。仅分析首次发病；重叠时点保留，但每次住院总权重为 1，并按患者和医院聚类。
      5. 存活出 ICU、院内死亡、转院或失访是互斥终止；行政结束独立删失并作逆概率删失加权与界限分析。特征只用 availability<t；[t,t+12h) 新治疗为 A_t，下一边界实测生理属于下一状态；无法排序的同时间戳边不进入相应边分析。
      6. 估计对象为条件于既往信息的未来 12 小时首次发病累积发生风险，由离散多项原因别风险转换；主要指标为 12 小时 Brier、绝对校准截距和斜率，AUPRC、提前量和假警报为次要；患者与医院层 bootstrap 给出 95% 区间。
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-012
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Protocol specifications for the two primary clinical tasks; Primary post-onset task column"
    protected_content: |-
      1. 发病后人群从首次发病进入；入 ICU 时已发病者只在首个可审计时点延迟进入，须分层且左截断，不反推发病时刻。首次发病为零点，状态按临床事件时刻进入。
      2. 恢复须连续 24 小时，信息可用时刻为窗口结束；恶化、死亡、出院和转院按记录可用时刻，只用当时可见标签。发病或延迟进入后每 12 小时评价，主要时点为病程第 7 日，第 14 日仅作敏感性分析。
      3. 死亡、存活出 ICU、转院为终止状态；恢复不由出院替代，并作逆概率删失加权敏感性分析。within-bin 规则与发病前相同；器官支持为治疗行动，恶化标签只在事件形成后定义。
      4. 估计对象为第 7 日“生理恢复或存活出 ICU”有利集合占用概率，两类另行报告；采用互斥离散多状态模型与 Aalen–Johansen 估计。主要指标为第 7 日多类别 Brier 与有利状态绝对校准，各状态和转移校准为次要；患者与医院层 bootstrap，首次发病与延迟进入分层并报告有效转移数。
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-013
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Protocol specifications for the two primary clinical tasks; paragraph beginning ‘主标签之外’; ## Key techniques and implementation > item 10"
    protected_content: |-
      1. 主标签之外只有两种敏感性标签：培养与抗菌药配对改为对称 ±24 小时；或所有患者均采用感染前 24 小时最低可计算 SOFA，并把器官功能窗口限制为感染前后各 24 小时。敏感性结果不得替换主结果。
      2. 泄漏核查必须覆盖发病后生理与治疗、尚不可用的培养或抗菌药信息、同一时间格内治疗、未来测量频率、跨划分插补与标准化、重复住院、患者或 ICU 记录跨集合、重叠窗口权重，以及由结局驱动的变量、时间网格或阈值。
      3. 须采用临床预先裁定的时间反转和阴性对照，并完整报告标签、数据统一、缺失、模型简化与未达标准的结果；阴性结果不得被解释为模型正确的证明。
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-014
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Mutually exclusive post-onset state and event system"
    protected_content: |-
      1. 每 12 小时赋值，互斥优先级固定为：死亡；转院或无法继续观察；存活出 ICU；恶化或新器官衰竭；生理恢复；持续脓毒症。源时间无法排序时取较高优先级并实施事件时间敏感性分析。
      2. 生理恢复定义为相对发病参考 SOFA 下降≥2 且连续 24 小时无新恶化；事件时刻为窗口起点、信息可用时刻为窗口结束，允许再次恶化；出 ICU 不等同恢复。
      3. 恶化或新器官衰竭定义为相对此前 24 小时最低 SOFA 增加≥2，或新启/升级血管活性药、有创通气或 CRRT；同时发生只记录一次，行动和标签副本分离。
      4. 持续脓毒症只作标签且可转移；存活出 ICU 与死亡为吸收状态；转院/不可继续观察是竞争终止，不编码为恢复或普通独立删失，须作逆概率删失加权和界限分析；死亡不作为随机缺失且同时间戳优先。
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-015
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Observational target, anchoring and abstention"
    protected_content: |-
      1. 观察性目标是在实际照护与测量政策下估计 p(X_0:T,Y_0:T,M_0:T,A_0:T | B,S) 及其风险、对齐后状态占用与转移、锚点预测和预设符号/滞后不变量；A_t 不解释为可干预因果作用。
      2. 每维至少两个跨库锚点；第一锚点载荷固定为 +1 并标准化尺度；非指定交叉载荷为 0 或遵循预写稀疏模式；K≤4、状态模式≤3、滞后只取预先确定的 1 或 2 个时间格，允许图不含同格瞬时循环。
      3. 20 个固定随机种子拟合后进行置换与符号对齐，只解释对齐后的状态占用、转移概率、锚点预测和预设边的符号或滞后。
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-016
    category: assumptions_limitations_and_contingencies
    source_locator: "## Research design and methods > ### Observational target, anchoring and abstention; paragraph beginning ‘非随机缺失主分析’"
    protected_content: |-
      1. 非随机缺失主分析采用显式测量过程的 MAR 或选择模型基线；模式混合敏感性偏移参数 δ 取开发库标准差的 −1、−0.5、0、+0.5、+1，并作选择模型转折点分析。
      2. 每个对齐状态、医院和时间层报告行动概率与有效样本量；行动比例<5%或>95%，或加权有效样本量<名义样本量的 20% 时，不估计治疗作用。
      3. 任一状态或边若在 20 个种子中的对齐率<90%、bootstrap 保留率<80%、外部符号一致率<80%、状态对齐<0.70，或区间未校准，须删除、合并或标记为数据库/照护政策特异；较好预测表现不得推翻该判定。
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-017
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Simulation and semi-synthetic recovery tests"
    protected_content: |-
      1. 月 7–10 且不读取外部最终测试结果，对每个核心情景至少重复 1,000 次，或运行到关键比例的 Monte Carlo 标准误≤0.02。生成器须包括正确指定、零边/独立状态、多余状态/过拟合、遗漏状态、错误滞后/观测模型，并交叉改变状态分离、切换率、1/2 个时间格滞后、政策反馈、隐藏混杂、非随机缺失、标签误差、访视密度、整院接口缺失和数据库差异。
      2. 状态恢复标准为离散调整兰德指数或连续主要典型相关≥0.80，且 20 个种子对齐率≥90%；转移标准为主要允许转移平均绝对误差≤0.05、95% 区间覆盖 0.90–0.98；预设符号与滞后正确恢复率≥0.80。
      3. 边检测须灵敏度≥0.80 且错误发现率≤0.10；零边场景任一假边 95% 区间排除 0 的重复比例≤0.05；错设场景须≥80% 重复触发失配或不作相应结构解释，且错误结构高置信比例≤0.05；概率校准斜率 0.80–1.20、绝对概率偏差≤0.02。
      4. 只保留达到标准的状态、转移与边；零边用于排除错误高置信结构；错设用于限制解释范围；结构恢复与概率校准分别判断。
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-018
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Hospital-based cross-database validation; paragraphs covering the hospital split and cross-partition patients"
    protected_content: |-
      1. 在任何结局导向选择前，按合格体量四分位和接口完整性分层，以固定种子 20260717 哈希划分 eICU 医院：30% 进入预留适配集、70% 进入最终测试集；医院划分优先于患者规则，最终测试医院不因患者链接转入适配集。划分表、链接算法版本和校验和须在查看最终测试结局前确定。
      2. 跨适配/测试医院的同一可链接患者全部记录从主要外部分析排除，不按患者哈希重分配；同分区患者仅保留预定义首次合格住院和首个合格 ICU 入住记录，同一患者不得跨集合。
      3. 在获得最终测试性能前报告跨分区排除人数、占原合格患者比例、医院数及仅基于结局前信息的年龄、性别、入院类型/来源、首个预测时点生理负担和观察密度；排除不得依据结局或模型误差。
      4. 敏感性分析采用最终测试优先的患者—医院连通分量：纯适配/纯测试分量维持角色；混合分量从适配集删除全部相关患者记录，只保留其预分配测试医院中的首次合格 ICU 记录，不改变医院角色且不借用最终测试训练。独立保管人只检查样本支持，不释放性能。
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-019
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Hospital-based cross-database validation; paragraph beginning ‘确定标签’"
    protected_content: |-
      在标签、统一方案、状态、预处理、信息可用规则、模型、超参数、阈值和评价代码冻结后，外部分析依次且分开报告三种方式：第一，不更新模型参数；第二，只用预留适配集重新校准各预测时点截距与斜率；第三，只用适配集更新观测模型而保持状态与转移参数不变。在目标库完整重拟合或重新开发属于模型更新/再开发，不属于外部验证；有限更新后的较好表现不得替代不更新参数外部测试的判定。
