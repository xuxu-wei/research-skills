protected_items:
  - protected_id: PCR-001
    category: identity_and_question
    source_locator: "Research question, objectives, and core hypothesis — complete section"
    protected_content: >-
      研究对象是纵向、以脓毒症为中心的 ICU 患者系统，包括可比较的未发病在险时段、首次发病、发病后互斥状态演化和结局；主要推断单位是尊重患者与医院聚类的患者—时间状态及状态转移。核心问题是能否构建知识约束、不确定性感知的候选动态系统表征，在不混淆观察性关联与随机化证据的前提下，检验患者状态与候选结构在未参与开发的医院和数据库中的可量化稳定性。目标是在 24 个月内完成阶段 I–II；只有双数据库具有足够共同锚点、事件和转移支持，状态数、尺度、锚定方式和滞后预先确定，且复杂候选达到绝对模拟恢复与错误高置信控制，才解释可恢复的不变量。后续 RCT 仅在阶段 II 结果和实际访视指标支持预定映射时估计随机分配组间的访视特异低维状态摘要差异，否则只分析与阶段 II 独立的试验特异临床状态；RCT 结果不改变阶段 II 主要任务、恢复与外部验证判定。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-002
    category: object_scope_and_boundaries
    source_locator: "Title, summary, audience, and positioning — complete section"
    protected_content: >-
      研究范围是脓毒症全病程候选表征的证据整合、计划性跨数据库验证、可复用基准资源和可证伪设计，不是普通临床预测或泛 ICU 风险分层，也不是仅提供预测工具。核心输入是文献/专家先验、须先完成访问与可观测性审计的 MIMIC-IV v3.1 与 eICU-CRD v2.0，以及仅在授权与语义条件满足时使用的 EXIT-SEP 和 XBJ-SCAP 个体数据。外部测试集不得参与模型开发或参数调整；RCT 次要分析须按试验分别实施，不用于补足阶段 II 或验证整个系统模型。各单项模块已有高置信先例，增量只来自把全病程时钟、状态—治疗—观测分工、绝对恢复、隔离外部验证和条件性 RCT 分析连接为证据链。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-003
    category: inputs_and_resources
    source_locator: "Data, materials, and existing evidence base > Current resource and evidence status — complete table"
    protected_content: >-
      MIMIC-IV v3.1 与 eICU-CRD v2.0 的存在和版本已核实，但团队访问、项目可执行性、凭证、数据使用协议、下载、存储及确切提取版本尚未核实。双数据库实际样本、事件、转移、医院、跨院患者、锚点密度和接口支持审计尚未运行，官方规模不能替代项目计数。EXIT-SEP/XBJ-SCAP 本地衍生报告只能说明稀疏性与字段缺口，不是原始资料审计或独立同行评审；RCT 个体数据授权、原始 CRF/SAP、随机化、中心、访视时序及生存、住院、出院语义尚未核实。WBC、CRP 只是候选共同锚点，最终阶段 II 资格、跨源语义、单位和访视对应关系尚未证明。所需团队职责已定义，但没有具名人员、承诺或工时记录。当前没有已生成的模型、模拟恢复、预测、外部测试或 RCT 新分析结果。截至 2026-07-17 的有界检索对单项模块已有先例为高置信，对完整组合缺口仅为低至中等置信。
    required_revised_disposition: retained_same_strength
  - protected_id: PCR-004
    category: inputs_and_resources
    source_locator: "Data, materials, and existing evidence base > Local RCT evidence — complete subsection"
    protected_content: >-
      EXIT-SEP 随机分配 1,817 例；本地衍生报告记录 1,760 例 28 日状态明确、395 例死亡、57 例状态未知，SOFA D1/D4/D7 非缺失数为 1,750/1,542/1,296，乳酸 D1–D7 非缺失数由 855 降至 223；D1/D7 相对随机化或首剂的确切参照待原始方案核验。XBJ-SCAP 随机分配 710 例；报告记录全分析集 675、符合方案集 617、基线 SOFA≥2 的操作性 sepsis-like 人群 671、严格重叠人群 658；SOFA D0/D4/D8 非缺失数为 703/628/610，WBC 为 704/634/614，CRP 为 579/503/467，28 日状态明确 675。XBJ-SCAP 的 D0/D8 时间参照待核验；SCAP 不等于确认 Sepsis-3，PaO2/FiO2、乳酸、休克、CRRT 和中枢神经变量在现有材料中不可用，D-dimer 单位待核验。
    required_revised_disposition: retained_same_strength
  - protected_id: PCR-005
    category: design_analysis_and_validation
    source_locator: "Research content and work packages > Twenty-four-month programme and Work packages — complete tables and minimum analysis order"
    protected_content: >-
      时间与分析顺序固定：月 0–3 确认两主数据库资源、职责并预先指定 HiRID 或 AmsterdamUMCdb 之一为备份；月 4–6 完成队列、事件/转移、医院、跨院患者、锚点、接口、缺失审计并确定主标签、双时钟、状态、医院划分、时间网格、共同模块和参数上限；月 7–12 先拟合竞争风险、多状态和线性状态空间基线，实施 Monte Carlo 与半合成恢复，只评估至多一个受限复杂候选；月 13–18/20 完成内部、时间外和医院外评价并确定标签、锚点、预处理、模型、超参数、更新层级、指标与外部标准；月 21–24 在第二数据库最终测试集先执行不更新参数验证，再分别报告适配集重新校准和仅更新观测模型。最低分析顺序为资源/观测审计、标签/状态/医院划分、简单基线、线性状态空间、绝对恢复、至多一个复杂候选、两项主要任务与两项次要诊断、冻结开发结果、外部最终测试。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-006
    category: design_analysis_and_validation
    source_locator: "Data, materials, and existing evidence base > Public ICU database roles and observability audit — complete subsection and audit table"
    protected_content: >-
      MIMIC-IV v3.1 为开发库，eICU-CRD v2.0 为按医院划分适配/最终测试的外部库；备份库须在月 0–3 指定并同等审计。审计由数据工程生成、临床和统计核验，并在月 6 前确定；访问、版本和提取记录完整后才可承担确认性角色。主分析每次住院仅用首个合格 ICU stay，可链接重复住院只保留患者首次合格住院。外部最终测试至少 20 个具事件支持医院；每个自由风险参数在开发/外部至少有 20/10 个事件，每个自由转移参数至少有 20/10 次转移。终止状态分开计数，稀少状态可合并但不得当普通独立删失。时间戳须支持 12 小时排序，否则拟合前统一评估 24 小时网格或事件时间。每共同维度至少两个锚点；每锚点在每库至少 30% 合格时间格实测，不得靠向前填充达标；存在于至少 70% 合格医院并覆盖至少 80% 合格患者。保留检测指示、实测时刻和距上次实测时间，不作无条件末次观测前移。K 为通过审计模块数与 4 的较小值，状态模式不超过 3，支持不足继续简化。主时间方案 12 小时；只有明确起止的输注、器官支持状态和静态基线可例外处理。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-007
    category: design_analysis_and_validation
    source_locator: "Data, materials, and existing evidence base > Prespecified variable roles — complete table"
    protected_content: >-
      Y_t 只含实测生命体征、血气、实验室和器官功能测量；A_t 含抗菌药、液体、血管活性药、机械通气、CRRT、激素的启停与剂量；M_t 含是否检测、次数、间隔、医嘱、采样、结果可用时刻和医院接口；B 只含预测时点前固定信息。治疗不得作潜在生理锚点，行动生成的标签副本与行动本体分离；未检测不等于正常，接口缺失不作患者生理状态。疑似感染、独立 SOFA、互斥状态、死亡、出院、转院只用于标签，不进入相同或更早预测时点；抗菌药双重用途遵守可用时钟并分离副本。B 不随时间复制成伪测量，未知值显式编码。共同层只保留单位、语义、时间戳和信息可见性均可审计的变量，数据库特异信息只用于探索性观测模型。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-008
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Protocol specifications for the two primary clinical tasks — complete table"
    protected_content: >-
      发病前人群为≥18 岁、每次住院首个合格 ICU stay、至少 12 小时可见历史且尚未达到主标签；发病后从首次发病开始，入 ICU 已发病者仅在首个可审计时点延迟进入并分层、左截断。疑似感染配对规则为标本先时给药在其后 72 小时内，给药先时标本在其后 24 小时内，感染时刻取较早者。无记录慢性器官障碍者基线 SOFA=0；有记录者取入 ICU 前 24 小时最低可计算 SOFA，不可审计者不进主风险集；SOFA 成分按滚动 24 小时最差值，相对基线增加≥2 须在感染前 48 小时至后 24 小时，首次可排序满足时刻为发病。标签可用时刻取配对较晚事件和必要 SOFA 在源系统可见/最终化时刻的最大值，不回填；恢复须连续 24 小时且窗口结束才可用。发病前自 ICU 第 12 小时起每 12 小时设时点，用此前最多 24、至少 12 小时历史预测未来 12 小时首次发病；发病后每 12 小时评价，主要为第 7 日，第 14 日仅敏感性。只分析首次发病；重叠时点保留但一次住院总权重为 1，并按患者/医院聚类；延迟进入不反推发病。发病前存活出 ICU、院内死亡、转院/失访为互斥终止，行政结束为独立删失并做逆概率删失加权和界限分析；发病后死亡、存活出 ICU、转院为终止，出院不得替代恢复。时点 t 只用 availability<t；[t,t+12h) 新治疗为 A_t，下一边界实测生理为下一状态；无法排序同时间戳边不进入分析。发病前估计未来 12 小时首次发病累积风险，以 12 小时 Brier、绝对校准截距/斜率为主要指标；发病后估计第 7 日“恢复或存活出 ICU”集合占用概率，两类另报，以多类别 Brier 和有利状态绝对校准为主要指标；两项均用患者与医院层 bootstrap。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-009
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Protocol specifications for the two primary clinical tasks — post-table sensitivity-label and leakage paragraph"
    protected_content: >-
      主标签外只允许两种敏感性标签：培养/抗菌药对称 ±24 小时配对；所有患者用感染前 24 小时最低可计算 SOFA，器官功能窗口限感染前后各 24 小时。敏感性结果不得替换主结果。泄漏核查须逐项覆盖发病后生理与治疗、尚未可用的培养/抗菌药、同格未来治疗、未来测量频率、跨划分插补与标准化、重复住院、患者或 ICU stay 跨集合、重叠窗口权重，以及由结局驱动的变量、时间网格或阈值。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-010
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Mutually exclusive post-onset state and event system — complete subsection"
    protected_content: >-
      每 12 小时互斥赋值，优先级固定为死亡、转院/无法继续观察、存活出 ICU、恶化/新器官衰竭、生理恢复、持续脓毒症；无法排序时取较高优先级并做事件时间敏感性。持续脓毒症为 ICU 内存活且未满足其他状态。恢复为相对发病参考 SOFA 下降≥2 且连续 24 小时无新恶化，事件时刻为窗口起点、可用时刻为窗口结束，允许再恶化；“未升级器官支持”仅为标签条件。恶化为相对此前 24 小时最低 SOFA 增加≥2，或新启/升级血管活性药、有创通气或 CRRT；同时发生只记录一次，生理测量与行动标签副本分开。存活出 ICU 是吸收状态且不等于恢复；转院/无法继续观察是竞争终止，不得编码为恢复或普通独立删失并须做加权和界限分析；死亡为吸收状态，不按随机缺失处理且同时间戳优先。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-011
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Observational target, anchoring and abstention — complete subsection"
    protected_content: >-
      观察性目标是在实际照护与测量政策下估计 X、Y、M、A 在 B、S 条件下的联合预测/生成分布及其风险、对齐状态占用/转移、锚点预测和预设符号/滞后不变量；A_t 不解释为可干预因果作用。每维至少两个跨库锚点；首锚点载荷固定 +1 并标准化尺度；未指定交叉载荷为 0 或按预写稀疏模式；K≤4、状态模式≤3、滞后仅为预定 1 或 2 个时间格，允许图无同格瞬时循环。用 20 个固定随机种子做置换/符号对齐，只解释对齐量。非随机缺失主分析用显式测量过程 MAR 或选择模型基线；pattern-mixture delta 为开发库标准差的 −1、−0.5、0、+0.5、+1，并做转折点。每对齐状态、医院、时间层报告行动概率和有效样本；行动比例<5% 或>95%，或加权有效样本<名义样本 20% 时不估计治疗作用。任一状态/边若 20 种子对齐率<90%、bootstrap 保留率<80%、外部符号一致率<80%、状态对齐<0.70 或区间未校准，须删除、合并或标记数据库/政策特异；较好预测不能改变判定。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-012
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Absolute simulation and semi-synthetic recovery — complete subsection and standards table"
    protected_content: >-
      月 7–10 在不读取外部最终测试结果时实施；每核心情景至少 1,000 次，或运行至关键比例 Monte Carlo 标准误≤0.02。生成器包括正确指定、零边/独立状态、多余状态/过拟合、遗漏状态、错误滞后/观测模型，并交叉改变状态分离、切换率、1/2 格滞后、政策反馈、隐藏混杂、非随机缺失、标签误差、访视密度、整院接口缺失和数据库差异。状态恢复要求调整兰德指数或主要典型相关≥0.80 且 20 种子对齐率≥90%；主要允许转移平均绝对误差≤0.05、95% 覆盖率 0.90–0.98；预设符号/滞后正确恢复率≥0.80；边检测灵敏度≥0.80 且错误发现率≤0.10；零边中任一假边 95% 区间排除 0 的重复比例≤0.05；错设中≥80% 重复触发失配/弃权，错误结构高置信比例≤0.05；概率校准斜率 0.80–1.20、绝对概率偏差≤0.02。只解释各自达标的状态、转移和边；结构恢复与概率校准分别判定。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-013
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Hospital-based cross-database validation — complete subsection"
    protected_content: >-
      在任何结局导向选择前，按合格体量四分位和接口完整性分层，以固定种子 20260717 将 eICU 医院划为 30% 预留适配、70% 最终测试；医院划分优先于患者规则，测试医院不因链接进入适配。划分后只用患者链接键识别跨院记录；跨适配/测试医院患者的全部记录从主要外部分析排除，不得按患者重分配；同分区患者只保留预定首次合格住院及 ICU stay。获得性能前报告排除人数、比例、医院数和结局前特征，排除不得依据结局或模型误差。敏感性采用测试集优先的患者—医院连通分量：混合分量删除适配侧相关记录，只保留预分配测试医院首次合格 stay，不改医院角色、不借测试数据训练。独立数据保管人只在不释放性能时检查支持。冻结标签、统一方案、状态、预处理、可用规则、模型、超参数、阈值和代码后，依次分报不更新参数外部验证、适配集重新校准截距/斜率、仅更新观测模型且保持状态/转移参数；完整重拟合或再开发不属于外部验证。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-014
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Trial-specific mapping to observed visits and independent clinical-state analysis — Trial semantics/common-anchor eligibility and Prespecified mapping paragraphs"
    protected_content: >-
      两项新状态端点均为原试验结果后提出的次要、探索性再分析；原 28 日终点复现另报、两试验分开。治疗组比较前须预定阶段 II 模型、映射、阈值、代码和随机种子；每试验须获个体数据授权，并由原始 CRF/SAP/字典或持有人确认随机化、分析集、中心/分层、D7（EXIT-SEP）或 D8（XBJ-SCAP）相对随机化和首剂的实际时间窗，以及死亡、住院、出院、转院语义。共同锚点必须是阶段 II 保留的 Y_t、试验实际访视直接测量、构念与单位一致或可确定转换、且采样/结果可用时刻在预定窗口；治疗、测量频率、SOFA/结局标签和事后状态不得进入。每试验至少两个合格锚点；WBC/CRP 仅为候选，单位不明 D-dimer 和不存在字段不得映射。用 MIMIC 开发集均值、标准差及第 1/99 百分位截断得 Z_C，对 L_C 作奇异值分解；P_state=V_1'X，P_obs=D_1^(-1)U_1'(Z_C−a_C)。奇异值并列按预定锚点字典序；符号在阶段 II 开发集中设为与同日 SOFA 非负相关，值越高越差。映射不得使用 RCT 分组、RCT 结局或跨试验合并数据，每试验各用其 C_r。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-015
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Trial-specific mapping to observed visits and independent clinical-state analysis — Agreement/error standards, mapped estimand, and independent clinical-state paragraphs"
    protected_content: >-
      先在 eICU 最终测试集相应 D7/D8 窗口且不按 RCT 结果调整，须同时满足：第一奇异轴解释 L_C Frobenius 能量≥50%；P_state/P_obs 相关≥0.70；归一化平均绝对误差≤0.50；P_state=α+βP_obs 中 |α|≤0.20 个标准差、β 0.80–1.20、95% 覆盖率 0.90–0.98；每共同锚点外部校准斜率 0.80–1.20、标准化截距绝对值≤0.20。遮蔽治疗分组的 RCT 中，≥80% 观测锚点须在预定生理合理范围，且≥60% 访视时存活住院者有至少两个实测锚点可直接计算 P_obs；按试验重估权重即不满足预定映射。映射达标时，D7/D8 前死亡置最差，存活住院者按 P_obs 从高（差）到低，访视前存活出院置单独最有利等级，以与中心/分层随机化相容的概率指数或胜出概率比较组间差异。若共同锚点或一致性/误差不足，但 SOFA、死亡、住院/出院、随机化、中心语义可核实，则用与阶段 II 独立的死亡最差、住院者按 SOFA 高到低、出院最有利端点；若 D7/D8、随机化、中心或生存语义不可核实，不构造新端点。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-016
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Trial-specific mapping to observed visits and independent clinical-state analysis — trial analysis table and final sparse-visit paragraph"
    protected_content: >-
      EXIT-SEP 目标为 1,817 名全体随机化者；1,760 例已知结局只能称完整结局子集；用实际 D7，若 D1 在随机化后则不作未受影响基线。XBJ-SCAP 目标为 710 名全体随机化者；无法重建才用 675 例全分析集作明确标注的改良意向治疗；617 例符合方案、671 例 sepsis-like、658 例严格重叠仅作敏感性；用实际 D8，若 D0 在随机化后不作基线/变化起点。两试验死亡与存活出院按等级；存活住院但锚点/SOFA 缺失时，在各多重插补数据集中用治疗、中心、确认的随机化前协变量和既往实际访视信息插补后重算摘要，以 Rubin 规则或聚类 bootstrap 合并；实施 delta ±0.5/±1 个标准差与最佳/最差转折点，转院/未知状态作界限分析。XBJ-SCAP 不填补结构性不存在变量，D-dimer 单位未核实则排除。两主要状态端点组成 Holm 家族错误率 0.05 检验族；其他访视/模块作探索性错误发现率控制，亚组只报治疗×亚组交互。D1/D4/D7 或 D0/D4/D8 只支持访视特异或离散变化，不插值为伪连续轨迹；两试验人群、访视、锚点或估计对象不同则独立分析。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-017
    category: claims_and_evidence_status
    source_locator: "Research content and work packages > Conjunctive stage-II success definition — complete subsection"
    protected_content: >-
      阶段 II 只有五类证据同时满足才支持候选系统表征，任一类不得由其他类或 RCT 补足。第一，两库均构造主发病前风险集和发病后队列，并达事件、转移、医院、锚点支持。第二，复杂候选在正确生成、零边、核心错设中达到全部绝对恢复；若只支持线性/多状态模型，结论必须改用较简单表征名称。第三，两主要任务在开发和时间外评价中，Brier/多类别 Brier 相对最强简单基线差值上侧 95% 界≤+0.01，校准斜率 0.80–1.20，校准截距对应绝对风险误差≤0.02。第四，标签/特征遵守可用时钟，患者、医院、重复住院和插补不跨划分，且无未解决高严重度泄漏。第五，医院优先划分后，最终外部测试仍有≥20 个具事件支持医院；不更新参数两任务满足 Brier 非劣性，对齐主要状态相关/一致性≥0.70，预设结构符号一致率≥0.80；适配集结果分报。数据依赖细化阈值只可在月 6 前按临床容许误差、开发库 bootstrap 和未用外部结果的先导模拟登记；硬性标准只可收紧不可放宽。
    required_revised_disposition: retained_same_strength
  - protected_id: PCR-018
    category: claims_and_evidence_status
    source_locator: "Expected outputs, falsification criteria, and interpretations > Planned outputs; Contribution, innovation, impact, application, and closest-work comparison > Contribution and evidence progression"
    protected_content: >-
      所有标签、审计、模型、恢复、外部验证和 RCT 扩展均为计划产物，不得写成已有模型或完成结果。阶段 II 计划产物包括双时钟标签与 12 小时风险集、互斥状态、变量用途/共同概念/接口/缺失/医院划分/跨院排除记录、简单基线、绝对恢复与错误高置信控制、至多一个受支持复杂候选或较简单模型、两主要任务和两次要诊断在开发/时间外/医院外/最终测试中的校准、不确定性、状态对齐及结果图。数据可追溯层目前尚未生成；状态恢复与任务效度是阶段 II 必需；跨数据库稳定是阶段 II 最低端点。RCT 仅在条件满足时分试验报告实际访视低维摘要差异，或与阶段 II 独立的临床状态差异；最多支持随机分配组在该访视对象上的差异。创新只允许“条件性证据整合、验证和资源增量”，模块已有先例为高置信，完整组合缺口为低至中等置信，不得提高证据状态。
    required_revised_disposition: retained_same_strength
  - protected_id: PCR-019
    category: assumptions_limitations_and_contingencies
    source_locator: "Feasibility, resources, risks, alternatives, and stop conditions > Working assumptions — complete subsection"
    protected_content: >-
      临床尺度到模拟参数范围尚未确定；模拟必须包括正确、零边、过拟合、遗漏状态、错误滞后/观测模型，以及政策反馈、隐藏混杂、非随机缺失、标签误差、访视密度、接口缺失和数据库差异。具体范围须在月 7 模拟前由临床、统计、系统辨识负责人，仅据临床容许误差、开发数据和不使用外部最终结果的先导模拟登记；未确定则复杂候选绝对恢复结论不成立。多类别校准精确估计量、置信界和细化阈值也尚待确定；已固定多类别 Brier、有利状态绝对校准、患者/医院聚类不确定性及硬标准只收紧不放宽。具体方法须在查看外部最终结果前，仅据开发库 bootstrap、临床容许误差和先导模拟确定；未登记则相应任务/状态不得进入阶段 II 合取判断，事件/参数筛选下限不得替代经验有效样本量和模拟稳定性。
    required_revised_disposition: retained_once_at_authority_location
  - protected_id: PCR-020
    category: assumptions_limitations_and_contingencies
    source_locator: "Feasibility, resources, risks, alternatives, and stop conditions > Limitations and boundary conditions — items 1–5"
    protected_content: >-
      数据库公开存在不等于已有访问、协议、可运行提取或所需事件/转移/医院/锚点支持；当前无可核验人员承诺或新模型结果。EHR 发病时刻依赖感染配对、基线 SOFA、滚动窗和可用时间；后录入、同格未来治疗、未来测量频率、重复住院、跨划分处理及结局决定的网格/阈值均可泄漏。潜在状态编号和旋转坐标不可解释；只有同时满足锚定、恢复、多种子对齐、bootstrap 保留、外部符号一致、状态对齐和区间校准的状态/转移/依赖可解释，预测较好不能替代。显式测量过程不能确定非随机缺失真实机制；低行动重叠或低有效样本量时不能估计治疗作用；阴性对照/时间反转无问题不能证明模型正确。跨数据库主要证据仅来自预定且未调整模型的不更新参数测试；适配集重新校准、只更新观测模型、完整再开发是不同操作，有限更新较好不得挽救主要外部测试失败；跨分区排除可能削弱支持。
    required_revised_disposition: retained_once_at_authority_location
  - protected_id: PCR-021
    category: assumptions_limitations_and_contingencies
    source_locator: "Feasibility, resources, risks, alternatives, and stop conditions > Limitations and boundary conditions — items 6–9"
    protected_content: >-
      两 RCT 目前只是潜在个体数据源；本地衍生报告不能替代授权、原始 CRF/SAP、随机化、中心、D7/D8 相对随机化/首剂时间及死亡、住院、出院、转院语义，锚点/单位/映射尚未检验。两试验人群、访视、锚点、估计对象不同，必须分开且不合并；稀疏访视只支持访视特异/离散变化，不支持伪连续轨迹；方向不一致或区间过宽时只报告无支持或跨场景适用有限，不得事后选亚组挽救。代表性检索不是系统综述，未完成 PRISMA 双人筛选、引文网络穷举、专利及 CNKI、万方、Scopus、Web of Science、Embase 或全部注册平台检索，预印本和术语会变化，因此组合缺口仅低至中等置信。观察性数据/预测表现不支持真实因果网络、治疗因果效应、反事实策略、机制、中介、控制或数字孪生；RCT 最多支持实际访视低维摘要或独立临床状态组间差异，不能验证未测潜在动力学、转移边或整个阶段 II 模型；计划不是已验证模型、临床决策工具或药物平台，不支持无条件临床推广。
    required_revised_disposition: retained_once_at_authority_location
  - protected_id: PCR-022
    category: assumptions_limitations_and_contingencies
    source_locator: "Feasibility, resources, risks, alternatives, and stop conditions > Risks, alternatives, and stop conditions — public-data access through timeline rows"
    protected_content: >-
      月 3 无两个可访问数据库或关键职责未具名时，启用预定且同等审计的 HiRID/AmsterdamUMCdb；仍无两个库则停止 24 个月跨库系统路线。月 6 事件、转移、医院、锚点、时间戳或接口不足时，拟合前统一改 24 小时网格或事件时间、删不支持模块/边并评估备份；仍不能构造两库全病程队列则停止跨库全病程端点。跨分区排除后若测试医院<20、任一自由风险/转移参数外部事件/转移<10、锚点覆盖<70% 医院或<80% 患者，或排除>原合格测试患者/主要事件 10%，执行预定排除与连通分量敏感性并评估备份；仍不足只报数据库描述，不作医院稳健或完整跨库端点。高严重度泄漏须修正规则、删变量、重建标签；月 20 未消除则不访问最终测试。任一状态、转移、边、覆盖、零边或错设标准失败时合并/删除并降级；月 12 无合格复杂候选则结束复杂扩展。delta/转折点改变解释、行动<5% 或>95%、加权有效样本<名义 20% 时报告敏感区间、合并/删除低支持关系并标记特异，不估计治疗作用或解释未测状态/行动边。不更新参数外部验证未达标可分报有限更新/再开发，但不得改变跨库稳定性未获支持。月 20 未冻结开发分析包则不访问最终测试；月 24 无外部结果则阶段 II 最低端点未完成。
    required_revised_disposition: retained_once_at_authority_location
  - protected_id: PCR-023
    category: assumptions_limitations_and_contingencies
    source_locator: "Feasibility, resources, risks, alternatives, and stop conditions > Risks, alternatives, and stop conditions — RCT and literature-positioning rows"
    protected_content: >-
      RCT 授权或核心语义不完整、每试验合格锚点<2，或一致性/误差任一未达标时，不构造或解释阶段 II 相关低维摘要；仅在 SOFA、随机化、中心及生存/住院语义可核实时转用独立死亡-SOFA 状态，否则只复现原终点或报告审计，核心语义不足即停止新端点。两试验方向相反或区间不能排除无支持时，分试验报告无支持/跨场景适用有限，不合并效应、不用事后亚组改变结论。若要主张全球首次、新算法、专利不存在或临床首次，须扩展系统综述、引文/专利网络及非英语数据库检索；当前只保留有界、条件性的整合与验证定位。
    required_revised_disposition: retained_once_at_authority_location
  - protected_id: PCR-024
    category: unsupported_claim_classes
    source_locator: "Feasibility, resources, risks, alternatives, and stop conditions > Limitations and boundary conditions — items 7–9; Title and positioning claim-support table — bounded-search row"
    protected_content: >-
      明确不支持的主张包括：真实因果网络、治疗因果效应、反事实策略、机制、中介、控制、数字孪生；以 RCT 次要分析验证未测潜在动力学、转移边或整个阶段 II 系统；把稀疏访视写成连续轨迹；把有限更新结果写成不更新参数外部验证成功；把当前计划写成已验证模型、临床决策工具、药物平台或无条件临床推广；把有界检索写成系统综述、全球不存在性、新算法、科学/方法/临床全球首次。条件性 RCT 只支持随机分配组在实际访视低维摘要或与阶段 II 独立临床状态上的差异；完整组合缺口只允许低至中等置信的限定表述。
    required_revised_disposition: retained_same_boundary
  - protected_id: PCR-025
    category: claims_and_evidence_status
    source_locator: "Expected outputs, falsification criteria, and interpretations > Falsification criteria and result interpretation — complete table"
    protected_content: >-
      若结果依赖发病后/尚不可用信息、同格未来治疗、未来测量频率或跨划分插补，则相应标签/任务的时间可实施性被否定。两库缺预设事件、转移、医院或锚点支持，表示跨库全病程表征经验基础不足。状态、转移、覆盖、零边或错设未达绝对恢复，表示复杂结构未恢复，只报达标的简单表征/预测。缺失转折点改变结论或行动比例/有效样本不足，表示关系对缺失假设或照护政策敏感。不更新参数外部测试未达概率评分、校准、状态对齐或符号一致，表示跨库稳定性假设被否定；适配结果只说明有限更新表现。试验锚点、单位、时间、低维性、相关、误差、校准或覆盖未达标，表示 RCT 访视摘要与阶段 II 表示关系不足，仅在语义可核实时转独立临床状态。随机化、中心、D7/D8、生存、住院或出院语义不可核实，表示新端点没有可审计估计对象。只有阶段 II 五类证据全达标，才支持一个经过数据审计、模拟恢复、任务评价和外部验证的候选全病程表征；仍不是因果机制或临床工具验证。
    required_revised_disposition: retained_same_strength
permitted_editorial_operations:
  - replace
  - define
  - move
  - split
  - merge
  - delete
  - reorder
  - add_bridge
  - consolidate
