mandatory_whole_dossier_checks:
  not_new_findings: true
  checks:
    - check: frozen identity and protected-content preservation
      instruction: >-
        逐字复制五个 identity_anchor 值，并逐项重开 PCR-001 至 PCR-012 的修订后
        locator，核对 register 中枚举的每项承诺，而不是以标题或 delta 声明代替正文。
      acceptance: >-
        五个 identity_anchor 值与 v051 完全相同；PCR-001 至 PCR-012 均有修订后
        locator 和正文可见的逐项保留证据。
    - check: four-role reader-facing concordance
      instruction: >-
        全文扫描共同生理锚点变量、锚点观测值、锚点预测值；两项次要表征诊断；
        恰当评分规则；零边与错设检查对象的首次定义和所有竞争形式。
      acceptance: >-
        四项 major action 的 acceptance test 均通过，且一个短形式不再跨越不同
        科学角色。
    - check: overlapping Objective 3 edit
      instruction: >-
        按 overlap disposition 对 Objective 3 只作一次合并编辑，同时保留绝对恢复、
        两类检查对象和两项次要表征诊断的独立角色。
      acceptance: >-
        Objective 3 同时满足 LANG-R108-002 与 LANG-R108-004，且不存在相互覆盖、
        重复或矛盾的处方。
    - check: editorial scope and scientific cardinality
      instruction: >-
        对照 v051 检查全部数字、时间窗、指标、阈值、分支资格、失败后果、表格行数、
        列表项数、固定字段基数和证据状态；只允许本 brief 的定义与称名替换。
      acceptance: >-
        没有新增科学选择或主张强化；所有科学数量、否定词、条件和作用域保持不变。
    - check: complete dossier structure
      instruction: >-
        检查 v052 是包含完整 frontmatter、15 个固定 H2、5 个固定推理 H3、证据链、
        Claim-Support 表和参考文献的单一完整 dossier。
      acceptance: >-
        没有持久化章节片段，完整 dossier 可独立进入后续 preservation review。

execution_and_handoff:
  single_complete_target_dossier: true
  partial_artifacts_forbidden: true
  same_writer_instance_required: true
  delta_after_dossier_freeze_only: true
  section_passes:
    - >-
      Pass 1 — 同一 writer 编辑 reader core（sections 1–4）：建立 LANG-R108-001、
      LANG-R108-002 和 LANG-R108-004 的首次定义，并按 overlap disposition 对
      Objective 3 只编辑一次。
    - >-
      Pass 2 — 同一 writer 编辑 research plan and technical authority（sections
      5–11）：执行四项 action 在时间节点、工作包、资源审计、主要任务、锚定、
      绝对恢复、跨数据库检验、试验映射、次要诊断和实现表中的全部列明 occurrence。
    - >-
      Pass 3 — 同一 writer 编辑 positioning, claim audit, and limitations authority
      （sections 12–14）：执行 evidence chains、Required analyses、Planned outputs、
      Falsification criteria、Contribution、Claim-Support 和第 14 节中的列明 occurrence，
      不增加宏观叙事动作或新的科学边界。
    - >-
      Pass 4 — 同一 writer 完成 references and whole-dossier concordance：不改文献
      证据内容，逐项运行四个 acceptance test、PCR-001 至 PCR-012 保留核对、完整
      dossier 检查和所有 occurrence 扫描。
  required_command_sequence:
    - structural_linter
    - freeze_complete_dossier
    - reader_facing_short_form_advisory_diff
    - write_revision_delta
  required_commands:
    - command_id: structural_linter
      command: >-
        python research-skills-openai/skills/multi-path-idea-generator/scripts/lint_idea_dossier.py tests/idea-narrative-forward-0.9.0-preview.3/one-pass-current/direct-final-current-v18/idea-dossier-v052.md --expected-plugin-version 0.9.0-preview.3
      substitution_allowed: false
      required_result: pass
      instruction: >-
        完成全部 bounded section passes 和 whole-dossier concordance 后运行此指定
        linter；不得用其他命令替代。若失败，修复完整 dossier 后重新运行全部受影响
        检查，再重新执行本命令。
    - command_id: reader_facing_short_form_advisory_diff
      command: >-
        python research-skills-openai/skills/academic-language-assessor/scripts/diff_reader_facing_short_forms.py tests/idea-narrative-forward-0.9.0-preview.3/one-pass-current/direct-final-current-v17/idea-dossier-v051.md tests/idea-narrative-forward-0.9.0-preview.3/one-pass-current/direct-final-current-v18/idea-dossier-v052.md
      substitution_allowed: false
      mode: advisory_read_only
      strict_switch_allowed: false
      instruction: >-
        dossier 通过指定 linter 并冻结后原样运行此现行 advisory diff；不得添加严格
        开关，也不得用自写搜索或其他命令替代。candidate 的出现本身不构成失败。
  advisory_candidate_dispositions:
    record_in: tests/idea-narrative-forward-0.9.0-preview.3/one-pass-current/direct-final-current-v18/revision-delta-v051-to-v052.md
    one_disposition_per_returned_candidate: true
    allowed_dispositions:
      - removed
      - standard_and_defined
      - descriptive_not_label
      - fixed_scaffolding
    instruction: >-
      对 advisory diff 返回的每一个 candidate，逐项记录 candidate、修订后 locator、
      语义依据和且仅一个允许的 disposition；不得漏项、合并多项或把 candidate presence
      当作 failure。若某项仍是经语义确认且未解决的术语问题，则阻止 handoff，不得
      虚构第五种 disposition。
  delta_requirements:
    - >-
      在 dossier 冻结之后才创建或最终确定 delta；任何后续 dossier 修改都使现有
      delta 和 advisory diff 结果失效，须重新完成 whole-dossier scan、指定 linter、
      冻结、指定 advisory diff 和 delta。
    - >-
      逐项映射 LANG-R108-001 至 LANG-R108-004 的修订后 locator、operation 和
      文本可核验的 acceptance-test 结果；不得以概括性“已完成”替代证据。
    - >-
      逐项映射 PCR-001 至 PCR-012 的修订后 locator 与正文保留证据，并记录五个
      identity_anchor 值逐字保留。
    - >-
      记录中心研究对象、主要研究问题或任务、主要结局、贡献，以及本次修订涉及的
      四个核心科学角色各自唯一的读者可见名称、首次出现位置、竞争形式处置和全文
      occurrence scan 结果。
    - >-
      记录指定 structural linter 的原命令和 pass 结果，以及指定 advisory diff 的
      原命令、只读运行结果和每个 returned candidate 的逐项 disposition。
    - >-
      delta 保持 locator-level 紧凑记录，不复制评估说明、protected content 或长篇
      dossier 正文。
  handoff_condition: >-
    仅当四项 major action、全部 PCR 保留、identity anchor、完整 dossier、指定
    linter、指定 advisory diff 及其逐项 dispositions 均完成时，才交付 v052 和
    revision-delta-v051-to-v052；其后必须进入独立 preservation review 与全新
    narrative/language reassessment。
