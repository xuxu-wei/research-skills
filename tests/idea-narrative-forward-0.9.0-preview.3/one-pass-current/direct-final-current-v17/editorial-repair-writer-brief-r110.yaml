      零边机制与模型错设下的两类检查对象。

overlap_dispositions:
  - finding_ids:
      - LANG-R108-002
      - LANG-R108-004
    disposition: >-
      由同一 writer 在 sections 1–4 pass 中对 Objective 3 只编辑一次。合并后的
      目标先写已知结构的绝对恢复，再分别直述零边机制下的虚假结构检查与模型
      错设下错误高置信结构结论检查，随后用“伪遮蔽重建诊断”和“未来轨迹预测
      诊断”称名两项次要表征诊断；四个科学角色彼此独立，原阈值、次要地位与
      阶段 II 判定边界全部保留。
    combined_target: >-
      Objective 3 同时满足 LANG-R108-002 的稳定诊断称名和 LANG-R108-004 的
      两类检查对象区分，不由 writer 在二者之间取舍。

