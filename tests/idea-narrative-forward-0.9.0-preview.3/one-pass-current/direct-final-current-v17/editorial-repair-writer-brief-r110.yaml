normalized_repair_actions:
  - repair_item_id: LANG-R108-001
    source_item_ids:
      - LANG-R108-001
    addresses_finding_ids:
      - LANG-R108-001
    scientific_role: physiological-anchor-variables
    source_normalized_locator: first-use-and-observation-mapping
    locator: >-
      Structured abstract，Objective and hypothesis（第 45 行）；Current resource
      and result status 及 support audit（第 100、110、138、141、165–168 行）；
      Observational target, anchoring, and evidence-qualified interpretation
      （第 224–226 行）；Conditional trial-observation mapping and independent
      analysis（第 273、275、277 行）；Key techniques and implementation
      （第 303、307 行）
    operation: define
    problem: >-
      “锚点预测”首次出现时没有说明锚点是跨数据库可比的生理测量变量；后文又用
      “锚点”“共同锚点”“观测锚点”和“实测锚点”交替指变量、观测值与预测对象，
      三种科学角色被同一短语折叠。
    target: >-
      首次出现时定义共同生理锚点，并在全文明确区分锚点变量、锚点观测值和锚点
      预测值；定义后的短形式不得跨越这三个角色。
    required_function_or_term: >-
      将第 45 行的“锚点预测”定义为“对跨数据库共同生理测量变量（共同生理锚点）
      的预测”。变量称“共同生理锚点变量”或已定义的“共同锚点”，实际测得的数值
      称“锚点观测值”，模型输出称“锚点预测值”；第 277 行的“观测锚点/实测锚点”
      依实际角色改为“锚点观测值”或“具有实测值的共同生理锚点变量”。
    standard_or_direct_name:
      - 共同生理锚点变量
      - 锚点观测值
      - 锚点预测值
    first_use_definition: >-
      共同生理锚点是指在两个重症监护数据库中均通过单位、测量语义、时间戳和
      可见性审计，可用于锚定潜在状态的实测生理变量。
    content_to_preserve:
      protected_ids:
        - PCR-003
        - PCR-004
        - PCR-006
        - PCR-007
        - PCR-008
        - PCR-010
        - PCR-011
      commitments: >-
        保留双库审计、每维至少两个锚点、单位与时间语义、覆盖率、载荷与尺度约束、
        试验映射资格、观测方程及全部数值阈值，不改变变量是否合格或如何进入模型
        的科学规则。
    delete_move_disposition: >-
      只定义并替换读者可见称名；不删除或移动任何变量资格、方程、阈值、后果或
      证据状态。
    destination: >-
      Structured abstract，Objective and hypothesis（第 45 行）首次定义；其余列明
      位置按变量、观测值或预测值作一致称名。
    dependencies: []
    acceptance_test: >-
      从第 45 行起全文检索所有含“锚点”的读者可见表述；每一处均能唯一归入变量、
      观测值或预测值三类之一，首次定义先于任何短形式，且第 277 行不再用同一个
      名词同时表示变量和数值。

  - repair_item_id: LANG-R108-002
    source_item_ids:
      - LANG-R108-002
    addresses_finding_ids:
      - LANG-R108-002
    scientific_role: secondary-representation-diagnostics
    source_normalized_locator: abstract-objectives-and-diagnostics
    locator: >-
      Structured abstract，Expected result（第 47 行）；Objective 3 及 work
      packages（第 82、124、128 行）；Protocol locks 及 Secondary representation
      diagnostics（第 205、292–294 行）；Evidence chain、required analyses 和
      evidence ladder（第 330–331、357、372、407 行）
    operation: replace
    problem: >-
      首两次出现只称“两项次要表示诊断”，没有说是哪两项；后文在“表示/表征”、
      “伪遮蔽重建/部分状态重建”和“未来轨迹诊断”之间切换，可能把对原已测生理值
      的诊断误读为潜在状态恢复。
    target: >-
      首次出现即给出两项诊断的直接名称，全文统一使用“表征”，并使伪遮蔽重建与
      未来轨迹预测始终保持为两个不同的次要诊断。
    required_function_or_term: >-
      将第 47 行改为“两项次要表征诊断（对原已测生理值的伪遮蔽重建诊断，以及
      未来轨迹预测诊断）”；后文统一用“伪遮蔽重建诊断”和“未来轨迹预测诊断”。
      第 62、76、82 和 205 行凡以“表示”指 representation 者改为“表征”，但不
      改动数学符号或普通动词“表示”。
    standard_or_direct_name:
      - 对原已测生理值的伪遮蔽重建诊断
      - 未来轨迹预测诊断
    first_use_definition: >-
      两项次要表征诊断是：遮蔽原本已测的生理值后检验其重建误差与覆盖，以及
      检验未来生理轨迹预测的评分与校准。
    content_to_preserve:
      protected_ids:
        - PCR-001
        - PCR-002
        - PCR-006
        - PCR-007
        - PCR-008
        - PCR-009
        - PCR-010
        - PCR-011
      commitments: >-
        保留两项诊断的次要地位、伪遮蔽仅作用于原已测值、各自的评分与覆盖指标、
        分层报告方式，以及它们不能改变主要任务或阶段 II 判定的边界。
    delete_move_disposition: >-
      替换“表示诊断”“部分状态重建”和“未来轨迹诊断”等竞争形式；不删除、移动
      或合并两个诊断，不改变其指标、作用域或证据地位。
    destination: >-
      Structured abstract，Expected result（第 47 行）给出两个直接名称；其余列明
      位置使用相同名称。Objective 3 与 LANG-R108-004 合并编辑一次。
    dependencies: []
    acceptance_test: >-
      全文只能找到一个首次定义和两个稳定的诊断名称；“部分状态重建”和术语意义上
      的“表示诊断”不再出现，且每一处“两项次要诊断”均可追溯到这两个名称。

  - repair_item_id: LANG-R108-003
    source_item_ids:
      - LANG-R108-003
    addresses_finding_ids:
      - LANG-R108-003
    scientific_role: primary-task-performance-criterion
    source_normalized_locator: freeze-and-external-criteria
    locator: >-
      24-month milestones（第 102 行）；WP3、primary-task protocol 和 evidence
      chain（第 124、203、330–331 行）；Required analyses、falsification criteria
      和 working assumptions（第 357、381、447 行）
    operation: define
    problem: >-
      “适当评分”可被理解为未具体说明的“合适评分”，没有明确指向统计学上的
      proper scoring rule；该词控制分析冻结、外部检验和阶段 II 判定，首次出现
      时尚未与 Brier 分数建立关系。
    target: >-
      使用明确指向 proper scoring rule 的中英对照术语，并在首次出现时给出本计划
      实际采用的 Brier 或多类别 Brier 分数实例。
    required_function_or_term: >-
      将首次出现的“适当评分”定义并替换为“恰当评分规则（proper scoring rules；
      本计划主要采用 Brier 分数或多类别 Brier 分数）”；后文统一使用“恰当评分
      规则”或直接写出相应 Brier 指标，不再单独使用“适当评分”。
    standard_or_direct_name:
      - 恰当评分规则（proper scoring rules）
      - Brier 分数
      - 多类别 Brier 分数
    first_use_definition: >-
      恰当评分规则是对概率预测分布进行评价、并在真实分布下使期望得分最优的一类
      评分规则；本计划主要使用 Brier 分数或多类别 Brier 分数。
    content_to_preserve:
      protected_ids:
        - PCR-006
        - PCR-007
        - PCR-008
        - PCR-010
      commitments: >-
        保留全部 Brier 非劣界、校准斜率、校准截距或绝对风险误差、置信界和最终
        测试授权规则；不改变任何评价指标或阈值。
    delete_move_disposition: >-
      只定义标准术语并替换“适当评分”这一不明确形式；不删除、移动或重写任何
      指标、阈值、置信界或授权后果。
    destination: >-
      24-month milestones（第 102 行）之前或当行给出完整定义；后续列明位置统一
      使用标准术语或 dossier 已指定的 Brier 指标。
    dependencies: []
    acceptance_test: >-
      第 102 行之前或当行出现完整定义；全文检索“适当评分”无结果，所有冻结和
      外部判定位置均明确连接到恰当评分规则及 dossier 已指定的 Brier 指标。

  - repair_item_id: LANG-R108-004
    source_item_ids:
      - LANG-R108-004
    addresses_finding_ids:
      - LANG-R108-004
    scientific_role: misspecification-diagnostic
    source_normalized_locator: objective-recovery-and-stop-rules
    locator: >-
      Objective 3（第 82 行）；Recovery admission and absolute criteria
      （第 101、240–241 行）；Key techniques、evidence chain 和 required analyses
      （第 304、323、355 行）；Falsification criteria（第 379 行）
    operation: replace
    problem: >-
      “假置信检查”和“错设与零边假置信检查”没有写明是谁对什么给出错误的高置信
      结论，并把零边机制中的虚假结构与模型错设下的过度置信两个不同结果压进同一
      短语；第 240–241 行实际给出两个不同判定对象。
    target: >-
      用直接表述区分“零边机制下产生虚假结构”和“模型错设下仍给出错误的高置信
      结构结论”，首次出现时同时定义，后文不再用一个无对象的“假置信”统称二者。
    required_function_or_term: >-
      将第 82 行的“执行绝对恢复与假置信检查”替换为“检验已知结构能否按预设绝对
      标准恢复，并分别检查零边机制下是否产生虚假结构、模型错设时是否仍给出错误
      的高置信结构结论”。后文使用“零边虚假结构检查”和“错设下错误高置信结论
      检查”，或使用同等清楚的完整描述。
    standard_or_direct_name:
      - 零边机制下的虚假结构检查
      - 模型错设下错误高置信结构结论的检查
    first_use_definition: >-
      零边虚假结构检查判断无真实边时模型是否仍报告边；错设下错误高置信结论检查
      判断生成机制不符合模型假设时，模型是否仍对错误结构给出高置信结论。
    content_to_preserve:
      protected_ids:
        - PCR-006
        - PCR-007
        - PCR-009
        - PCR-010
        - PCR-012
      commitments: >-
        保留零边虚假边比例、错设识别比例、错误结构高置信比例、复杂候选淘汰和不得
        事后调整阈值的所有规则，并保持两个判定对象彼此独立。
    delete_move_disposition: >-
      替换无主客体的“假置信”统称；不删除、移动或合并两类检查，不改变各自阈值、
      淘汰规则或停止解释后果。
    destination: >-
      Objective 3（第 82 行）同时定义两个检查对象；其余列明位置各自只映射到一个
      稳定名称。Objective 3 与 LANG-R108-002 合并编辑一次。
    dependencies: []
    acceptance_test: >-
      第 82 行即可辨认两个检查对象；全文不再出现无主客体的“假置信检查”，第 240
      和 241 行的两项判定分别只映射到一个稳定名称。

preservation_requirements:
  identity_anchor_copy_verbatim: true
  frozen_identity_anchor:
    primary_research_question: "can a knowledge-constrained, uncertainty-aware dynamic system representation of ICU patients cover the sepsis-centered pre-onset, onset, post-onset, and outcome continuum, demonstrate cross-database state/structure validity, and then test limited randomized intervention perturbations without conflating prediction with causality?"
    primary_objective: "construct and validate the sepsis complex-system model, with stage II completed within 24 months."
    study_object: "the longitudinal sepsis-centered ICU patient system, including comparable at-risk non-onset intervals and post-onset trajectories."
    core_data_or_evidence_base: "literature/expert priors; longitudinal public ICU data; conditionally available EXIT-SEP and XBJ-SCAP individual-level RCT data."
    primary_unit_of_inference: "patient-time state and state transition, with patient and hospital clustering respected."
  required_protected_ids:
    - PCR-001
    - PCR-002
    - PCR-003
    - PCR-004
    - PCR-005
    - PCR-006
    - PCR-007
    - PCR-008
    - PCR-009
    - PCR-010
    - PCR-011
    - PCR-012
  reopen_every_registered_source_locator: true
  register_summary_is_index_only: true
  no_new_scientific_choice: true
  instruction: >-
    修改前逐一打开 PCR-001 至 PCR-012 的 source_locator，并按原文核对所有科学
    承诺。不得新增、选择或改写研究对象、估计目标、数据资格、方法、阈值、分支、
    停止规则、证据状态或主张强度；若语言修改需要新的科学选择，停止并报告，不能
    在本次 editorial repair 中自行决定。

