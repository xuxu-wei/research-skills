omitted_item_scope_guard: >-
  NRP-003 and LA-001 through LA-006 are visible owner-prioritization records only.
  Do not execute their replacements, silently fold them into NRP-001 or NRP-002,
  reproduce them, or add a language, terminology, or summary-specific test because of
  them. Incidental wording changes required to delete duplicated major-action prose
  must not be used to perform any omitted minor repair.

identified_overlaps:
  - finding_ids:
      - NRP-001
      - NRP-002

overlap_dispositions:
  - finding_ids:
      - NRP-001
      - NRP-002
    disposition: >-
      Execute NRP-001 first. It owns every occurrence of conditional trial-extension
      eligibility, branch selection, estimand, trial-specific processing,
      multiplicity, stopping logic, and trial-result interpretation. Keep that
      complete logic exactly once in Research design and methods > 试验观测映射和独立分析,
      and reduce every other occurrence to the closed list of minimum local functions
      stated in NRP-001. Then execute NRP-002 on the resulting text. NRP-002 owns the
      complete limitation families and residual caveat duplication: keep all eleven
      full families exactly in section 14, delete an outside restatement unless it is
      indispensable to one allowed adjacent function, and never re-expand trial
      mechanics or delete NRP-001's required local role. When one source sentence
      mixes trial mechanics with a limitation, retain the operating rule only at the
      methods authority or its expressly allowed local function, retain the complete
      limitation only in section 14, and delete the duplicated explanatory clause.

unresolved_overlaps: []
all_overlaps_resolved: true

normalized_repair_actions:
  - repair_item_id: NRP-001
    source_item_ids:
      - NRP-001
      - NAR-001
    addresses_finding_ids:
      - NAR-001
    locator: >-
      Research design and methods > 试验观测映射和独立分析, together with every
      occurrence of the conditional trial extension from Title, summary, audience,
      and positioning through Feasibility, resources, risks, alternatives, and stop
      conditions
    operation: consolidate
    problem: >-
      The dedicated methods subsection correctly contains the full extension, but
      shared prerequisites, mapping eligibility and fidelity, the ordered proxy
      outcome, the independent SOFA alternative, the probability-index estimand,
      trial-specific processing, stopping rules, and interpretation boundaries are
      repeatedly re-explained across the dossier. This repeatedly interrupts the
      24-month stage I-II route and gives the contingent extension near-primary
      narrative weight.
    target: >-
      Preserve one complete eligibility-to-analysis-to-stopping authority in Research
      design and methods > 试验观测映射和独立分析. Outside that authority, retain only
      the minimum statement expressly allowed below for one local role, delete every
      multi-step branch explanation, and remove every other stage-III occurrence.
      The reader must be able to follow the complete stage I-II route without leaving
      it to reconstruct the contingent extension.
    required_function_or_term: >-
      The sole methods authority must retain the shared prerequisites; separate
      EXIT-SEP and XBJ-SCAP authorization and semantic verification; trial-specific
      common-anchor eligibility; external-fidelity rules; the ordered outcome based
      on death, the one-dimensional observable proxy, and live discharge; the
      mutually exclusive independent SOFA ordered-endpoint alternative; the
      stratified standardized probability-index estimand with original strata,
      pooled-arm weights, favorable direction, and half-credit ties; visit timing;
      analysis sets; missing-data and bounds handling; multiplicity; and every
      semantic, mapping, and analysis stop. Outside the authority, no retained
      statement may reproduce more than its single enumerated local role.
    content_to_preserve:
      protected_ids:
        - PCR-001
        - PCR-002
        - PCR-010
        - PCR-011
        - PCR-012
        - PCR-013
        - PCR-014
        - PCR-027
        - PCR-028
        - PCR-029
        - PCR-030
        - PCR-031
        - PCR-033
        - PCR-036
        - PCR-038
        - PCR-039
        - PCR-040
        - PCR-042
        - PCR-043
        - PCR-045
        - PCR-053
        - PCR-054
        - PCR-055
        - PCR-057
        - PCR-058
        - PCR-059
        - PCR-061
        - PCR-062
        - PCR-064
      instruction: >-
        Before changing any affected passage, reopen every applicable register
        locator. Preserve the conditional dependency on conjunctive stage-II success,
        separate-trial status, exact branch eligibility and consequences, all
        thresholds and formulas, trial-specific populations and visits, missing-data
        handling, multiplicity, current evidence status, noncausal interpretation,
        and every prohibited claim. Moving or deleting repetition does not authorize
        changing scientific content.
    delete_move_disposition: >-
      Keep the complete trial-extension logic in the existing methods subsection.
      Delete full or partial re-explanations of its eligibility tree, mapping-fidelity
      branch, independent-SOFA branch, estimand, imputation, multiplicity, stopping
      sequence, and whole-system interpretation outside that subsection. At each
      expressly allowed outside locator, retain only its stated local role; delete the
      extension entirely from all other opening, abstract, reasoning, methods-adjacent,
      contribution, feasibility, and governance prose. Do not replace deleted detail
      with another summary of the branch tree.
    destination: Research design and methods > 试验观测映射和独立分析
    dependencies: []
    outside_authority_allowed_occurrences:
      - locator: Research question, objectives, and core hypothesis > Primary research question
        allowed_local_function: primary_question_identity
        minimum_statement: >-
          One subordinate clause may state that, only after the main study meets its
          standard, separate trial-specific analyses examine randomized assignment in
          relation to the prespecified ordered visit outcome. Include no eligibility,
          branch, estimator, or stop detail.
      - locator: Research question, objectives, and core hypothesis > Objectives > objective 4
        allowed_local_function: objective
        minimum_statement: >-
          One objective sentence may state the same conditional, separate, secondary
          trial question and that it does not count toward stage-II success.
      - locator: Research content and work packages > 24-month minimum delivery and milestones
        allowed_local_function: timing_dependency
        minimum_statement: >-
          One milestone entry may state that the extension follows the 24-month
          stage-I/II minimum, depends on stage-II success, and cannot count toward or
          repair it. Include no operating detail.
      - locator: Research content and work packages > Work packages and minimum route
        allowed_local_function: work_package
        minimum_statement: >-
          WP5 and the terminal precedence link may state only dependency, timing,
          separate per-trial output, and exclusion from stage-II success.
      - locator: Data, materials, and existing evidence base > Current resource and result status
        allowed_local_function: current_factual_status
        minimum_statement: >-
          Retain only the current facts that authorization, original semantics,
          mapping inputs, and new trial results remain unverified or ungenerated.
      - locator: Data, materials, and existing evidence base > Local randomized-trial evidence status
        allowed_local_function: current_factual_status
        minimum_statement: >-
          Preserve the registered trial-specific counts, source status, field gaps,
          and facts still requiring verification. Do not add the downstream branch
          sequence to these factual descriptions.
      - locator: Key techniques and implementation > trial-observation-mapping interface row
        allowed_local_function: implementation_record
        minimum_statement: >-
          Retain only the per-trial inputs and the records the implementation must
          produce. Do not repeat eligibility thresholds, formulas, alternative-branch
          conditions, imputation recipes, multiplicity rules, or stopping logic.
      - locator: Evidence chain > 有前置条件的随机试验次要分析
        allowed_local_function: evidence_chain
        minimum_statement: >-
          Keep exactly the required Input, Method / analysis / processing, Output, and
          Supports roles. The method line may state separate per-trial verification
          and execution of the prespecified ordered-outcome analysis, but not the
          branch tree or its technical specifications.
      - locator: Required analyses and evidence
        allowed_local_function: method_eligibility
        minimum_statement: >-
          One compact requirement may state authorization, original-semantic
          verification, trial-specific eligibility, and execution of the fixed
          method. Delete field lists, thresholds, formulas, branch construction,
          imputation, center, multiplicity, and stopping sequences.
      - locator: Expected outputs, falsification criteria, and interpretations > Planned outputs
        allowed_local_function: planned_output
        minimum_statement: >-
          Retain only separate per-trial results when eligible, or the recorded reason
          that no new visit-outcome analysis was performed.
      - locator: Expected outputs, falsification criteria, and interpretations > Falsification and stop criteria
        allowed_local_function: falsification_consequence
        minimum_statement: >-
          Retain only the consequence that mapping failure blocks the mapping-ordered
          outcome without erasing an independently eligible SOFA analysis, while
          unverifiable core semantics stop all new visit-outcome analyses. Preserve
          discordance and imprecision consequences without repeating any thresholds
          or the full eligibility sequence.
      - locator: Expected outputs, falsification criteria, and interpretations > Interpretation matrix
        allowed_local_function: interpretation
        minimum_statement: >-
          Retain one result-interpretation row for an eligible mapping result and one
          for an independent SOFA result, with their distinct allowed and prohibited
          meanings. Include no construction or eligibility method.
      - locator: Contribution, innovation, impact, application, and closest-work comparison > Contribution and evidence ladder
        allowed_local_function: contribution_positioning
        minimum_statement: >-
          Retain one subordinate evidence row stating the conditional per-trial
          claim-strength role. Do not list technical method requirements.
      - locator: Contribution, innovation, impact, application, and closest-work comparison > Verified representative closest-work comparison
        allowed_local_function: contribution_positioning
        minimum_statement: >-
          Retain only the precedent comparison and the conditional, separate,
          subordinate difference proposed here.
      - locator: Title and positioning claim-support table
        allowed_local_function: claim_audit
        minimum_statement: >-
          Retain one row that audits the subordinate-extension claim, its evidence
          chain, conditional status, separate-trial scope, and non-primary role.
          Include no branch method.
      - locator: Feasibility, resources, risks, alternatives, and stop conditions > Working assumptions
        allowed_local_function: assumption_governance
        minimum_statement: >-
          Retain the estimator-confirmation owner, deadline, affected component, and
          consequence. Keep the complete estimator definition and branch mechanics
          only in the methods authority; map PCR-045 to both revised locators.
      - locator: Feasibility, resources, risks, alternatives, and stop conditions > Limitations and boundary conditions
        allowed_local_function: limitation_authority
        minimum_statement: >-
          Preserve the complete trial-related limitation families within the sole
          full limitations authority. They must not be converted into a second
          eligibility-to-analysis specification.
      - locator: Feasibility, resources, risks, alternatives, and stop conditions > Risks, alternatives, and stop conditions
        allowed_local_function: risk_response
        minimum_statement: >-
          Retain only the concrete authorization or core-semantic trigger, response,
          and consequence. Do not restate the mutually exclusive branch tree.
    acceptance_test: >-
      The complete extension from shared prerequisites through eligibility, mapping,
      alternatives, estimand, trial-specific processing, multiplicity, and stopping
      appears exactly once in Research design and methods > 试验观测映射和独立分析.
      The stage-I/II question-to-output route remains continuous and visibly primary.
      Every retained outside occurrence appears in the closed list above, performs
      exactly its one assigned role, contains no multi-step branch logic, and is the
      minimum text needed for that role. EXIT-SEP and XBJ-SCAP remain separate;
      mapping failure does not erase the independent SOFA alternative; core-semantic
      failure stops all new visit outcomes; and stage III cannot count toward, bypass,
      repair, or receive narrative weight comparable to stage II.

  - repair_item_id: NRP-002
    source_item_ids:
      - NRP-002
      - NAR-002
    addresses_finding_ids:
      - NAR-002
    locator: >-
      Feasibility, resources, risks, alternatives, and stop conditions > Limitations
      and boundary conditions, together with every limitation or caveat restatement
      elsewhere in the complete dossier
    operation: consolidate
    problem: >-
      Section 14 already contains eleven complete limitation families, while access,
      support, isolation, noncausal interpretation, trial semantics, result status,
      timing, and claim boundaries recur throughout the dossier even when they add no
      local scientific or operational decision. The repeated cautions fragment the
      positive argument and obscure the difference among a true limitation, a current
      fact, a method rule, a falsification consequence, an interpretation, and a risk
      response.
    target: >-
      Keep section 14 as the sole full limitations authority. Outside it, omit every
      limitation or caveat restatement unless it is indispensable to the immediately
      adjacent positive reasoning, method eligibility, current factual status,
      falsification consequence, interpretation, or risk response. Do not keep a
      statement merely because its section is required, do not retain general warning
      prose around a valid local function, and do not insert a pointer to section 14.
    required_function_or_term: >-
      Preserve all eleven scientifically distinct limitation families in full in
      section 14. Every retained similar statement outside it must be concise,
      self-contained, indispensable to the adjacent text, and assigned exactly one of
      these allowed functions: positive_reasoning, method_eligibility,
      current_factual_status, falsification_consequence, interpretation, or
      risk_response. A section heading, table requirement, claim-audit convention, or
      desire for repetition is not an allowed function.
    content_to_preserve:
      protected_ids:
        - PCR-001
        - PCR-002
        - PCR-003
        - PCR-004
        - PCR-005
        - PCR-006
        - PCR-007
        - PCR-008
