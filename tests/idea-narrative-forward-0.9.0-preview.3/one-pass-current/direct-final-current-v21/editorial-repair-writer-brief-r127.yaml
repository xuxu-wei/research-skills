        - PCR-064
      instruction: >-
        Reopen every source_locator before condensing, moving, or deleting its text.
        Preserve every enumerated scientific commitment, including identity, numbers,
        time rules, formulas, support rules, eligibility, mutually exclusive branches,
        consequences, owners and deadlines, evidence status, claim strength, and
        unsupported claim classes. PCR-048 through PCR-058 remain complete once in
        section 14. Other protected commitments remain at the technical or local
        authority required by their scientific function. Consolidation changes only
        location and repetition; it adds no data, method, evidence, or claim strength.
    delete_move_disposition: >-
      Preserve all eleven complete families in section 14. Elsewhere, first isolate
      the smallest clause that is indispensable to one allowed adjacent function,
      retain that clause without general warning prose, and delete the rest. Delete
      the entire occurrence when no allowed function applies. Do not move duplicate
      caveats into another outside section, do not preserve them because a required
      section exists, and do not replace deleted prose with a cross-reference or
      pointer to section 14.
    destination: >-
      Full limitation families remain only in Feasibility, resources, risks,
      alternatives, and stop conditions > Limitations and boundary conditions
    dependencies:
      - NRP-001
    allowed_outside_authority_functions:
      - function: positive_reasoning
        rule: >-
          Retain only a boundary without which the immediately adjacent positive gap,
          rationale, study question, or contribution would change meaning or claim
          strength. Delete free-standing caution and repeated lists.
      - function: method_eligibility
        rule: >-
          Retain only a condition that directly determines whether the adjacent
          cohort, model, external test, or analysis may be run or interpreted. Keep
          complete technical logic at its methods authority.
      - function: current_factual_status
        rule: >-
          Retain only what currently exists, remains unverified or ungenerated, and
          what source or resource status is known. Do not append a general limitation
          explanation.
      - function: falsification_consequence
        rule: >-
          Retain only the failed object, trigger, and scientific consequence needed by
          the adjacent falsification or stop statement.
      - function: interpretation
        rule: >-
          Retain only the result-specific allowed or prohibited inference needed to
          understand the adjacent result pattern or bounded claim.
      - function: risk_response
        rule: >-
          Retain only the concrete trigger, prespecified response, and consequence in
          the adjacent risk row.
    locator_dispositions:
      - locator: Title, summary, audience, and positioning; Structured abstract
        disposition: >-
          Preserve candidate and planned status and only an identity-defining
          interpretive boundary indispensable to the positive aim. Delete repeated
          access, result-status, trial-semantic, isolation, noncausal, deployment, and
          other caveat prose. NRP-003 remains omitted: do not otherwise redesign the
          one-sentence summary or apply a minor language repair.
      - locator: Background, current state, gap, significance, and rationale; Research question, objectives, and core hypothesis
        disposition: >-
          Preserve the positive reasoning chain, primary question, objectives, and
          hypothesis. Retain a concise noncausal or evidence boundary only where its
          omission would strengthen the adjacent question, hypothesis, or rationale;
          delete repeated complete cautions.
      - locator: Research content and work packages; Research design and methods; Key techniques and implementation; Required analyses and evidence
        disposition: >-
          Retain only operational eligibility, data-isolation, analysis-precedence,
          and stop rules needed to execute the adjacent method. Delete general
          limitation restatements, and keep the complete trial-extension logic only at
          the NRP-001 methods authority.
      - locator: Data, materials, and existing evidence base; Feasibility and resources
        disposition: >-
          Retain exact current resource, access, support, evidence, and result facts.
          Delete surrounding general cautions and repeated consequences unless they
          directly state the status decision in that row.
      - locator: Evidence chains; Planned outputs
        disposition: >-
          Preserve all required evidence-chain fields and planned-output roles. A
          limitation-like clause may remain only if it is indispensable to method
          eligibility, current factual status, or the output's interpretation; a
          required field alone is not a reason to keep it.
      - locator: Falsification and stop criteria
        disposition: >-
          Retain object-specific triggers and consequences, not the surrounding full
          limitation explanation.
      - locator: Interpretation matrix; Contribution and evidence ladder; Verified representative closest-work comparison; Title and positioning claim-support table
        disposition: >-
          Retain only result-specific interpretation and the minimum boundary needed
          to keep the adjacent positive or positioning claim at its registered
          strength. Delete general noncausal, nondeployment, novelty, or evidence
          warnings that merely repeat section 14.
      - locator: Working assumptions
        disposition: >-
          Preserve each registered assumption's fixed content, owner, deadline,
          affected component, and consequence. Keep technical definitions at their
          methods authority and governance at the assumption row; delete only
          duplicated limitation prose that changes none of those elements.
      - locator: Limitations and boundary conditions
        disposition: >-
          Preserve all eleven complete and scientifically distinct families as the
          sole full limitations authority. Do not shorten, merge away, replace, or
          redirect any family.
      - locator: Risks, alternatives, and stop conditions
        disposition: >-
          Retain each concrete trigger, prespecified response, and consequence. Delete
          general warning clauses and repeated branch explanations that do not change
          that risk response.
    acceptance_test: >-
      Section 14 contains the complete eleven-family limitations authority and is the
      only place where full limitation families are stated. Every similar retained
      occurrence outside section 14 is indispensable to its immediately adjacent
      text, is assigned exactly one allowed function, and contains only the minimum
      self-contained boundary needed for that function. Every unassigned occurrence
      is deleted; no text is retained merely because a section is required; no
      limitation or caveat pointer to section 14 is inserted; and NRP-001's single
      trial-method authority, closed list of role statements, uninterrupted stage-I/II
      route, and subordinate weighting remain intact.

