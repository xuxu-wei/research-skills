machine_identity_anchor_requirement:
  copy_verbatim_from_register: true
  fields:
    - primary_research_question
    - primary_objective
    - study_object
    - core_data_or_evidence_base
    - primary_unit_of_inference
  acceptance: >-
    All five identity_anchor frontmatter values in v056 are character-for-character
    identical to register v007. Reader-facing prose may move or consolidate, but the
    machine-facing values may not be paraphrased.

mandatory_whole_dossier_checks:
  not_new_findings: true
  checks:
    - check: Exact structural and active-plugin-version lint
      instruction: >-
        After all bounded passes and before freezing the dossier, run exactly: python
        research-skills-openai/skills/multi-path-idea-generator/scripts/lint_idea_dossier.py
        tests/idea-narrative-forward-0.9.0-preview.3/one-pass-current/direct-final-current-v22/idea-dossier-v056.md
        --expected-plugin-version 0.9.0-preview.3. Resolve every error without changing
        science. Preserve all 15 required H2 headings, the five distinct
        Background-to-Rationale H3 functions, all five evidence chains with Input,
        Method / analysis / processing, Output, and Supports fields, the Key
        techniques implementation records, and the claim-support table.
      acceptance: >-
        The exact command exits successfully, reports OK for idea-dossier-v056.md,
        and the dossier declares plugin_version 0.9.0-preview.3.
    - check: All 64 protected-content items
      instruction: >-
        Reopen every source locator and every revised locator for PCR-001 through
        PCR-064. Compare the candidate dossier against every enumerated element,
        including numbers, times, formulas, branch eligibility and consequences,
        owners and deadlines, evidence status, claim strength, and unsupported claim
        classes. A heading, a short register summary, or a completion assertion is not
        preservation evidence. Consolidation may change location and repetition only.
      acceptance: >-
        Every PCR-001 through PCR-064 commitment remains at its stated revised locator
        or locators, and the revision delta contains exactly one compact,
        text-grounded preservation row for each protected ID.
    - check: Five verbatim machine-facing identity anchors
      instruction: >-
        Compare primary_research_question, primary_objective, study_object,
        core_data_or_evidence_base, and primary_unit_of_inference in v056 against
        register v007 and copy each value verbatim, including punctuation and
        capitalization.
      acceptance: >-
