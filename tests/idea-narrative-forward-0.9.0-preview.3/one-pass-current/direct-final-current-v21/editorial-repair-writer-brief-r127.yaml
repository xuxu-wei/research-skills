execution_and_handoff:
  section_passes:
    - >-
      Pass 1 — reader core, sections 1-4: apply only the NRP-001 and NRP-002
      dispositions needed in the title, summary, positioning, structured abstract,
      Background-to-Rationale chain, question, objectives, and hypothesis. Remove
      non-authorized extension and caveat repetition without executing NRP-003 or any
      language finding; preserve required field cardinalities.
    - >-
      Pass 2 — research plan and technical authority, sections 5-11: keep the complete
      trial-extension logic in its single methods subsection, reduce every other trial
      occurrence to its enumerated local role, apply the aggressive limitation rule,
      and preserve the uninterrupted stage-I/II work-package, methods, implementation,
      evidence-chain, required-analysis, output, falsification, and interpretation
      route in one complete dossier.
    - >-
      Pass 3 — positioning, claim audit, and limitations authority, sections 12-14:
      preserve positive contribution and bounded claim-support functions, keep all
      eleven full limitation families only in section 14, delete all unjustified
      outside caveats, and preserve registered assumptions and risk responses without
      re-expanding trial logic.
    - >-
      Pass 4 — references and whole-dossier concordance: inspect references, perform
      both fixture-specific all-occurrence inventories, verify PCR-001 through
      PCR-064 and all five identity anchors, run the exact structural lint, verify
      both included actions against their acceptance tests, and only then freeze the
      complete dossier.
  same_writer_instance_required: true
  single_complete_target_dossier: true
  partial_artifacts_forbidden: true
  pre_freeze_action_compliance_required: true
  delta_after_dossier_freeze_only: true
  delta_requirements:
    - >-
      Create or finalize revision-delta-v055-to-v056.md only after the complete v056
      dossier has passed all four bounded section passes, both all-occurrence
      inventories, the exact lint, the full protected-content scan, the identity check,
      and the action-compliance check, and after v056 is frozen. Any later dossier edit
      invalidates the delta and requires rerunning these checks and rewriting it.
    - >-
      Map NRP-001 and NRP-002 to revised locators, executed consolidation and deletion
      operations, every enumerated locator disposition, and text-grounded results of
      their acceptance tests. Do not map NRP-003 or LA-001 through LA-006 as executed.
    - >-
      Map every PCR-001 through PCR-064 to revised locator or locators and compact
      item-level evidence in the dossier's actual words. Do not reproduce protected
