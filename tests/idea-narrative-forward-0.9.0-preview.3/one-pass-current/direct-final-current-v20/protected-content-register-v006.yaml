  - protected_id: PCR-049
    category: assumptions_and_limitations
    source_locator: "Feasibility, resources, risks, alternatives, and stop conditions > Limitations and boundary conditions > 2. Labels, clocks, and leakage"
    source_context_locator: null
    protected_content: >-
      Sepsis-3 has no unique EHR onset time; infection pairing, SOFA baseline,
      observation window, and availability time alter labels. Timestamp quality,
      dual-use variables, measurement frequency, repeated admissions, and cross-split
      processing can leak information. Results enter the evidence chain only with no
      unresolved high-severity leakage.
    required_revised_disposition: retained_once_at_authority_location

  - protected_id: PCR-050
    category: assumptions_and_limitations
    source_locator: "Feasibility, resources, risks, alternatives, and stop conditions > Limitations and boundary conditions > 3. State recoverability and structural scope"
    source_context_locator: null
    protected_content: >-
      Recoverable invariants exist only under allowed reparameterizations and
      prespecified generators; simulation coverage is not real-system identification.
      Prediction cannot replace state/edge recovery, seed alignment, bootstrap
      retention, external sign agreement, state alignment, or interval calibration.
      Failed states or edges must be deleted, merged, or qualified as database- or
      care-policy-specific.
    required_revised_disposition: retained_once_at_authority_location

  - protected_id: PCR-051
    category: assumptions_and_limitations
    source_locator: "Feasibility, resources, risks, alternatives, and stop conditions > Limitations and boundary conditions > 4. Nonrandom missingness and low action overlap"
    source_context_locator: null
    protected_content: >-
      Explicit measurement models, pattern-mixture shifts, selection-model tipping
      points, and negative controls examine only part of missingness sensitivity and do
      not identify unmeasured physiology. Low action overlap or low effective sample
      size supports only care-policy-specific association, not treatment-effect
      estimation.
    required_revised_disposition: retained_once_at_authority_location

  - protected_id: PCR-052
    category: assumptions_and_limitations
    source_locator: "Feasibility, resources, risks, alternatives, and stop conditions > Limitations and boundary conditions > 5. Cross-database evidence"
    source_context_locator: null
    protected_content: >-
      The second database differs by center, era, sampling, and interface, and
      hospital-wide interface absence can mimic patient-level missingness. The frozen
      no-update test is primary external evidence; calibration-only and observation-
      layer-only adaptation describe adapted performance, and full refitting is
      development. Adaptation cannot alter a failed no-update conclusion.
    required_revised_disposition: retained_once_at_authority_location

  - protected_id: PCR-053
    category: assumptions_and_limitations
    source_locator: "Feasibility, resources, risks, alternatives, and stop conditions > Limitations and boundary conditions > 6. Time and delivery boundary"
    source_context_locator: null
    protected_content: >-
      Stages I-II must complete within 24 months. Missing month-12, month-20, or
      month-24 milestones respectively limits the complex candidate, access to final
