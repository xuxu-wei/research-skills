protected_items:
  - protected_id: PCR-001
    category: identity_and_question
    source_locator: "YAML frontmatter > identity_anchor"
    protected_content: |-
      The study identity comprises all of the following anchors: (1) the primary question is whether a knowledge-constrained, uncertainty-aware dynamic representation of ICU patients can cover the sepsis-centered pre-onset, onset, post-onset, and outcome continuum, demonstrate cross-database state/structure validity, and then test limited randomized intervention perturbations without conflating prediction with causality; (2) the primary objective is to construct and validate the sepsis complex-system model, with stage II completed within 24 months; (3) the study object is the longitudinal sepsis-centered ICU patient system, including comparable at-risk non-onset intervals and post-onset trajectories; (4) the core evidence base is literature and expert priors, longitudinal public ICU data, and conditionally available EXIT-SEP and XBJ-SCAP individual-level RCT data; and (5) the primary unit of inference is the patient-time state and state transition, with patient and hospital clustering respected.
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-002
    category: object_scope_and_boundaries
    source_locator: "## Research question, objectives, and core hypothesis > ### Primary research question and ### Objectives"
    protected_content: |-
      Preserve the complete scope and its conditional branches: (1) the object includes comparable not-yet-onset at-risk intervals and post-onset trajectories, and inference concerns patient-time states and transitions with patient and hospital clustering; (2) the candidate representation must cover pre-onset risk, first onset, mutually exclusive post-onset evolution, and outcomes; (3) cross-site validity asks whether patient states and candidate structure remain quantifiably stable in hospitals and databases excluded from development; (4) the RCT question is asked only after stage II passes and only when actual visit measures support the prespecified mapping, and concerns visit-specific differences between randomized groups in a low-dimensional summary calculated from those measures; (5) the four objectives remain the dual-time full-course boundary, audit-constrained representation with physiology/treatment/measurement separation and invariant-only interpretation, simulation recovery plus isolated cross-database validation of two primary tasks and two secondary diagnostics, and trial-specific sparse-visit secondary analysis with an independent death-and-SOFA clinical-state fallback when mapping fails.
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-003
    category: claims_and_evidence_status
    source_locator: "## Title, summary, audience, and positioning > One-sentence complete-Idea summary and Positioning and contribution frame"
    protected_content: |-
      Preserve the stated strength and conditions of the positioning: (1) this is a 24-month planned construction and validation using literature, expert knowledge, and two public ICU databases that first require access and observability audits; (2) the principal external test is in hospitals and a database excluded from development or parameter adjustment and does not update model parameters; (3) RCT secondary analyses occur separately by trial only if all five stage-II evidence classes pass and authorization, original semantics, and actual visit measures meet requirements; (4) the work is positioned as evidence integration, planned cross-database validation, reusable benchmark data and analysis resources, and a falsifiable design—not ordinary clinical prediction, generic ICU risk stratification, or merely a prediction tool; (5) the individual modules have high-confidence precedents, while the expected increment is their auditable connection rather than novelty of each module.
    required_revised_disposition: retained_same_strength

  - protected_id: PCR-004
    category: claims_and_evidence_status
    source_locator: "## Structured abstract > Expected result"
    protected_content: |-
      Every described product is planned rather than completed. Planned outputs include executable dual-time labels, dual-database observation and variable-use audits, mutually exclusive states, simulation recovery tests with records of noninterpretable states/transitions/dependencies and reasons, two primary tasks, two secondary representation diagnostics, and no-parameter-update external validation. Trial outputs remain conditional: after stage II passes, freeze the model and map it to actual RCT visit measures; if mapping concordance fails, use an analysis of clinical states independent of the candidate representation. Nothing in this locator may be restated as an existing model, completed validation, generated result, or established trial finding.
    required_revised_disposition: retained_same_strength

  - protected_id: PCR-005
    category: inputs_and_resources
    source_locator: "## Data, materials, and existing evidence base > ### Current resource and evidence status"
    protected_content: |-
      Preserve each evidence-status distinction: (1) the public existence and versions of MIMIC-IV v3.1 and eICU-CRD v2.0 are verified, but team access and project executability are not; (2) credentials, data-use agreements, downloads, storage, exact extracted versions, and checksums are unverified; (3) project-specific sample, event, transition, hospital, cross-hospital patient, anchor-density, and interface support have not been generated; (4) local EXIT-SEP and XBJ-SCAP cleaning/validation reports document derived-workbook construction, key nonmissingness, and reproduction checks but are neither original-source audits nor independent peer review; (5) individual-level trial authorization, original CRF/SAP, randomization, center, visit timing, and survival/hospitalization/discharge semantics are unverified; (6) WBC and CRP are only candidate anchors and final retention, cross-source semantics, and units are unproved; (7) roles are specified but named personnel, commitments, and effort are unverified; (8) no new model, simulation recovery, prediction, external-test, or RCT analysis result exists; and (9) the representative-literature update is bounded through 2026-07-17, supports high confidence that individual modules have precedents, and supports only low-to-moderate confidence in the full-combination gap.
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-006
    category: inputs_and_resources
    source_locator: "## Data, materials, and existing evidence base > ### Public ICU database roles and observability audit"
    protected_content: |-
      Preserve database roles and input admissibility: (1) MIMIC-IV v3.1 is the planned development database for labels, model development, and internal/time-holdout evaluation, conditional on credentials, agreement, and exact table versions; (2) eICU-CRD v2.0 is the planned external database, partitioned by hospital into a reserved adaptation set and a final external test set, with whole-hospital interface missingness audited; (3) one of HiRID or AmsterdamUMCdb must be prespecified during months 0–3 and pass the same audit before replacing a primary database role; (4) only concepts with auditable units, semantics, timestamps, and information visibility enter the common layer, while database-specific information is exploratory and confined to the observation model.
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-007
    category: inputs_and_resources
    source_locator: "## Data, materials, and existing evidence base > ### Local RCT evidence"
    protected_content: |-
      Preserve the trial evidence counts and their status: (1) EXIT-SEP randomized 1,817 Sepsis-3 patients in 45 Chinese ICUs; local derived reports record 1,760 with known 28-day status, 395 deaths, 57 unknown statuses, SOFA nonmissing counts of 1,750 at D1, 1,542 at D4, and 1,296 at protocol D7, and lactate nonmissing counts declining from 855 at D1 to 223 at D7; exact D1/D7 timing relative to randomization or first dose still requires original-protocol verification; (2) XBJ-SCAP randomized 710 severe-community-acquired-pneumonia patients; derived reports record 675 in the full analysis set, 617 per protocol, 671 in the full-analysis-set population with baseline SOFA at least 2 meeting an operational sepsis-like definition, 658 in the strict-overlap population, SOFA nonmissing counts of 703/628/610 at D0/D4/D8, WBC counts of 704/634/614, CRP counts of 579/503/467, and 675 with known 28-day status; exact D0/D8 timing still requires original-protocol verification; SCAP enrollment is not equivalent to confirmed Sepsis-3; PaO2/FiO2, lactate, shock, CRRT, and central-nervous-system variables are unavailable in current materials; D-dimer units remain unverified.
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-008
    category: design_analysis_and_validation
    source_locator: "## Research content and work packages > ### Twenty-four-month programme"
    protected_content: |-
      Preserve the ordered programme and information barriers: (1) months 0–3 verify access, agreements, storage, compute, six named responsibilities, an independent data custodian, and one backup database; (2) months 4–6 complete cohort-flow, event/transition, hospital, cross-hospital patient, common-anchor, interface, and missingness audits and fix the label, dual-time design, multistate system, hospital split, time grid, common modules, and parameter cap; (3) months 7–12 fit competing-risk, multistate, and linear state-space baselines first, run Monte Carlo and semi-synthetic recovery, and assess at most one restricted complex candidate; (4) months 13–18/20 complete development, time-holdout, and hospital-holdout evaluation and freeze the label, anchors, preprocessing, model, hyperparameters, update level, metrics, and external criteria in a checksummed package; (5) months 21–24 run the no-parameter-update external test and separately report adaptation-set recalibration and observation-model-only updating; (6) model selection, metrics, and data splits are fixed before their relevant results are visible, and the independent custodian controls final external-test access.
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-009
    category: design_analysis_and_validation
    source_locator: "## Research content and work packages > ### Prespecified criteria for completing the 24-month validation stage"
    protected_content: |-
      Stage II passes only if all five evidence classes pass; no class and no later RCT result can rescue another: (1) both databases support construction of the primary pre-onset risk set and post-onset state cohort under prespecified event, transition, hospital, and anchor requirements; (2) any complex candidate passes every recovery standard in correctly specified, null-edge, and core-misspecification scenarios, while a result supported only for linear or multistate models must use that simpler name; (3) for both primary tasks in development and time holdout, the upper 95% bound of the Brier or multiclass-Brier difference versus the strongest simple baseline is no greater than +0.01, calibration slope is 0.80–1.20, and the absolute-risk error corresponding to calibration intercept is no greater than 0.02; (4) labels/features obey label-availability time, patients, hospitals, repeat admissions, and imputation do not cross splits, and no unresolved high-severity leakage remains; (5) after hospital-first splitting, the final external test contains at least 20 event-supported hospitals, both primary tasks meet the Brier noninferiority standard without parameter updating, aligned primary-state correlation or concordance is at least 0.70, and prespecified structural-sign concordance is at least 0.80; adaptation-set results are separate. Data-dependent refinements may be registered by month 6 only from clinical tolerances, development-database bootstrap results, and pilot simulations that do not use external results; stated hard standards may be tightened but never relaxed.
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-010
    category: design_analysis_and_validation
    source_locator: "## Data, materials, and existing evidence base > ### Public ICU database roles and observability audit > audit table and paragraph beginning '主时间方案为 12 小时'"
    protected_content: |-
      Preserve all audit rules as one support system: (1) the main analysis uses only the first eligible ICU stay per admission and, for linkable repeat admissions, the patient's first eligible admission; (2) the final external test needs at least 20 event-supported hospitals; (3) each free risk parameter needs at least 20 development and 10 external events, and each free transition parameter needs at least 20 development and 10 external transitions; (4) alive ICU discharge, death, transfer/loss to follow-up, and administrative end are counted separately, with rare terminal states mergeable but not treated as ordinary independent censoring; (5) timestamps must support 12-hour ordering, otherwise a 24-hour grid or event time is evaluated uniformly before fitting; (6) each common dimension needs at least two anchors; each anchor must be actually measured in at least 30% of eligible bins in each database, without forward-filling to qualify; (7) an anchor must exist in at least 70% of eligible hospitals and cover 80% of eligible patients; (8) measurement indicators, actual measurement times, and time since last actual measurement are retained, with no unconditional last-observation-carried-forward; (9) state dimension K equals the smaller of 4 and the number of audited modules, state modes are at most 3, and inadequate event/transition support forces simplification; (10) the primary grid is 12 hours; only infusions with explicit start/stop times, organ-support states, and static baselines escape the no-unconditional-forward-fill rule.
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-011
    category: design_analysis_and_validation
    source_locator: "## Data, materials, and existing evidence base > ### Prespecified variable roles"
    protected_content: |-
      Preserve the role separation: Y_t contains measured physiology and audited anchors but excludes treatment starts/stops/doses and measurement frequency, and label-derived SOFA copies remain separate; A_t contains starts, stops, and doses of antimicrobials, fluids, vasoactives, mechanical ventilation, CRRT, and steroids, is never a latent physiologic anchor, and uses a timestamped separate copy when contributing to a deterioration label; M_t contains whether/when/how often measurements are ordered, sampled, and available plus hospital interfaces, with unmeasured not equated to normal and interface absence not encoded as physiology; label-only fields include suspected-infection pairing, independent SOFA events, mutually exclusive states, death, discharge, and transfer and never enter the same or earlier prediction time; antimicrobial dual use obeys label-availability time and stays separate from actions; B contains fixed pre-prediction baseline covariates and explicitly encoded unknowns, not time-replicated pseudo-measurements.
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-012
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Protocol specifications for the two primary clinical tasks > Primary pre-onset task column"
    protected_content: |-
      Preserve the full pre-onset task: (1) adults at least 18 years old, first eligible ICU stay per admission, at least 12 hours of visible history, and not yet at the primary label at the prediction time; (2) suspected infection pairs specimen collection with first actual systemic-antimicrobial administration: drug within 72 hours after an earlier specimen or specimen within 24 hours after an earlier drug, with infection time the earlier event; (3) baseline SOFA is 0 without recorded chronic dysfunction, otherwise the lowest calculable SOFA in the 24 hours before ICU, and unauditable baselines are excluded from the primary risk set; (4) rolling 24-hour worst SOFA components and an increase of at least 2 points within 48 hours before through 24 hours after infection define the first sortable onset time; (5) label availability is the maximum source-system availability/finalization time of the later paired event and necessary SOFA data, with no backfill to event time; (6) landmarks begin at ICU hour 12 and repeat every 12 hours, use at most the prior 24 hours and at least 12 hours of available history, and predict first onset in the next 12 hours; (7) overlapping landmarks remain, total admission weight is 1, and inference clusters by patient and hospital; (8) alive ICU discharge, in-hospital death, transfer, and loss to follow-up are mutually exclusive pre-onset termini, while administrative end is independently censored with inverse-probability censoring weighting and bounds; (9) at time t, features require availability before t, treatments newly occurring in [t,t+12h) are A_t, physiology measured at the next boundary belongs to the next state, and unsortable same-timestamp edges are excluded; (10) the estimand is conditional 12-hour cumulative first-onset incidence from discrete multinomial cause-specific hazards; primary metrics are 12-hour Brier and absolute calibration intercept/slope, with AUPRC, lead time, and false alarms secondary; uncertainty uses patient- and hospital-level bootstrap 95% intervals.
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-013
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Protocol specifications for the two primary clinical tasks > Primary post-onset task column"
    protected_content: |-
      Preserve the full post-onset task: (1) include first onset; patients already septic at ICU entry enter only at the first auditable time, with delayed entry stratified and left truncated and without backdating onset; (2) onset is time zero and state changes use clinical event time; physiologic recovery must persist 24 hours and is only available at the end of that window, while deterioration, death, discharge, and transfer use the then-visible record; (3) evaluate every 12 hours after onset or delayed entry, with day 7 primary and day 14 sensitivity; (4) death, alive ICU discharge, and transfer are terminal states, discharge does not substitute for recovery, and inverse-probability censoring-weight sensitivity analysis is retained; (5) the same within-bin availability and ordering rule as the pre-onset task applies, organ support remains a treatment action, and deterioration exists only after its independent label has formed; (6) the estimand is day-7 occupancy of the favorable set 'physiologic recovery or alive ICU discharge', with its two components separately reported, using a mutually exclusive discrete multistate model and Aalen–Johansen estimation; (7) primary evaluation uses day-7 multiclass Brier and favorable-state absolute calibration, with state/transition calibration secondary; uncertainty uses patient- and hospital-level bootstrap, stratifies first-onset versus delayed-entry patients, and reports effective transition counts.
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-014
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Protocol specifications for the two primary clinical tasks > paragraph beginning '主标签之外仅设置两种敏感性标签'"
    protected_content: |-
      Preserve exactly two sensitivity labels, neither replacing the primary result: (1) make culture–antimicrobial pairing symmetric at ±24 hours; (2) use the lowest calculable SOFA in the 24 hours before infection for every patient and restrict the organ-dysfunction window to 24 hours on each side of infection. Leakage checks must cover post-onset physiology/treatment, culture or antimicrobial information not yet available, treatment later in the same bin, future measurement frequency, cross-split imputation and standardization, repeat admissions, patients or ICU stays crossing sets, overlapping-window weights, and outcome-driven variables, grids, or thresholds.
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-015
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Mutually exclusive post-onset state and event system"
    protected_content: |-
      Preserve 12-hour mutually exclusive assignment and the priority order death; transfer/unobservable; alive ICU discharge; deterioration/new organ failure; physiologic recovery; persistent sepsis. When source times cannot be ordered, assign the higher-priority state and retain event-time sensitivity analysis. State definitions remain: persistent sepsis is alive in ICU without another state and is transition-capable; recovery is SOFA at least 2 points below the onset reference with no new deterioration for 24 continuous hours, event time at window start and availability at window end, with recurrent deterioration allowed and no organ-support escalation used only as a label condition; deterioration is SOFA at least 2 points above the prior 24-hour minimum or new/escalated vasoactive therapy, invasive ventilation, or CRRT, counted once if simultaneous and separated from action variables; alive ICU discharge is absorbing but not equivalent to recovery; transfer/unobservable is a competing terminal state, not recovery or ordinary independent censoring, and receives weighting/bounds; death during traceable ICU course is absorbing, nonrandom-missingness is not implied, and death wins same-timestamp ties.
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-016
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Observational target, anchoring and abstention > paragraphs defining p(X_0:T,...) and anchor constraints"
    protected_content: |-
      Preserve the observational estimand and identifiability constraints: (1) X_t is anchored latent patient state, Y_t physiology, A_t treatment, M_t measurement indicator/intensity, B baseline, and S database/hospital; the target under actual care and measurement policies is p(X_0:T,Y_0:T,M_0:T,A_0:T | B,S) and its derived risk, aligned occupancy/transition, anchor prediction, and prespecified sign/lag invariants, without interpreting A_t as an intervention's causal effect; (2) every dimension needs at least two cross-database anchors, the first loading fixed at +1 with standardized scale, and unspecified cross-loadings fixed at 0 or a prewritten sparse pattern; (3) K is at most 4, state modes at most 3, lags only 1 or 2 prespecified bins, and the graph may omit instantaneous within-bin cycles; (4) fit 20 fixed random seeds, align permutation and sign, and interpret only aligned occupancy, transition probabilities, anchor predictions, and prespecified edge sign or lag.
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-017
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Observational target, anchoring and abstention > paragraph beginning '非随机缺失主分析'"
    protected_content: |-
      Preserve the missingness, support, and abstention rules: (1) the primary missingness analysis uses an explicit measurement-process MAR or selection-model baseline, plus pattern-mixture delta sensitivity values of −1, −0.5, 0, +0.5, and +1 development-database standard deviations and selection-model tipping-point analysis; (2) action probabilities and effective sample size are reported for every aligned state, hospital, and time stratum; no treatment effect is estimated if action prevalence is below 5% or above 95%, or weighted effective sample size is below 20% of nominal; (3) any state or edge with alignment below 90% across 20 seeds, bootstrap retention below 80%, external sign concordance below 80%, state alignment below 0.70, or uncalibrated intervals must be deleted, merged, or labeled database/care-policy-specific; better prediction cannot rescue this interpretation failure.
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-018
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Simulation and semi-synthetic recovery tests"
    protected_content: |-
      Preserve the recovery design, standards, and consequences: (1) during months 7–10 and without reading final external-test results, repeat every core scenario at least 1,000 times or until the Monte Carlo standard error of key proportions is at most 0.02; (2) generators include correct specification, null edges/independent states, redundant states/overfit, omitted states, wrong lag or observation model, crossed with state separation, switching rate, 1- or 2-bin lag, policy feedback, hidden confounding, nonrandom missingness, label error, visit density, whole-hospital interface missingness, and database shift; (3) state recovery needs adjusted Rand index or primary canonical correlation at least 0.80 and 20-seed alignment at least 90%; (4) primary allowed-transition mean absolute error is at most 0.05 and 95% interval coverage 0.90–0.98; (5) prespecified sign/lag recovery is at least 0.80; (6) edge detection needs sensitivity at least 0.80 and false-discovery rate at most 0.10; (7) under null edges, the repeated fraction in which any false edge's 95% interval excludes 0 is at most 0.05; (8) misspecification detection needs at least 80% of repetitions to trigger mismatch or list uninterpretable structure, while high-confidence declaration of wrong structure is at most 0.05; (9) probability calibration slope is 0.80–1.20 and absolute probability bias at most 0.02; (10) only states, transitions, and edges meeting their standards are interpreted, null/misspecification failures limit structure claims, and structural recovery and probability calibration remain separate judgments.
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-019
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Hospital-based cross-database validation > hospital split and numbered patient-handling rules"
    protected_content: |-
      Preserve the isolation algorithm: (1) before outcome-guided selection, stratify eligible eICU hospitals by volume quartile and interface completeness and hash hospital identifiers with fixed seed 20260717, assigning 30% of hospitals to the reserved adaptation set and 70% to the final external test; (2) hospital assignment precedes patient rules, final-test hospitals never move to adaptation because of links, and the assignment table, linkage-algorithm version, and checksum are fixed before final-test outcomes are viewed; (3) after hospital assignment, identify cross-hospital records only with patient-linkage keys and exclude every record of a patient spanning adaptation and test hospitals from the primary external analysis, without patient-hash reassignment; (4) patients confined to one partition contribute their prespecified first eligible admission and first eligible ICU stay and never cross sets; (5) before performance is released, report exclusion counts, fraction of originally eligible patients, hospitals involved, and outcome-preceding age, sex, admission type/source, first-landmark physiologic burden, and observation density, never excluding on outcome or model error; (6) the prespecified sensitivity uses test-priority patient–hospital connected components: pure components keep their role, mixed components lose all related adaptation records and retain only the first eligible ICU stay in prespecified test hospitals; hospital roles do not change and test data are not borrowed for training; (7) the independent custodian checks sample support without releasing performance.
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-020
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Hospital-based cross-database validation > paragraph beginning '确定标签、变量统一方案'"
    protected_content: |-
      Preserve the external-analysis sequence after labels, harmonization, states, preprocessing, availability rules, model, hyperparameters, thresholds, and evaluation code are fixed: first, external validation without parameter updates; second, adaptation-set recalibration of intercept and slope at each prediction time; third, adaptation-set updating of the observation model only while holding state and transition parameters fixed. Report all three separately. Full refitting or redevelopment in the target database is model updating/redevelopment and is not external validation; favorable limited-update performance cannot replace a failed no-parameter-update external test.
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-021
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Trial-specific mapping to observed visits and independent clinical-state analysis > trial semantics, anchor eligibility, and prespecified mapping"
    protected_content: |-
      Preserve trial gating and mapping identity: (1) both new state endpoints are post hoc secondary exploratory reanalyses and original 28-day endpoint reproduction is separate; trials are analyzed separately; (2) after stage II passes and before treatment-group comparisons, freeze the model, mapping rules, thresholds, code, and random seed; each trial needs individual-level authorization and original CRF/SAP/data-dictionary or holder confirmation of randomization, analysis set, center/strata, actual D7 for EXIT-SEP or D8 for XBJ-SCAP relative to randomization and first dose, and death/hospitalization/alive-discharge/transfer semantics; (3) a common anchor must be a retained Y_t physiologic anchor, directly measured at the actual visit, construct- and unit-consistent or preconvertible, and sampled/available within the visit window; treatment, measurement frequency, SOFA/endpoint labels, and post hoc states are excluded; each trial needs at least two eligible anchors; WBC and CRP are only candidates, and unknown-unit D-dimer or absent fields never map; (4) using MIMIC development means, standard deviations, and 1st/99th percentile truncation, form Z_C; from the stage-II observation equation Z_C=a_C+L_CX+e and SVD L_C=UDV', define P_state=V_1'X and visit-observed P_obs=D_1^(-1)U_1'(Z_C−a_C); (5) resolve tied singular values by prespecified anchor dictionary order and set sign in MIMIC so correlation with same-day total SOFA is nonnegative, making higher values worse; (6) mapping never uses RCT treatment assignment, RCT outcome, or pooled cross-trial data, and each trial uses its own C_r.
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-022
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Trial-specific mapping to observed visits and independent clinical-state analysis > Consistency and error standards"
    protected_content: |-
      Preserve the joint pass rule, evaluated first in the corresponding eICU final-test D7 or D8 window and never tuned to RCT results: first singular axis explains at least 50% of L_C Frobenius energy; P_state–P_obs correlation is at least 0.70; normalized mean absolute error is at most 0.50 P_state standard deviations; in P_state=alpha+beta P_obs, |alpha| is at most 0.20 standard deviations, beta is 0.80–1.20, and 95% interval coverage is 0.90–0.98; every common anchor's external calibration slope is 0.80–1.20 and absolute standardized intercept at most 0.20. Then, in treatment-blinded trial data, at least 80% of observed anchors must fall within the prespecified physiologic range and at least 60% of living hospitalized visits must have two or more actually measured anchors allowing direct P_obs calculation. Re-estimating weights by trial fails the prespecified mapping requirement. Every criterion must pass; one passing criterion cannot rescue another.
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-023
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Trial-specific mapping to observed visits and independent clinical-state analysis > mapping-passing estimand and independent clinical-state analysis"
    protected_content: |-
      Preserve the branch and estimands: if mapping passes, place deaths before D7/D8 in the worst rank, rank living hospitalized patients from high/worse to low/better P_obs, and place alive discharges before the visit in a separate most-favorable rank; compare randomized groups with a center- or randomization-stratum-compatible probabilistic index or win probability. If anchors or mapping concordance/error fail but SOFA, death, hospitalization/discharge, randomization, and center semantics are verifiable, use a prespecified endpoint independent of the candidate representation: death worst, living hospitalized patients ordered by SOFA high to low, alive discharge best. If D7/D8, randomization, center, or survival semantics cannot be verified, construct no new state endpoint.
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-024
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Trial-specific mapping to observed visits and independent clinical-state analysis > trial table and paragraph on sparse visits"
    protected_content: |-
      Preserve trial-specific populations, missingness, and multiplicity: (1) EXIT-SEP targets all 1,817 randomized participants; the 1,760 known-outcome participants are only a complete-outcome subset; use actual D7, and if D1 is postrandomization it is not an untreated baseline; (2) XBJ-SCAP targets all 710 randomized participants; only if reconstruction fails use a clearly labeled modified intention-to-treat analysis of the 675-person full analysis set; the 617 per-protocol, 671 operational sepsis-like, and 658 strict-overlap groups are sensitivity analyses only; use actual D8, and if D0 is postrandomization it is not an untreated baseline or change-score origin; (3) deaths and alive discharges are ranked; for living hospitalized participants missing anchors/SOFA, impute within each multiple-imputation dataset using treatment, center, confirmed prerandomization covariates, and prior actual visits, recompute the fixed summary, and combine with Rubin rules or cluster bootstrap; retain delta shifts of ±0.5 and ±1 standard deviation, best/worst tipping-point analysis, and bounds for transfer or unknown status; (4) never impute structurally absent XBJ-SCAP PaO2/FiO2, lactate, shock, CRRT, or CNS fields and exclude D-dimer until its unit is verified; (5) the two primary trial state endpoints form one Holm family with familywise error 0.05; other visits/modules use exploratory false-discovery-rate control; subgroups report treatment-by-subgroup interaction only; (6) D1/D4/D7 and D0/D4/D8 sparse visits support only visit-specific or discrete-change analyses, never interpolated pseudo-continuous trajectories, and differences in populations, visits, anchors, or estimands require separate analyses rather than pooling.
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-025
    category: design_analysis_and_validation
    source_locator: "## Research design and methods > ### Secondary representation diagnostics"
    protected_content: |-
      Preserve the secondary-only role of representation diagnostics: partial-state reconstruction uses pseudo-masking mean absolute error, root mean square error, log score, and interval coverage; future trajectory uses ranked probability score, negative log-likelihood, occupancy, and outcome calibration; results are stratified by variable, state, hospital, and observation density. Pseudo-masking evaluates only values that were originally measured and therefore supports representation diagnostics only, not broader recovery, validation, or causal claims.
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-026
    category: design_analysis_and_validation
    source_locator: "## Required analyses and evidence"
    protected_content: |-
      Preserve the required evidence bundle for stage II: (1) dual-database access/version/agreement/sample/event/transition/hospital/cross-hospital patient/anchor/interface/missingness/complexity audits and named responsibilities; (2) unit tests for the primary and two sensitivity labels, dual times, 12-hour landmarks, day-7 states, priority, delayed entry, competing events, and censoring; (3) variable-role table, time-isolation proof for dual-use copies, and checks for forward fill, future measurement frequency, and cross-split imputation; (4) simple baselines, Monte Carlo and semi-synthetic recovery, null-edge and misspecification results, plus model selection and state/transition/dependency deletion, merge, and noninterpretability records with reasons; (5) missingness delta/tipping-point, action-overlap/effective-sample-size, interface-missingness, label-error, time-reversal, and clinical-negative-control results; (6) both primary tasks and both secondary diagnostics with probability scores, absolute calibration, coverage, alert burden, and patient/hospital clustered intervals; (7) hospital hash assignment, cross-partition exclusions, pre-outcome feature comparison, connected-component sensitivity, permission logs, analysis-package checksum, and separate results for all three external modes; (8) a criterion-by-criterion decision table for the five stage-II classes, separating benchmark-resource value from the cross-database representation conclusion. Before RCT work, additionally require authorization; original semantics/timing documentation including the 57 unknown EXIT-SEP outcomes and XBJ-SCAP randomized-versus-full-analysis-set difference; trial-specific anchors, units, windows, mapping, error/concordance tests; and specifications for ties, multiple-imputation inference, centers, Holm family, and subgroup interactions.
    required_revised_disposition: retained_same_meaning

  - protected_id: PCR-027
    category: claims_and_evidence_status
    source_locator: "## Expected outputs, falsification criteria, and interpretations > ### Falsification criteria and result interpretation"
    protected_content: |-
      Preserve every failure interpretation and the one positive interpretation: leakage from post-onset/not-yet-available information, later same-bin treatment, future measurement frequency, or cross-split imputation falsifies temporal implementability of the affected label/task; missing dual-database event, transition, hospital, or anchor support means the empirical basis for the cross-database full-course representation is inadequate; failure of state, transition, coverage, null-edge, or misspecification recovery means the complex structure was not recovered and only passing simpler representations or prediction results may be reported; missingness tipping points or inadequate action overlap/effective sample size make the affected state/action relation sensitive to assumptions or care policy; failure of no-parameter-update external probability score, calibration, state alignment, or sign concordance falsifies the cross-database stability needed for stage II, and adaptation performance indicates only limited-update behavior; failure of trial anchors, units, timing, low-dimensionality, correlation, error, calibration, or coverage means the observed-visit summary is insufficiently related to the retained representation and permits only the independent clinical state when semantics allow; unverifiable randomization, center, D7/D8, survival, hospitalization, or discharge means no auditable new-state estimand; only all five stage-II classes passing supports a candidate full-course representation that has undergone data audit, recovery testing, task evaluation, and external validation.
    required_revised_disposition: retained_same_strength

  - protected_id: PCR-028
    category: claims_and_evidence_status
    source_locator: "## Contribution, innovation, impact, application, and closest-work comparison > ### Contribution and evidence progression"
    protected_content: |-
      Preserve the evidence ladder and conditional strength: data traceability remains planned and requires dual-database audit, role tables, and leakage checks; recovered state and two-primary-task performance are stage-II necessities requiring recovery, tasks, diagnostics, calibration, and noninterpretability records; cross-database state/structure stability is the stage-II minimum endpoint and requires hospital splitting, no-update validation, separate limited updates, alignment, and figures; randomized visit-summary differences require verified trial semantics, anchors, mapping, concordance/error, death/missingness, center, and multiplicity and are conditional secondary analyses; death-and-SOFA clinical-state differences are independent of the candidate representation. If executed, the contribution may be evidence integration, validation, reusable benchmark resources, and methodological transparency; empirical contributions are not yet established.
    required_revised_disposition: retained_same_strength

  - protected_id: PCR-029
    category: assumptions_limitations_and_contingencies
    source_locator: "## Feasibility, resources, risks, alternatives, and stop conditions > ### Feasibility and resources"
    protected_content: |-
      Preserve feasibility status and scope: the minimum team has named critical-care/phenotyping, longitudinal-statistics, system-identification, data-engineering, model-implementation, and independent external-test-custodian roles, but no verifiable names, commitments, or effort currently exist. Compute scope is two primary databases, K at most 4, at most 3 state modes, two primary tasks, two secondary diagnostics, and at most one complex candidate. Database existence/version is verified, while credentials, agreements, runnable extraction, queue support, personnel, and all new model/simulation/external/RCT results are unverified or absent. The 24-month minimum requires dual-database audit, recovery tests, two primary tasks, leakage checks, and cross-database external validation. RCT analysis lies beyond the minimum, occurs only after stage II plus authorization/semantics/visit support, and no RCT result may fill any resource, recovery, primary-task, or external-validation gap.
    required_revised_disposition: retained_once_at_authority_location

  - protected_id: PCR-030
    category: assumptions_limitations_and_contingencies
    source_locator: "## Feasibility, resources, risks, alternatives, and stop conditions > ### Working assumptions"
    protected_content: |-
      Preserve both unresolved registrations and their consequences: (1) clinical-scale-to-simulation-parameter mapping is not fixed; simulation must include correct, null-edge, overfit, omitted-state, wrong-lag/observation-model, policy-feedback, hidden-confounding, nonrandom-missingness, label-error, visit-density, interface-missingness, and database-shift conditions; clinical, statistical, and identification leads must register parameter ranges before month-7 simulation using only clinical tolerances, development data, and pilot simulation without final external results; failure to do so precludes claiming the complex candidate passed recovery; (2) exact multiclass-calibration estimators, confidence bounds, and data-supported threshold refinements remain to be registered before viewing final external-test results, using only development bootstrap, clinical tolerances, and pilot simulation; multiclass Brier, favorable-state absolute calibration, patient/hospital uncertainty, and the tighten-only hard standards are already fixed; no registration means the affected primary-task or state conclusion cannot contribute to stage II, and screening event/parameter minima never substitute for empirical effective sample size or simulation stability.
    required_revised_disposition: retained_once_at_authority_location

  - protected_id: PCR-031
    category: assumptions_limitations_and_contingencies
    source_locator: "## Feasibility, resources, risks, alternatives, and stop conditions > ### Limitations and boundary conditions > items 1–5"
    protected_content: |-
      Preserve these limitations and no-rescue rules once at the authority location: (1) public database existence does not establish team access, agreements, runnable extraction, or required event/transition/hospital/anchor support, and no verified staff commitment or new result exists; (2) EHR onset depends on suspected-infection pairing, baseline SOFA, rolling windows, and information availability, and late entry, later same-bin treatment, future measurement frequency, repeat admissions, cross-split processing, or outcome-driven grids/thresholds can leak; (3) latent-state labels and rotations are uninterpretable by themselves—only states, transitions, or dependencies passing anchoring, simulation recovery, multi-seed alignment, bootstrap retention, external sign, state alignment, and interval calibration can be interpreted, and prediction performance cannot rescue failure; (4) explicit measurement-process modeling cannot identify the true nonrandom-missingness mechanism, inadequate overlap/effective sample size precludes treatment-effect estimation, and clean negative controls or time reversal do not prove correctness; (5) primary cross-database evidence is the prespecified model's no-parameter-update test, while recalibration, observation-only updating, and full target-database refitting are distinct, and favorable limited updates cannot rescue no-update failure; cross-partition exclusion can itself erode support.
    required_revised_disposition: retained_once_at_authority_location

  - protected_id: PCR-032
    category: assumptions_limitations_and_contingencies
    source_locator: "## Feasibility, resources, risks, alternatives, and stop conditions > ### Limitations and boundary conditions > items 6–8"
    protected_content: |-
      Preserve the trial and literature limitations once at the authority location: (1) EXIT-SEP and XBJ-SCAP are only potential individual-level sources; derived local cleaning/validation materials cannot substitute for authorization, original CRF/SAP, randomization, center, D7/D8 timing relative to randomization/first dose, or death/hospitalization/discharge/transfer semantics, and common anchors, units, and mapping remain untested; (2) trials differ in populations, visits, anchors, and estimands and therefore remain separate; sparse visits support visit-specific or discrete-change analysis only, not pseudo-continuous trajectories; opposing directions or wide intervals yield no support or limited cross-setting applicability and cannot be altered by post hoc subgroup selection; (3) the literature search is not systematic and lacks PRISMA dual screening, exhaustive citation networks, patents, CNKI, Wanfang, Scopus, Web of Science, Embase, and all registries, while preprints and terminology change; the full-combination gap therefore remains low-to-moderate confidence.
    required_revised_disposition: retained_once_at_authority_location

  - protected_id: PCR-033
    category: assumptions_limitations_and_contingencies
    source_locator: "## Feasibility, resources, risks, alternatives, and stop conditions > ### Risks, alternatives, and stop conditions"
    protected_content: |-
      Preserve every trigger → alternative → bounded conclusion branch: (1) if by month 3 two databases are not accessible or key roles unnamed, activate the prespecified equally audited HiRID or AmsterdamUMCdb; if two accessible databases still do not exist, stop the 24-month cross-database route; (2) if by month 6 events, transitions, hospitals, anchors, timestamps, or interfaces lack support, uniformly switch before fitting to a 24-hour grid or event time, remove unsupported modules/edges, and assess the backup; if two full-course cohorts still cannot be built, stop the cross-database full-course endpoint; (3) if patients cross partitions or exclusion leaves fewer than 20 eligible test hospitals, fewer than 10 external events/transitions for any free risk/transition parameter, anchor coverage below 70% of hospitals or 80% of patients, or removes over 10% of originally eligible test patients or primary events, exclude all cross-partition patients, run the test-priority component sensitivity, and assess the backup; persistent insufficiency permits database-level description only, not hospital-robust or full cross-database system conclusions; (4) unresolved high-severity leakage is corrected by availability rules, variable removal, and regenerated labels; if unresolved by month 20, do not access final external results; (5) failure of any state, transition, edge, coverage, null-edge, or misspecification criterion leads to merging/deleting states/edges and simpler multistate, linear, or prediction-only baselines; no eligible complex candidate by month 12 ends complex extension and retains only supported simpler levels; (6) if delta/tipping points change interpretation, action prevalence is below 5% or above 95%, or weighted effective sample size below 20% of nominal, report sensitivity intervals, merge/delete low-support relations, and mark database/care-policy specificity; do not estimate treatment effects or interpret implicated unmeasured states/action edges; (7) failed no-update external scoring, calibration, alignment, or sign criteria leads to separately reported recalibration, observation-only update, and full redevelopment, none of which changes the conclusion that stage-II cross-database stability lacks support; (8) if no final development package by month 20 or no final external result by month 24, preserve simple models, audits, and failed evidence; month-20 failure blocks external access and month-24 failure leaves the minimum stage-II endpoint incomplete; (9) if RCT authorization/semantics are incomplete, fewer than two eligible anchors exist, or any mapping criterion fails, use independent death-and-SOFA clinical state only if SOFA, randomization, center, and survival/hospitalization semantics are verified, otherwise reproduce the original endpoint or report the audit; do not construct/interpret a frozen-model visit summary, and stop new-state endpoints when core semantics fail; (10) opposing trial directions or intervals compatible with no group difference require separate no-support/limited-applicability reports, no pooling, and no post hoc subgroup rescue; (11) any global-first, new-algorithm, no-patent, or clinical-first claim requires expanded systematic, citation/patent-network, and non-English searches; until then retain only bounded conditional integration/validation positioning.
    required_revised_disposition: retained_once_at_authority_location

  - protected_id: PCR-034
    category: unsupported_claim_classes
    source_locator: "## Feasibility, resources, risks, alternatives, and stop conditions > ### Limitations and boundary conditions > item 9, Interpretation boundary"
    protected_content: |-
      Preserve every unsupported claim class: observational data and prediction performance do not support a real causal network, treatment causal effects, counterfactual policies, mechanisms, mediation, control, or digital-twin claims. Conditional RCT secondary analysis can support at most randomized-group differences in the actual-visit low-dimensional summary or the independent clinical state; it cannot validate unmeasured latent dynamics, transition edges, or the whole system model used in stage-II adjudication. The current plan is not a validated model, clinical decision tool, or drug platform and does not support unconditional clinical deployment.
    required_revised_disposition: retained_same_boundary

  - protected_id: PCR-035
    category: unsupported_claim_classes
    source_locator: "## Title and positioning claim-support table > row '有界检索尚未发现完整证据组合的代表性先例'"
    protected_content: |-
      Preserve the bounded literature boundary: the search through 2026-07-17 found no representative precedent for the full connected evidence combination only at low-to-moderate confidence. Before expanded searching and completed research, do not claim global absence, scientific or methodological first, a new algorithm, patent absence, or clinical first. Individual modules are not claimed novel.
    required_revised_disposition: retained_same_boundary

