        第 7 节完整出现，结果证伪与结果依赖解释只在第 11 节完整出现。两试验方向不一致或
        区间过宽时不得以亚组改变主要解释，筛选下限不得替代有效样本量和模拟稳定性。
    - protected_id: PCR-011
      revised_authority: "Research content and work packages > Twenty-four-month minimum；第 7 节阶段 III 方法权威；其余规定的最小功能位置"
      governed_by:
        - NRP-001
        - NRP-002
        - NRP-003
        - NRP-004
        - NRP-005
        - LAR-105-01
        - LAR-105-02
        - LAR-105-03
        - LAR-105-06
        - LAR-105-08
        - LAR-105-09
      required_disposition: >-
        24 个月阶段 I–II、阶段 III 共享前提、映射分支、独立分支、停止和不可补足关系保持；
        完整技术逻辑只在第 7 节一次出现。标题/摘要、Structured abstract、问题、目标、时间、
        数据、实现、证据链、核查、产物、贡献和 Claim-Support 的出现次数与信息粒度严格按
        register 规定，不把一个分支的条件写成共享前提。
    - protected_id: PCR-012
      revised_authority: "Feasibility, resources, risks, alternatives, and stop conditions；必要的局部估计目标/解释/主张边界"
      governed_by:
        - NRP-001
        - NRP-002
        - NRP-003
        - NRP-004
        - LAR-105-02
        - LAR-105-03
        - LAR-105-04
        - LAR-105-06
        - LAR-105-08
        - LAR-105-09
      required_disposition: >-
        第 14 节一次性保留完整禁止主张清单；观察性数据、预测和条件性试验分析的不同证据
        边界不得削弱。其他位置只有在删除会造成紧邻估计目标、结果解释或主张审计实质误读时
        才保留最小自足边界，不成组重复完整清单。

writer_access:
  allowed_reads:
    - tests/idea-test-0.9.0-preview.1/0.9.0-preview.1/03_ideas/nodes/I01-001/dossiers/idea-dossier-v003.md
    - tests/idea-narrative-forward-0.9.0-preview.3/one-pass-current/baseline-current/editorial-repair-writer-brief-r106.yaml
    - tests/idea-narrative-forward-0.9.0-preview.3/run-001/inputs/protected-content-register-v004.yaml
  forbidden_reads:
    - 任何 narrative assessment、language assessment 或 assessor report
    - 任何 narrative repair plan、修订计划或其他计划型 reviewer 产物
    - 任何既有 revision delta、修订差异或历史修订记录
    - 任何 methodology preflight 或方法学预检
    - 任何 evaluation、评估报告、评分或决定
    - 除绑定 v003 外的任何 prior dossier、context、evidence map、ledger、portfolio 或 hidden parent context
  allowed_writes:
    complete_dossier:
      artifact_id: idea-dossier-I01-001-v051
      version: v051
      path: tests/idea-narrative-forward-0.9.0-preview.3/one-pass-current/direct-final-current-v17/idea-dossier-v051.md
      change_type: editorial_repair
    revision_delta:
      artifact_id: revision-delta-I01-001-v003-to-v051
      version: v051
      path: tests/idea-narrative-forward-0.9.0-preview.3/one-pass-current/direct-final-current-v17/revision-delta-v003-to-v051.md
      change_type: editorial_repair_delta

output_lineage:
  instruction: >-
    v051 和 delta 均绑定 active_plugin_version 0.9.0-preview.3，并用上述逻辑 ID、版本和路径
    记录 source dossier、writer brief 与 protected register。不得沿用 v003 的旧 plugin version，
    不得复制 v003 based_on 中的旧完整性值，也不得生成新的 SHA、内容哈希或摘要值。
  dossier_change_type: editorial_repair
  delta_change_type: editorial_repair_delta

execution_and_handoff:
  single_complete_target_dossier: true
  partial_artifacts_forbidden: true
  delta_after_dossier_freeze_only: true
  same_writer_requirement: >-
    同一个 writer 实例在同一个完整 v051 文件上依次完成全部 section passes、全篇扫描和修复；
    不得把章节分给不同 writer，不得持久化章节片段。
  section_passes:
    - "Pass 1：同一 writer 修订 reader core，即第 1–4 节；只编辑完整 v051 目标文件。"
    - "Pass 2：同一 writer 修订研究计划和技术权威，即第 5–11 节；只编辑同一完整 v051。"
    - "Pass 3：同一 writer 修订定位、主张审计及唯一完整限制/假设/风险权威，即第 12–14 节。"
    - "Pass 4：同一 writer 核对 References，并对完整 dossier 执行术语、科学角色、数值、时间、引用和章节功能一致性扫描。"
  freeze_sequence:
    - 完成四个 bounded passes 后保存一个完整 v051。
    - 对完整 v051 执行 mandatory_whole_dossier_checks 和确定性 linter。
    - 修复 linter 或扫描发现的未执行动作，并重新运行完整扫描与 linter。
    - 只有全部检查通过后冻结 v051；冻结前不得创建或定稿 delta。
    - 冻结后创建并定稿 delta；若此后 v051 有任何编辑，作废 delta，重新扫描、lint、冻结并重写 delta。
  delta_requirements:
    - "为全部十四个 included repair item ID 各写一行：精确 revised locator、实际 operation 及可从 v051 文本核对的 acceptance-test 结果。"
    - "为 PCR-001 至 PCR-012 各写一行：精确 revised locator(s) 及 register 每个枚举要素在 v051 中的逐项保存证据；不得用标题、主题或完成声明代替正文证据。"
    - "加入紧凑的读者称名 concordance：只覆盖中央研究对象、主要问题/任务、主要结果、贡献，以及本 brief 实际修订的核心科学角色；记录一个读者称名、首次使用 locator、竞争形式处置和全篇扫描结果。不得扩展成术语清单。"
    - "对 bounded comparison 产生的每个 advisory short-form-diff candidate 记录其 revised locator、是否采用及文本理由；未采用者说明原因；若没有候选则明确记录 none。该候选处置不能替代十四项动作或十二项 PCR 映射。"
    - "记录完整 dossier 的术语/角色扫描、确定性 linter 通过和同一 writer 完成四个 section passes；不得复制评估说明、长段 source text 或 protected_content。"
    - "delta 保持紧凑；不得持久化 SHA、内容哈希、摘要值、时间戳替代证明或新的科学规则。"
  handoff_blockers:
    - 任一 included repair item 缺少 text-grounded delta 映射
    - 任一 PCR ID 缺少逐项保存证据或 identity_anchor 不逐字一致
    - 任一 critical/major 语言动作在全篇仍有竞争称名、错误修饰或未定义首次使用
    - 第 14 节不是唯一完整限制、假设和风险权威，或其他位置出现指向第 14 节的提示
    - linter 未通过、v051 未冻结、delta 在冻结前完成，或冻结后又编辑 v051
    - 修订需要未授权科学选择而 writer 未停止

linter_pass:
  mode: deterministic_complete_dossier
  instruction: >-
    在 delta 之前对完整 v051 运行适用的确定性 dossier linter；不得为运行 linter 打开额外
    项目产物。若运行环境没有单独命令，则按下列 deterministic_checks 对输出文本完成同等
    结构检查，并在 delta 记录每项通过结果。
  deterministic_checks:
    - frontmatter 可解析，artifact_id/version/plugin_version/change_type/identity_status 与本 brief 一致
    - 十五个规定 H2 均存在且各出现一次，Background 下五个规定 H3 按指定顺序存在
    - Markdown 表格列数一致，References 编号与正文引用保持可解析且原证据不丢失
    - One-sentence complete-Idea summary 恰为一个句子，五条 Evidence chains 只有四个规定字段
    - 禁止的竞争称名和内部隐喻扫描完成，保留的 R0/R1 均先有直接定义
    - v051 或 delta 不含新持久化的 SHA、内容哈希或摘要值
  acceptance: >-
    所有 deterministic_checks 通过；任一失败必须先修复完整 v051，再重新进行全篇扫描和
    linter，之后才能冻结 dossier 并创建 delta。

mandatory_whole_dossier_checks:
  not_new_findings: true
  checks:
    - check: identity-anchor-verbatim
      instruction: >-
        比较 v051 frontmatter identity_anchor 的五个键值与 identity_anchor_verbatim.exact_values，
        并核对正文主要研究问题、对象和推断单位未发生身份漂移。
      acceptance: >-
        五个值逐字符一致，identity_status 为 preserved，正文仍是同一脓毒症全病程候选动态
        系统研究而非普通预测或泛 ICU 风险分层。
    - check: section-function-and-authority
      instruction: >-
        核对十五个 H2 的原定功能、第 3 节五个 H3 的顺序、第 7 节技术权威、第 11 节结果
        证伪/解释权威及第 14 节完整限制/假设/风险权威。
      acceptance: >-
        每项内容位于其唯一权威位置；其他单元只保留自身功能所需的最小自足内容，无跳转提示，
        无完整技术树、解释树或限制清单的重复。
    - check: stage-iii-branch-logic
      instruction: >-
        全篇核对阶段 III 共享前提、观测映射分支、独立 SOFA 分支和核心语义不足停止的逻辑；
        特别检查共同锚点和忠实度条件只属于映射分支。
      acceptance: >-
        完整逻辑只在第 7 节一次出现，两个试验分开且不合并，一个分支的资格未被写成整个
        阶段 III 的共享前提，阶段 III 仍不能补足阶段 II 失败。
    - check: reader-entry-progressive-disclosure
      instruction: >-
        检查标题、One-sentence 字段、定位和 Structured abstract 的顺序、负荷及阶段 III 粒度。
      acceptance: >-
        读者可一次复述问题、24 个月目标、价值和总体设计；标题/摘要不含试验名、访视日、
        技术摘要量、资格清单或分支标签，Structured abstract 的阶段 III 高层用途合计一次。
    - check: scientific-role-concordance
      instruction: >-
        对完整 dossier 扫描中央研究对象、主要问题/任务、主要结果、贡献，以及本 brief 修订的
        RCT 次要分析、P_state、P_obs、有序访视结局、独立 SOFA 端点、可恢复不变量、四种
        外部更新操作、负向结果和实际停止动作；核对首次使用、修饰关系和全部回指。
      acceptance: >-
        每个角色只有一个源动作授权的读者称名，首次必要说明位于允许的信息层级，竞争形式
        已删除或按不同科学角色重分类；扫描结果可在 delta 紧凑记录而不形成术语清单。
    - check: local-scientific-expression
      instruction: >-
        扫描“门、硬门、防火墙、封印、泄漏清零、打开 test、救回、挽救”和无对象的“降级、
        失败图、弃权”，并逐处核对替换后的对象、标准、动作和后果。
      acceptance: >-
        无内部项目或软件隐喻承担科学含义；每个判定和负向产物均直接说明实际对象、标准、
        替代/停止动作及允许主张，原科学条件全部保留。
    - check: limitation-and-boundary-preservation
      instruction: >-
        按 PCR-010、PCR-011、PCR-012 逐项核对第 7、11、14 节及必要局部边界，检查近乎逐字
        重复、完整禁止清单位置和所有独特限制。
      acceptance: >-
        第 14 节是唯一完整限制/假设/风险权威且不含末尾复述；第 7/11 节各保留自己的技术或
        结果功能；所有独特边界存在，无完整清单在其他位置重复，也无指向第 14 节的提示。
    - check: quantitative-temporal-and-status-concordance
      instruction: >-
        全篇核对 PCR-004 至 PCR-009 的数据库/结果状态、日期、样本数、访视、阈值、百分比、
        排序、分析集、更新范围、失败后果和 planned/not-generated 表达。
      acceptance: >-
        所有数值和时间规则与 v003/PCR 一致；未核验或未生成内容未被写成已具备，有限适配、
        试验分支和贡献强度均未被加强。
    - check: evidence-chain-and-implementation-function
      instruction: >-
        核对第 8 节每项是否新增可复现输入—计算—输出—核查关系，并核对五条 evidence chains
        的四字段结构和各自证据功能。
      acceptance: >-
        第 8 节不再以工具隐喻复述方法且不重复完整分支；五条链均只有 Input、Method /
        analysis / processing、Output、Supports，原四项科学关系完整。
    - check: protected-content-completeness
      instruction: >-
        对 PCR-001 至 PCR-012 逐个重开所有 source_locator 和 revised locator，比较 register 的
        每个枚举要素与 v051 实际文字，而不是依赖标题或 delta 声明。
      acceptance: >-
        十二项全部有 item-level 文本证据；任何无法保留的承诺都被识别为科学变化并停止
        editorial repair，不以措辞压缩、章节主题或完成声明掩盖缺失。
    - check: output-freeze-and-delta-order
      instruction: >-
        确认四个 same-writer section passes、完整术语/角色扫描和 linter 均在 v051 freeze 之前
        完成，delta 只在 freeze 之后创建或定稿。
      acceptance: >-
        v051 冻结后没有后续编辑；delta 包含十四项 repair、十二项 PCR、紧凑角色一致性和
        advisory short-form-diff candidate disposition，且没有 SHA、内容哈希或摘要值。
