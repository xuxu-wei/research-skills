included_nonblocking_finding_rationale:
  NAR-005: >-
    本次集中修订需要把第 8 节改造成可复查的科学实现说明；与 major 动作共同执行可避免
    方法移动后留下重复或内部工具化表达。
  LAR-105-07: >-
    负向产物和停止动作遍布摘要、方法、证据链与产物，若不在本次全篇扫描中统一其对象
    和后果，会继续妨碍跨学科读者识别交付物。
  LAR-105-09: >-
    该去重动作与第 14 节权威集中和证据链字段删除直接重合，纳入同一次修订才能保留所有
    不同边界而删除近乎逐字重复。

repair_ownership:
  narrative:
    owns:
      - 章节和字段的功能
      - 论证顺序与渐进披露
      - 技术内容的权威位置
      - 重复内容的移动、合并和删除
  language:
    owns:
      - 科学角色的读者称名
      - 修饰语附着关系
      - 首次必要说明与后续回指
      - 全篇称名一致性与局部学术表达
  preservation:
    owns:
      - identity_anchor 逐字保持
      - PCR-001 至 PCR-012 中每个科学承诺、状态、数值、时间规则、分支资格和主张边界
  combined_rule: >-
    先按叙事动作确定每项内容是否属于当前单元及其位置，再在该位置执行语言动作；任何
    移动或压缩均须以 protected register 的实际 source_locator 内容逐项核对，而非只看摘要。

