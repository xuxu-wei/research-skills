normalized_repair_actions:
  - repair_item_id: NRP-001
    source_item_ids:
      - NRP-001
      - NAR-001
    addresses_finding_ids:
      - NAR-001
    locator: "Background, current state, gap, significance, and rationale：现有五段正文"
    operation: split
    problem: >-
      Background、Current state、Gap、Significance 和 Rationale 混在连续段落中；gap 被
      相邻工作组合差异替代，significance 未说明解决问题会改变什么，设计理由被技术条件
      和阶段 III 限制分散。
    target: >-
      保留原 H2，在其下依次建立 Background、Current state、Gap、Significance 和
      Rationale 五个 H3。每个 H3 完成唯一且可独立概括的论证功能，并形成从科学问题到
      现有证据、未解证据问题、读者相关价值及阶段 I–II 设计理由的连续链。
    required_function_or_term: >-
      Gap 必须命名现有证据尚不能回答的全病程和跨数据库证据问题；Significance 必须说明
      对重症研究设计、跨数据库解释和后续干预研究判断的后果；Rationale 用高层科学关系
      连接双时钟、状态—治疗—测量分离、模拟恢复和跨数据库检验，不展开计算细节。
    content_to_preserve:
      protected_ids:
        - PCR-001
        - PCR-002
        - PCR-003
        - PCR-004
        - PCR-005
        - PCR-009
        - PCR-010
        - PCR-011
        - PCR-012
      source_science:
        - Sepsis-3 标签与信息可用时刻并不唯一的事实及引文
        - 公共 ICU 数据库异质性、既有研究范围和观察性偏倚事实及引文
        - 观察政策下预测或生成表示的边界和低支持时停止过度解释
        - 稀疏试验资料只能支持后续且有前置条件的次要分析
        - 研究对象、阶段 I–II 目标与后续阶段 III 之间的科学关系
    delete_move_disposition: >-
      将“没有完全相同组合”的详细定位比较移到第 12 节；把阶段 III 资格、映射、替代分析
      和监管限制的技术细节移到第 7 节；恢复阈值和失配处置只留在第 7 节。背景仅保留一句
      说明后续试验分析不能替代阶段 I–II 证据，不保留限制清单或跳转提示。
    destination:
      - "Research design and methods 中相应技术小节"
      - "Contribution, innovation, impact, application, and closest-work comparison"
    dependencies: []
    acceptance_test: >-
      原 H2 名称不变并按规定顺序包含五个 H3；每个 H3 可独立用一句话概括。Gap 不是
      “尚无相同组合”的改写，Significance 明确给出对目标读者的科学后果，Rationale 完成
      gap-to-design 连接且不含计算阈值；阶段 III 在本节只剩一项高层、必要且自足的关系说明。

  - repair_item_id: NRP-002
    source_item_ids:
      - NRP-002
      - NAR-002
      - NAR-003
    addresses_finding_ids:
      - NAR-002
      - NAR-003
    locator: "Title, summary, audience, and positioning：Title、One-sentence complete-Idea summary 及 Structured abstract"
    operation: replace
    problem: >-
      标题和一句话摘要把 24 个月主要研究与后续试验分析并列，并在正向目标之前枚举资格、
      计算、失败分支和禁止主张；Structured abstract 继续提前使用未解释的跨学科概念。
    target: >-
      标题首先标识脓毒症全病程候选动态系统表征及阶段 I–II 的计划跨数据库检验。读者入口
      按“问题—24 个月目标—价值—总体设计—从属的高层阶段 III 用途”渐进披露；
      One-sentence 字段保持一个句子和三个清楚分句，Structured abstract 全部字段合计只
      用一次高层阶段 III 用途，不展开试验或分支细节。
    required_function_or_term: >-
      用跨学科读者可直接理解的语言说明四段病程、两项主要临床任务、模拟恢复和两库检验
      的关系。标题和摘要对阶段 III 只说明“主体研究达到标准后，条件性开展分试验次要分析”；
      不写试验名、访视日、摘要量、资格清单或分支标签。所需技术概念在第 7 节首次允许的
      技术位置给出完整定义。
    content_to_preserve:
      protected_ids:
        - PCR-001
        - PCR-002
        - PCR-003
        - PCR-004
        - PCR-005
        - PCR-009
        - PCR-011
        - PCR-012
      source_science:
        - 发病前、首次发病、发病后和结局连续体
        - 知识约束和不确定性感知的候选表征
        - 阶段 I–II 在 24 个月内完成并接受两个公共 ICU 数据库检验
        - 数据访问与可观测性尚须审计且结果尚未生成
        - 预测或观察性表示不等于因果
        - 主体研究达标后才开展分试验的后续次要分析
    delete_move_disposition: >-
      删除标题中把阶段 III 与主体并列的细节；替换一句话摘要中的完整资格—计算—失败枚举；
      将恢复算法、四种外部更新、试验名/访视、P_state/P_obs、两种端点及完整禁止主张清单
      移到其第 7 节或第 14 节权威位置。不得把这些技术细节作为语言“首次定义”重新塞回入口。
    destination:
      - "Research design and methods > Absolute simulation and semi-synthetic recovery gate"
      - "Research design and methods > Hospital-primary genuine cross-database validation"
      - "Research design and methods > Conditional trial-observation projection and independent fallback"
      - "Feasibility, resources, risks, alternatives, and stop conditions"
    dependencies:
      - NRP-003
    acceptance_test: >-
      目标读者只读标题、摘要和定位即可复述问题、24 个月主体目标、价值和总体设计；保留概念
      均可直接理解。标题不把阶段 III 列为并列贡献；One-sentence 字段恰为一个句子且有主体、
      高层条件性延伸和共同解释边界三个分句，但不含试验名、访视日、技术分支标签、公式、
      更新层级清单或完整禁止主张串；Structured abstract 中高层阶段 III 用途合计只出现一次。

  - repair_item_id: NRP-003
    source_item_ids:
      - NRP-003
      - NAR-003
    addresses_finding_ids:
      - NAR-003
    locator: "Research design and methods > Conditional trial-observation projection and independent fallback"
    operation: consolidate
    problem: >-
      阶段 III 的资格、共同生理锚点、投影计算、忠实度、死亡/出院排序、缺失处理、替代分析
      和解释范围在多处重复，使后续次要分析获得与阶段 I–II 相近的叙事重量，并混淆共享
      前提与分支专属条件。
    target: >-
      在本方法小节连续且只完整说明一次阶段 III 科学流程。先列共享前提，再平行列出观测
      映射成立的分支、观测映射不成立但独立分析条件成立的分支，以及核心语义不足时停止；
      其余章节各自只保留完成问题、目标、时间、数据状态、接口、证据链、核查、产物、证伪、
