      - LAR-105-08
      - LAR-105-09
    disposition: >-
      NRP-002 决定入口只先说明问题、24 个月阶段 I–II 目标、价值、总体设计和一项从属的
      高层阶段 III 用途。标题和摘要不写试验名、访视日、摘要量、共享资格清单、技术分支
      标签、公式或四种更新操作。语言动作在入口改用可直接理解的普通科学描述；P_state、
      P_obs、有序访视结局、独立 SOFA 端点、可恢复不变量和四种外部更新的完整定义分别在
      第 7 节首次允许技术展开处给出。One-sentence 字段仍为一句并有三个清楚分句，但第二
      分句只作高层条件性说明，不把已移出的分支细节塞回入口。
  - finding_ids:
      - NRP-001
      - NRP-003
      - NRP-004
      - LAR-105-01
      - LAR-105-06
      - LAR-105-09
    disposition: >-
      NRP-001 保留五个 H3 的论证功能。背景只用一句说明后续试验数据不能替代阶段 I–II
      证据，不展开资格、映射或限制清单；完整方法移到第 7 节，完整限制、假设与风险只在
      第 14 节。保留的局部句子采用直接科学语言，不使用“门、层、降级”等内部表达，也
      不通过“见后文”或“见第 14 节”完成其功能。
  - finding_ids:
      - NRP-003
      - NRP-004
      - LAR-105-01
      - LAR-105-02
      - LAR-105-03
      - LAR-105-06
      - LAR-105-09
    disposition: >-
      第 7 节相应小节是阶段 III 资格、映射、比较、缺失处理、互斥分支和停止规则的唯一
      连续技术权威。先写阶段 II 成功、试验个体数据和核心语义等共享前提，再并列“观测
      映射成立时的有序访视结局分析”与“观测映射不成立但独立分析条件成立时的 SOFA
      有序临床状态端点”；共同锚点数量和投影忠实度只属于前一分支，不得升格为整个阶段
      III 的共同前提。其他章节由 NRP-003 规定最小功能提及，语言动作只修正其称名。
  - finding_ids:
      - NRP-003
      - NRP-004
      - LAR-105-06
      - LAR-105-09
    disposition: >-
      第 11 节只保留结果证伪标准和结果依赖解释；第 14 节一次性完整保留限制、工作假设、
      风险、非方法型触发—响应—后果和禁止主张，不复制第 7 节的完整分析树或第 11 节的
      完整解释矩阵。其他单元的必要边界必须短而自足，且全篇不得加入指向第 14 节的提示。
  - finding_ids:
      - NRP-003
      - NRP-004
      - NRP-005
      - LAR-105-04
      - LAR-105-05
      - LAR-105-06
      - LAR-105-07
      - LAR-105-09
    disposition: >-
      第 7 节保留科学方法及判定标准，第 8 节只记录可复现输入、计算关系、输出和核查用途，
      第 9 节只保留每条证据链的 Input、Method / analysis / processing、Output 和 Supports，
      第 14 节保留完整限制与风险后果。四种外部操作和负向结果均按实际科学角色直接命名；
      不以新的通用短称代替不同动作，也不因去重删除数值标准或失败后果。
  - finding_ids:
