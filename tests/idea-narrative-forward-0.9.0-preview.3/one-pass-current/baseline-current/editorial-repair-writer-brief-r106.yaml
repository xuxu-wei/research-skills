writer_scope:
  repair_type: editorial_only
  governing_instructions:
    - >-
      只执行本 brief 中的十四项 normalized_repair_actions；评估报告和原修订计划仅为
      审计来源，不是 writer 输入，也不得重新打开。
    - >-
      叙事动作决定章节功能、顺序、信息层级、保留位置以及移动或删除；语言动作决定
      科学角色的读者称名、修饰关系、首次必要说明、全篇一致性和局部表达。
    - >-
      不得为了满足语言动作而把叙事动作已经移出读者入口的技术细节放回标题或摘要。
      读者入口使用可直接理解的高层描述；完整定义放在首次允许技术展开的位置。
    - >-
      第 14 节是完整限制、工作假设和风险的唯一权威位置。其他位置只有在删除会扭曲
      紧邻科学推理或主张时才保留最小且自足的边界；不得用“见第 14 节”等指针代替正文。
    - >-
      第 7 节保留设计资格、分析定义和互斥分支的完整技术说明；第 11 节保留结果证伪
      和结果依赖解释；第 14 节不得再次展开这两类完整决策树。
    - >-
      不建立术语清单，不创造新的压缩标签或缩写，不增加源动作之外的病例规则、阈值、
      分支或科学限制。R0、R1 仅可在其科学含义已直接说明后保留。
    - >-
      两个输出只用逻辑 ID、版本和路径建立血缘；不得计算、请求、报告或持久化 SHA、
      内容哈希或摘要值。
  clarification_stop: >-
    若执行任一动作需要在两个科学定义、参数、估计目标、数据状态或解释边界之间作出
    brief 与 protected register 未授权的选择，则保持 v003 科学内容不变，记录需要确认的
    具体 locator 与选择，停止修订，不得猜测或把缺失答案改写成新假设。

identity_anchor_verbatim:
  instruction: >-
    将 v003 frontmatter 的 identity_anchor 键和值逐字复制到 v051；键顺序可保持原顺序，
    任何值均不得翻译、改写、缩写或重新标点。
  exact_values:
    primary_research_question: "can a knowledge-constrained, uncertainty-aware dynamic system representation of ICU patients cover the sepsis-centered pre-onset, onset, post-onset, and outcome continuum, demonstrate cross-database state/structure validity, and then test limited randomized intervention perturbations without conflating prediction with causality?"
    primary_objective: "construct and validate the sepsis complex-system model, with stage II completed within 24 months."
    study_object: "the longitudinal sepsis-centered ICU patient system, including comparable at-risk non-onset intervals and post-onset trajectories."
    core_data_or_evidence_base: "literature/expert priors; longitudinal public ICU data; conditionally available EXIT-SEP and XBJ-SCAP individual-level RCT data."
    primary_unit_of_inference: "patient-time state and state transition, with patient and hospital clustering respected."
  acceptance: >-
    v051 的 identity_anchor 映射与上述五个键值逐字符一致，identity_status 仍为 preserved；
    任何差异均停止 editorial repair。

