    locator: "H1/Title；第 3 节；Conditional trial-observation projection；所有‘条件性稀疏 RCT’形式"
    operation: replace
    problem: 原短语使“稀疏”误修饰随机试验，“条件性”与是否开展分析关系不清；示例标题又会抬高后续阶段。
    target: 标题完全不提后续阶段；摘要从属说明与方法用“条件满足后，次要分析含稀疏访视数据的随机对照试验”或等义直接形式。
    required_function_or_term: “条件满足”只修饰是否开展分析，“稀疏”只修饰访视数据；共享前提不混入仅控制观测映射分支的条件。
    content_to_preserve:
      protected_ids: [PCR-005, PCR-009, PCR-011]
    delete_move_disposition: 标题删除后续阶段；删除含混压缩词，摘要仅留用途说明，完整条件、访视定义和分支移第 7 节。
    destination: [One-sentence summary 从属说明, 第 7 节方法]
    dependencies: [NRP-003]
    acceptance_test: H1 与 Title 仅写阶段 I–II；所有保留表述中“条件满足”只控制是否分析、“稀疏”只修饰访视数据，且不暗示完成验证、稀疏随机化或试验合并。

mandatory_whole_dossier_checks:
  not_new_findings: true
  checks:
    - check: core_term_first_use_and_role_uniqueness
      instruction: 临时列出核心术语及全篇出现；首次直述定义，一个短词只承担一个科学角色。
      acceptance: 每个术语有稳定名称、首次定义、竞争形式处置和全出现扫描结果。
    - check: trigger_object_consequence
      instruction: 普通动作词若混合诊断结果、决定、对象状态或记录，改写为明确 trigger-object-consequence。
      acceptance: 无动作词跨角色混用，每处触发、对象、判定/动作和后果可直接解析。
    - check: cross_disciplinary_first_statement
      instruction: 跨学科短词首次影响理解或决策时先直述科学对象与功能，不发明新压缩标签。
      acceptance: 目标读者无需项目词汇表即可识别保留短词的对象和功能。
    - check: no_internal_workflow_or_version_prose
      instruction: reader prose 删除 workflow、review、repair、preflight、版本和修订历史，改写为当前科学或证据状态。
      acceptance: 内部流程和版本词仅存在于 delta 或元数据，不进入 dossier 正文。
    - check: limitations_authority
      instruction: 临时扫描每个限制家族；第 14 节完整列一次，其他仅留不可缺的紧邻边界并删除所有指针。
      acceptance: 每个限制家族唯一完整位置为第 14 节；其他边界均有不可替代的紧邻功能且无指针。
    - check: lint_and_concordance
      instruction: 冻结前运行确定性 lint，并对对象、问题/任务、主要结局、贡献和控制设计/解释的其他核心角色做全篇 concordance。
      acceptance: lint 无错误或未处置 advisory；各角色名称唯一、首次定义在首次使用前、竞争形式已处置，规定结构完整。

execution_and_handoff:
  section_passes: [sections 1-4, sections 5-11, sections 12-14, references and whole-dossier concordance]
  single_complete_target_dossier: true
  partial_artifacts_forbidden: true
  delta_after_dossier_freeze_only: true
  delta_requirements:
    - 每个 included_repair_item_id 映射到修订 locator、operation 和正文 acceptance evidence
    - 每个 protected_id 映射到修订 locator 和逐项保护证据
    - 记录核心角色 concordance，不复制长报告、protected content 或 dossier 正文
  failure_routes:
    scientific_change_needed: scientific_change_declared
    identity_drift_detected: new_idea_required
    missing_scientific_confirmation: clarification_required
    incomplete_mapping: block_preservation_handoff
