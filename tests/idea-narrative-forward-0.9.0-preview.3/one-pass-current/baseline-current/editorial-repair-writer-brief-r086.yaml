global_rules:
  - H1 与 Title 一致，只写阶段 I–II 的脓毒症全病程候选动态系统表征及计划跨数据库检验；不得把条件性后续阶段重新抬入标题。
  - One-sentence complete-Idea summary 严格保持一句，依次写研究对象或问题、24 个月阶段 I–II 目标、总体检验、贡献及条件性后续用途；后续阶段只作从属用途说明。
  - 后续阶段完整共享前提、互斥分支、端点、比较、缺失、停止和解释逻辑只在第 7 节相应方法权威小节出现一次。
  - 第 14 节是完整限制、工作假设、禁止主张和非方法型风险的唯一权威位置；其他位置仅保留推进紧邻推理不可缺少的最小自足边界，不得添加第 14 节指针。
  - 压缩、删除或移动前，打开 register 中每个 source_locator 并逐项保留科学承诺；register 摘要不能替代源段落。

overlap_dispositions:
  - finding_ids: [NRP-002, NRP-003, NRP-004, LANG-R085-003, LANG-R085-004, LANG-R085-006]
    disposition: >-
      Narrative 动作控制修辞功能和位置，language 动作控制保留文字。标题删去阶段 III；一句话摘要仅保留从属用途说明；完整资格、分支、临床排序和稀疏访视修饰关系移至方法。LANG-R085-006 的示例标题不采用。
  - finding_ids: [NRP-001, NRP-004, LANG-R085-005]
    disposition: >-
      第 3 节保留五个 H3 和 gap-to-design 链，用直接科学措辞替代隐喻；完整限制归第 14 节，本节只留必要的紧邻边界。
  - finding_ids: [NRP-003, NRP-004, LANG-R085-001, LANG-R085-002, LANG-R085-003, LANG-R085-005]
    disposition: >-
      数据与方法权威位置保留审计、冻结、外部检验、后续分支和失败后果；统一 G1、零更新外部检验与独立次要临床状态术语。第 14 节只列完整限制，不复制方法树。
  - finding_ids: [NRP-005, LANG-R085-005]
    disposition: >-
      第 10 节只写输入、计算关系、输出、复查用途与依赖，用明确科学对象和后果替换工具或项目隐喻，不复制第 7 节理由。
all_overlaps_resolved: true

normalized_repair_actions:
  - repair_item_id: NRP-001
    source_item_ids: [NRP-001, NAR-001]
    addresses_finding_ids: [NAR-001]
    locator: "Background, current state, gap, significance, and rationale；五段正文"
    operation: split
    problem: 背景、现状、差距、意义和理由混写；差距被写成组合差异，方法条件与限制分散正向论证。
    target: 原 H2 下依次建立五个非空 H3：Background、Current state、Gap、Significance、Rationale，各自只承担规定功能。
    required_function_or_term: Gap 明确全病程与跨数据库证据问题；Significance 写科学后果；Rationale 以双时钟、状态—治疗—测量区分、恢复和跨库检验连接 gap 与阶段 I–II，不展开计算。
    content_to_preserve:
      protected_ids: [PCR-001, PCR-009, PCR-012]
    delete_move_disposition: 删除无紧邻功能的限制与内部隐喻；相邻工作比较移第 12 节，计算条件移第 7 节，完整限制移第 14 节。
    destination: [第 7 节方法, 第 12 节 closest-work comparison, 第 14 节]
    dependencies: [NRP-004, LANG-R085-005]
    acceptance_test: 五个规定 H3 均非空并可各用一句概括；Gap 非组合差异改写，Significance 有科学后果，Rationale 完成 gap-to-design；无完整限制清单或第 14 节指针。

  - repair_item_id: NRP-002
    source_item_ids: [NRP-002, NAR-002, NAR-003]
    addresses_finding_ids: [NAR-002, NAR-003]
    locator: "Title, summary, audience, and positioning > Title 与 One-sentence complete-Idea summary"
    operation: replace
    problem: 标题和一句话摘要把阶段 I–II 与条件性后续试验并列，并堆叠资格、计算、替代和禁止主张。
    target: 标题只写阶段 I–II 核心；一句话摘要按对象/问题—24 个月目标—总体检验—贡献—条件性后续用途展开，阶段 III 仅作从属说明。
    required_function_or_term: 一次阅读可理解研究对象、两项主要任务、恢复与跨库检验关系；跨学科概念首次影响理解时直述。One-sentence 字段保持一句。
    content_to_preserve:
      protected_ids: [PCR-001, PCR-002, PCR-009, PCR-011, PCR-012]
    delete_move_disposition: 标题删除阶段 III；摘要删除资格清单、计算、试验名/访视、分支树及成组禁止主张，方法内容移第 7 节，完整限制移第 14 节。
    destination: [第 7 节后续阶段方法权威小节, 第 14 节]
    dependencies: [NRP-003, NRP-004, LANG-R085-003, LANG-R085-004, LANG-R085-006]
    acceptance_test: H1 与 Title 一致且仅写阶段 I–II；One-sentence 恰为一句、主干先于条件、四个信息块可直接辨认；无完整阶段 III 逻辑、限制清单或第 14 节指针。

  - repair_item_id: NRP-003
    source_item_ids: [NRP-003, NAR-003]
    addresses_finding_ids: [NAR-003]
    locator: "Research design and methods > Conditional trial-observation projection and independent fallback"
    operation: consolidate
    problem: 后续阶段资格、锚点、投影、排序、缺失、替代和停止逻辑散布多节，使其与主要阶段并列并重复。
    target: 本小节先写共享前提，再并列观测映射分支与独立临床状态分支，最后写语义不足时停止；其他章节只留自身功能的最小陈述。
    required_function_or_term: 完整说明阶段 II、数据与试验语义前提，EXIT-SEP D7/XBJ-SCAP D8 分析，共同锚点、固定投影、忠实度、随机比较、死亡/出院/缺失、独立分析、停止和解释边界。
    content_to_preserve:
