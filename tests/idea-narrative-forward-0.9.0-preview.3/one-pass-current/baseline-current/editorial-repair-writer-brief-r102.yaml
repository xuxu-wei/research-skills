  LANG-R101-02: "Included because inconsistent validation and update names affect the primary evidence path."
  LANG-R101-03: "Included because project labels control scientific criteria and negative-result outputs."
  LANG-R101-04: "Included as a bounded replacement of reader-facing internal status language."

