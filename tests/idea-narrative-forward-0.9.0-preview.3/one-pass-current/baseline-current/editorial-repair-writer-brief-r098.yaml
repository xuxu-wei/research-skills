overlap_dispositions:
  - finding_ids: [NRP-001, NRP-002, NRP-003, NRP-004, NRP-005, ALA-R097-001, ALA-R097-002, ALA-R097-003, ALA-R097-004, ALA-R097-005, ALA-R097-006, ALA-R097-007, ALA-R097-008, ALA-R097-009]
    disposition: >-
      Narrative actions govern section function and placement; language actions
      govern terminology, first-use explanation, modifier attachment, and local
      expression within that placement. Keep full stage-III logic only in section 7,
      complete limitations and unsupported claims only in section 14, and
      reproducibility records only in section 8; satisfy both sources without changing science.
unresolved_overlaps: []
all_overlaps_resolved: true

normalized_repair_actions:
  - repair_item_id: NRP-001
    source_item_ids: [NRP-001, NAR-001]
    addresses_finding_ids: [NAR-001]
    locator: "Section 3: Background, current state, gap, significance, and rationale"
    operation: split
    problem: >-
      Five reasoning functions are mixed; the gap is framed mainly as an absent
      combination, significance is implicit, and method/trial detail substitutes for rationale.
    target: >-
      Retain the H2 and create the five contract H3s in order. Gap names the
      unanswered whole-course and cross-database evidence problem; Significance
      states the consequence for the target readers; Rationale connects that
      problem to dual clocks, role separation, recovery, and external validation.
    required_function_or_term: >-
      Each H3 has one distinct function and is understandable without later
      definitions; use the unified core-object and external-validation wording.
    content_to_preserve:
      protected_ids: [PCR-001, PCR-003, PCR-004, PCR-005, PCR-009, PCR-011]
    delete_move_disposition: >-
      Move closest-work positioning to section 12 and computational criteria to
      section 7; keep only one high-level reason that trial data cannot replace stage II.
    destination: ["Section 7", "Section 12"]
    dependencies: []
    acceptance_test: >-
      All five H3s are nonempty and independently summarizable; Gap is not an
      absent-combination claim, Significance names a scientific consequence,
      and Rationale supplies a concise gap-to-design bridge.

  - repair_item_id: NRP-002
    source_item_ids: [NRP-002, NAR-002, NAR-003]
    addresses_finding_ids: [NAR-002, NAR-003]
    locator: "Sections 1-2: H1, Title, one-sentence summary, and structured abstract"
    operation: replace
    problem: >-
      The opening gives a conditional extension and opaque labels equal weight
      with the 24-month study before its positive purpose.
    target: >-
      Lead with the whole-course object, two primary tasks, recovery, independent
      external validation, value, and 24-month stages I-II. Say only that separate
      secondary trial analyses may follow if the main study meets its standards;
      omit trial/visit names, branch labels, eligibility, quantities, and alternatives.
    required_function_or_term: >-
      Keep one summary sentence and H1/Title equality. State the future aim of
      high-level papers and auditable evidence without implying achieved prestige.
    content_to_preserve:
      protected_ids: [PCR-001, PCR-002, PCR-003, PCR-006, PCR-007, PCR-009, PCR-011]
    delete_move_disposition: >-
      Move trial eligibility, calculations, alternatives, and detailed boundaries
      to section 7; do not duplicate moved text.
    destination: "Section 7 > Conditional trial-observation projection and independent fallback"
    dependencies: [NRP-003]
    acceptance_test: >-
      A target reader can restate problem, 24-month aim, value, and design from
      sections 1-2; the extension is subordinate and no project label is undefined.

  - repair_item_id: NRP-003
    source_item_ids: [NRP-003, NAR-003]
    addresses_finding_ids: [NAR-003]
    locator: "Section 7 > Conditional trial-observation projection and independent fallback"
    operation: consolidate
    problem: >-
      Stage-III eligibility, mapping, comparison, alternative, stopping, and
      interpretation logic is repeated across almost every dossier function.
    target: >-
      Make this subsection the sole authority. State shared prerequisites, then
      mutually exclusive mapping and independent clinical-state routes; stop new
      visit outcomes when core semantics fail. Keep trials separate.
    required_function_or_term: >-
      Preserve R0/R1, anchors, frozen mapping, fidelity, all-randomized/mITT,
      death/discharge/missingness, multiplicity, branch interpretations, and
      stage III's inability to repair stage II.
    content_to_preserve:
      protected_ids: [PCR-005, PCR-006, PCR-007, PCR-008, PCR-010, PCR-011, PCR-012]
    delete_move_disposition: >-
      Delete repeated full branch logic elsewhere; retain only each section's
      permitted minimal function under PCR-011, with no cross-reference substitute.
    destination: "This section-7 subsection only"
    dependencies: []
    acceptance_test: >-
      The full shared eligibility, two branches, stopping route, and permitted
      interpretation occur continuously once here; no branch-specific condition
      is promoted to a shared prerequisite and no other location repeats the tree.

  - repair_item_id: NRP-004
    source_item_ids: [NRP-004, NAR-004]
    addresses_finding_ids: [NAR-004]
    locator: "Section 14 and all repeated caveat, assumption, or unsupported-claim passages"
    operation: consolidate
    problem: >-
      Complete limitation families and failure consequences recur in the opening,
      reasoning, evidence chains, interpretations, contribution, claims, and risks.
    target: >-
      Section 14 is the sole complete authority for resource status, working
      assumptions, limitation families, and all unsupported claim classes. Its
      operational risks state trigger, response, and consequence. Methods alone
      holds design eligibility/alternatives/stopping logic; section 11 alone holds
      falsification and result-dependent interpretations.
    required_function_or_term: >-
      Outside section 14, omit limitations, assumptions, and unsupported-claim
      statements unless one minimal self-contained boundary directly advances
      the adjacent scientific reasoning. Never point or cross-reference readers to section 14.
    content_to_preserve:
      protected_ids: [PCR-004, PCR-005, PCR-006, PCR-007, PCR-008, PCR-009, PCR-010, PCR-011, PCR-012]
    delete_move_disposition: >-
      Delete every Evidence-chain limits field and merge repeated defensive lists;
      do not remove distinct method, analysis, output, claim-audit, or risk functions.
    destination: ["Section 14", "Section 7 for design logic", "Section 11 for falsification and interpretations"]
    dependencies: [NRP-003]
    acceptance_test: >-
      Section 14 contains every complete limitation, assumption, unsupported claim,
      and operational consequence once; other sections contain no repetition or
      section-14 pointer, and every exception demonstrably advances local reasoning.

  - repair_item_id: NRP-005
    source_item_ids: [NRP-005, NAR-005]
    addresses_finding_ids: [NAR-005]
    locator: "Section 8: Key techniques and implementation"
    operation: replace
    problem: >-
      Ten tool/control metaphors largely rename section-7 rules without consistently
      identifying reproducible inputs, computations, outputs, and review records.
    target: >-
      Organize concrete records for event and availability times; variables/units;
      cohorts and exclusive states; model inputs/outputs; simulation scenarios and
      criteria; hospital partitions and exclusions; trial anchors/mapping; uncertainty;
      and negative controls, each with its audit purpose and dependency.
    required_function_or_term: >-
      Use direct scientific functions, not tool metaphors; add reproducibility
      information only and leave scientific rationale and thresholds in Methods.
    content_to_preserve:
      protected_ids: [PCR-004, PCR-005, PCR-006, PCR-007, PCR-008, PCR-011]
    delete_move_disposition: >-
      Replace metaphorical headings and delete threshold/rationale repetitions;
      retain method reasoning at the corresponding section-7 authority.
    destination: "Section 7 for method rationale only"
    dependencies: [NRP-003, NRP-004]
    acceptance_test: >-
      Each item lets a researcher identify fields or constructs, computation,
      output record, and audit purpose; none merely renames section 7 or repeats limitations.

  - repair_item_id: ALA-R097-001
    source_item_ids: [ALA-R097-001]
    addresses_finding_ids: [ALA-R097-001]
    locator: "Whole dossier: core study object and model hierarchy"
    operation: define
    problem: >-
      候选动态系统表征、候选全病程表示、候选状态表示、候选架构、候选系统表征、复杂候选、受限复杂候选、准入复杂候选、自动降级模型和准入模型混淆同一对象及上下位层级。
    target: >-
      首次定义“覆盖脓毒症全病程并联合描述患者状态、治疗行动和测量过程的候选动态系统表征”；明确简单基线与“通过预设恢复判定标准后准入的复杂动态模型”是不同实现，之后每层只用一个名称。
    required_function_or_term: >-
      每个“候选”同句带可识别语义中心；不得另造短称。
    content_to_preserve:
      protected_ids: [PCR-001, PCR-002, PCR-003, PCR-006, PCR-009]
    delete_move_disposition: "逐处替换全部 competing forms，不移动或合并科学层级。"
    destination: null
    dependencies: [NRP-001, NRP-002, NRP-005]
    acceptance_test: >-
      全文扫描上述全部形式：同一角色名称一致，基线/一般表征/复杂模型层级可由首次定义判断，无裸“候选”或新压缩标签。

  - repair_item_id: ALA-R097-002
    source_item_ids: [ALA-R097-002]
    addresses_finding_ids: [ALA-R097-002]
    locator: "Whole dossier: names of the conditional RCT secondary analyses"
    operation: replace
    problem: >-
      “条件性稀疏 RCT 次要再分析”“严格条件化的稀疏 RCT 次要再分析层”“稀疏 RCT 层”及长式分支名使“稀疏”误修饰试验、条件对象不明。
    target: >-
      在允许出现该成分的位置使用“有条件开展的 RCT 稀疏访视数据次要再分析”；首次说明条件只约束是否开展分析，稀疏只修饰访视数据。
    required_function_or_term: >-
      开篇遵守 NRP-002/PCR-011 的高层用途上限；完整条件只在 section 7。
    content_to_preserve:
      protected_ids: [PCR-005, PCR-011]
    delete_move_disposition: "替换全部 competing forms；不新增简称或恢复已移出的分支细节。"
    destination: "Placement follows NRP-002 and NRP-003"
    dependencies: [NRP-002, NRP-003]
    acceptance_test: >-
      全文不再出现“稀疏 RCT”读法；每处修饰关系唯一，且没有新短称。

  - repair_item_id: ALA-R097-003
    source_item_ids: [ALA-R097-003]
    addresses_finding_ids: [ALA-R097-003]
    locator: "Reader-entry and method occurrences of recovery, trial-semantic, and projection criteria"
    operation: define
    problem: >-
      绝对模拟恢复门、绝对恢复/假置信门、试验语义门、冻结观测投影门、投影门及资源/审计/准入/外部门等短标签未说明被判对象、指标与后果。
    target: >-
      首次直接写“模拟中的状态/转移恢复与假结构控制标准”“试验随机化、访视与结局语义核验条件”“冻结映射的外部测量一致性、校准和投影误差标准”；完整定义后才可用 R0/R1。
    required_function_or_term: >-
      每个 reader-entry actor-operation-object-or-target-criterion 角色逐项可辨；广义恢复、检验、评价或验证操作须在同句带模型/映射名称和目标量。
    content_to_preserve:
      protected_ids: [PCR-006, PCR-007, PCR-010, PCR-011]
    delete_move_disposition: "替换全部 competing forms；数值、顺序及失败后果留在原科学权威位置。"
    destination: "Placement follows NRP-002 through NRP-005"
    dependencies: [NRP-002, NRP-003, NRP-005]
    acceptance_test: >-
      从首个 reader-entry 句起逐角色复核：对象、操作、目标量、判据和后果均可就地识别；R0/R1 不先于定义，且无另一未定义“门”或新短称。

  - repair_item_id: ALA-R097-004
    source_item_ids: [ALA-R097-004]
    addresses_finding_ids: [ALA-R097-004]
    locator: "Whole dossier: mapped trial quantities and randomized-comparison outcome"
    operation: split
    problem: >-
      冻结观测投影、观测投影、状态投影、可观测代理、投影可观测状态摘要、投影可观测摘要及投影摘要混合 P_state、P_obs 与最终排序结局。
    target: >-
      分别称“潜在状态的一维投影（P_state）”“由试验实测共同锚点计算的一维观测代理（P_obs）”和“把死亡、P_obs、存活出院按预设顺序组成的访视排序结局”；每个名称只承担一个角色。
    required_function_or_term: >-
      摘要与贡献若保留该分支，只指向最终访视排序结局；不引入额外简称。
    content_to_preserve:
      protected_ids: [PCR-005, PCR-011, PCR-012]
    delete_move_disposition: "逐处拆分全部 competing forms，不改变公式、数据源、顺序或解释边界。"
    destination: "Full definitions in the section-7 trial authority"
    dependencies: [NRP-002, NRP-003]
    acceptance_test: >-
      全文每个投影/代理/摘要均有明确中心；P_state、P_obs、最终结局一一对应，随机化估计目标无歧义且无新短称。

  - repair_item_id: ALA-R097-005
    source_item_ids: [ALA-R097-005]
    addresses_finding_ids: [ALA-R097-005]
    locator: "Whole dossier: independent SOFA-based trial outcome"
    operation: define
    problem: >-
      death-ranked SOFA、独立 SOFA、独立临床状态再分析及两个英语长标签未在首次出现说明三层排序或统一对象。
    target: >-
      首次写“死亡最差、仍住院存活者按 SOFA 由高到低、存活出院最有利的试验特异访视排序结局”；定义后统一称“独立 SOFA 访视排序结局”。
    required_function_or_term: >-
      明确它与阶段 II 表征独立、两试验分开且只作次要再分析。
    content_to_preserve:
      protected_ids: [PCR-005, PCR-011, PCR-012]
    delete_move_disposition: "替换全部 competing forms，不改变排序、分析独立性或数据语义。"
    destination: "Full definition in the section-7 trial authority"
    dependencies: [NRP-002, NRP-003]
    acceptance_test: >-
      首次出现即可还原三层排序；正文、表格、输出和解释只用一个已定义名称，无英语分支标签或新短称。

  - repair_item_id: ALA-R097-006
    source_item_ids: [ALA-R097-006]
    addresses_finding_ids: [ALA-R097-006]
    locator: "Whole dossier: external validation, updating, and transportability"
    operation: split
    problem: >-
      跨数据库检验/验证、真正外部、未触碰/untouched、运输/运输性、适配后运输、zero-update 和 transport updating 混合外部验证、适配更新与可迁移性。
    target: >-
      分别使用“独立外部数据库验证（冻结模型且零更新）”“外部数据库适配后的校准或观测层更新”“模型性能对新医院或数据库的可迁移性”；把最终测试区直接说明为未参与开发、选择、调参或阈值设定。
    required_function_or_term: >-
      每处操作有 actor、冻结/适配状态、对象或目标量和判据；不使用裸“运输”“未触碰”或英语操作标签。
    content_to_preserve:
      protected_ids: [PCR-004, PCR-006, PCR-007, PCR-009, PCR-010]
    delete_move_disposition: "替换全部 competing forms；保留医院优先隔离、零更新优先及有限更新不得替代失败。"
    destination: "Placement follows narrative section functions"
    dependencies: [NRP-001, NRP-002, NRP-003, NRP-005]
    acceptance_test: >-
      全文每处唯一归入冻结模型外部验证、适配后更新或可迁移性判断；所有竞争形式消失且无新简称。

  - repair_item_id: ALA-R097-007
    source_item_ids: [ALA-R097-007]
    addresses_finding_ids: [ALA-R097-007]
    locator: "Whole dossier: every eligibility, failure, negative-result, stopping, and interpretation consequence"
    operation: replace
    problem: >-
      降级、自动降级、fallback、stop、no-go 和弃权同时表示改网格、删边、改模型/人群、转独立端点、缩小主张或停止端点，省略受影响对象与后果。
    target: >-
      每句直接写触发者采取的科学操作、对象/目标量、判据、保留产物和不可再支持的主张，例如改用 24 小时网格、删除指定边、仅保留多状态/线性模型、改用 FAS/mITT、转入独立 SOFA 访视排序结局、仅报告数据库层结果或停止指定新端点。
    required_function_or_term: >-
      完成全部 reader-entry actor-operation-object-or-target-criterion role pass；广义操作 finding 不得遗漏同句模型名称或目标量。每个失败或阴性结果产物直接说明呈现对象、判据和后果，不留压缩标签。
    content_to_preserve:
      protected_ids: [PCR-004, PCR-005, PCR-006, PCR-007, PCR-008, PCR-009, PCR-010, PCR-011, PCR-012]
    delete_move_disposition: "替换全部 competing forms；不改变触发条件、顺序、最低产物、分支或主张强度。"
    destination: "Placement follows NRP-003 and NRP-004 authorities"
    dependencies: [NRP-002, NRP-003, NRP-004, NRP-005]
    acceptance_test: >-
      逐查所有条件/后果句和失败产物：句面给出 actor、operation、object/target、criterion、presented object 和 scientific consequence；无孤立降级/fallback/stop/no-go/弃权或新短称。

  - repair_item_id: ALA-R097-008
    source_item_ids: [ALA-R097-008]
    addresses_finding_ids: [ALA-R097-008]
    locator: "Reader-facing prose and free-form table cells only"
    operation: replace
    problem: >-
      data-access no-go、not generated、project-local derivative、stable/database-specific/abstained、projection-pass、editorial_repositioning、scientific_discovery、identity_status、preserved 和 new_idea_required 暴露内部或混合语言状态。
    target: >-
      使用自然中文说明访问未满足、结果尚未生成、项目内衍生材料、稳定/数据库特异/不予解释、仅映射判定通过、编辑定位、科学发现主张、身份保持不变及需要另立研究问题。
    required_function_or_term: >-
      不修改机器 frontmatter、合同固定标题、字段标签、公式符号或 Claim-Support 表头。
    content_to_preserve:
      protected_ids: [PCR-004, PCR-009, PCR-010, PCR-011, PCR-012]
    delete_move_disposition: "仅逐处替换 reader-facing competing forms，不改变状态语义或脚手架。"
    destination: null
    dependencies: [NRP-004, NRP-005]
    acceptance_test: >-
      普通正文和自由表格不再出现所列状态词，中文可直接说明状态/后果；机器元数据和固定脚手架逐字保持。

  - repair_item_id: ALA-R097-009
    source_item_ids: [ALA-R097-009]
    addresses_finding_ids: [ALA-R097-009]
    locator: "One-sentence summary and localized dense sentences/cells in external, trial, analysis, and section-14 text"
    operation: split
    problem: >-
      条件、操作、数值、失败后果与否定边界堆叠，读者不能唯一配对；摘要还嵌套未定义标签。
    target: >-
      摘要仍为一句，按研究对象、阶段 II 验证、条件性后续分析、贡献边界的平行顺序压缩；其他定位拆为单一主操作的短句或同一表格单元内编号条件。
    required_function_or_term: >-
      每个若/仅当/否则/不得就近配对唯一条件和后果；采用 ALA-001 至 007 的完整名称，不另造短称。
    content_to_preserve:
      protected_ids: [PCR-001, PCR-002, PCR-006, PCR-007, PCR-010, PCR-011, PCR-012]
    delete_move_disposition: "删除不增加判定信息的重复限定语；不删除数值、角色、条件、后果或表格结构。"
    destination: "Placement follows NRP-002 through NRP-004"
    dependencies: [NRP-002, NRP-003, NRP-004]
    acceptance_test: >-
      摘要仍恰为一句且四段逻辑清楚；其余定位一语法单位一个主操作，条件与后果唯一配对，信息与结构无损。

mandatory_whole_dossier_checks:
  not_new_findings: true
  checks:
    - check: "Verbatim identity-anchor equality"
      instruction: "Copy all five identity_anchor scalars exactly; do not translate, paraphrase, or normalize them."
      acceptance: "All five parsed output scalars equal the brief scalars."
    - check: "Protected-content item audit"
      instruction: >-
        Reopen every PCR-001 through PCR-012 source locator and compare every
        enumerated commitment with revised text; headings and delta claims are not evidence.
      acceptance: >-
        Each ID has revised locator(s) and item-level delta evidence; no status,
        threshold, sequence, branch, boundary, or claim strength changed.
    - check: "Section-14 authority and no pointers"
      instruction: >-
        Put complete limitations, assumptions, and unsupported claims only in
        section 14; elsewhere allow only a minimal self-contained boundary that advances local reasoning.
      acceptance: >-
        No repetition or section-14 pointer; section 7 alone owns design branches
        and section 11 alone owns falsification/result interpretations.
    - check: "Conditional-component projection"
      instruction: "Enforce PCR-011; put shared prerequisites and mutually exclusive routes once in section 7."
      acceptance: "No repeated branch tree and no branch condition becomes a shared prerequisite."
    - check: "Reader-entry role completeness"
      instruction: >-
        Inspect actor, operation, object/target, criterion, and consequence in
        every reader-entry, failure, negative-result, stopping, update, recovery, or validation sentence.
      acceptance: >-
        Every role is direct or defined; broad operations name model/mapping and
        target in the same sentence; failure artifacts state object, criterion, and consequence.
    - check: "Terminology and competing-form concordance"
      instruction: >-
        Scan every competing form in ALA-R097-001 through 007 and reader-facing
        state in 008; recheck each replacement's referent and modifier attachment.
      acceptance: >-
        One name per role; all forms removed/reclassified, first use defined, and no new short form.
    - check: "Future publication aim and evidence status"
      instruction: >-
        Preserve the goal of one or more high-level papers and auditable evidence;
        keep all models, validation, analyses, and contributions prospective.
      acceptance: >-
        Goal is locatable, work is not reduced to prediction, and no achieved prestige or result is implied.
    - check: "Complete-dossier structure and concordance"
      instruction: >-
        Preserve 15 H2s, five section-3 H3s, H1/Title equality, four-field evidence
        chains, tables, citations, references, thresholds, and core-role naming.
      acceptance: >-
        Lint and concordance pass; references resolve; every repair and PCR ID has text-grounded delta evidence.

execution_and_handoff:
  single_complete_target_dossier: true
  partial_artifacts_forbidden: true
  section_passes:
    - "同一位 writer 完成 sections 1-4"
    - "同一位 writer 完成 sections 5-11"
    - "同一位 writer 完成 sections 12-14"
    - "同一位 writer 完成 references and whole-dossier concordance"
  delta_after_dossier_freeze_only: true
  delta_requirements:
    - "Map all 14 repair IDs to revised locator, operation, and text-grounded acceptance evidence."
    - "Map PCR-001 through PCR-012 to revised locator(s) and item-level evidence without copying protected text."
    - "For every repaired core role, record one name, first use, removed/reclassified forms, and all-occurrence result."
    - "Write the compact delta only after dossier freeze, whole-text scan, and lint; any later edit invalidates it."
    - "If science must change or protected content cannot remain, mark unresolved and stop; do not guess."
