    target: 原 H2 下依次建立五个非空 H3：Background、Current state、Gap、Significance、Rationale，各自只承担规定功能。
    required_function_or_term: Gap 明确现有证据尚不能回答的全病程与跨数据库问题；Significance 写其对重症研究设计、跨库解释和后续干预判断的科学后果；Rationale 用双时钟、状态—治疗—测量区分、恢复检验和跨库评估连接 gap 与阶段 I–II，不展开计算。
    content_to_preserve:
      protected_ids: [PCR-001, PCR-003, PCR-004, PCR-005, PCR-009, PCR-012]
    delete_move_disposition: 相邻工作比较移第 12 节，计算条件移第 7 节，完整限制与不支持主张移第 14 节；本节只留推进五步推理所需的最小边界。
