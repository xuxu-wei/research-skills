mandatory_whole_dossier_checks:
  not_new_findings: true
  checks:
    - check: protected_source_locator_preservation
      instruction: 删除、移动或压缩前逐一打开 PCR-001 至 PCR-012 的 source_locator，核对数字、时序、分支资格、分析处理、证据状态和主张强度。
      acceptance: 每个 protected_id 在 v048 有修订 locator 和逐项文本证据；无承诺丢失、分支条件上提、状态加强或科学内容新增。
    - check: entry_hierarchy_and_sentence_contracts
      instruction: 联查 H1/Title、一句话摘要、结构化摘要和主要研究问题，确认阶段 I–II 主线先行，后续用途从属且不展开分支树。
      acceptance: 标题无阶段 III；一句摘要一个句号且先正向主线；研究问题一个问号且任务平行；入口无试验细节、禁止清单或第 14 节指针。
    - check: authority_location_and_no_pointers
      instruction: 扫描每个限制、假设、不支持主张和阶段 III 分支家族，分别核对第 7、11、14 节的唯一权威功能，并删除其他位置的完整复述与指针。
      acceptance: 第 14 节是完整限制/假设/不支持主张的唯一位置，第 7 节只有方法树，第 11 节只有证伪/结果解释；其他边界最小、自足且不可替代。
    - check: verified_terminology_concordance
      instruction: 建立全篇术语表并扫描研究对象、判定标准、外部评估/更新四类、试验层级复合结局及其所有竞争形式；采用各 language action 中有证据支持的替换。
      acceptance: 每个核心角色有一个稳定名称和首次定义；TRIPOD/TRIPOD+AI 支持的评估—更新区别及 ICH E9(R1) 支持的结局—汇总量区别在摘要、方法、证据链、解释和贡献中一致。
    - check: abbreviation_and_plain_language_scan
      instruction: 从标题至 References 前扫描大写缩写和连续英文普通词，按 LA-R089-005 逐项定义、展开或替换。
      acceptance: 所列缩写在摘要与主文首次出现时分别可理解，低频缩写已展开，裸英文操作词已换成具体中文且公式、数据库名和参考文献题名未变。
    - check: structure_references_and_lint
      instruction: 保留十五个规定 H2、第 3 节五个规定 H3、表格功能、引文编号与完整 References；冻结前运行适用的确定性结构 lint 和全篇 concordance。
      acceptance: 结构与引文完整，lint 无错误或未处置提示，核心名称无竞争形式，未写入评审历史、修订历史或内部工作术语。

execution_and_handoff:
  section_passes:
    - sections 1-4
    - sections 5-11
    - sections 12-14
    - references and whole-dossier concordance
  single_complete_target_dossier: true
  partial_artifacts_forbidden: true
  delta_after_dossier_freeze_only: true
  delta_requirements:
    - 每个 included_repair_item_id 映射到修订 locator、实际 operation 和正文中的 acceptance evidence
    - 每个 PCR-001 至 PCR-012 映射到修订 locator 和逐项保护证据，包括 source_locator 中未被 register 摘要逐字复述的承诺
    - 记录标题/摘要/研究问题层级、权威位置、术语、缩写和引用的全篇 concordance，不复制审计报告、protected content 或长段 dossier 正文
    - 完整 dossier 冻结并通过 lint 后才创建 delta；之后若 dossier 改动，重新扫描并重写 delta
  failure_routes:
    scientific_change_needed: scientific_change_declared
    identity_drift_detected: new_idea_required
    missing_scientific_confirmation: clarification_required
    incomplete_mapping: block_preservation_handoff
