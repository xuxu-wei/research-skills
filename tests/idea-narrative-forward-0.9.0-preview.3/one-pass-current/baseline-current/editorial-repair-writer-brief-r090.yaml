overlap_dispositions:
  - finding_ids: [NRP-002, NRP-003, NRP-004, LA-R089-001, LA-R089-004, LA-R089-006, LA-R089-008]
    disposition: >-
      Narrative 动作决定入口功能、信息位置和披露层级，language 动作只决定已保留内容的直接措辞与句法。标题只写阶段 I–II；一句话摘要先完成正向主线，可在末尾保留高层后续用途，但不纳入试验名、D7/D8、结局排序、分支树或成组禁止性解释。上述细节移至各自权威位置；LA-R089-001、004、006 中要求把后续分析或非因果清单写回标题/一句话摘要的局部 placement 不执行。
  - finding_ids: [NRP-003, NRP-004, LA-R089-004, LA-R089-007, LA-R089-008]
    disposition: >-
      Narrative 动作限定研究问题只保留一个高层条件性用途，不展开后续分支；LA-R089-007 控制一个问号、平行动词和闭合句法，LA-R089-004 控制保留术语的准确性。试验人群、访视、层级结局、替代和停止条件均在第 7 节完整表达，不在研究问题重复。
  - finding_ids: [NRP-001, NRP-003, NRP-004, LA-R089-002, LA-R089-004, LA-R089-008]
    disposition: >-
      Narrative 动作控制跨节功能：第 3 节完成五步推理，第 7 节保留方法资格和分析树，第 11 节保留证伪及结果解释，第 14 节完整且唯一地列出限制、假设和不支持主张。Language 动作在这些位置提供直接科学名称并删除近义复述；其他位置既不复制完整边界，也不添加跨节指针。
  - finding_ids: [NRP-002, NRP-004, LA-R089-002, LA-R089-003, LA-R089-005]
    disposition: >-
      摘要只用高层外部评估表述；方法权威位置按 LA-R089-003 分开“未更新外部性能评估”“基于适配集的重新校准”“基于适配集的观测层更新”“全模型重新拟合”，并由 narrative 动作决定完整冻结、失败和限制的位置。缩写和内部标签不得取代这些操作名称。
  - finding_ids: [NRP-003, NRP-004, LA-R089-002, LA-R089-004, LA-R089-005, LA-R089-008]
    disposition: >-
      第 7 节先写共享前提，再并列观测映射成立时的投影结局分支与映射不成立但独立分析条件满足时的 SOFA 分支，最后写核心语义不足时停止；不得把单一分支条件提升为共享前提。Narrative 动作决定唯一完整位置，language 动作决定层级复合结局、随机分配组间差异、缩写和局部句法。
  - finding_ids: [NRP-005, NRP-003, NRP-004, LA-R089-002, LA-R089-005]
    disposition: >-
      第 10 节只写可复现记录的输入、计算关系、输出、核查用途和依赖；用直接科学操作替换门、封印、防火墙等隐喻并定义必要缩写。完整科学理由和分析分支留第 7 节，完整限制留第 14 节，不在第 10 节复述或指向它们。
