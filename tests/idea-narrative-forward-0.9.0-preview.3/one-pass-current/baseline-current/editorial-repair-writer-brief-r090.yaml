global_rules:
  - H1 与 Title 完全一致，并以直接科学描述只突出阶段 I–II 的脓毒症纵向研究对象及计划的跨数据库评估；标题不得出现阶段 III、试验、访视、投影或后续分析。
  - One-sentence complete-Idea summary 保持一个句号结束的一句，先写正向主线，再写 24 个月目标、总体设计与预期贡献；最多在末尾用一个高层从属短语说明主体研究达到标准后的条件性次要用途，不列试验名、访视、资格、分支或禁止性清单，也不强制加入非因果清单。
  - Primary research question 保持一个总问句和语法平行的主要任务；可保留一个高层条件性后续用途，但不得展开资格、访视、映射、替代或停止分支树。
  - 后续阶段的共享前提、两个互斥分析分支、结局排序、汇总量、缺失、多重性、停止和解释逻辑，只在第 7 节相应方法权威小节完整出现一次。
  - 第 14 节是完整限制、工作假设和不支持主张类别的唯一权威位置；其他位置不留指向第 14 节的提示，只在删除会实质扭曲紧邻推理时保留最小、自足的局部边界。
  - 第 11 节只保留结果证伪判定及结果依赖的解释，第 7 节只保留方法资格与分析后果；二者都不得复制完整限制家族或完整禁止主张清单。
  - 压缩、删除或移动前，打开 protected register 中每个 source_locator，逐项保留该位置的数值、时序、分析处理、证据状态和主张边界；register 摘要不是丢弃细节的许可。

