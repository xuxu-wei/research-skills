    dependencies: [NRP-003, NRP-004, LA-R089-001, LA-R089-002, LA-R089-008]
    acceptance_test: 五个规定 H3 均非空并可各用一句概括；Gap 不是组合差异改写，Significance 明示科学后果，Rationale 完成 gap-to-design；无完整限制或禁止清单，无第 14 节指针。

