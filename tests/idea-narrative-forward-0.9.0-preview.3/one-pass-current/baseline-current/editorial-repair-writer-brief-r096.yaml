normalized_repair_actions:
  - repair_item_id: NRP-001
    source_item_ids: [NRP-001, NAR-001]
    addresses_finding_ids: [NAR-001]
    locator: "Background, current state, gap, significance, and rationale；五段正文"
    operation: split
    problem: 背景、现状、差距、意义和理由混写，组合差异替代未解证据问题，方法条件与限制分散正向论证。
    target: 原 H2 下依次建立五个非空 H3：Background、Current state、Gap、Significance、Rationale，各自只承担规定功能。
    required_function_or_term: Gap 明确现有证据尚不能回答的全病程动态复杂系统与跨数据库问题；Significance 写科学后果；Rationale 用双时钟、状态—治疗—测量区分、模拟恢复和跨数据库验证连接 gap 与阶段 I–II，不展开计算。
    content_to_preserve:
      protected_ids: [PCR-001, PCR-003, PCR-004, PCR-005, PCR-009, PCR-012]
    delete_move_disposition: 相邻工作比较移第 12 节，计算标准移第 7 节，完整限制与不支持主张移第 14 节；本节只留推进五步推理的最小自足边界。
