overlap_dispositions:
  - finding_ids: [NRP-001, NRP-002, L-001, L-009, L-010]
    disposition: >-
      Narrative 动作决定入口功能和层级，language 动作只决定保留文字。标题采用“脓毒症全病程动态复杂系统模型的构建与跨数据库验证”且只含阶段 I–II；首次定义把患者状态及转移表示说明为候选动态复杂系统模型的组成。L-001 建议的“候选动态状态表示”不采用，因为会降低研究身份；L-009/010 不得把分支树或限制清单写回摘要。
  - finding_ids: [NRP-001, NRP-005, L-002, L-008]
    disposition: >-
      第 3 节只用“观测数据可用性与支持审计”推进 gap-to-design，第 6/7 节保留完整数据属性、标准及分析后果，第 10 节只写复现记录。可在完整名称后使用 G1，但不得把数据审计称为系统可观测性，也不得以门、审计器等标签替代科学功能。
  - finding_ids: [NRP-001, NRP-004, NRP-005, L-003, L-004, L-008, L-010]
    disposition: >-
      Narrative 动作决定模拟方法、证伪和限制的位置；language 动作逐处直接说明生成情景、错误对象、指标、判定规则、重复比例及未满足后的删除/合并/停止解释。不得采用“错误结构的高置信支持控制”新短称，也不得保留裸“弃权”或括号短称。
  - finding_ids: [NRP-002, NRP-004, L-005, L-008, L-009, L-010]
    disposition: >-
      摘要只高层说明跨数据库验证；第 7 节分别直述“预先隔离且未用于模型选择的外部测试集”“未更新外部性能评估”“基于适配集的重新校准”“基于适配集的观测层更新”和“全模型重新拟合”。优先中文，不强制或依赖 zero-update；完整限制归第 14 节。
  - finding_ids: [NRP-002, NRP-003, NRP-004, L-006, L-007, L-008, L-009, L-010]
    disposition: >-
      Narrative 动作决定标题、摘要、问题和方法的披露层级。标题不含后续阶段；摘要仅留从属最小用途；第 7 节才直接说明如何用阶段 II 预先固定的计算规则把试验实测共同指标合成为访视状态分数、比较随机分配组间差异，以及条件不满足时的独立 SOFA 分析。全文不用观测投影、投影可观测、投影摘要、随机化扰动、death-ranked 或 fallback 等短称。
  - finding_ids: [NRP-003, NRP-004, L-006, L-007, L-010]
    disposition: >-
      第 7 节先写共享前提，再并列共同指标满足要求时的访视状态分数分析和计算条件不满足但试验核心语义可核验时的独立临床状态分析，最后写核心语义不足时停止；第 11 节只写结果判定，第 14 节完整且唯一地写限制、假设和不支持主张。其他位置无指针。
  - finding_ids: [NRP-003, NRP-004, NRP-005, L-002, L-003, L-004, L-005, L-006, L-007, L-008]
    disposition: >-
      第 10 节按输入—计算关系—输出记录—核查用途—依赖组织，不复述第 7 节理由或第 14 节限制。每个保留缩写先给中文功能；门、降级、封印、防火墙及裸英文短语均改为对象、规则、动作和后果的直接科学表达。
