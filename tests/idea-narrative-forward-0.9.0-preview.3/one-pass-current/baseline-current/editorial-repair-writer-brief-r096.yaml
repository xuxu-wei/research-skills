    dependencies: [NRP-003, NRP-004]
    acceptance_test: 五个规定 H3 均非空并可各用一句概括；Gap 不是组合差异改写，Significance 明示科学后果，Rationale 完成 gap-to-design；研究身份仍是动态复杂系统模型，无完整限制清单或第 14 节指针。

