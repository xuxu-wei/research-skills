global_rules:
  - H1 与 Title 完全一致，使用“脓毒症全病程动态复杂系统模型的构建与跨数据库验证”；标题不出现 RCT、阶段 III、试验、访视或条件性后续分析，也不得暗示已有模型或结果。
  - 首次定义保持动态复杂系统模型的研究身份，并明确患者时间状态及状态转移表示只是该候选模型的组成；不得把研究对象降为普通纵向表示、普通状态表示或单一预测模型。
  - One-sentence complete-Idea summary 保持一个句号结束的一句，先写研究问题、24 个月阶段 I–II 目标、总体设计与预期贡献；最多在末尾以一个从属短语说明主体研究达标后的条件性次要用途，不写完整替代分支或禁止性清单。
  - Primary research question 保持一个总问句和语法平行的主要任务；可留一个高层条件性后续用途，不展开试验名、访视、共同指标、计算、替代或停止分支树。
  - 后续阶段的共享前提、两个互斥分析分支、结局排序、汇总量、缺失、多重性、停止和解释逻辑，只在第 7 节相应方法权威小节完整出现一次。
  - 第 14 节是完整限制、工作假设和不支持主张类别的唯一权威位置；其他位置不留第 14 节指针，只在删除会实质扭曲紧邻推理时保留最小、自足的局部边界。第 11 节只保留结果证伪和结果依赖解释。
  - 全篇不得新造紧凑标签。所有缩写须在首次读者可见位置以中文科学功能定义，所有替换须在标题、摘要、正文、表格和图题中保持 concordance。
  - 删除、移动或压缩前打开 protected register 中每个 source_locator，逐项保留数字、时序、分析处理、证据状态和主张边界；register 摘要不是丢弃细节的许可。

