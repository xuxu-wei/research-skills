mandatory_whole_dossier_checks:
  not_new_findings: true
  checks:
    - check: protected_source_locator_preservation
      instruction: 删除、移动或压缩前逐一打开 PCR-001 至 PCR-012 的 source_locator，核对数字、时序、分支资格、分析处理、证据状态和主张强度。
      acceptance: 每个 protected_id 在 v048 有修订 locator 和逐项正文证据；无承诺丢失、分支条件上提、状态加强或科学内容新增。
    - check: identity_title_and_entry_hierarchy
      instruction: 联查 H1/Title、首次定义、一句话摘要、结构化摘要和主要研究问题，确认动态复杂系统模型身份与阶段 I–II 主线。
      acceptance: 标题为规定文字且无 RCT/阶段 III；状态及转移表示明确是模型组成；摘要一个句号且正向主线先行，研究问题不展开分支树。
    - check: authority_location_and_no_pointers
      instruction: 扫描每个限制、假设、不支持主张和后续分析分支，分别核对第 7、11、14 节的唯一功能并删除其他完整复述与指针。
      acceptance: 第 14 节是完整限制/假设/不支持主张的唯一位置，第 7 节只有方法树，第 11 节只有证伪/结果解释；其他边界最小、自足且不可替代。
    - check: forbidden_compact_forms_and_direct_consequences
      instruction: 全文扫描旧核心对象名、可观测性审计、绝对门、假置信、弃权、zero-update、观测投影、投影可观测、投影摘要、随机化扰动、death-ranked、fallback、门、降级、封印和防火墙。
      acceptance: 规定删除项无读者正文残留；每个标准均直接写对象、规则和后果；不存在“错误结构的高置信支持控制”或其他新造紧凑标签。
    - check: abbreviation_and_replacement_concordance
      instruction: 从标题至 References 前扫描大写缩写、裸英文复合词和各 action 的所有竞争形式，在内存中逐项核对并检查修饰关系，不持久化术语表。
      acceptance: 每个必要缩写首次有中文科学功能，低收益缩写已展开；模型身份、数据支持审计、模拟对象、外部评估/更新及试验结局在标题、摘要、正文、表格和图题中一致。
    - check: structure_references_and_lint
      instruction: 保留十五个规定 H2、第 3 节五个规定 H3、表格功能、引文编号和完整 References；冻结前运行适用的确定性结构 lint 与全篇 concordance。
      acceptance: 结构和引文完整，lint 无错误或未处置提示，正文无评审/修订历史、内部工作术语或未经验证的新科学内容。

execution_and_handoff:
  section_passes:
    - sections 1-4
    - sections 5-11
    - sections 12-14
    - references and whole-dossier concordance
  single_complete_target_dossier: true
  partial_artifacts_forbidden: true
  delta_after_dossier_freeze_only: true
  delta_requirements:
    - 每个 included_repair_item_id 映射到修订 locator、实际 operation 和正文 acceptance evidence
    - 每个 PCR-001 至 PCR-012 映射到修订 locator 和逐项保护证据，包括 source_locator 中未被 register 摘要逐字复述的承诺
    - 记录研究身份、入口层级、权威位置、术语、缩写、禁止短称和引用的全篇 concordance，不复制审计报告、protected content 或长段 dossier 正文
    - 完整 dossier 冻结并通过 lint 后才创建 delta；之后若 dossier 改动，重新扫描并重写 delta
  failure_routes:
    scientific_change_needed: scientific_change_declared
    identity_drift_detected: new_idea_required
    missing_scientific_confirmation: clarification_required
    incomplete_mapping: block_preservation_handoff
