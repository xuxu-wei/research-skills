  - protected_id: PCR-051
    category: assumptions_limitations_and_contingencies
    source_locator: "Operational thresholds > 月 0–3 数据与人员; 月 4–6 双数据库审计"
    protected_content: >-
      月 3 前若主要数据库访问/协议/存储/计算或关键人员不能确认，先启用完成同等审计的预设备份数据库；若仍无两个可承担角色的数据库，停止 24 个月跨数据库动态系统模型路线。若月 4–6 审计不能支持两库风险集/状态队列、12 小时排序或足够共同指标/事件/转移/医院，则在拟合和外部结果访问前统一改为 24 小时窗，仍不支持则改事件时间，并可减变量、状态/边或启用备份；无两库全病程支持时停止跨数据库系统端点。
    required_revised_disposition: retained_once_at_authority_location
  - protected_id: PCR-052
