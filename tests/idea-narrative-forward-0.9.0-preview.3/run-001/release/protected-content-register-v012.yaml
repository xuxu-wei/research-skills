    required_revised_disposition: retained_once_at_authority_location
  - protected_id: PCR-059
    category: assumptions_limitations_and_contingencies
    source_locator: "Operational thresholds > 试验语义与分析集; 共同观测变量; 观测映射外部忠实度"
    protected_content: >-
      试验授权/语义或核心访视信息不能核验时，停止一维摘要和独立 SOFA 分支，只复现原终点或报告审计，且不得推测字段或构造连续轨迹。每项试验少于两个合格锚点、语义/单位/时间不一致、需禁用变量或试验特异重估权重，或映射忠实度失败时，一维摘要分支不成立且不得用较好组间差异或事后调阈值恢复；只有 SOFA、分组、中心、生存和住院语义可核验时才转独立 SOFA，否则两个分支均停止。
    required_revised_disposition: retained_once_at_authority_location
  - protected_id: PCR-060
    category: assumptions_limitations_and_contingencies
