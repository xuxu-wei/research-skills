  - protected_id: PCR-061
    category: assumptions_limitations_and_contingencies
    source_locator: "Data, materials, and existing evidence base > time interval; Research design and methods > sparse trial visits"
    protected_content: >-
      主时间间隔拟为 12 小时；除有明确起止时间的输注、器官支持与静态基线外，动态测量不作无条件前值延续，每个值保留实测标志、实测时间和距上次实测间隔。试验的第 1/4/7 日或第 0/4/8 日稀疏测量仅用于访视特异或离散变化分析，不插值为连续轨迹。
    required_revised_disposition: retained_once_at_authority_location
  - protected_id: PCR-062
    category: assumptions_limitations_and_contingencies
    source_locator: "Scientific and interpretive boundaries > XBJ-SCAP"
    protected_content: >-
      XBJ-SCAP 的重症社区获得性肺炎入组不等同于确认 Sepsis-3；现有材料缺部分患者级变量且 D-dimer 单位待核验，相关字段不得推测或构造。
    required_revised_disposition: retained_once_at_authority_location

  - protected_id: PCR-063
    category: unsupported_claim_classes
    source_locator: "Scientific and interpretive boundaries > item 1"
    protected_content: >-
      观察性状态、治疗行动和测量过程关联及预测表现不支持治疗因果效应、真实反馈网络或反事实策略；阴性对照或时间反转无问题也不证明模型正确。
    required_revised_disposition: retained_same_boundary
  - protected_id: PCR-064
    category: unsupported_claim_classes
    source_locator: "Scientific and interpretive boundaries > items 3-4"
    protected_content: >-
      随机试验分支不支持未测量潜在动力学、状态转移边、中介机制、个体控制或完整动态系统的验证；独立 SOFA 结果不支持阶段 II 模型。
    required_revised_disposition: retained_same_boundary
  - protected_id: PCR-065
    category: unsupported_claim_classes
    source_locator: "Scientific and interpretive boundaries > item 5; Operational thresholds > 最接近工作与应用定位"
    protected_content: >-
      当前研究不支持新算法、全球首次、全球不存在相关工作、专利空白、数字孪生或控制模型主张；产生此类主张前须另行完成系统综述、引文网络、专利和非英语数据库检索。
    required_revised_disposition: retained_same_boundary
  - protected_id: PCR-066
    category: unsupported_claim_classes
    source_locator: "Scientific and interpretive boundaries > items 4-5; Operational thresholds > 最接近工作与应用定位"
    protected_content: >-
      当前研究不支持已验证临床决策工具、药物平台或无条件国际临床推广；临床应用还需前瞻性安全、效用和治理证据，且 XueBiJing 在未获当地监管批准辖区的使用不能由本研究推广。
    required_revised_disposition: retained_same_boundary
  - protected_id: PCR-067
    category: unsupported_claim_classes
    source_locator: "Scientific and interpretive boundaries > item 2; Hospital-based cross-database validation"
    protected_content: >-
      适配数据再校准、观测层更新或全模型重新拟合不支持声称原冻结模型通过不更新外部验证；全模型重新拟合属于新的开发研究。
    required_revised_disposition: retained_same_boundary
  - protected_id: PCR-068
    category: unsupported_claim_classes
    source_locator: "Scientific and interpretive boundaries > item 7"
    protected_content: >-
      阶段 III 结果不支持补足阶段 II 在资源、模拟恢复、主要任务或外部验证方面的失败，也不改变阶段 II 独立成败。
    required_revised_disposition: retained_same_boundary
  - protected_id: PCR-069
    category: unsupported_claim_classes
    source_locator: "Scientific and interpretive boundaries > item 6; Operational thresholds > 试验语义与分析集"
    protected_content: >-
      未核验或不存在的患者级字段、变量、单位和访视语义不支持推测、填造或构造连续轨迹；XBJ-SCAP 入组不能被无条件写为确认 Sepsis-3。
    required_revised_disposition: retained_same_boundary
  - protected_id: PCR-070
    category: unsupported_claim_classes
    source_locator: "Conditional trial observation mapping and secondary analyses; Operational thresholds > 随机试验结果与多重性"
    protected_content: >-
      两个随机试验不支持合并为共同效应或共同机制，选择亚组不支持改变主要结论；亚组结果仅限治疗—亚组交互。
    required_revised_disposition: retained_same_boundary
  - protected_id: PCR-071
    category: unsupported_claim_classes
    source_locator: "Structured abstract > Expected result; Current feasibility and evidence status"
    protected_content: >-
      尚未生成的候选模型、模拟、临床任务、外部验证及试验分析不支持任何完成性、有效性、恢复成功、外部稳定或治疗差异的结果主张。
    required_revised_disposition: retained_same_boundary
  - protected_id: PCR-072
    category: unsupported_claim_classes
    source_locator: "Scientific and interpretive boundaries > item 5; Representative closest-work comparison"
    protected_content: >-
      当前有界检索不支持系统综述完整性或全面新颖性结论：未实施 PRISMA 双人筛选、引文网络穷举或专利检索，也未覆盖 CNKI、万方、Scopus、Web of Science、Embase 或全部注册平台，且预印本更新和术语差异可能造成遗漏。
    required_revised_disposition: retained_same_boundary

permitted_editorial_operations:
