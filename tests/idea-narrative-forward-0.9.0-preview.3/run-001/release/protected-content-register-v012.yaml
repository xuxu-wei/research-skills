    source_locator: "Operational thresholds > 两项主要临床任务; 外部结果"
    protected_content: >-
      任一主要任务在开发、跨时间或预先隔离外部数据不达 Brier 非劣与校准标准时，该任务不获支持；次要诊断、随机试验结果或更复杂模型不得替代失败。不更新模型的外部验证是主要跨数据库依据；适配数据再校准或观测层更新只能说明更新后的外部适用性，不能挽救不更新模型的失败。
