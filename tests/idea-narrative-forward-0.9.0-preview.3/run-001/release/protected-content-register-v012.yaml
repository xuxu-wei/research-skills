  - protected_id: PCR-050
    category: assumptions_limitations_and_contingencies
    source_locator: "Authoritative limitations... > 尚待冻结的方法规范"
    protected_content: >-
      医院规模四分位分层指标及其计算定义尚待月 4–6 审计后、查看验证结局或表现前、在验证数据保持隔离时冻结；接口完整性分层、种子 20260717、30%/70% 医院分配和跨分区患者处理不变。主要任务 95% 上置信限的具体构造须在月 6 前冻结；+0.01 阈值、判定方向、校准标准和禁止替代规则不变。
