    source_locator: "Operational thresholds > 依赖双数据库审计的阈值登记"
    protected_content: >-
      依赖审计结果的阈值须在月 6 前根据临床容许误差、开发数据自助法及不接触外部结果的先导模拟登记；本 dossier 已规定的阈值只能收紧，不能放宽，也不能依据外部验证结果修改。未完成登记时须在模型拟合前补齐。
    required_revised_disposition: retained_once_at_authority_location
  - protected_id: PCR-053
    category: assumptions_limitations_and_contingencies
    source_locator: "Operational thresholds > event/transition complexity, recovery, structure, and stability rows"
    protected_content: >-
      数据支持、恢复、结构或稳定性不达阈值时，应降低维度、合并/删除状态、转移或结构边，或降级为线性状态空间、多状态或任务级预测模型；未恢复对象不得解释。无结构边或错设判断失败时淘汰复杂候选，预测分数或事后调阈值不得替代该判定；再校准只能处理概率校准，不能修复结构失败，未稳定状态或边不得进入共同结构结论。
    required_revised_disposition: retained_once_at_authority_location
  - protected_id: PCR-054
    category: assumptions_limitations_and_contingencies
    source_locator: "Operational thresholds > 标签与数据分组"
    protected_content: >-
      若发病后信息、同窗后续行动、未来测量频率、跨分组插补/标准化或患者重复记录跨集合等造成高严重度泄漏，必须修正信息可用时间、删除问题变量并重建标签；未解决时不得访问外部验证结果。
    required_revised_disposition: retained_once_at_authority_location
  - protected_id: PCR-055
