    protected_content: >-
      两试验方向不一致、区间宽、Holm 校正后无支持或缺失敏感时，须如实报告不确定性和跨人群外部适用性限制，不得选择亚组改变主要结论；两试验不得合并为共同效应或机制，亚组仅报告交互。
