protected_items:
  - protected_id: PCR-001
    category: identity_and_question
    source_locator: "frontmatter identity_anchor; Research question, objectives, and core hypothesis > Primary research question"
    protected_content: >-
      核心问题是：能否构建受知识约束、能够量化不确定性的 ICU 患者动态系统模型，覆盖以脓毒症为中心的发病前、首次发病、发病后和结局连续体；在处理患者与医院层级聚类后检验患者—时间状态、状态转移、共同生理锚点预测及预设关系正负符号与时间滞后的跨数据库稳定性；并且仅在阶段 II 成功后，以预先锁定的观测映射检验试验实际稀疏访视时点的一维状态摘要随机分组间差异。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-002
    category: identity_and_question
    source_locator: "frontmatter identity_anchor; Structured abstract > Objective and hypothesis"
    protected_content: >-
      主要目标是在 24 个月内完成阶段 I–II，构建并验证脓毒症复杂系统模型；阶段 II 包括模型开发、恢复检验、两项主要临床任务和跨数据库验证。阶段 III 位于 24 个月最低交付之后且具有条件性。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-003
    category: identity_and_question
    source_locator: "Research question, objectives, and core hypothesis > Core hypothesis"
    protected_content: >-
      核心假设具有条件性：在双数据库共同观测指标与事件支持充分，且尺度、状态数、滞后和锚定方式预先固定的前提下，至多一个受限复杂候选模型能够在模拟中恢复状态占用概率、转移概率、共同生理锚点预测以及预设关系的正负符号与时间滞后，并在预先隔离的外部数据库中维持两项主要任务的校准、状态对齐和预设结构稳定性。
    required_revised_disposition: retained_same_strength
  - protected_id: PCR-004
    category: identity_and_question
    source_locator: "Title, summary, audience, and positioning > Positioning and contribution frame; Contribution and evidence ladder"
    protected_content: >-
      研究定位是候选动态模型的有界证据整合、预先设定的跨数据库验证、研究基准与可复用资源建设；增量来自按依赖顺序连接全病程定义、模型可恢复性检验、外部验证和条件性试验分析，而不是宣称各方法组件本身为新。
    required_revised_disposition: retained_same_strength
  - protected_id: PCR-005
    category: identity_and_question
    source_locator: "Feasibility, resources, risks, alternatives, and stop conditions > Research identity and final boundary"
    protected_content: >-
      研究身份由主要研究问题、目标、研究对象、核心证据基础及患者—时间状态和状态转移这一推断单位共同界定。取消发病前—首次发病—发病后—结局连续体、改为普通临床预测、替换公共 ICU 数据与条件性随机试验的核心证据基础，或改变主要推断单位，均须重新界定为另一项研究。
    required_revised_disposition: retained_same_boundary

  - protected_id: PCR-006
    category: object_scope_and_boundaries
    source_locator: "frontmatter identity_anchor > study_object and primary_unit_of_inference"
    protected_content: >-
      研究对象是纵向的、以脓毒症为中心的 ICU 患者系统，包括可比的未发病风险区间和发病后轨迹；主要推断单位是患者—时间状态与状态转移，并尊重患者和医院聚类。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-007
    category: object_scope_and_boundaries
    source_locator: "Title, summary, audience, and positioning > 三阶段导航; Research content and work packages"
    protected_content: >-
      阶段 I（月 0–6）负责资源、标签、队列和双数据库审计；阶段 II（月 3–24）负责知识结构与基线、模拟恢复、两项主要任务、两项次要诊断、开发冻结和按医院隔离的跨数据库验证，阶段 I–II 共同构成 24 个月最低交付；阶段 III 仅在 24 月后有条件启动，其结果不改变阶段 II 的独立成败。
    required_revised_disposition: retained_same_boundary
  - protected_id: PCR-008
    category: object_scope_and_boundaries
    source_locator: "Research design and methods > Protocol locks for the two primary clinical tasks > 人群"
    protected_content: >-
      发病前人群限定为年龄至少 18 岁、每次住院首个合格 ICU 入住、至少 12 小时可见历史、预测时点尚未达到主要发病标签者；观察起点已发病者不进入风险集。发病后人群为首次新发脓毒症；入 ICU 时已发病者仅在首个可审计时点延迟进入、分层分析并处理左截断。
    required_revised_disposition: retained_same_boundary
  - protected_id: PCR-009
    category: object_scope_and_boundaries
    source_locator: "Research design and methods > Mutually exclusive post-onset state and event system"
    protected_content: >-
      发病后每 12 小时赋予一个互斥状态，固定优先顺序为死亡、转院或无法继续观察、存活离开 ICU、恶化或新发器官衰竭、生理恢复、持续脓毒症；源时间无法排序时采用较高优先级，并以事件时间分析作敏感性分析。存活离开 ICU 不等同于生理恢复，转院不编码为恢复或普通独立删失。
    required_revised_disposition: retained_same_boundary
  - protected_id: PCR-010
    category: object_scope_and_boundaries
    source_locator: "Feasibility, resources, risks, alternatives, and stop conditions > Resources and governance"
    protected_content: >-
      计算范围限两个主要数据库；模型范围限最多 4 个状态维度、最多 3 个切换机制和至多一个复杂候选模型；分析范围限两项主要临床任务和两项次要表征诊断。动物实验、完成新的随机试验、因果机制识别和控制策略不属于 24 个月成立条件。
    required_revised_disposition: retained_same_boundary
  - protected_id: PCR-011
    category: object_scope_and_boundaries
    source_locator: "Research design and methods > Hospital-based cross-database validation"
    protected_content: >-
      外部数据库按医院而非患者重新分组：在结局选择前按待冻结的医院规模指标四分位和接口完整性分层，再以固定随机种子 20260717 按 eICU 医院标识符将 30% 医院分入适配集、70% 医院分入预先隔离且未参与开发的验证集；同一数据库按未参与开发医院验证与跨数据库验证须分别报告。
    required_revised_disposition: retained_same_boundary
  - protected_id: PCR-012
    category: object_scope_and_boundaries
    source_locator: "Research design and methods > Conditional trial observation mapping and secondary analyses > Analysis targets"
    protected_content: >-
      阶段 III 的两个试验必须分开分析且不合并。EXIT-SEP 目标人群为全部 1,817 名随机受试者，1,760 名结局已知者仅称完整结局子集，主要访视为实际第 7 日；XBJ-SCAP 目标人群为全部 710 名随机受试者，无法重建全部随机集时才降级为 675 名全分析集的明确标记改良意向治疗分析，主要访视为实际第 8 日，并保留预设敏感性人群。
    required_revised_disposition: retained_same_boundary
  - protected_id: PCR-013
    category: object_scope_and_boundaries
    source_locator: "Title, summary, audience, and positioning > four evidence classes; Interpretation of the planned evidence"
    protected_content: >-
      任务级预测、模拟中的状态与结构恢复、跨数据库稳定性、随机试验组间差异是回答不同问题的证据层，须分别报告，不能互相替代或合并为单一评价。
    required_revised_disposition: retained_same_boundary

  - protected_id: PCR-014
    category: inputs_and_resources
    source_locator: "Data, materials, and existing evidence base > Public ICU databases and planned roles"
    protected_content: >-
      MIMIC-IV v3.1 是开发数据库，用于标签和模型开发、内部验证及跨时间验证；eICU-CRD v2.0 是外部数据库，用于按医院分开的模型适配和跨数据库外部验证，并审计整院接口缺失；HiRID 或 AmsterdamUMCdb 必须在研究启动期预先指定一个，完成同等审计后才能作为角色替代数据库。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-015
    category: inputs_and_resources
    source_locator: "Data, materials, and existing evidence base > Public ICU databases and planned roles > 共同概念层 and 双数据库审计"
    protected_content: >-
      跨数据库共同概念层只纳入单位、临床语义、时间戳和信息可用时间均已核验的共同变量；数据库特异变量仅用于探索性观测模型。模型拟合前的双数据库审计必须核查可计算样本、事件、允许转移、医院、跨院患者、共同观测指标覆盖、接口缺失及治疗行动覆盖与重叠。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-016
    category: inputs_and_resources
    source_locator: "Feasibility, resources, risks, alternatives, and stop conditions > Current feasibility and evidence status"
    protected_content: >-
      MIMIC-IV 与 eICU 的存在、版本和文献已核验，但团队访问凭证、数据使用协议、下载存储、确切提取版本和校验记录均未核验；项目实际样本、事件、转移、医院、跨院患者、共同观测指标和接口支持尚未生成，官方数据库规模不能替代项目审计计数。
    required_revised_disposition: retained_same_status
  - protected_id: PCR-017
    category: inputs_and_resources
    source_locator: "Data, materials, and existing evidence base > Trial data considered for conditional stage III analyses"
    protected_content: >-
      EXIT-SEP 已报道随机分配 1,817 例 Sepsis-3 患者；本地衍生报告记录 1,760 例 28 日状态明确、395 例死亡、57 例状态未知，SOFA 第 1/4/7 日非缺失数为 1,750/1,542/1,296，乳酸为 855 至 223。XBJ-SCAP 已报道随机分配 710 例重症社区获得性肺炎患者；本地衍生报告记录全分析集 675、符合方案集 617、脓毒症样人群 671、严格重叠人群 658，SOFA 第 0/4/8 日非缺失数为 703/628/610，白细胞计数 704/634/614，C 反应蛋白 579/503/467，675 例有 28 日状态。
    required_revised_disposition: retained_same_status
  - protected_id: PCR-018
    category: inputs_and_resources
    source_locator: "frontmatter identity_anchor > core_data_or_evidence_base; Evidence chains > 数据支持、锚定与模拟恢复"
    protected_content: >-
      核心证据基础由文献与专家先验、纵向公共 ICU 数据，以及在个体数据与语义资格满足时才可使用的 EXIT-SEP 和 XBJ-SCAP 个体级随机试验数据组成。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-019
    category: inputs_and_resources
    source_locator: "Data, materials, and existing evidence base > Variable-role separation"
    protected_content: >-
      生理测量、治疗行动、测量过程、标签专用变量和基线协变量必须分离：治疗不作潜在生理状态锚点，未检测不视为正常，医院接口缺失不视为生理状态，标签变量不进入相同或更早预测时点，SOFA 或抗菌药等双重用途字段须以独立副本和信息可用时间规则处理。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-020
    category: inputs_and_resources
    source_locator: "Feasibility, resources, risks, alternatives, and stop conditions > Resources and governance; Current feasibility and evidence status"
    protected_content: >-
      最低人员配置包括具名重症临床或表型负责人、纵向统计负责人、系统辨识负责人、数据工程负责人、模型实现人员和独立外部验证数据保管人；当前仅定义了角色，具名人员与可用工时尚未核验，角色规范不等于人员承诺。
    required_revised_disposition: retained_same_status
  - protected_id: PCR-021
    category: inputs_and_resources
    source_locator: "Research design and methods > Trial semantics and common-observation eligibility"
    protected_content: >-
      启动任何阶段 III 分析前，必须具备个体级分析授权及原始病例报告表或统计分析计划、数据字典或数据持有人确认，并可核验随机分组、分析集、中心或分层因素、实际第 7/8 日相对随机化与首剂的访视窗，以及死亡、住院、存活出院和转院语义。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-022
    category: inputs_and_resources
    source_locator: "Feasibility, resources, risks, alternatives, and stop conditions > Current feasibility and evidence status"
    protected_content: >-
      EXIT-SEP 与 XBJ-SCAP 的现有项目内材料仅为衍生清洗或验证报告，不能替代个体数据授权和原始试验文件核验。阶段 II 与试验间的共同生理观测指标、单位和访视映射未核验；白细胞计数与 C 反应蛋白只是候选，单位不明的 D-dimer 或不存在的变量不得纳入。
    required_revised_disposition: retained_same_status

  - protected_id: PCR-023
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Protocol locks for the two primary clinical tasks > 主要发病前任务"
    protected_content: >-
      主要发病前 estimand 是在 ICU 第 12 小时起每 12 小时的动态预测时点，基于此前最多 24 小时且至少 12 小时的当时可用信息，估计未来 12 小时首次发病的累积发生函数；先拟合离散时间多项式原因别风险模型再转为 CIF。主要评价为 12 小时 Brier 分数、绝对校准截距和斜率，精确率—召回率曲线下面积、提前量和假警报为次要指标。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-024
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Protocol locks for the two primary clinical tasks > 主要发病后任务"
    protected_content: >-
      主要发病后 estimand 是发病或延迟进入后每 12 小时更新、估计病程第 7 日处于“生理恢复或存活离开 ICU”有利集合的概率，并分别报告两种状态；使用互斥离散多状态模型与 Aalen–Johansen 估计，第 14 日为敏感性分析。主要评价为第 7 日多类别 Brier 分数和有利状态绝对校准，各状态及转移校准为次要指标。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-025
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Protocol locks for the two primary clinical tasks > 事件时间 and 信息可用时间"
    protected_content: >-
      主要 Sepsis-3 发病标签以微生物标本与系统抗菌药首次实际给药配对：采集在先时给药须在 72 小时内，给药在先时采集须在 24 小时内，感染时间取二者较早；无慢性器官功能障碍记录时基线 SOFA 为 0，否则为入 ICU 前 24 小时最低可计算 SOFA；滚动 24 小时最差 SOFA 相对基线增加至少 2 分须位于感染前 48 小时至后 24 小时。发病事件时间为首次满足时，信息可用时间取配对中较晚事件与必要 SOFA 数据可见或最终确认时间的最大值，后到信息不得回填。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-026
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Protocol locks for the two primary clinical tasks > competing events, ordering, sensitivity labels, and leakage audit"
    protected_content: >-
      发病前存活离开 ICU、院内死亡、转院或失访是互斥终止，行政性随访结束按独立删失并作 IPCW 与界限敏感性分析；发病后死亡、存活离开 ICU 和转院是终止状态。时间 t 的特征只使用可用时间早于 t 的信息，同窗新治疗作为 A_t，下一边界实测生理为后继状态，同时间戳无法排序的信息不用于转移。两种预设标签敏感性定义及覆盖未来信息、同窗后续行动、跨分组处理、患者重复记录分组和结局导向阈值等的数据泄漏审计必须保留。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-027
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Mutually exclusive post-onset state and event system > state definitions"
    protected_content: >-
      生理恢复要求相对发病参考 SOFA 下降至少 2 分且连续 24 小时无新恶化，事件时间为窗口起点、可用时间为窗口结束；恶化或新发器官衰竭定义为相对此前 24 小时最低 SOFA 增加至少 2 分，或新启用/升级血管活性药、有创通气或连续性肾脏替代治疗，同时发生仅记录一次；持续脓毒症是 ICU 内存活且未满足其他状态。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-028
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Observational model target, anchoring, and reporting"
    protected_content: >-
      观察模型在实际照护和测量条件下估计 p(X_0:T,Y_0:T,M_0:T,A_0:T | B,S)，其中 X 为潜在状态、Y 为生理测量、A 为治疗行动、M 为测量过程、B 为基线协变量、S 为数据库或医院；由此得到发病风险、对齐后的状态占用概率与转移概率、共同生理锚点预测以及预设关系的正负符号与时间滞后。后两者不指结构边方向。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-029
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Observational model target, anchoring, and reporting > anchoring constraints"
    protected_content: >-
      每个潜在状态维度至少用两个跨数据库共同观测指标锚定，第一个锚点载荷固定为 +1 并据此标准化尺度，未预设交叉载荷固定为 0 或按预写稀疏模式；最多 4 个状态维度、3 个切换机制，滞后仅为 1 或 2 个冻结时间窗，预设图不得有同窗瞬时循环。20 个固定随机种子拟合须在允许的维度排列和符号变换下对齐后报告。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-030
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Observational model target, anchoring, and reporting > missingness and treatment coverage"
    protected_content: >-
      非随机缺失主要拟合同时保留显式表示测量过程的缺失随机基线和选择模型基线，不在两者间事先选择；模式混合偏移为开发库标准差的 -1、-0.5、0、+0.5、+1，并作选择模型临界点分析。每个对齐状态、医院和时间层均报告治疗行动概率与有效样本量。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-031
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Simulation and semi-synthetic recovery study"
    protected_content: >-
      Monte Carlo 与半合成模拟必须在不读取最终外部验证结果时进行；数据生成机制包括正确指定、无结构边或独立状态、额外/过度复杂状态、遗漏状态、错误滞后和错误观测模型，并交叉改变状态分离度、切换率、滞后、治疗政策反馈、隐藏混杂、非随机缺失、标签误差、访视频率、整院接口缺失和数据库差异。评价须覆盖状态恢复、转移误差与区间覆盖、关系符号/滞后恢复、结构灵敏度与错误发现、无边错误判断、错设识别或不报告以及概率校准。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-032
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Hospital-based cross-database validation > cross-hospital patient handling"
    protected_content: >-
      跨医院患者处理顺序固定：先定医院分组，再识别跨院记录；同时出现在适配与验证医院的可链接患者全部记录从主要外部分析排除且不按患者重分组；只在单一分组者保留首次合格住院及首个合格 ICU 入住；查看表现前报告排除规模及结局前特征；敏感性分析使用验证集优先的患者—医院连通分量规则。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-033
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Hospital-based cross-database validation > external analysis sequence"
    protected_content: >-
      冻结标签、共同变量映射、状态、预处理、信息可用时间、模型、超参数、阈值和评价代码后，外部分析顺序为：不更新模型的外部验证；仅用适配数据进行结局时间范围特异的截距/斜率再校准；仅用适配数据更新观测层并固定状态和转移模型。全模型重新拟合必须另标为跨数据库模型更新研究。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-034
    category: design_analysis_and_validation
    source_locator: "Research content and work packages > Minimum success definition: all required evidence"
    protected_content: >-
      阶段 II 成功须五类证据同时满足：两库均能构造发病前风险集和发病后状态队列；候选模型在预设模拟中恢复目标状态/结构并识别错设；两项主要临床任务达到预定 Brier 与校准标准；时间信息及数据分组无未解决高严重度问题；预先隔离外部数据支持任务表现、状态对齐和预设结构稳定性。任一必要条件失败即不构成阶段 II 成功。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-035
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Conditional trial observation mapping and secondary analyses > eligibility"
    protected_content: >-
      阶段 III 只有阶段 II 已完成并冻结、试验授权和语义核验通过时才可启动。每项试验的共同变量集合只取阶段 II 审计保留且在实际访视直接测得、构念/标本/单位一致或可确定性换算、时间处于冻结访视窗的生理锚点；不得包含治疗、测量频率、SOFA、结局标签或事后派生状态，也不得重估试验特异权重。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-036
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Pre-specified deterministic observation mapping"
    protected_content: >-
      试验观测映射使用 MIMIC 开发数据冻结的均值、标准差和第 1/99 百分位截断标准化共同指标；从冻结观测方程 Z_C=a_C+L_CX+e 的 SVD 定义 P_state=V_1'X 和 P_obs=D_1^-1 U_1'(Z_C-a_C)。奇异值并列时按冻结锚点字典顺序选轴；符号在阶段 II 开发数据中固定为与同日 SOFA 非负相关，使高值表示更不利。映射不得使用试验治疗分组或结局，两试验各用自己的共同变量集合和映射。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-037
    category: design_analysis_and_validation
    source_locator: "Research design and methods > External projection fidelity assessment; Operational thresholds > 观测映射外部忠实度"
    protected_content: >-
      映射忠实度须先在预先隔离 eICU 的相应第 7/8 日窗口评价，且不得依据试验结果调参。失败条件包括：第一奇异轴解释占比 <50%；P_state 与 P_obs 相关 <0.70；归一化 MAE >0.50；回归截距绝对值 >0.20 个 P_state 标准差；斜率不在 0.80–1.20；95% 覆盖率不在 0.90–0.98；任一锚点外部斜率不在 0.80–1.20 或标准化截距绝对值 >0.20；遮蔽治疗组的试验锚点落在冻结生理范围的比例 <80%；或存活住院访视中至少两个实测锚点可计算 P_obs 的比例 <60%。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-038
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Analysis targets"
    protected_content: >-
      映射达标时，主要状态结局按访视前死亡最不利、存活住院者 P_obs 从高到低、访视前存活出院最有利排序；主要汇总为与中心/分层随机化相容的概率指数。独立 SOFA 分析沿用死亡和出院排序但按 SOFA 排存活住院者，且与阶段 II 映射无关。缺失处理包括按试验预设多重插补、Rubin 规则或聚类自助法、±0.5/±1 标准差偏移、最好/最坏情形及转院/未知状态界限分析；两个试验主要状态端点构成总体 0.05 的 Holm 家族，亚组只报告治疗—亚组交互。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-039
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Secondary representation diagnostics"
    protected_content: >-
      两项次要表征诊断为遮蔽后重建与未来轨迹诊断：前者报告 MAE、RMSE、对数评分和区间覆盖；后者报告连续分级概率评分、负对数似然、状态占用概率和结局校准。结果按变量、状态、医院和观测密度分层，并与两项主要任务分开。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-040
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Protocol locks > 不确定性"
    protected_content: >-
      两项主要临床任务均以患者与医院层级自助法估计 95% 区间；发病前重叠窗口保留但每次 ICU 入住总权重为 1，发病后新发与延迟进入分层并报告有效转移数。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-041
    category: design_analysis_and_validation
    source_locator: "Operational thresholds > 模拟运行充分性; 状态与转移恢复; 结构与错设识别"
    protected_content: >-
      模型准入阈值包括：每个核心模拟情景至少 1,000 次重复或关键比例 MCSE 不超过 0.02；离散状态 ARI/连续状态主要典型相关至少 0.80；20 个固定种子状态匹配率至少 90%；主要转移 MAE 不高于 0.05；95% 覆盖率在 0.90–0.98；关系符号/滞后恢复率及结构边灵敏度至少 0.80，错误发现率不高于 0.10；无结构边错误边区间排除 0 的比例不高于 0.05；错设情景失配识别或不报告至少 80%，对错误结构高置信判断不高于 0.05。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-042
    category: design_analysis_and_validation
    source_locator: "Operational thresholds > 概率校准和结构稳定性; 两项主要临床任务; 外部结果"
    protected_content: >-
      主要校准/外部阈值包括校准斜率 0.80–1.20、绝对概率或风险误差不超过 0.02；主要任务相对最强简单基线的 Brier 差值 95% 上置信限不得高于 +0.01；固定种子状态/边一致匹配至少 90%，自助法保留至少 80%，外部关系符号一致至少 80%，跨数据库状态对齐至少 0.70。不更新模型的外部任务、状态对齐或关系符号任一未达标均使相应冻结跨数据库端点不获支持。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-043
    category: design_analysis_and_validation
    source_locator: "Operational thresholds > 事件、转移和复杂度支持; 外部医院与跨分区患者支持"
    protected_content: >-
      数据支持阈值包括开发/外部每个自由风险参数分别至少 20/10 个事件，每个自由转移参数分别至少 20/10 次转移，每个潜在维度至少 2 个共同锚点；锚点在任一数据库合格时间窗的实测比例至少 30%，覆盖至少 70% 合格医院和 80% 合格患者。外部验证需至少 20 个有事件支持的医院；跨分区排除患者或主要事件超过原合格验证集 10% 会触发支持核验与备份数据库方案。
    required_revised_disposition: retained_same_meaning

