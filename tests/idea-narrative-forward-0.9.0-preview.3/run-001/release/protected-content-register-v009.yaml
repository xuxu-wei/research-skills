protected_items:
  - protected_id: PCR-001
    category: identity_and_question
    source_locator: "Frontmatter > identity_anchor"
    protected_content: >-
      研究身份由以下五项共同固定：主要问题是构建受知识约束、可量化不确定性的 ICU 患者动态系统表示，覆盖以脓毒症为中心的发病前、首次发病、发病后和结局连续体，检验跨数据库状态与结构有效性，并在不混淆预测与因果的前提下进一步检验有限的随机干预扰动；主要目标是在 24 个月内完成阶段 II 的模型构建与验证；研究对象是纵向脓毒症中心 ICU 患者系统，包括可比的未发病风险时段和发病后轨迹；核心证据基础是文献与专家先验、纵向公共 ICU 数据，以及有条件可得的 EXIT-SEP 与 XBJ-SCAP 个体级随机试验数据；主要推断单位是患者—时间状态及状态转移，并尊重患者与医院聚类。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-002
    category: identity_and_question
    source_locator: "Research question, objectives, and core hypothesis > Primary research question > ‘能否构建一种受知识约束且能够量化不确定性的 ICU 患者动态系统模型’"
    protected_content: >-
      主要研究问题包含依次相连但不能互换的三部分：构建覆盖脓毒症发病前、首次发病、发病后与结局的候选动态系统模型；在处理患者与医院聚类后，检验患者—时间状态、状态转移、共同生理锚点预测及预设关系正负符号与时间滞后的跨数据库稳定性；仅在阶段 II 成功后，才使用试验共同实测生理指标和预先锁定的观测映射形成一维状态摘要，并检验实际稀疏访视时点的随机分组差异。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-003
    category: identity_and_question
    source_locator: "Research question, objectives, and core hypothesis > Objectives and Core hypothesis"
    protected_content: >-
      四项目标依次为：建立全病程边界与可追溯时间规则；由双数据库审计约束候选状态模型并分开生理状态、治疗行动和测量过程；在预设数据生成机制中检验恢复与错设识别，再检验两项主要任务、两项次要诊断和跨数据库稳定性；阶段 II 成功后才开展分试验的条件性随机试验次要分析。核心假设限于满足共同指标、事件支持及预先固定的尺度、状态数、滞后和锚定后，至多一个受限复杂候选可恢复预定状态与结构对象，并在隔离外部数据库中维持两项主要任务校准、状态对齐和预设结构稳定性。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-004
    category: object_scope_and_boundaries
    source_locator: "Frontmatter > identity_anchor > study_object and primary_unit_of_inference; Research design and methods > Protocol locks for the two primary clinical tasks"
    protected_content: >-
      研究对象保持为纵向、脓毒症中心的成人 ICU 患者系统。发病前分析使用尚未达到主要发病标签的动态患者—时间风险集；观察起点已经发病者不进入该风险集。发病后分析包括首次新发病例，以及在首个可审计时点延迟进入并单独分层、处理左截断的入 ICU 时已发病者。主要推断单位仍是患者—时间状态和状态转移，不得改成普通住院级静态预测。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-005
    category: object_scope_and_boundaries
    source_locator: "Title, summary, audience, and positioning > Three-stage map; Research content and work packages > Twenty-four-month minimum deliverable and dated milestones"
    protected_content: >-
      阶段 I 为月 0–6 的资源、标签、队列与双数据库审计；阶段 II 为月 3–24 的知识结构、基线、模拟恢复、主要任务、次要诊断、开发冻结与按医院隔离的跨数据库验证，月 3–6 与阶段 I 按计划交叠；阶段 I–II 构成 24 个月最低交付。阶段 III 为月 24 后的条件性试验分析，只能在阶段 II 全部必要证据及试验语义和共同观测映射资格满足后启动，且不能补足阶段 II 的任何失败。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-006
    category: object_scope_and_boundaries
    source_locator: "Feasibility, resources, risks, alternatives, and stop conditions > Resources and governance"
    protected_content: >-
      计算范围限两个主要数据库；模型范围限最多 4 个状态维度、最多 3 个切换机制和至多一个复杂候选模型；分析范围限两项主要临床任务和两项次要表征诊断。动物实验、完成新的随机试验、因果机制识别和控制策略均不属于 24 个月成立条件。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-007
    category: object_scope_and_boundaries
    source_locator: "Research design and methods > Conditional trial observation mapping and secondary analyses > opening paragraph and Analysis targets"
    protected_content: >-
      EXIT-SEP 与 XBJ-SCAP 的分析均是原试验结果发表后提出的次要或探索性分析，必须按试验、实际访视、共同变量和估计目标分开报告，不合并为共同效应。主要访视分别是 EXIT-SEP 实际第 7 日和 XBJ-SCAP 实际第 8 日；稀疏访视仅支持访视特异或离散变化分析，不得插值为连续轨迹。独立 SOFA 临床状态分析与阶段 II 观测映射分离。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-008
    category: inputs_and_resources
    source_locator: "Data, materials, and existing evidence base > Public ICU databases and planned roles"
    protected_content: >-
      MIMIC-IV v3.1 是开发数据库，用于标签、模型开发、内部验证与跨时间验证；eICU-CRD v2.0 是外部数据库，用于按医院分开的适配数据和预先隔离的跨数据库验证数据，并审计整院接口缺失。HiRID 或 AmsterdamUMCdb 必须在启动期预先指定其一，只有完成同等审计后才可替代不能承担角色的主要数据库。共同概念层只保留单位、临床语义、时间戳和信息可用时间均经核验的变量；数据库特异变量只用于探索性观测模型。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-009
    category: inputs_and_resources
    source_locator: "Data, materials, and existing evidence base > Trial data considered for conditional stage III analyses"
    protected_content: >-
      EXIT-SEP 的现有依据为 45 个中国 ICU 随机分配 1,817 人，本地衍生材料记录 1,760 人 28 日状态明确、395 人死亡、57 人状态未知；SOFA 在第 1、4、7 日的非缺失数为 1,750、1,542、1,296，乳酸由 855 降至 223。XBJ-SCAP 随机分配 710 人；现有衍生材料记录全分析集 675 人、符合方案集 617 人、全分析集且基线 SOFA 至少 2 分的操作性人群 671 人、严格重叠人群 658 人；SOFA 第 0、4、8 日非缺失数为 703、628、610，白细胞计数为 704、634、614，C 反应蛋白为 579、503、467，675 人具有 28 日状态。这些是条件性输入现状，不是新分析结果。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-010
    category: inputs_and_resources
    source_locator: "Feasibility, resources, risks, alternatives, and stop conditions > Current feasibility and evidence status"
    protected_content: >-
      数据库存在、版本和文献已核验，但团队访问凭证、数据使用协议、下载、存储、确切提取版本和校验记录尚未核验；双数据库实际样本、事件、转移、医院、跨院患者、共同指标和接口支持尚未生成；关键人员只定义了角色，具名人员和工时尚未核验；候选模型、模拟恢复、主要任务、外部验证及随机试验新结果均尚未生成；临床尺度到模拟参数的映射、多类别校准估计量、区间构造和阈值登记尚未冻结。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-011
    category: inputs_and_resources
    source_locator: "Feasibility, resources, risks, alternatives, and stop conditions > Current feasibility and evidence status; Resources and governance"
    protected_content: >-
      本地试验材料只是项目内衍生清洗或验证报告，不能替代个体数据授权、原始病例报告表或统计分析计划、数据字典或持有人确认，以及随机分组、中心、访视、生存与住院语义核验。最低人员配置包括具名重症临床或表型负责人、纵向统计负责人、系统辨识负责人、数据工程负责人、模型实现人员和独立外部验证数据保管人；角色规范不能写成人员承诺。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-012
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Protocol locks for the two primary clinical tasks > Event time, information availability time, prediction times, and sensitivity definitions"
    protected_content: >-
      主要 Sepsis-3 标签使用培养与系统抗菌药首次实际给药配对：采集在先时给药须在 72 小时内，给药在先时采集须在 24 小时内，感染时间取两者较早者；无慢性器官功能障碍记录时基线 SOFA 为 0，有记录时使用入 ICU 前 24 小时最低可计算 SOFA；滚动 24 小时最差 SOFA 相对基线增加至少 2 分且位于感染前 48 小时至后 24 小时时，以首次满足时为发病时间。信息可用时间取配对中较晚事件及必要 SOFA 数据可见或最终确认时间的最大值，后到信息不得回填。敏感性定义保留对称前后 24 小时配对，以及对所有人使用感染前 24 小时最低 SOFA 并将器官功能窗限制为感染前后各 24 小时。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-013
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Protocol locks for the two primary clinical tasks > Primary pre-onset task column"
    protected_content: >-
      发病前主要任务从 ICU 第 12 小时起每 12 小时形成动态预测，使用此前最多 24 小时且至少 12 小时、在当时已经可用的信息，估计未来 12 小时内首次发病的累积发生函数。发病前存活离开 ICU、院内死亡、转院或失访是互斥终止，行政性结束按独立删失并进行 IPCW 与界限敏感性分析。主要模型先用离散时间多项式原因别风险再转为累积发生函数；主要评价为 12 小时 Brier 分数及绝对校准截距和斜率，精确率—召回率曲线下面积、提前量和假警报为次要指标。重叠预测窗保留，但每次 ICU 入住总权重为 1，并处理患者和医院聚类。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-014
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Protocol locks for the two primary clinical tasks > Primary post-onset task column; Mutually exclusive post-onset state and event system"
    protected_content: >-
      发病后每 12 小时更新，主要终点为病程第 7 日，第 14 日为敏感性分析。主要估计目标是第 7 日处于“生理恢复或存活离开 ICU”有利集合的概率，同时分别报告两种状态；采用互斥离散多状态模型与 Aalen–Johansen 估计。状态优先级固定为死亡、转院或无法继续观察、存活离开 ICU、恶化或新发器官衰竭、生理恢复、持续脓毒症；恢复需 SOFA 相对发病参考下降至少 2 分且连续 24 小时无新恶化，恶化包括 SOFA 相对此前 24 小时最低值增加至少 2 分或新启用/升级血管活性药、有创通气或连续性肾脏替代治疗。死亡、存活离开 ICU 和转院为终止状态，生理恢复不得用出院替代。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-015
    category: design_analysis_and_validation
    source_locator: "Data, materials, and existing evidence base > Variable-role separation; Research design and methods > Protocol locks > leakage audit paragraph"
    protected_content: >-
      生理测量、治疗行动、测量过程、标签专用变量和基线协变量必须保持分离。治疗启停、剂量和测量频率不得作为潜在生理状态锚点；未检测不得视为正常，医院接口缺失不得视为患者生理状态；SOFA 与抗菌药的标签用途须用独立副本并按信息可用时间隔离。泄漏审计必须覆盖发病后信息、同窗后续行动、未来测量频率、跨分组插补或标准化、同一患者或重复住院/ICU 入住跨集合、重叠窗权重，以及由结局决定的变量、时间间隔或阈值。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-016
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Observational model target, anchoring, and reporting"
    protected_content: >-
      模型目标是在实际照护和测量条件下估计潜在状态 X、生理测量 Y、治疗行动 A、测量过程 M、基线 B 与数据库或医院 S 的联合预测或生成分布，并导出发病风险、对齐后的状态占用概率与转移概率、共同生理锚点预测，以及预设关系的正负符号和 1 或 2 个冻结时间窗的滞后。每个潜在维度至少用两个跨数据库共同指标锚定，第一个锚点载荷固定为 +1 并据此标准化，未指定交叉载荷固定为 0 或采用预写稀疏模式；不允许同窗瞬时循环。20 个固定随机种子拟合必须在允许的维度排列和符号变换后完成状态对齐再报告。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-017
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Observational model target, anchoring, and reporting > missingness and treatment paragraph"
    protected_content: >-
      可能非随机缺失的主要拟合必须并列保留缺失随机基线和选择模型基线，两者均显式表示测量过程，不得在当前计划中预先择一。模式混合偏移固定为开发库标准差的 -1、-0.5、0、+0.5、+1，并实施选择模型临界点分析。每个对齐状态、医院和时间层均须报告治疗行动概率与有效样本量。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-018
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Simulation and semi-synthetic recovery study"
    protected_content: >-
      月 7–10 在不读取最终外部验证结果的条件下开展 Monte Carlo 与半合成模拟。数据生成机制必须包括正确指定、无结构边或独立状态、额外状态或过度复杂、遗漏状态、错误滞后和错误观测模型，并交叉改变状态分离度、切换率、滞后、治疗政策反馈、隐藏混杂、非随机缺失、标签误差、访视频率、整院接口缺失和数据库差异。评价必须包括状态恢复、转移误差与覆盖、关系符号和滞后恢复、结构边灵敏度与错误发现率、无结构边错误判断、错设识别或拒绝报告比例，以及概率校准。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-019
    category: design_analysis_and_validation
    source_locator: "Feasibility, resources, risks, alternatives, and stop conditions > Operational thresholds table > Event/transition support, simulation sufficiency, state/transition recovery, structure/misspecification, calibration/stability rows"
    protected_content: >-
      数值准入与恢复门槛保持不变：开发库和外部库中每个自由风险参数分别至少有 20 和 10 个事件，每个自由转移参数分别至少有 20 和 10 次转移；每个潜在维度至少 2 个共同锚点，每个锚点在任一数据库合格窗的实测比例至少 30%，覆盖至少 70% 合格医院和 80% 合格患者。每个核心模拟情景至少 1,000 次重复，或关键比例的 MCSE 不高于 0.02。离散状态 ARI 或连续状态主要典型相关至少 0.80，20 个种子之间状态匹配率至少 90%，主要转移平均绝对误差不高于 0.05，95% 区间覆盖为 0.90–0.98。关系符号或滞后恢复率及边检测灵敏度至少 0.80，错误发现率不高于 0.10；无边情景错误边区间排除 0 的比例不高于 0.05；错设识别或不报告比例至少 80%，对错误结构作高置信判断比例不高于 0.05。校准斜率为 0.80–1.20、绝对概率偏差不高于 0.02；种子间一致匹配率至少 90%，自助法保留率及外部符号一致率至少 80%，跨数据库状态对齐至少 0.70，区间覆盖须经校准。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-020
    category: design_analysis_and_validation
    source_locator: "Feasibility, resources, risks, alternatives, and stop conditions > Operational thresholds table > Nonrandom missingness/treatment overlap and two primary tasks rows"
    protected_content: >-
      非随机缺失的预设偏移或选择模型临界点若改变主要解释，必须报告敏感区间；某行动在对应状态、医院和时间层的发生比例须在 5%–95% 之间，加权有效样本量至少为名义样本量的 20%，否则合并或删除相应状态/行动层并限制解释。两项主要任务在开发、跨时间和隔离外部验证中的 Brier 或多类别 Brier 分数，相对最强简单基线差值的上侧 95% 界不得高于 +0.01；校准斜率须为 0.80–1.20，校准截距对应的绝对风险误差不得高于 0.02。次要诊断、试验结果或复杂模型不得替代主要任务失败。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-021
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Hospital-based cross-database validation > hospital split and cross-hospital patient rules"
    protected_content: >-
      在任何结局导向选择前，eICU 医院按合格体量四分位和接口完整性分层，再按医院标识符与固定种子 20260717 可复现地分为 30% 适配医院和 70% 预先隔离、未参与开发的验证医院；分组、患者链接算法版本和校验记录必须在查看验证结局前冻结。同一可链接患者若跨适配和验证医院，其全部记录从主要外部分析排除，不按患者重新分组；须在查看模型表现前报告排除规模和预定基线特征，并保留“验证集优先的患者—医院连通分量”敏感性分析。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-022
    category: design_analysis_and_validation
    source_locator: "Research design and methods > Hospital-based cross-database validation > three external analyses"
    protected_content: >-
