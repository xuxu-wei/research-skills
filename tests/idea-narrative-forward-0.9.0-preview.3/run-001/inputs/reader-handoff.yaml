schema_version: 1
artifact_id: reader-handoff-forward-001
version: v001
path: tests/idea-narrative-forward-0.9.0-preview.3/run-001/inputs/reader-handoff.yaml
target_reader_profile:
  primary_readers:
    - critical-care medicine principal investigators
    - clinical epidemiology researchers
    - longitudinal statistics and system-identification researchers
    - systems science, medical AI, and translational research investigators
  reading_purpose: decide whether the research question, contribution, and staged design warrant further scientific development
reader_prior_knowledge:
  may_assume:
    - general familiarity with critical-care research and longitudinal clinical data
    - general familiarity with validation, uncertainty, and observational-versus-interventional evidence
  must_not_assume:
    - familiarity with project-internal workflow vocabulary
    - familiarity with newly coined labels or metaphors
    - detailed expertise in every participating discipline
terms_requiring_definition:
  rule: define any core term that is not directly understandable across the listed disciplines at first use
reader_reasoning_chain:
  - establish the research problem and its boundary
  - summarize what existing work can currently answer
  - identify the unresolved scientific or evidence gap
  - explain why closing that gap matters
  - show why the proposed design is a justified response to that gap
language: zh-CN
