  - action_id: NRP-004
    addresses_findings:
      - NAR-004
    priority: major
    dossier_locator:
      section_heading: "Expected outputs, falsification criteria, and interpretations"
      subsection_heading: "Falsification and stop criteria"
      content_anchor: "RCT 投影：共同锚点/单位/时序、SVD 低维性"
    operation: consolidate
    current_problem: >-
      同一解释边界、失败条件和停止规则在摘要、核心假设、日期条件、方法、证据链、解释矩阵、贡献表与风险矩阵中多次完整出现，限制内容没有单一权威位置。
    target_state: >-
      一个权威小节完整收纳所有独特限制、失败条件和停止后果；其他位置只保留会直接改变紧邻设计选择含义的最小局部边界，重复内容被删除而不是再次总结。
    required_content_or_function: >-
      逐项合并观察性与因果边界、外部零更新与有限更新的解释边界、试验投影与独立备用端点的解释边界、数据和结果尚未生成的状态、创新与应用边界，以及各阶段停止或降级条件；保留触发条件和后果之间的一一对应。
    content_to_preserve:
      - "观察性结果不识别治疗因果效应、真实反馈网络或反事实策略。"
      - "有限更新成功不能替代未触碰零更新失败。"
      - "试验投影通过只支持实际访视的可观测摘要差异，独立 SOFA 备用端点与阶段 II 表征无关。"
      - "任何分支都不验证潜在动力学、转移边、中介、控制、整个系统或临床推广。"
      - "资源、G1、模型、模拟、外部检验和试验语义目前的未验证或未生成状态。"
      - "不主张新算法、全球首次、数字孪生、控制模型、临床工具或药物平台。"
      - "所有现有日期、数值触发条件、自动降级和停止后果。"
    content_to_remove_or_move:
      - "摘要、核心假设、证据链、解释矩阵和贡献表中不承担相邻推理功能的完整禁止性清单。"
      - "日期表、falsification 列表和风险矩阵之间语义相同的停止条件副本。"
      - "多处重复的计划状态、未验证资源和有限创新说明。"
    destination_if_moved: "Feasibility, resources, risks, alternatives, and stop conditions 下新增或扩展的单一权威“限制与停止条件”小节。"
