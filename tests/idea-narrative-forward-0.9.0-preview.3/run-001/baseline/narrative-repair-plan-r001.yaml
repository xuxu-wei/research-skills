      subsection_heading: null
      content_anchor: "One-sentence complete-Idea summary"
    operation: replace
    current_problem: >-
      单句摘要在完成正面研究概括之前纳入几乎全部检验条件、试验访视、失败分支和禁止性解释。
    target_state: >-
      单句摘要先清楚表达研究对象、核心问题、24 个月阶段 II 的主要证据目标及阶段 III 的条件性从属地位，只保留改变研究身份或允许解释范围的必要限定。
    required_content_or_function: >-
      用跨学科读者一次可解析的主干陈述全病程候选表征、公共 ICU 数据的计划性跨数据库检验和后续条件性试验再分析；将具体检验名称、访视编号、备用端点细节和完整禁止性清单放回结构化摘要、方法或限制章节。
    content_to_preserve:
      - "24 个月内完成阶段 I–II 的时间边界。"
      - "发病前、首次发病、发病后和结局连续体。"
      - "知识约束、不确定性感知的候选表征与两个须经审计的公共 ICU 数据库。"
      - "计划性未触碰跨数据库检验是阶段 II 主要证据目标。"
      - "试验再分析仅在阶段 II 后条件性开展，且不把预测或随机分配结果扩张为因果系统结论。"
    content_to_remove_or_move:
      - "绝对模拟恢复条件、具体外部更新层级和其他执行性检验名称。"
      - "EXIT-SEP D7、XBJ-SCAP D8、投影失败后的 death-ranked SOFA 细节。"
      - "真实因果网络、连续动力学、控制、数字孪生等完整禁止性枚举。"
