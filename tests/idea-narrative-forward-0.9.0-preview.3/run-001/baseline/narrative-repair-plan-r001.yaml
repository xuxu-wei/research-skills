      subsection_heading: null
      content_anchor: "最近近邻使“单个模块新颖”不可成立。"
    operation: replace
    current_problem: >-
      该节把代表性近邻未覆盖完整组合当作主要缺口，随后直接进入方法边界和条件，未独立完成证据缺口、意义与设计理由三项功能。
    target_state: >-
      该节以连续且互不替代的段落说明现有工作能回答什么、仍不能回答什么、为何值得目标读者解决，以及阶段 II 与条件性阶段 III 的每个主要设计层如何回应这一问题。
    required_content_or_function: >-
      将现有能力、未解决的跨阶段和跨数据库证据问题、该问题对可靠解释与进一步研究决策的意义、以及状态—行动—测量分离、绝对恢复检验、未触碰外部检验和条件性试验桥接的理由按依赖顺序写出；不得以“尚无完整组合”或创新定位代替科学或证据缺口。
    content_to_preserve:
      - "Sepsis-3 发病时刻和标签可用时刻并不唯一，以及禁止未来信息回填的边界与引文 [1-3]。"
      - "公共 ICU 数据库在中心、年代、采样、接口和共同概念上的差异与引文 [5-10]。"
      - "各单项模块已有代表性先例、项目仅主张条件性整合与验证增量的定位及引文 [26-37]。"
      - "治疗—病情反馈、测量过程、MNAR 与观察性目标不识别因果作用的内容及引文 [14-16]。"
      - "EXIT-SEP 与 XBJ-SCAP 的稀疏性、冻结观测投影、独立备用端点及推广边界与引文 [4,17,18,21-25]。"
    content_to_remove_or_move:
      - "把“单个模块不新颖”或“未建立全球先例”当作缺口主体的防御性展开；移至 closest-work comparison。"
      - "不直接推进本节相邻推理的完整限制和失败分支；移至权威限制与停止条件位置。"
    destination_if_moved: "Contribution, innovation, impact, application, and closest-work comparison；以及 Feasibility, resources, risks, alternatives, and stop conditions 下的权威限制与停止条件小节。"
    dependencies: []
    acceptance_test: >-
      只读本节的目标读者能够分别用一句话回答研究问题的背景、现有能力、未解决证据问题、解决该问题的意义及设计理由；意义不是创新性同义语，每个主要设计层都能追溯到前述缺口，且未新增科学主张。
  - action_id: NRP-002
    addresses_findings:
      - NAR-002
    priority: major
    dossier_locator:
