      - NRP-001
      - NRP-002
      - NRP-003
    acceptance_test: >-
      对全文逐项核对后，每一独特限制和停止条件都有且只有一个完整权威表述；其他章节中的限定均能证明其对紧邻设计选择不可缺少，删除任何重复没有丢失触发条件、后果、阶段边界或科学解释边界。
