      subsection_heading: null
      content_anchor: "Approach: 主发病前任务采用每 12 小时 landmark"
    operation: reorder
    current_problem: >-
      方法条目在解释各设计环节的读者功能之前引入多个跨学科或项目特定概念，必要定义与设计理由位于后文。
    target_state: >-
      结构化摘要自身完成问题、现状、缺口、意义、设计理由和预期贡献的短路线；每个方法概念在其功能已经明确后出现，并在首次必要使用处获得跨学科可理解的说明。
    required_content_or_function: >-
