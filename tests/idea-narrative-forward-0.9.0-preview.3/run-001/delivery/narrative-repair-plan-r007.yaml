    target_state: >-
      读者在首次遇到阶段编号时即可看到阶段 I、阶段 II、阶段 III 的边界、时间范围、所含工作和进入条件，并能把所有后续编号唯一映射回该定义。
    required_content_or_function: >-
      在顶部定向信息中增加一个简短的三阶段映射，并使 Twenty-four-month minimum deliverable、Objectives、Conditional trial observation mapping 和停止条件中的阶段用语与该映射一致；明确阶段 III 只有在阶段 II 的五类必要证据全部满足后才可能启动。
