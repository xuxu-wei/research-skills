      - 阶段 I–II 构成 24 个月最低交付、阶段 III 位于 24 个月之后的时间边界。
      - 阶段 II 成功需要五类证据全部满足，任一必要条件失败均不能由阶段 III 补足。
      - 现有月度里程碑、WP1–WP5 内容、执行顺序和停止条件。
      - 主要研究问题、四项目标和研究身份锚点。
