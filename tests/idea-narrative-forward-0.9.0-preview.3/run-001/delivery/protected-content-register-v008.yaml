protected_items:
  - protected_id: PCR-V008-001
    category: identity_and_question
    source_locator: "YAML identity_anchor; Title, summary, audience, and positioning; Primary research question"
    protected_content: >-
      研究身份仍是构建并验证覆盖发病前、首次发病、发病后状态演化与结局的脓毒症候选动态复杂系统模型，而不是普通临床预测模型或泛 ICU 风险模型；阶段 I–II 在 24 个月内完成。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-V008-002
    category: object_scope_and_boundaries
    source_locator: "YAML identity_anchor; Research design and methods"
    protected_content: >-
      研究对象、系统边界与主要推断单位保持为纵向脓毒症 ICU 患者系统及患者—时间状态和状态转移，并尊重患者与医院聚类。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-V008-003
    category: inputs_and_resources
    source_locator: "Data, materials, and existing evidence base; Current feasibility and evidence status"
    protected_content: >-
      文献与专家先验、公共 ICU 数据和条件性试验数据来源及其当前可用性、授权、语义与结果状态均不得改变或写成已经具备。
    required_revised_disposition: retained_same_status
  - protected_id: PCR-V008-004
    category: design_analysis_and_validation
    source_locator: "Research content and work packages; Research design and methods; Scientific falsification criteria"
    protected_content: >-
      分阶段方法顺序、两项主要任务、estimands、数值阈值、模拟恢复、跨数据库验证、科学证伪标准及阶段间依赖关系均保持不变。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-V008-005
    category: claims_and_evidence_status
    source_locator: "Structured abstract; Contribution and evidence ladder; Current feasibility and evidence status"
    protected_content: >-
      所有模型、恢复、外部验证和试验分析仍是计划产物；贡献、创新与可行性主张的强度和现有证据状态均不得提升。
    required_revised_disposition: retained_same_strength
  - protected_id: PCR-V008-006
    category: assumptions_limitations_and_contingencies
    source_locator: "Feasibility, resources, risks, alternatives, and stop conditions > Authoritative limitations, feasibility findings, interpretation boundaries, alternatives, and stop conditions"
    protected_content: >-
      第 14 节仍是全部关键限制、可行性发现、解释边界、替代方案和停止条件的唯一权威位置；阶段 III 保持条件性且不能补足阶段 II 失败，任何阈值、后果或风险均不得删除或弱化。
    required_revised_disposition: retained_once_at_authority_location
  - protected_id: PCR-V008-007
    category: unsupported_claim_classes
    source_locator: "Feasibility, resources, risks, alternatives, and stop conditions > Scientific and interpretive boundaries; Research identity and final boundary"
    protected_content: >-
      观察性与预测证据不支持真实因果网络、机制、控制或数字孪生；试验分支不验证未测动力学、完整系统或无条件临床应用，这些禁止主张保持不变。
    required_revised_disposition: retained_same_boundary
permitted_editorial_operations:
  - replace
  - define
  - move
  - split
  - merge
  - delete
  - reorder
  - add_bridge
  - consolidate
prohibited_changes:
  - change_study_identity_or_core_question
  - add_unreviewed_scientific_content
  - strengthen_claim_or_evidence_status
  - weaken_assumption_limitation_or_contingency
  - present_planned_work_as_completed
  - conceal_feasibility_finding
