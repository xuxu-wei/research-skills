execution_and_handoff:
  single_complete_target_dossier: true
  partial_artifacts_forbidden: true
  pre_freeze_action_compliance_required: true
  delta_after_dossier_freeze_only: true
  section_passes:
    - >-
      Pass 1 — reader core, sections 1–4: edit one complete v004 target through Title/summary/positioning,
      Structured abstract, background-current state-gap-significance-rationale, and research question/objectives/core hypothesis;
      apply NRP-001, NRP-003, LANG-001, LANG-002, LANG-004, and LANG-005 where applicable.
    - >-
      Pass 2 — research plan and technical authority, sections 5–11: edit research content, inputs/evidence, methods,
      implementation, evidence chains, required analyses, and outputs/interpretations; make the conditional-follow-up
      subsection the sole operational authority and apply all terminology actions without changing design.
    - >-
      Pass 3 — positioning, claim audit, and sole limitations authority, sections 12–14: edit contribution/comparison,
      claim-support table, feasibility/assumptions/limitations/risks/stops; retain every registered limitation and stop,
      remove only narrative duplication, and keep limitations as the sole complete limitation authority.
    - >-
      Pass 4 — references and whole-dossier concordance: preserve reference support, scan every included action and every
      PCR item against actual revised text, run exact-version structural lint, candidate scan, all-candidate disposition,
      reader-facing short-form diff, and whole-dossier role concordance; freeze v004 before writing the delta.
  delta_requirements:
    - >-
      After v004 is frozen, provide one compact row for each of NRP-001..003 and LANG-001..006 with revised locator,
      executed operation, and text-grounded acceptance result; no included item may be missing or marked complete by assertion alone.
    - >-
      Provide one compact row for each PCR-001..PCR-052 with revised locator(s), item-level preservation evidence, and
      required disposition; do not copy the protected text or long dossier excerpts.
    - >-
      Record a reader-facing concordance for central object, primary question/task, primary outcome, contribution,
      task-three prediction target, model-recovery diagnostic, missingness weighting, and prediction time origin:
      one name, first-use locator, competing forms removed/reclassified, and all-occurrence scan result for each.
    - >-
      Record the short-form diff from v003 to frozen v004 and dispose every scanner candidate as retained-and-clear,
      defined, replaced, deleted-as-duplication, or not-reader-facing, each with locator and brief rationale; this is an
      execution receipt, not a second finding or repair list.
    - >-
      State that identity_anchor values were copied verbatim; limitations PCR-031..041 and stops PCR-042..048 were
      re-opened in v004; all branch-specific eligibility and consequences remained correctly scoped.
    - >-
      Keep the delta compact, bind both outputs to plugin version 0.10.0, and do not compute, request, report, or persist
      content hashes, digests, checksums, or timestamps as integrity substitutes.

mandatory_whole_dossier_checks:
  not_new_findings: true
  checks:
    - check: Exact research-idea.v3 structural lint for plugin version 0.10.0
      instruction: >-
        After all dossier edits and before freezing v004, run exactly:
        python research-skills-openai/skills/multi-path-idea-generator/scripts/lint_idea_dossier.py
        tests/脓毒症复杂系统模型/03_ideas/nodes/I01-001/dossiers/idea-dossier-v004.md
        --expected-plugin-version 0.10.0
      acceptance: The command exits 0 against the final frozen v004; any later edit requires rerunning it and all following checks.
    - check: Reader-facing short-form diff
      instruction: >-
        Run python research-skills-openai/skills/academic-language-assessor/scripts/diff_reader_facing_short_forms.py
        with v003 as source and frozen v004 as revised; inspect every reported added, removed, or changed form.
      acceptance: >-
        The delta records the tool result and gives a locator-level disposition for every reported form; no new ambiguous
        short form remains and the tool output is not treated as a language verdict by itself.
    - check: Full language-candidate disposition
      instruction: >-
        Run scan_idea_language_candidates.py on frozen v004 and inspect every candidate in context; record each candidate
        disposition once in the compact delta receipt, without inventing new findings.
      acceptance: >-
        Every candidate has exactly one observable disposition, all LANG-001..006 acceptance tests pass across all occurrences,
        and no unresolved major terminology competition remains.
    - check: Complete protected-content preservation
      instruction: >-
        For PCR-001 through PCR-052, reopen every source locator in v003 and every claimed revised locator in v004;
        compare actual dossier words with every enumerated commitment and required revised disposition.
      acceptance: >-
        All 52 protected IDs map to exact revised locators with item-level evidence; no numerical, temporal, analysis,
        eligibility, evidence-status, claim-boundary, assumption, limitation, or stop element is lost, broadened, or weakened.
    - check: Identity-anchor verbatim preservation
      instruction: >-
        Compare the five frontmatter identity_anchor values in v003 and v004 character for character; reader-facing titles
        and task-three wording may change, but machine-facing anchor values may not.
      acceptance: All five values are byte-for-byte identical in content and order, and the delta records this comparison.
    - check: Limitations and stopping rules
      instruction: >-
        Reopen PCR-031..041 at the sole complete limitations authority and PCR-042..048 at Risks, alternatives, and stop conditions;
        verify that consolidation removed only duplication and that every trigger, response, consequence, and non-remediation rule remains.
      acceptance: >-
        Eleven limitations and seven stop-condition items are individually locatable and not weakened; conditional RCT and animal
        branch conditions remain distinct, and no fallback is promoted into a shared prerequisite.
    - check: Scientific-scope and identity guard
      instruction: >-
        Compare v004 against v003 and the PCR for study object, four tasks, populations, databases, time axes, outcomes,
        comparators, weights, inference, thresholds, evidence status, assumptions, resources, claims, and branch logic.
      acceptance: >-
        Differences are limited to the nine normalized editorial actions; no scientific addition, deletion, choice, stronger claim,
        completed-work implication, or identity drift occurs. If any is necessary, stop and declare scientific change.
    - check: References and claim-support concordance
      instruction: >-
        Verify every retained citation still supports the adjacent claim after moves/deletions, and every claim-support-table row
        retains contribution, implementation, evidence chain, basis, actual increment, and support status without a repeated full limitation list.
      acceptance: References remain complete and correctly attached; the claim-support table preserves its audit function and scope.
    - check: Freeze-before-delta ordering and output boundaries
      instruction: >-
        Persist only the complete v004 dossier, finish all scans and lint, freeze it, then create revision-delta-v003-to-v004.md;
        do not write fragments, candidate files, or intermediate deltas.
      acceptance: >-
        Exactly the two allowed outputs exist; the delta postdates the final content decision, covers all included items/PCR/roles,
        and any subsequent dossier edit invalidates and requires rewriting the delta.
