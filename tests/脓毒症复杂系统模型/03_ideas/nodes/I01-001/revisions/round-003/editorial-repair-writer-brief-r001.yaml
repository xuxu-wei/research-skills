included_nonblocking_finding_rationale:
  NAR-003: >-
    本轮已经因两个 major narrative finding 进行集中修订；该项只要求把内部任务来源和
    裸阶段标签替换为既有科学对象名称，动作明确、无需科学选择，与 NRP-002 的范围归并
    同步完成可避免保留第二份待修清单。
  LANG-002: >-
    本轮已经因 LANG-001 进行 major language repair；模型恢复诊断的对象可由现有模拟检查
    直接确定，首用定义和全篇统一均不改变方法。
  LANG-003: >-
    概率与权重的规范名称由现有权重公式和用途唯一确定，可在同一轮全篇术语核对中直接统一，
    不改变协变量、截断、归一化或敏感性分析。
  LANG-004: >-
    预测起始时点的中文首用定义只解释现有 landmark 功能，不改变任何时点、风险集或时域。
  LANG-005: >-
    将可能暗示统计独立性的措辞改为分别报告且互不替代，直接恢复既定任务关系，不改变四任务
    Holm 家族或推断结构。
  LANG-006: >-
    两处数据库资格语句的平行动词和完整谓语可直接修复，且所有资格条件已经明确，无需补充新事实。

