  - action_id: NRP-002
    addresses_findings:
      - NAR-002
    priority: minor
    dossier_locator:
      section_heading: Title, summary, audience, and positioning
      subsection_heading: null
      content_anchor: "One-sentence complete-Idea summary 末尾的“状态表示的跨库可重复性”"
    operation: define
    current_problem: >-
      跨数据库的状态可重复性、临床锚定可分离性和状态迁移在开篇承担核心目标功能，却到方法部分才获得可解释的含义，而且与病程内“状态转移”的表达相邻。
    target_state: >-
      首次出现处提供一个简短的概念界定，使读者知道这里评价的是冻结开发状态在外部数据库中能否由可观测临床特征保持对应和可区分，而不是患者从一个状态变化到另一个状态；完整操作规则仍只在方法部分展开。
    required_content_or_function: >-
      定义须说明跨库应用冻结开发标签、使用临床可观测锚定特征判断对应与可分离性，并明确其与患者病程内状态转移的区别；无需在开篇重复占用、距离、未迁移、合并和拆分的全部判定细节。
    content_to_preserve:
      - 状态表示跨库可重复性是核心外部验证目标之一。
      - 外部数据库不重新估计或重新命名潜在状态。
      - 临床锚定特征与观测过程指标分开，且不使用验证结局修改迁移规则。
      - “External application and state-transfer diagnostics”中的占用、距离、可分离性及未迁移、合并、拆分处置规则。
    content_to_remove_or_move: []
    destination_if_moved: null
    dependencies: []
    acceptance_test: >-
      只读开篇的声明读者即可准确区分跨数据库的状态迁移或可重复性与患者病程内的状态转移，并能说明前者依赖冻结标签和临床可观测锚定；方法部分仍是完整指标与判定规则的唯一位置，且未增加新的科学主张。
