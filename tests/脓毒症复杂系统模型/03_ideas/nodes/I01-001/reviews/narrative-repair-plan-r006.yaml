      content_anchor: "**Confirmatory family.** 数据资格和最小模型可辨识性是进入外部确认性评价前必须实证满足的条件。"
    operation: consolidate
    current_problem: >-
      D_kc、Delta_k、max-t 重采样、单侧上置信界、任务 p 值和 Holm 判定规则的完整说明位于主问题与目标之间，并与“Multiplicity and overall interpretation”的完整方法说明重复。
    target_state: >-
      本节按主问题、目标、核心假设的顺序完成正向研究陈述，只保留识别四项确认性任务及其共同判定原则所需的简短说明；全部公式、同时推断和 Holm 实施细节在方法部分集中说明一次。
    required_content_or_function: >-
      保持四项任务各自形成一个确认性假设、主要模型须同时优于任务内全部比较模型、患者级汇总、四任务家族错误率控制及任务通过条件；完整方法说明须让读者能够恢复 D_kc、Delta_k、置信界、p 值与 Holm 程序之间的关系。
    content_to_preserve:
      - 四项任务各自唯一的确认性假设及负损失差有利于主要模型的方向。
      - 每位患者先在任务内汇总、Delta_k 取相对全部比较模型的最不利平均损失差。
      - 患者级 max-t 同时推断、单侧上置信界、任务 p 值和四任务 Holm 控制的全部既定规则。
      - 任务须同时满足上置信界小于 0 和 Holm 调整后 p 值小于 0.05 的既定通过规则。
    content_to_remove_or_move:
      - 从主问题与 Objectives 之间移出关于 D_kc、Delta_k、max-t、比较模型 p 值最大值和 Holm 程序的完整技术段落。
      - 合并两处对同一推断程序的完整解释，避免研究问题部分和方法部分各保留一套可被视为权威的技术说明。
    destination_if_moved: "Research design and methods > Multiplicity and overall interpretation"
    dependencies: []
    acceptance_test: >-
