    operation: move
    current_problem: >-
      Background 在 Current state、Gap 和 Significance 之前给出本研究选择的状态表示，
      且 Rationale 随后再次解释同一选择。
    target_state: >-
      Background 以病程随时间变化以及治疗、测量和结局相互依赖的问题前提收束；
      Rationale 在 Gap 和 Significance 之后首次说明为何采用开放动态表示。
    required_content_or_function: >-
      保持五段式论证的单向顺序，并在 Rationale 中明确连接动态临床问题、未解决缺口与拟议
      受约束状态模型。
    content_to_preserve:
      - "治疗和环境作为时间变化输入的科学前提"
      - "器官功能、生理观测与低维状态之间的关系"
      - "首次发生、恢复、恶化、存活出 ICU 和死亡作为病程事件"
    content_to_remove_or_move:
      - "Background 末句中以“因而本研究把”开头的拟议表示说明"
    destination_if_moved: "Background, current state, gap, significance, and rationale > Rationale 的开头，与现有设计顺序说明合并"
    dependencies: []
    acceptance_test: >-
      顺序阅读五个小节时，Background 不再在 Current state 和 Gap 之前宣布方案；Rationale
      能独立说明开放动态表示如何回应 Gap，且相关科学组成没有丢失或重复成第二段完整说明。
  - action_id: NRP-002
    addresses_findings:
