      完整的 24 小时操作定义和事件编码。
    required_content_or_function: >-
      首次使用处须让读者知道持续恢复要求稳定的器官功能改善和停止主要器官支持，并且不
      等同于存活出 ICU；具体阈值和时长仍由方法部分权威规定。
    content_to_preserve:
      - "持续恢复作为任务二的首次事件"
      - "完整操作定义中的存活、停止三类器官支持、六个器官功能域和连续 24 小时条件"
      - "存活出 ICU 单独编码且不自动等同恢复"
    content_to_remove_or_move: []
    destination_if_moved: null
    dependencies: []
