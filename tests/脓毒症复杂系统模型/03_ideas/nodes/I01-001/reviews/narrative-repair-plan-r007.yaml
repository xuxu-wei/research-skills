      section_heading: "Title, summary, audience, and positioning"
      subsection_heading: null
      content_anchor: "“动态状态模型”在本研究中指"
    operation: consolidate
    current_problem: >-
      开篇定义段把理解核心构想所需的入口定义、跨数据库诊断的操作细节和一个后文不再使用
      的复杂系统标签放在同一层级，重复了方法部分已有的技术权威说明。
    target_state: >-
      开篇只解释理解题目、摘要和主要问题所需的模型、全病程、约束、外部验证及状态表示诊断
