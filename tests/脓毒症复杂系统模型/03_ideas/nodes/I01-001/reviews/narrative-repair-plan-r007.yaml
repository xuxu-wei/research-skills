    destination_if_moved: "Research design and methods > Four task-level summary hypotheses > H3 保留科学理由和操作定义；Result-dependent interpretations 与 Limitations and boundary conditions 各保留其必要的局部边界"
    dependencies: []
    acceptance_test: >-
      Working assumptions 只包含真正未确认的条件；H3 在不借助“用户提出的”等产出过程表述
