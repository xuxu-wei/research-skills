      保留跨学科入口所需的最小概念桥梁，同时让跨数据库诊断的特征集合、分布距离和判定逻辑
      由 External application and cross-database state-representation diagnostics 统一承载。
    content_to_preserve:
      - "动态状态模型概括器官功能和生理构型并表示停留与允许转移的读者级含义"
      - "全病程从感染风险入口覆盖首次发生及发病后结局的边界"
      - "约束来自建模前文献与结构化专家程序"
      - "外部验证使用冻结模型直接应用于异质数据库的基本含义"
      - "治疗、测量和环境与病程持续交互的科学前提"
    content_to_remove_or_move:
      - "开篇对六个器官功能域、生命体征、器官支持、短时变化、占用、分布距离和可分离性的成套操作说明"
      - "只在开篇出现的“人体开放复杂巨系统”标签"
    destination_if_moved: "Research design and methods > External application and cross-database state-representation diagnostics；已经完整存在的细节不再重复添加"
    dependencies: []
    acceptance_test: >-
      开篇每个保留术语都直接服务于题目、摘要或主要问题的一次阅读；跨数据库诊断的具体特征
      与规则只在方法权威位置完整出现；Background 仍明确表达治疗、测量和环境交互的科学前提。
  - action_id: NRP-004
    addresses_findings:
      - NAR-004
    priority: minor
    dossier_locator:
