      subsection_heading: null
      content_anchor: "One-sentence complete-Idea summary 中首次出现“持续恢复”"
    operation: define
    current_problem: >-
      核心结局“持续恢复”在多个摘要和论证位置使用后，才在方法部分被说明为不同于存活出
      ICU 的特定复合事件。
    target_state: >-
