      - 文献—专家约束表在主模型拟合前验收的顺序
      - 12–18 个月核心实证研究与条件性后续研究的范围边界
      - “人体开放复杂巨系统”被操作化为动态临床系统视角而非既定模型类别的科学含义
    content_to_remove_or_move:
      - “用户给定目标”“用户提出”“用户设定”“用户四项候选标准”等任务来源措辞
      - 未同时说明科学对象的“第一阶段”“第二阶段”“第三阶段”标签
      - 仅用于恢复内部项目背景、对科学推理没有新增作用的阶段指代
    destination_if_moved: null
    dependencies:
      - NRP-002
    acceptance_test: >-
      搜索全文不再出现以“用户”说明研究目标来源的措辞；每个阶段性指代在原位即可识别其科学对象，不需要读者查找项目阶段定义。四项任务、约束材料、核心实证研究和条件性后续研究之间的顺序与范围关系仍与修订前一致。
