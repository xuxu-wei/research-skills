      content_anchor: "不能支持“首个”“完整”"
    source_context_locator: null
    protected_content: >-
      不支持“首个”“完整系统”“无人研究”、首次建立完整人体系统或首次使用动态状态方法的主张。
    required_revised_disposition: retained_as_explicitly_unsupported
  - protected_id: PCR-050
    category: unsupported_claim_classes
    source_locator:
      section_heading: "## Feasibility, resources, risks, alternatives, and stop conditions"
      subsection_heading: "### Limitations and boundary conditions"
      content_anchor: "模型中的边、权重和治疗系数只能解释为预测性条件时间关联"
    source_context_locator: null
    protected_content: >-
      观察性电子病历中的边、权重和治疗系数不支持因果调控、最优治疗、治疗作用、反事实个体效应或中介网络主张；只能解释为预测性条件时间关联。
    required_revised_disposition: retained_as_explicitly_unsupported
  - protected_id: PCR-051
    category: unsupported_claim_classes
    source_locator:
      section_heading: "## Feasibility, resources, risks, alternatives, and stop conditions"
      subsection_heading: "### Limitations and boundary conditions"
      content_anchor: "预测改善不等于临床效用"
    source_context_locator: null
    protected_content: >-
      潜在状态恢复、临床特征所作的状态跨库诊断、任务预测或观测重建均不能证明真实生物状态；预测改善不支持临床效用、真实世界效果、可部署性、治疗建议、机制或监管用途，这些均需独立后续研究。
    required_revised_disposition: retained_as_explicitly_unsupported
  - protected_id: PCR-052
    category: unsupported_claim_classes
    source_locator:
      section_heading: "## Research design and methods"
      subsection_heading: "### Conditional randomized-trial and animal follow-up"
      content_anchor: "任何 RCT 结果都不能把核心实证研究未通过的任务改写为通过"
    source_context_locator: null
    protected_content: >-
      随机试验或动物研究不支持改写核心实证研究未通过的任务；随机分配不自动识别中介网络，动物结果不构成临床模型的外部验证，也不能补救核心研究失败。
    required_revised_disposition: retained_as_explicitly_unsupported
permitted_editorial_operations:
  - replace
  - define
  - move
  - split
  - merge
  - delete
  - reorder
  - add_bridge
  - consolidate
prohibited_changes:
  - change_study_identity_or_core_question
  - add_unreviewed_scientific_content
  - strengthen_claim_or_evidence_status
  - weaken_assumption_limitation_or_contingency
  - present_planned_work_as_completed
  - conceal_feasibility_finding
