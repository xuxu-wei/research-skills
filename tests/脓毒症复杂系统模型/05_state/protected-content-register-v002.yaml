      content_anchor: "1. 当前证据来自有界检索"
    source_context_locator: null
    protected_content: >-
      当前证据来自有界检索而非穷尽性系统综述，不能支持“首个”“完整”、无人研究、首次建立完整人体系统或首次使用动态状态方法的主张；2026 年来源须在论文定稿时复核。
    required_revised_disposition: retained_not_weakened
  - protected_id: PCR-032
    category: assumptions_and_limitations
    source_locator:
      section_heading: "## Feasibility, resources, risks, alternatives, and stop conditions"
      subsection_heading: "### Limitations and boundary conditions"
      content_anchor: "2. 尚未取得候选数据库"
    source_context_locator: null
    protected_content: >-
      尚未取得候选数据库的项目访问批准、真实样例提取和完整变量字典；数据库存在不等于本项目已经具备许可、共同变量和足够信息量。
    required_revised_disposition: retained_not_weakened
  - protected_id: PCR-033
    category: assumptions_and_limitations
    source_locator:
      section_heading: "## Feasibility, resources, risks, alternatives, and stop conditions"
      subsection_heading: "### Limitations and boundary conditions"
      content_anchor: "3. 数据库之间的人群、实践、变量语义、采样和结局定义不同"
    source_context_locator: null
    protected_content: >-
      数据库在人群、实践、变量语义、采样和结局定义上不同；外部差异可能同时反映病例组合、标签和观测过程。
    required_revised_disposition: retained_not_weakened
  - protected_id: PCR-034
    category: assumptions_and_limitations
    source_locator:
      section_heading: "## Feasibility, resources, risks, alternatives, and stop conditions"
      subsection_heading: "### Limitations and boundary conditions"
      content_anchor: "4. 感染风险入口、脓毒症标签、首次索引时点"
    source_context_locator: null
    protected_content: >-
      感染风险入口、脓毒症标签、首次索引时点、任务时域和持续恢复定义会影响结果，须以冻结代码和预定敏感性分析界定。
    required_revised_disposition: retained_not_weakened
  - protected_id: PCR-035
    category: assumptions_and_limitations
    source_locator:
      section_heading: "## Feasibility, resources, risks, alternatives, and stop conditions"
      subsection_heading: "### Limitations and boundary conditions"
      content_anchor: "5. 观察性电子病历中的治疗和测量"
    source_context_locator: null
    protected_content: >-
      观察性电子病历中的治疗和测量受病情与既往处置影响；模型中的边、权重和治疗系数只能解释为预测性条件时间关联，不能识别因果调控、最优治疗、治疗作用、反事实个体效应或中介网络。
    required_revised_disposition: retained_not_weakened
  - protected_id: PCR-036
    category: assumptions_and_limitations
    source_locator:
      section_heading: "## Feasibility, resources, risks, alternatives, and stop conditions"
      subsection_heading: "### Limitations and boundary conditions"
      content_anchor: "6. 临床锚定迁移只评价表示的跨库可重复性"
    source_context_locator: null
    protected_content: >-
      临床特征所作的跨库状态表示诊断只评价表示的跨库可重复性；开发期潜在状态恢复诊断只评价设定模型与模拟机制下的可辨识性；观测模型重建只评价观测过程；任何一项都不能证明真实生物状态。任务三也仅评价遮蔽实测变量预测，不能把潜在状态当作真值。
    required_revised_disposition: retained_not_weakened
  - protected_id: PCR-037
    category: assumptions_and_limitations
    source_locator:
      section_heading: "## Feasibility, resources, risks, alternatives, and stop conditions"
      subsection_heading: "### Limitations and boundary conditions"
      content_anchor: "7. 外部验证只适用于"
    source_context_locator: null
    protected_content: >-
      外部验证仅适用于所研究的人群、共同变量、风险集、时域和医疗环境；预测改善不等于临床效用、真实世界效果、可部署性、治疗建议、机制或监管用途，这些均需独立后续研究。
    required_revised_disposition: retained_not_weakened
  - protected_id: PCR-038
    category: assumptions_and_limitations
    source_locator:
      section_heading: "## Feasibility, resources, risks, alternatives, and stop conditions"
      subsection_heading: "### Limitations and boundary conditions"
      content_anchor: "8. 目标值被观测的概率"
    source_context_locator: null
    protected_content: >-
      目标值被观测的概率、逆观测概率权重和逆删失概率权重依赖冻结模型与可观测历史；极端权重、未测量驱动因素或跨库观测政策差异可能造成残余偏倚。
    required_revised_disposition: retained_not_weakened
  - protected_id: PCR-039
    category: assumptions_and_limitations
    source_locator:
      section_heading: "## Feasibility, resources, risks, alternatives, and stop conditions"
      subsection_heading: "### Limitations and boundary conditions"
      content_anchor: "9. EXIT-SEP 与 XBJ-SCAP"
    source_context_locator: null
    protected_content: >-
      EXIT-SEP 与 XBJ-SCAP 的数据权限、逐时变量和功效未核实；既有 EXIT-SEP 表型分析造成重叠风险，随机分配也不自动识别中介网络。
    required_revised_disposition: retained_not_weakened
  - protected_id: PCR-040
    category: assumptions_and_limitations
    source_locator:
      section_heading: "## Feasibility, resources, risks, alternatives, and stop conditions"
      subsection_heading: "### Limitations and boundary conditions"
      content_anchor: "10. 动物研究缺少"
    source_context_locator: null
    protected_content: >-
      动物研究缺少具体机制、平台、样本量、伦理和预算；人鼠可转化性证据存在冲突，动物结果不能作为临床模型外部验证。
    required_revised_disposition: retained_not_weakened
  - protected_id: PCR-041
    category: assumptions_and_limitations
    source_locator:
      section_heading: "## Feasibility, resources, risks, alternatives, and stop conditions"
      subsection_heading: "### Limitations and boundary conditions"
      content_anchor: "11. 建模前文献—专家约束表"
    source_context_locator: null
    protected_content: >-
      建模前文献—专家约束表、核心团队和计算承诺目前尚未完成；12–18 个月只约束核心实证研究，条件性后续研究没有既定时间和资源承诺。
    required_revised_disposition: retained_not_weakened
  - protected_id: PCR-042
    category: assumptions_and_limitations
    source_locator:
      section_heading: "## Feasibility, resources, risks, alternatives, and stop conditions"
      subsection_heading: "### Risks, alternatives, and stop conditions"
      content_anchor: "月 2 末不能形成一个开发库和一个异质外部库的合格组合"
    source_context_locator: null
    protected_content: >-
      若月 2 末不能形成一开发库加一异质外部库的合格组合，只可按预登记顺序核验替代库且不得查看模型表现；替代后仍失败即停止跨库主分析，不进入潜在状态模型。
    required_revised_disposition: retained_not_weakened
  - protected_id: PCR-043
    category: assumptions_and_limitations
    source_locator:
      section_heading: "## Feasibility, resources, risks, alternatives, and stop conditions"
      subsection_heading: "### Risks, alternatives, and stop conditions"
      content_anchor: "约束表缺少核心字段、最低专家构成、共识或异议记录"
    source_context_locator: null
    protected_content: >-
      若约束表缺少核心字段、最低专家构成、共识或异议记录，须补齐专家轮次和逐项记录，不得由数据团队代填；月 2 末仍不合格则不开始主模型拟合。
    required_revised_disposition: retained_not_weakened
  - protected_id: PCR-044
    category: assumptions_and_limitations
    source_locator:
      section_heading: "## Feasibility, resources, risks, alternatives, and stop conditions"
      subsection_heading: "### Risks, alternatives, and stop conditions"
      content_anchor: "核心团队角色未书面落实或计算基准不足"
    source_context_locator: null
    protected_content: >-
      若核心团队角色未书面落实或计算基准不足，先取消第三库、额外亚组和非必需消融并重新基准；五个核心角色仍不齐，或两库模拟、重采样和复现仍不能完成，则停止复杂模型路线。
    required_revised_disposition: retained_not_weakened
  - protected_id: PCR-045
    category: assumptions_and_limitations
    source_locator:
      section_heading: "## Feasibility, resources, risks, alternatives, and stop conditions"
      subsection_heading: "### Risks, alternatives, and stop conditions"
      content_anchor: "模拟或内部时间验证显示最小统一模型不可恢复"
    source_context_locator: null
    protected_content: >-
      若模拟或内部时间验证显示最小统一模型不能按预定判据稳定恢复关键参数、潜在状态或关键转移，须按状态数、转移、停留时间和交互顺序简化并重跑参数与潜在状态恢复诊断；最小模型仍不能覆盖全病程则停止统一潜在状态主张。
    required_revised_disposition: retained_not_weakened
  - protected_id: PCR-046
    category: assumptions_and_limitations
    source_locator:
      section_heading: "## Feasibility, resources, risks, alternatives, and stop conditions"
      subsection_heading: "### Risks, alternatives, and stop conditions"
      content_anchor: "外部必需状态未迁移、合并或拆分"
    source_context_locator: null
    protected_content: >-
      外部必需状态未迁移、合并或拆分时，保留开发标签并报告受影响状态，不得用结局重定义或强制匹配；完整状态表示失败，受影响任务按预定可执行规则失败，其他任务最多部分支持。
    required_revised_disposition: retained_not_weakened
  - protected_id: PCR-047
    category: assumptions_and_limitations
    source_locator:
      section_heading: "## Feasibility, resources, risks, alternatives, and stop conditions"
      subsection_heading: "### Risks, alternatives, and stop conditions"
      content_anchor: "一个或多个任务未通过 Holm 调整"
    source_context_locator: null
    protected_content: >-
      一个或多个任务未通过 Holm 调整时，仍报告其估计量和区间且不改变其他任务检验；未通过任务明确不受支持，不能由其他任务、有限校准、第三库、随机试验或动物研究补救。
    required_revised_disposition: retained_not_weakened
  - protected_id: PCR-048
    category: assumptions_and_limitations
    source_locator:
      section_heading: "## Feasibility, resources, risks, alternatives, and stop conditions"
      subsection_heading: "### Risks, alternatives, and stop conditions"
      content_anchor: "不能由独立分析者复现"
    source_context_locator: null
    protected_content: >-
      数据抽取、任务摘要、Holm 结论或状态跨库诊断若不能由独立分析者复现，须暂停结果解释并核对字段血缘、患者聚类、权重和代码；核心结果仍不能复现则不得提交全病程状态或外部验证主张。
    required_revised_disposition: retained_not_weakened
  - protected_id: PCR-049
    category: unsupported_claim_classes
    source_locator:
      section_heading: "## Feasibility, resources, risks, alternatives, and stop conditions"
