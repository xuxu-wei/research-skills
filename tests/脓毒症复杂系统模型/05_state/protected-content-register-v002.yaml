protected_items:
  - protected_id: PCR-001
    category: identity_and_question
    source_locator:
      section_heading: "## Research question, objectives, and core hypothesis"
      content_anchor: "**Primary research question.** 在成人重症监护感染风险患者中"
    source_context_locator: null
    protected_content: >-
      主要研究问题是：在成人重症监护感染风险患者中，由合格文献—专家约束预先限定并区分生理状态、测量过程和治疗记录的低维全病程动态状态模型，能否在一个开发数据库稳定估计，并在一个异质外部数据库分别优于任务特异简单比较模型，预测首次脓毒症发生、死亡或持续恢复、从部分已观测历史预测被有意遮蔽但实际测得的临床变量及后续演化过程，同时保持临床锚定状态的跨库可分离性；第三项任务不以潜在生理状态作为真值或验证端点。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-002
    category: identity_and_question
    source_locator:
      section_heading: "## Research question, objectives, and core hypothesis"
      content_anchor: "Objectives."
    source_context_locator: null
    protected_content: >-
      四项目标依次为：建模前验收变量本体和结构约束表并实证确认开发库、异质外部库、核心团队及计算条件；在开发库用模拟、参数与潜在状态恢复诊断和内部时间验证确定状态数与复杂度并冻结覆盖感染风险、首次发生及发病后演化的统一模型；把冻结模型直接应用于外部患者，按预定患者级汇总规则平行评价四项确认性假设并用不含验证结局的临床锚定特征评价开发状态迁移；分别给出四项任务的通过、未通过和不确定性，按通过任务与可迁移状态限定总体或部分支持并保存可复现失效边界。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-055
    category: identity_and_question
    source_locator:
      section_heading: "## Research question, objectives, and core hypothesis"
      content_anchor: "**Core hypothesis.** 在所有实施前置条件满足且最小统一模型可辨识的条件下"
    source_context_locator: null
    protected_content: >-
      核心假设是：所有实施前置条件满足且最小统一模型可辨识时，受约束全病程动态状态模型在异质外部数据库四个任务级患者汇总损失均低于各自预定简单比较模型；第三项损失仅由被有意遮蔽但实际测得的临床变量计算；必需临床锚定状态保持跨库可分离性。
    required_revised_disposition: retained_same_meaning_at_hypothesis_authority
  - protected_id: PCR-003
    category: object_scope_and_boundaries
    source_locator:
      section_heading: "## Title, summary, audience, and positioning"
      content_anchor: "“动态状态模型”在本研究中指"
    source_context_locator: null
    protected_content: >-
      研究对象为成人 ICU 患者从感染风险、首次脓毒症发生到发病后恢复、恶化、存活出 ICU 或死亡的全病程。同一状态空间、训练样本和预测接口从感染风险队列入口开始，显式包含首次发生并继续覆盖发病后状态及终末事件；任何索引后窗口只用于任务评价。模型须区分生理、观测和处置过程；约束来自文献与结构化专家程序；外部验证是在模型、变量映射、状态标签、任务代码、比较模型、权重和判定规则冻结后直接用于未参与开发的异质数据库患者。动态临床系统视角保留治疗、测量和外部环境的持续信息交换。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-004
    category: object_scope_and_boundaries
    source_locator:
      section_heading: "## Research design and methods"
      subsection_heading: "### Unified full-course population, time axis, and state space"
      content_anchor: "统一训练样本从成人 ICU 住院中首次满足冻结感染风险入口的时点开始"
    source_context_locator: null
    protected_content: >-
      统一训练样本从成人 ICU 住院中首次满足冻结感染风险入口时开始，至存活出 ICU、死亡或行政删失。未发生脓毒症者保留在感染风险状态族并贡献任务一和全病程轨迹；发生者经冻结的首次 Sepsis-3 电子病历实现进入首次发生转移并继续贡献发病后状态、恢复、恶化、出 ICU 和死亡转移。患者身份在特征构建前隔离，同一患者重复住院归入同一分割。状态空间的五类功能组成是感染风险未发病状态、首次发生转移、发病后低维器官功能与临床支持状态、持续恢复或恶化状态、存活出 ICU 和死亡吸收事件。
    required_revised_disposition: retained_same_meaning_at_method_authority
  - protected_id: PCR-005
    category: object_scope_and_boundaries
    source_locator:
      section_heading: "## Title, summary, audience, and positioning"
      content_anchor: "本构想的实证核心是在 12–18 个月内完成"
    source_context_locator: null
    protected_content: >-
      12–18 个月实证核心仅包括一个公开开发库和一个异质外部库的模型构建、验证、复现和论文。随机试验二次分析与动物机制研究均为该时间表之外、须满足各自预定条件后另行启动的后续研究，不是核心实证研究的必需资源或交付，也不能改变核心研究失败任务的结论。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-056
    category: object_scope_and_boundaries
    source_locator:
      section_heading: "## Title, summary, audience, and positioning"
      content_anchor: "- **Positioning and contribution frame:** 核心身份是统一全病程动态复杂系统模型的构建与外部验证"
    source_context_locator: null
    protected_content: >-
      核心身份是统一全病程动态复杂系统模型的构建与外部验证。感染风险期、首次脓毒症发生和发病后演化由同一个冻结模型表示；四项预定验证任务各自形成一个确认性假设，不设跨任务总准确率，也不以某一个索引后综合指标统领其余任务。
    required_revised_disposition: retained_same_meaning
  - protected_id: PCR-006
    category: inputs_and_resources
    source_locator:
      section_heading: "## Data, materials, and existing evidence base"
      subsection_heading: "### Pre-model constraint-table prerequisite"
      content_anchor: "主模型拟合前，约束表必须覆盖"
    source_context_locator: null
    protected_content: >-
      主模型拟合前，约束表须覆盖感染风险状态族、首次脓毒症转移、发病后器官功能构型、恢复与恶化、存活出 ICU 与死亡，区分治疗输入、生理观测、观测过程和事件结局，登记允许、禁止和不确定转移、时间滞后与尺度、来源、专家支持、反对理由和数据库可映射性。专家组至少有两名脓毒症或重症医师、一名系统科学或系统辨识专家、一名纵向统计或生存分析专家和一名重症临床数据或人工智能专家；记录利益冲突和缺席，先独立判断再至少一轮匿名理由反馈。强制约束须获至少 80% 参与者支持，且至少一名临床成员和一名方法学成员支持；否则标为不确定且不能作为强制边。共识、少数意见、未解决异议和最终处置逐项保存。
    required_revised_disposition: retained_same_meaning_at_input_authority
  - protected_id: PCR-007
    category: inputs_and_resources
    source_locator:
      section_heading: "## Data, materials, and existing evidence base"
      subsection_heading: "### Required inputs and database constitution"
      content_anchor: "12–18 个月核心实证研究固定使用一个公开成人重症监护纵向开发数据库"
    source_context_locator: null
    protected_content: >-
      核心研究固定需要一个公开成人 ICU 纵向开发库和一个在人群、中心构成、地域或照护流程上异质的公开外部库。候选来源不等于已取得访问、字段适配或足够信息量；月 1–2 仅在项目级授权、真实样例提取和逐概念映射全部通过后按预登记顺序确定两库，且不得依据模型表现、外部状态可分离性或任务结果选择或替换。开发库须支持全病程队列、模型构建、模拟校准、内部时间验证和阈值冻结；外部库须能执行同一核心标签、6 小时网格和共同变量表，与开发库患者及机构独立，且外部结局不参与开发选择。共同变量须包括可按预定规则遮蔽并评分的实测临床变量。
    required_revised_disposition: retained_same_meaning_at_input_authority
  - protected_id: PCR-008
    category: inputs_and_resources
    source_locator:
      section_heading: "## Data, materials, and existing evidence base"
      subsection_heading: "### Database, team, and compute qualification"
      content_anchor: "每个候选库均须报告共同变量及单位"
    source_context_locator: null
    protected_content: >-
      每个候选库须用真实样例证明共同变量与单位、时间戳精度、各病程阶段测量密度、患者数、首次发病及恢复、恶化、出 ICU、死亡事件数、候选状态占用、有效患者级转移、随访删失、重复住院、版本、许可和允许用途；有效转移必须有可判定起止点及足够前后观测，不能以表格行数代替。月 2 前须书面落实临床、系统辨识、纵向统计、数据和独立复现五个核心负责人及工时责任，并以候选样例结构实测全病程模拟、最小模型多初值拟合、患者级重采样和外部评分的时间与存储。任一项不通过，只能按预登记顺序换库、削减非核心分析或停止复杂模型路线。研究不采用跨疾病通用事件数硬阈值；信息量标准由开发结构下的预先模拟、参数与潜在状态恢复诊断和内部试点确定，并在访问外部结局性能或状态可分离结果前冻结。
    required_revised_disposition: retained_same_meaning_at_input_authority
  - protected_id: PCR-009
    category: inputs_and_resources
    source_locator:
      section_heading: "## Data, materials, and existing evidence base"
      subsection_heading: "### Required inputs and database constitution"
      content_anchor: "第三公开数据库"
    source_context_locator: null
    protected_content: >-
      第三公开数据库仅在两库核心结果锁定后另行通过同一资格审计时作为可选压力测试，不进入四任务 Holm 家族或总体判定。EXIT-SEP 或 XBJ-SCAP 个体数据仅属条件性后续资源；当前使用权、逐时变量和功效均未核实，也不是核心实证研究输入。
    required_revised_disposition: retained_same_meaning_at_input_authority
  - protected_id: PCR-057
    category: inputs_and_resources
    source_locator:
      section_heading: "## Key techniques and implementation"
      content_anchor: "跨库概念协调："
    source_context_locator: null
    protected_content: >-
      每个共同概念须保存原始字段、单位、时间戳来源、聚合窗、异常值和缺失编码；数据库特异变量不得进入主要跨库模型。
    required_revised_disposition: retained_same_meaning_at_input_authority
  - protected_id: PCR-010
    category: design_analysis_and_inference
    source_locator:
      section_heading: "## Research design and methods"
      subsection_heading: "### Unified full-course population, time axis, and state space"
      content_anchor: "持续恢复定义为"
    source_context_locator: null
    protected_content: >-
      持续恢复定义为患者存活、脱离侵入性机械通气、血管活性药物和肾脏替代治疗，且六个器官功能域连续 24 小时不再满足冻结的脓毒症相关恶化标准；它是任务二的首次事件，但统一模型仍允许随后恶化或出 ICU。存活出 ICU 单独编码，不自动等同恢复。模型以真实时间运行；6 小时网格仅用于共同特征生成和任务评分，任何索引后 6、12、24、48、72 小时或未来 24 小时、7 日窗口仅是任务起始点或时域，不改变从感染风险入口至出 ICU 或死亡的病程边界。
    required_revised_disposition: retained_same_meaning_at_method_authority
  - protected_id: PCR-011
    category: design_analysis_and_inference
    source_locator:
      section_heading: "## Research design and methods"
      subsection_heading: "### Primary model and task-specific comparators"
      content_anchor: "主要模型为受约束隐半马尔可夫全病程动态状态模型"
    source_context_locator: null
    protected_content: >-
      主要模型是受约束隐半马尔可夫全病程动态状态模型：有限潜在状态表示低维器官功能构型，停留时间分布允许转移风险随状态持续时间变化，观测模型连接生命体征、实验室和器官支持，观测过程模型表示是否测量、频率和距上次测量时间，治疗记录作为时间变化输入进入转移模型；治疗系数仅用于条件预测，不估计治疗作用。任务一至四各有两个预定简单比较模型，并与主要模型使用完全相同的队列、共同变量、信息截断、时间轴、结果编码、风险集、权重和评分代码；每项以相对全部比较模型的最不利平均损失差判定，同时优于全部比较模型才通过。
    required_revised_disposition: retained_same_meaning_at_method_authority
  - protected_id: PCR-012
    category: design_analysis_and_inference
    source_locator:
      section_heading: "## Research question, objectives, and core hypothesis"
      content_anchor: "Confirmatory family."
    source_context_locator: null
    protected_content: >-
      数据资格和最小模型可辨识性是进入外部确认性评价前必须实证通过的前置条件，而不是统计假设；通过后仅检验四个任务级原假设。每位患者先汇总所有预测起始时点、时域和结果组成的加权损失；对任务 k，D_kc 是主要模型相对比较模型 c 的患者级平均损失差，Delta_k 是其中最大值，原假设为 Delta_k 大于或等于 0、备择为小于 0，负值有利。任务内以患者级 max-t 重采样覆盖全部比较模型并给出单侧 95% 上置信界；任务 p 值取各比较模型单侧配对检验 p 值最大值，检验同时优于全部比较模型的交并假设。四个任务 p 值进入家族错误率 0.05 的 Holm step-down；另报告每个比较的患者级平均差和双侧 95% 置信区间。任务仅在上置信界小于 0 且 Holm 调整后 p 值小于 0.05 时通过。
    required_revised_disposition: retained_once_at_authority_location
  - protected_id: PCR-013
    category: design_analysis_and_inference
    source_locator:
      section_heading: "## Research design and methods"
      subsection_heading: "### Four task-level summary hypotheses"
      content_anchor: "H1：是否及何时首次发生脓毒症"
    source_context_locator: null
    protected_content: >-
      H1 从感染风险入口起每 6 小时设预测起始点，风险集为仍在 ICU、尚未首次脓毒症且未死亡者；结果为随后 6、12、24 小时的首次脓毒症、先存活出 ICU、先死亡、仍无上述事件四类状态向量，使用多类别 Brier 损失，转院或行政终止按删失。三个时域等权，患者内所有合格起始点等权汇总；比较重复预测起始点离散时间竞争风险模型与简单感染—脓毒症多状态 Markov 模型，以 Delta_1 的最不利比较和共同通过规则判定。
    required_revised_disposition: retained_same_meaning_at_method_authority
  - protected_id: PCR-014
    category: design_analysis_and_inference
    source_locator:
      section_heading: "## Research design and methods"
      subsection_heading: "### Four task-level summary hypotheses"
      content_anchor: "H2：何时转向死亡或持续恢复"
    source_context_locator: null
    protected_content: >-
      H2 的预测起始点为首次脓毒症索引后 6、12、24、48、72 小时，风险集为仍存活、在 ICU 且此前未持续恢复者；在索引后 24、48、72、168 小时中晚于起始点的时点，结果为首次死亡、首次持续恢复、先存活出 ICU 且未先恢复、此前均未发生四类状态向量，使用多类别 Brier 损失。每个起始点只纳入其后的绝对时域，合格起始点—时域对等权并在患者内汇总；比较简单竞争风险多状态模型与重复预测起始点竞争风险模型，以 Delta_2 和共同通过规则判定。
    required_revised_disposition: retained_same_meaning_at_method_authority
  - protected_id: PCR-015
    category: design_analysis_and_inference
    source_locator:
      section_heading: "## Research design and methods"
      subsection_heading: "### Four task-level summary hypotheses"
      content_anchor: "H3：从部分已观测历史预测被有意遮蔽的实测临床变量"
    source_context_locator: null
    protected_content: >-
      H3 在全病程 6 小时网格上，对确有真实测量的六个器官功能域和三类器官支持构造预定 12 小时连续块遮蔽；预测起始点为遮蔽开始，输入仅含此前和其他未遮蔽观测。连续变量按开发库冻结尺度变换，二元支持按 Bernoulli 分布编码；目标是遮蔽块内实际测得的值，潜在生理状态不是该任务的真值、标签或验证端点，也不由该任务直接验证。使用冻结预测分布在遮蔽实测值上的负对数评分；九个结果域等权，域内变量、遮蔽块和预测起始点等权，并以逆观测概率权重校正；比较带开发库估计不确定性的最近一次观测模型与简单条件分布模型，以 Delta_3 和共同通过规则判定。预测区间覆盖只作校准诊断，不进入 H3。
    required_revised_disposition: retained_same_meaning_at_method_authority
  - protected_id: PCR-016
    category: design_analysis_and_inference
    source_locator:
      section_heading: "## Research design and methods"
      subsection_heading: "### Four task-level summary hypotheses"
      content_anchor: "H4：预测后续演化过程及结果"
    source_context_locator: null
    protected_content: >-
      H4 从感染风险入口起每 6 小时设预测起始点，风险集为仍在 ICU 且存活者；结果为随后 24、48、72、168 小时的可观测状态向量，包括是否仍在感染风险期、是否已首次脓毒症、六个器官功能域类别、三类器官支持、持续恢复、存活出 ICU 和死亡，吸收事件后保持吸收编码，使用各结果域多类别 Brier 损失。四时域和结果域等权，患者内所有起始点先汇总；比较简单全病程多状态 Markov 模型与不含潜在状态的重复预测起始点轨迹模型，以 Delta_4 和共同通过规则判定。
    required_revised_disposition: retained_same_meaning_at_method_authority
  - protected_id: PCR-017
    category: design_analysis_and_inference
    source_locator:
      section_heading: "## Research design and methods"
      subsection_heading: "### Four task-level summary hypotheses"
      content_anchor: "所有基础权重均在开发阶段冻结"
    source_context_locator: null
    protected_content: >-
      基础权重在开发阶段冻结：预测起始点和时域基础权重相等，结果域先等权再域内等权，逆删失或逆观测概率权重乘入后在患者内重新归一，使每位患者对任务总体均值贡献相等。权重模型形式、协变量、截断分位数和无穷权重处理均须开发期冻结；外部库仅按冻结算法用截至起始点的资料估计删失概率或目标被观测概率，外部潜在状态、任务预测和结局不得进入权重模型。患者级重采样以患者为单位并保持重复住院聚类。死亡和存活出 ICU 按事件或竞争事件而非删失；观测权重仅用于实际测量可评分的纵向组成与任务三目标。主分析用冻结截断规则；不截断、替代截断和完整病例仅属敏感性分析且不改变主判定。
    required_revised_disposition: retained_same_meaning_at_method_authority
  - protected_id: PCR-018
    category: design_analysis_and_inference
    source_locator:
      section_heading: "## Research design and methods"
      subsection_heading: "### Complexity selection and identifiability"
      content_anchor: "若最高复杂度未通过"
    source_context_locator: null
    protected_content: >-
      开发阶段须依据资格审计所得全病程测量密度、缺失、删失、患者、事件和有效转移结构模拟，检查状态占用、参数偏倚、区间覆盖、标签交换、弱转移恢复和预测稳定性，并在内部时间分割完成多初值与后验预测诊断；数值阈值、重复次数和通过规则须在接触外部结局或外部可分离性之前冻结。最高复杂度失败时，按减少状态数、合并支持不足转移、简化停留时间分布、移除非必要交互的顺序简化并逐步重跑恢复诊断。最小统一模型仍不能同时恢复感染风险、首次发生和发病后关键转移时，停止潜在状态和全病程统一模型主张，不得缩窄为索引后模型后继续宣称全病程成功。
    required_revised_disposition: retained_same_meaning_at_method_authority
  - protected_id: PCR-019
    category: design_analysis_and_inference
    source_locator:
      section_heading: "## Research design and methods"
      subsection_heading: "### External application and state-transfer diagnostics"
      content_anchor: "开发完成后，状态数、全部参数、状态标签"
    source_context_locator: null
    protected_content: >-
      开发完成后冻结状态数、全部参数、状态标签、标准化、变量映射、允许转移、任务代码、比较模型和权重；外部库只接收冻结模型及截至当前时点的共同变量历史，不重新估计潜在状态、状态数、转移参数或观测参数，也不重命名状态。用于比较开发状态的临床变量仅包括六个器官功能域、同期生命体征、当前器官支持和短时变化方向；开发期冻结各状态分布、距离、最小占用和可分离规则，且不得用验证结局修改。未满足占用或距离规则为未迁移；两个开发状态在外部不可分离为合并；一个开发状态分成多个不相容子分布为拆分；不存在为获得表面对应而作一一匹配。测量指示、频率和距上次测量时间仅作独立观测过程诊断，不能提高生理状态的跨库判定。
    required_revised_disposition: retained_same_meaning_at_method_authority
  - protected_id: PCR-020
    category: design_analysis_and_inference
    source_locator:
      section_heading: "## Research design and methods"
      subsection_heading: "### External application and state-transfer diagnostics"
      content_anchor: "必需状态”在开发阶段定义为"
    source_context_locator: null
    protected_content: >-
      必需状态在开发期定义为至少服务一个任务且通过最小占用与有效转移要求的状态。任一必需状态未迁移，或同一病程阶段的必需状态合并或拆分，均不支持完整状态表示；若受影响状态不改变已通过任务的可观测预测，最多支持这些任务而不支持完整状态表示；若该失败使某任务的预定风险集、预测状态或结果域不可执行，该任务直接未通过。
    required_revised_disposition: retained_same_meaning_at_method_authority
  - protected_id: PCR-021
    category: design_analysis_and_inference
    source_locator:
      section_heading: "## Research design and methods"
      subsection_heading: "### Multiplicity and overall interpretation"
      content_anchor: "实施前条件满足后，四项任务同时估计"
    source_context_locator: null
    protected_content: >-
      前置条件通过后四项任务平行估计，无任务顺序，某一任务结果不停止其他任务。每个比较模型的患者级配对损失差采用同一 max-t 重采样，固定 10,000 次；任务 p 值取单侧 p 值最大值，任务上置信界为最不利比较的同时单侧 95% 上界；四任务用 Holm step-down。并列 p 值按任务编号处理，排序后依次与 0.05/4、0.05/3、0.05/2、0.05 比较，首次未拒绝时停止拒绝后续排序假设。总体支持要求四任务均通过、所有必需状态迁移且无严重泄漏或独立复现失败；部分支持只能按通过任务或可迁移状态限定；资格或最小模型失败、四任务全未通过或状态失败使关键病程阶段无法解释时判为失败。有限校准仅可在无调整结果锁定后、与最终评价互斥的外部校准样本中调整基线风险或截距，不得改状态、边、比较变量或任务摘要；有限校准及第三库仅为敏感性证据，不替代无调整判定。
    required_revised_disposition: retained_same_meaning_at_method_authority
  - protected_id: PCR-022
    category: design_analysis_and_inference
    source_locator:
      section_heading: "## Research content and work packages"
      content_anchor: "月 1–2"
    source_context_locator: null
    protected_content: >-
      12–18 个月核心安排是：月 1–2 完成两库资格、约束表、团队和计算验收；月 3–6 完成全病程开发、比较模型、模拟恢复、内部验证与规则冻结；月 7–12 将冻结模型无调整应用于一个异质外部库，先作状态与观测过程诊断，再平行估计四任务和 Holm，并在月 12 前形成核心结果；月 13–18 完成预定敏感性、独立复现、代码与变量映射及论文，可选第三库结果单列。随机试验和动物研究不在该时间表内。
    required_revised_disposition: retained_same_meaning_at_method_authority
  - protected_id: PCR-023
    category: design_analysis_and_inference
    source_locator:
      section_heading: "## Research design and methods"
      subsection_heading: "### Conditional randomized-trial and animal follow-up"
      content_anchor: "只有 12–18 个月核心实证研究达到总体支持"
    source_context_locator: null
    protected_content: >-
      只有核心实证研究达到总体支持、模型和代码冻结、EXIT-SEP 使用权与逐时变量确认、交互功效及与既有表型分析的差异核验完成后，才可另行提出随机治疗效应修饰问题。随机分配直接支持分配治疗比较，但不自动识别中介网络。XBJ-SCAP 仅在重症社区获得性肺炎边界和测量时点适配时单独使用；任何随机试验结果都不能将核心实证研究未通过任务改写为通过。
    required_revised_disposition: retained_same_meaning_at_method_authority
  - protected_id: PCR-024
    category: design_analysis_and_inference
    source_locator:
      section_heading: "## Research design and methods"
      subsection_heading: "### Conditional randomized-trial and animal follow-up"
      content_anchor: "只有合格随机试验分析与人类观察结果共同提出"
    source_context_locator: null
    protected_content: >-
      只有合格随机试验分析与人类观察结果共同提出具体、可干预且可测机制，并具备平台、伦理和样本量依据时，才另行设计符合 MQTiPSS 与 ARRIVE 2.0 的动物研究。动物结果不是临床模型外部验证，也不能补救核心实证研究失败。
    required_revised_disposition: retained_same_meaning_at_method_authority
  - protected_id: PCR-053
    category: design_analysis_and_inference
    source_locator:
      section_heading: "## Research design and methods"
      subsection_heading: "### Conditional randomized-trial and animal follow-up"
      content_anchor: "随机试验与动物研究各自按其资格和后果启动"
    source_context_locator: null
    protected_content: >-
      随机试验与动物研究按各自资格和后果独立启动；其中一项不可行不取消另一项在满足自身资格后开展的可能性。两类后续研究均不得替代核心两库研究或补救其失败。
    required_revised_disposition: retained_same_meaning_at_method_authority
  - protected_id: PCR-054
    category: design_analysis_and_inference
    source_locator:
      section_heading: "## Feasibility, resources, risks, alternatives, and stop conditions"
      subsection_heading: "### Working assumptions"
      content_anchor: "任务三的固定操作化说明。"
    source_context_locator: null
    protected_content: >-
      公开观察性重症监护数据库不提供潜在生理状态金标准，因此任务三固定操作化为：给定部分已观测临床历史，预测按预定规则被有意遮蔽但实际测得的临床变量。这是固定设计要素而非把潜在状态视为真值的工作假设；任务三即使成功也仅支持测量补全用途，不支持潜在状态恢复。任务三所需共同目标变量、可评分遮蔽块、观测概率权重稳定性和外部可执行性须在资格审计中实证通过，不能作为假设继续。
    required_revised_disposition: retained_same_meaning_at_method_authority
  - protected_id: PCR-058
    category: design_analysis_and_inference
    source_locator:
      section_heading: "## Required analyses and evidence"
      subsection_heading: "### During development"
      content_anchor: "审计患者级时间泄漏、同一患者跨切分"
    source_context_locator:
      section_heading: "## Expected outputs, falsification criteria, and interpretations"
      subsection_heading: "### Falsification criteria"
      content_anchor: "任务增益只来自数据库测量强度、标签实现、信息泄漏或不一致权重处理"
    protected_content: >-
      必须审计患者级时间泄漏、同一患者跨切分、未来信息构建标签、比较模型处理不一致和外部数据参与选择。若任务增益仅来自数据库测量强度、标签实现、信息泄漏或不一致权重处理，则构成预定证伪情形，不能解释为模型获得有效外部预测支持。
    required_revised_disposition: retained_not_weakened
  - protected_id: PCR-025
    category: claims_and_evidence_status
    source_locator:
      section_heading: "## Data, materials, and existing evidence base"
      subsection_heading: "### Existing evidence base"
      content_anchor: "临床定义、公开数据库存在性"
    source_context_locator: null
    protected_content: >-
      代表性来源支持临床定义、公开数据库存在与异质性、外部性能下降、信息性缺失以及动态表型和状态空间近邻；标签实现影响主要由一项针对性研究支持；EXIT-SEP、XBJ-SCAP 和 EXIT-SEP 表型事后分析各有直接来源。该证据是研究设计依据而不是本研究已经获得的结果，也不支持“首个”或“完整系统”主张。
    required_revised_disposition: retained_same_strength
  - protected_id: PCR-026
    category: claims_and_evidence_status
    source_locator:
      section_heading: "## Structured abstract"
      content_anchor: "Expected result"
    source_context_locator: null
    protected_content: >-
      状态与转移模型、四个任务级比较结果、状态与观测过程诊断、总体支持、部分支持或失败均是预期产物而非已完成结果。计划贡献是把文献—专家结构、全病程潜在状态模型、四任务确认性评价和异质外部验证组成可证伪路线，为脓毒症复杂系统研究提供可重复的预测性表示；不宣称得到真实生物状态、因果网络或可部署治疗工具。
    required_revised_disposition: retained_same_strength
  - protected_id: PCR-027
    category: claims_and_evidence_status
    source_locator:
      section_heading: "## Contribution, innovation, impact, application, and closest-work comparison"
      subsection_heading: "### Bounded contribution frame"
      content_anchor: "本研究的计划贡献有三项"
    source_context_locator: null
    protected_content: >-
      计划贡献限定为三项：以合格约束表、项目级数据资格、团队和计算条件及参数与潜在状态恢复诊断使模型复杂度由可支持的信息结构决定；以一个统一模型覆盖感染风险、首次发生和发病后演化，同时将四目标各压缩为患者级确认性假设并控制家族错误率；将冻结开发模型直接用于外部患者，以预定临床特征诊断开发状态跨库表现并单列测量强度。贡献性质仅为方法整合、外部验证和失效边界证据。
    required_revised_disposition: retained_same_strength
  - protected_id: PCR-028
    category: claims_and_evidence_status
    source_locator:
      section_heading: "## Expected outputs, falsification criteria, and interpretations"
      subsection_heading: "### Result-dependent interpretations"
      content_anchor: "结果模式"
    source_context_locator: null
    protected_content: >-
      四任务全通过、所有必需状态跨库满足规则且独立复现成功时，只能在研究数据库、共同变量、风险集和时域内支持预测性全病程表示及四项外部用途，不推导真实生物状态或因果治疗关系。一至三项通过时仅支持通过任务；四任务通过但非必需状态的跨库表现不完整时只支持四项可观测预测用途及可迁移状态；仅 H3 通过只支持从部分已观测历史预测预定遮蔽实测临床变量的测量补全用途，不支持潜在状态恢复或全病程演化；开发重建好但状态跨库表现或外部任务全失败只支持开发环境观测重建；有限校准或第三库优于核心结果仅属环境差异和失效边界敏感性证据，不改写无调整两库判定。
    required_revised_disposition: retained_same_strength
  - protected_id: PCR-029
    category: assumptions_and_limitations
    source_locator:
      section_heading: "## Feasibility, resources, risks, alternatives, and stop conditions"
      subsection_heading: "### Working assumptions"
      content_anchor: "WA-01"
    source_context_locator: null
    protected_content: >-
      WA-01：尚未确认最终论文是否只呈现核心实证研究；暂按核心实证研究可独立形成完整实证论文、后续研究可另文或后续整合推进。核心身份、四任务、两库路线和核心交付不因成果组织改变；月 3 协议冻结前确认，若不成立只调整成果组织、作者分工和后续整合。
    required_revised_disposition: retained_same_meaning_at_assumption_authority
  - protected_id: PCR-030
    category: assumptions_and_limitations
    source_locator:
      section_heading: "## Feasibility, resources, risks, alternatives, and stop conditions"
      subsection_heading: "### Working assumptions"
      content_anchor: "WA-02"
    source_context_locator: null
    protected_content: >-
      WA-02：可选第三数据库暂按只有两库核心结果锁定且资源允许时才加入压力测试推进。第三库不进入四任务 Holm 家族、总体判定、核心身份或月 12 必需交付；月 12 核心外部结果锁定后确认，若资格或资源不足则取消。
    required_revised_disposition: retained_same_meaning_at_assumption_authority
  - protected_id: PCR-031
    category: assumptions_and_limitations
    source_locator:
