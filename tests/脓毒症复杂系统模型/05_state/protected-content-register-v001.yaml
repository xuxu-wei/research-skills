    protected_content: >-
      四任务全通过、所有必需状态迁移且独立复现成功时，只能在研究数据库、共同变量、风险集和时域内支持预测性全病程表示及四项外部用途，不推导真实生物状态或因果治疗关系。一至三项通过时仅支持通过任务；四任务通过但非必需状态迁移不完整时只支持可观测预测用途及可迁移状态；仅 H3 通过只支持有限观测下可观测值预测；开发重建好但迁移或外部任务全失败只支持开发环境观测重建；有限校准或第三库优于核心结果仅属环境差异和失效边界敏感性证据，不改写无调整两库判定。
    required_revised_disposition: retained_same_strength
