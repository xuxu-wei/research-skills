identity_anchor:
  primary_research_question: >-
    在成人重症监护感染风险患者中，一个预先限定的低维脓毒症全病程动态状态模型能否从一个公开纵向开发数据库中稳定估计，并在一个异质外部数据库中分别改善首次脓毒症发生、死亡或持续恢复、部分观测下状态估计以及后续演化过程的预测，同时保持可重复的临床锚定状态表示？
  primary_objective: >-
    构建并外部验证一个区分生理过程、观测过程和临床处置过程的受约束统一动态状态模型，使其状态空间、训练样本和允许转移覆盖感染风险期、首次脓毒症发生及发病后恢复、恶化、出重症监护和死亡，并以四个预定任务级确认性假设给出预测用途、状态迁移性和失效边界。
  study_object: >-
    成人重症监护期间从感染风险进入、首次脓毒症发生到发病后器官功能、临床支持、恢复、恶化、存活出重症监护或死亡的全病程演化。
  core_data_or_evidence_base: >-
    达到最低完整性要求的文献与临床专家约束表，以及一个公开成人重症监护纵向开发数据库和一个异质公开成人重症监护外部验证数据库中的共同变量、治疗记录、测量过程和临床事件。
  primary_unit_of_inference: >-
    成人患者的一次重症监护住院经历及其中按预定时间定位的重复风险集、可观测病程和状态转移；任务内先汇总为患者级结果，再进行患者间推断。
