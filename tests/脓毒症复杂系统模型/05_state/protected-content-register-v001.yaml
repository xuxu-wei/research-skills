    source_locator:
      section_heading: "## Contribution, innovation, impact, application, and closest-work comparison"
      subsection_heading: "### Bounded contribution frame"
      content_anchor: "本研究的计划贡献有三项"
    source_context_locator: null
    protected_content: >-
      计划贡献限定为三项：以约束表、项目级数据资格、团队和计算门及模拟恢复诊断使模型复杂度由可支持的信息结构决定；以一个统一模型覆盖感染风险、首次发生和发病后演化，同时将四目标各压缩为患者级确认性假设并控制家族错误率；将冻结开发模型直接用于外部患者，以临床锚定诊断状态迁移并单列测量强度。贡献性质是方法整合、外部验证和失效边界证据，不是“首次完整人体系统”、真实生物实体、临床效用、因果调控或个体化治疗作用证明。
    required_revised_disposition: retained_same_strength
  - protected_id: PCR-028
    category: claims_and_evidence_status
