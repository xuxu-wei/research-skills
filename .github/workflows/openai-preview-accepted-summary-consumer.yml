name: OpenAI Preview Accepted Summary Consumer

on:
  workflow_run:
    workflows: [OpenAI Preview Accepted Evidence]
    types: [completed]

permissions: {}

concurrency:
  group: openai-preview-accepted-summary-consumer-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  validate-source-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Reject an untrusted or unsuccessful source run
        env:
          CONSUMER_COMMIT: ${{ github.sha }}
          CONSUMER_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_PATH: ${{ github.event.workflow_run.path }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_STATUS: ${{ github.event.workflow_run.status }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONSUMER_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo "consumer must run trusted default-branch code" >&2; exit 1; }
          [[ "$CONSUMER_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "consumer commit is not a full SHA" >&2; exit 1; }
          [[ "$SOURCE_REPOSITORY" == "$REPOSITORY" ]] || { echo "source repository mismatch" >&2; exit 1; }
          [[ "$SOURCE_WORKFLOW" == "OpenAI Preview Accepted Evidence" ]] || { echo "source workflow name mismatch" >&2; exit 1; }
          [[ "$SOURCE_PATH" == ".github/workflows/openai-preview-accepted-evidence.yml" ]] || { echo "source workflow path mismatch" >&2; exit 1; }
          [[ "$SOURCE_EVENT" == "workflow_dispatch" ]] || { echo "source workflow event mismatch" >&2; exit 1; }
          [[ "$SOURCE_BRANCH" == "$DEFAULT_BRANCH" ]] || { echo "source run is not bound to the default branch" >&2; exit 1; }
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "source commit is not a full SHA" >&2; exit 1; }
          [[ "$CONSUMER_COMMIT" == "$SOURCE_COMMIT" ]] || { echo "default branch advanced after the source run; rerun accepted evidence" >&2; exit 1; }
          [[ "$SOURCE_STATUS" == "completed" && "$SOURCE_CONCLUSION" == "success" ]] || { echo "source run did not complete successfully" >&2; exit 1; }
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "source run ID is invalid" >&2; exit 1; }
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || { echo "source run attempt is invalid" >&2; exit 1; }

  verify-accepted-summary:
    needs: validate-source-run
    if: ${{ needs.validate-source-run.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      deployments: read
    env:
      SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Check out the trusted consumer from the default branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Independently verify the protected run and accepted summary
        env:
          CONSUMER_RESULT: ${{ runner.temp }}/openai-preview-accepted-consumer-result.json
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/verify_openai_preview_accepted_summary.py \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --source-commit "$SOURCE_COMMIT" \
            --consumer-commit "$GITHUB_SHA" \
            --consumer-run-id "$GITHUB_RUN_ID" \
            --consumer-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$CONSUMER_RESULT"
      - name: Publish the non-overwriting consumer result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openai-preview-accepted-consumer-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/openai-preview-accepted-consumer-result.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
          include-hidden-files: false
