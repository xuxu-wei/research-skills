name: OpenAI Preview Evidence

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable prerelease tag containing the evidence assets
        required: true
        type: string
      source_commit:
        description: Full 40-hex source commit identified by the tag and evidence
        required: true
        type: string
      asset_index_pattern:
        description: Filename pattern for one-bundle GitHub Release asset indexes
        required: true
        default: openai-preview-release-asset-index-*.json
        type: string
      phase7_runtime_receipts_name:
        description: Optional Phase 7 runtime-receipt collection asset filename
        required: false
        default: ""
        type: string
      phase7_asset_index_pattern:
        description: Optional pattern selecting exactly ten Phase 7 bundle indexes
        required: false
        default: ""
        type: string
      phase8_reviewer_receipts_name:
        description: Optional Phase 8 six-review receipt collection asset filename
        required: false
        default: ""
        type: string
      phase8_retrieval_receipts_name:
        description: Optional Phase 8 six-retrieval receipt collection asset filename
        required: false
        default: ""
        type: string
      phase8_asset_index_pattern:
        description: Optional pattern selecting exactly twelve Phase 8 bundle indexes
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

jobs:
  validate-release-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Verify immutable prerelease tag and source identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_JSON: ${{ runner.temp }}/openai-preview-release.json
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import os,re,sys; value=os.environ["SOURCE_COMMIT"]; sys.exit(0 if re.fullmatch(r"[0-9a-f]{40}", value) else "source_commit must be a lowercase full 40-hex commit")'
          python -c 'import os,re,sys; value=os.environ["RELEASE_TAG"]; valid=bool(re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", value)) and ".." not in value; sys.exit(0 if valid else "release_tag contains unsupported characters")'
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_COMMIT" ]]; then
            echo "Checkout does not match source_commit" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "The requested tag is not present in the checkout" >&2
            exit 1
          fi
          if [[ "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" != "$SOURCE_COMMIT" ]]; then
            echo "The requested tag does not resolve to source_commit" >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$RELEASE_JSON"
          python -c 'import json,os,sys; data=json.load(open(os.environ["RELEASE_JSON"], encoding="utf-8")); ok=data.get("tag_name")==os.environ["RELEASE_TAG"] and data.get("prerelease") is True and data.get("draft") is False and data.get("immutable") is True; sys.exit(0 if ok else "release must be a published immutable GitHub prerelease for the requested tag")'
      - name: Download prerelease evidence assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_DIR: ${{ runner.temp }}/openai-preview-assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ASSET_DIR"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$ASSET_DIR" --clobber
          mapfile -d '' downloaded_assets < <(find "$ASSET_DIR" -maxdepth 1 -type f -print0)
          if [[ ${#downloaded_assets[@]} -eq 0 ]]; then
            echo "The prerelease has no evidence assets; refusing to synthesize a result" >&2
            exit 1
          fi
      - name: Bind evidence to the checked-out source tree
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EXPECTED_IDENTITY: ${{ runner.temp }}/openai-preview-expected-source.json
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_openai_release_ledger.py --check
          python -c 'import json,os; ledger=json.load(open("research-skills-openai/reports/release-ledger.json", encoding="utf-8"))["release"]; contracts=ledger["installable_contracts"]; identity={"plugin_version":ledger["version"],"source_commit":os.environ["SOURCE_COMMIT"],"manifest_sha256":contracts["manifest_sha256"],"registry_sha256":contracts["registry_sha256"],"skill_tree_sha256":ledger["installable_skill_tree"]["sha256"]}; json.dump({"source_identity":identity},open(os.environ["EXPECTED_IDENTITY"],"w",encoding="utf-8"),sort_keys=True)'
      - name: Validate optional Phase 7 and Phase 8 index selections
        env:
          ASSET_DIR: ${{ runner.temp }}/openai-preview-assets
          PHASE7_ASSET_INDEX_PATTERN: ${{ inputs.phase7_asset_index_pattern }}
          PHASE7_RUNTIME_RECEIPTS_NAME: ${{ inputs.phase7_runtime_receipts_name }}
          PHASE7_EVIDENCE_ROOT: ${{ runner.temp }}/openai-preview-phase7-evidence
          PHASE7_SUBSET_RESULT: ${{ runner.temp }}/openai-preview-phase7-subset.json
          PHASE8_ASSET_INDEX_PATTERN: ${{ inputs.phase8_asset_index_pattern }}
          PHASE8_EVIDENCE_ROOT: ${{ runner.temp }}/openai-preview-phase8-evidence
          PHASE8_SUBSET_RESULT: ${{ runner.temp }}/openai-preview-phase8-subset.json
          PHASE8_RETRIEVAL_RECEIPTS_NAME: ${{ inputs.phase8_retrieval_receipts_name }}
          PHASE8_REVIEWER_RECEIPTS_NAME: ${{ inputs.phase8_reviewer_receipts_name }}
        shell: bash
        run: |
          set -euo pipefail
          phase7_enabled=false
          if [[ -n "$PHASE7_RUNTIME_RECEIPTS_NAME" || -n "$PHASE7_ASSET_INDEX_PATTERN" ]]; then
            [[ -n "$PHASE7_RUNTIME_RECEIPTS_NAME" && -n "$PHASE7_ASSET_INDEX_PATTERN" ]] || { echo "Phase 7 receipt and dedicated pattern must be supplied together" >&2; exit 1; }
            phase7_enabled=true
          fi
          phase8_enabled=false
          if [[ -n "$PHASE8_REVIEWER_RECEIPTS_NAME" || -n "$PHASE8_RETRIEVAL_RECEIPTS_NAME" || -n "$PHASE8_ASSET_INDEX_PATTERN" ]]; then
            [[ -n "$PHASE8_REVIEWER_RECEIPTS_NAME" && -n "$PHASE8_RETRIEVAL_RECEIPTS_NAME" && -n "$PHASE8_ASSET_INDEX_PATTERN" ]] || { echo "Both Phase 8 receipts and the dedicated pattern must be supplied together" >&2; exit 1; }
            phase8_enabled=true
          fi
          for pattern in "$PHASE7_ASSET_INDEX_PATTERN" "$PHASE8_ASSET_INDEX_PATTERN"; do
            [[ -z "$pattern" || ( "$pattern" != */* && "$pattern" != *\\* ) ]] || { echo "dedicated asset index pattern must be a single-directory pattern" >&2; exit 1; }
          done
          phase7_indexes=()
          phase8_indexes=()
          if [[ "$phase7_enabled" == true ]]; then
            mapfile -d '' phase7_indexes < <(find "$ASSET_DIR" -maxdepth 1 -type f -name "$PHASE7_ASSET_INDEX_PATTERN" -print0 | sort -z)
            [[ ${#phase7_indexes[@]} -eq 10 ]] || { echo "Phase 7 dedicated pattern must select exactly ten indexes" >&2; exit 1; }
            python scripts/materialize_openai_preview_evidence_subset.py \
              --source-root "$ASSET_DIR" \
              --destination-root "$PHASE7_EVIDENCE_ROOT" \
              --asset-index-pattern "$PHASE7_ASSET_INDEX_PATTERN" \
              --expected-index-count 10 \
              > "$PHASE7_SUBSET_RESULT"
          fi
          if [[ "$phase8_enabled" == true ]]; then
            mapfile -d '' phase8_indexes < <(find "$ASSET_DIR" -maxdepth 1 -type f -name "$PHASE8_ASSET_INDEX_PATTERN" -print0 | sort -z)
            [[ ${#phase8_indexes[@]} -eq 12 ]] || { echo "Phase 8 dedicated pattern must select exactly twelve indexes" >&2; exit 1; }
            python scripts/materialize_openai_preview_evidence_subset.py \
              --source-root "$ASSET_DIR" \
              --destination-root "$PHASE8_EVIDENCE_ROOT" \
              --asset-index-pattern "$PHASE8_ASSET_INDEX_PATTERN" \
              --expected-index-count 12 \
              > "$PHASE8_SUBSET_RESULT"
          fi
          if [[ "$phase7_enabled" == true && "$phase8_enabled" == true ]]; then
            [[ "$PHASE7_ASSET_INDEX_PATTERN" != "$PHASE8_ASSET_INDEX_PATTERN" ]] || { echo "Phase 7 and Phase 8 dedicated patterns must differ" >&2; exit 1; }
            declare -A phase7_index_set=()
            for path in "${phase7_indexes[@]}"; do phase7_index_set["$path"]=1; done
            for path in "${phase8_indexes[@]}"; do
              [[ -z "${phase7_index_set[$path]:-}" ]] || { echo "Phase 7 and Phase 8 dedicated index selections overlap" >&2; exit 1; }
            done
            python -c 'import json,os,sys; p7=json.load(open(os.environ["PHASE7_SUBSET_RESULT"],encoding="utf-8")); p8=json.load(open(os.environ["PHASE8_SUBSET_RESULT"],encoding="utf-8")); overlap=set(p7.get("inventory",{}))&set(p8.get("inventory",{})); sys.exit(f"Phase 7 and Phase 8 evidence subsets reuse physical assets: {sorted(overlap)}" if overlap else 0)'
          fi
      - name: Validate downloaded bundle offline
        env:
          ASSET_DIR: ${{ runner.temp }}/openai-preview-assets
          ASSET_INDEX_PATTERN: ${{ inputs.asset_index_pattern }}
          EXPECTED_IDENTITY: ${{ runner.temp }}/openai-preview-expected-source.json
          VALIDATION_RESULT_DIR: ${{ runner.temp }}/openai-preview-integrity-results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$VALIDATION_RESULT_DIR"
          python -c 'import os,sys; pattern=os.environ["ASSET_INDEX_PATTERN"]; ok=bool(pattern) and "/" not in pattern and "\\" not in pattern; sys.exit(0 if ok else "asset index pattern must be a single-directory pattern")'
          mapfile -d '' asset_indexes < <(find "$ASSET_DIR" -maxdepth 1 -type f -name "$ASSET_INDEX_PATTERN" -print0 | sort -z)
          if [[ ${#asset_indexes[@]} -eq 0 ]]; then
            echo "No one-bundle Release asset indexes were downloaded" >&2
            exit 1
          fi
          declare -A seen_envelopes=()
          result_number=0
          for asset_index in "${asset_indexes[@]}"; do
            envelope_name="$(python -c 'import json,sys; from pathlib import Path; data=json.load(open(sys.argv[1],encoding="utf-8")); matches=[item.get("name") for item in data.get("assets",[]) if isinstance(item,dict) and item.get("evidence_kind")=="evidence_envelope"]; ok=len(matches)==1 and isinstance(matches[0],str) and Path(matches[0]).name==matches[0]; sys.exit("each asset index must bind exactly one safe evidence envelope name") if not ok else print(matches[0])' "$asset_index")"
            if [[ -n "${seen_envelopes[$envelope_name]:-}" ]]; then
              echo "Two asset indexes bind the same evidence envelope" >&2
              exit 1
            fi
            seen_envelopes[$envelope_name]=1
            envelope="$ASSET_DIR/$envelope_name"
            if [[ ! -f "$envelope" ]]; then
              echo "The indexed evidence envelope is missing" >&2
              exit 1
            fi
            result_number=$((result_number + 1))
            python scripts/validate_openai_preview_evidence_bundle.py \
              --asset-index "$asset_index" \
              --asset-dir "$ASSET_DIR" \
              --expected-source-identity "$EXPECTED_IDENTITY" \
              --envelope "$envelope" \
              > "$VALIDATION_RESULT_DIR/$result_number.json"
          done
          VALIDATION_RESULT_DIR="$VALIDATION_RESULT_DIR" EXPECTED_RESULT_COUNT="${#asset_indexes[@]}" python -c 'import json,os,sys; from pathlib import Path; results=[json.load(open(path,encoding="utf-8")) for path in sorted(Path(os.environ["VALIDATION_RESULT_DIR"]).glob("*.json"))]; ok=len(results)==int(os.environ["EXPECTED_RESULT_COUNT"]) and all(item.get("integrity_valid") is True and item.get("gate_eligible") is False and item.get("accepted") is False and item.get("summary",{}).get("envelope_count")==1 and item.get("summary",{}).get("claimed_preview_attested")==1 and item.get("summary",{}).get("claimed_provider_verified")==0 for item in results); sys.exit(0 if ok else "every one-bundle index must pass non-gating integrity validation and claim Preview, never provider, status")'
      - name: Authenticate Preview witnesses and Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_DIR: ${{ runner.temp }}/openai-preview-assets
          ASSET_INDEX_PATTERN: ${{ inputs.asset_index_pattern }}
          EXPECTED_IDENTITY: ${{ runner.temp }}/openai-preview-expected-source.json
          PREVIEW_RESULT_DIR: ${{ runner.temp }}/openai-preview-semantic-results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PREVIEW_RESULT_DIR"
          mapfile -d '' asset_indexes < <(find "$ASSET_DIR" -maxdepth 1 -type f -name "$ASSET_INDEX_PATTERN" -print0 | sort -z)
          if [[ ${#asset_indexes[@]} -eq 0 ]]; then
            echo "No one-bundle indexes are available for authenticated Preview verification" >&2
            exit 1
          fi
          declare -A seen_envelopes=()
          result_number=0
          for asset_index in "${asset_indexes[@]}"; do
            envelope_name="$(python -c 'import json,sys; from pathlib import Path; data=json.load(open(sys.argv[1],encoding="utf-8")); matches=[item.get("name") for item in data.get("assets",[]) if isinstance(item,dict) and item.get("evidence_kind")=="evidence_envelope"]; ok=len(matches)==1 and isinstance(matches[0],str) and Path(matches[0]).name==matches[0]; sys.exit("each asset index must bind exactly one safe evidence envelope name") if not ok else print(matches[0])' "$asset_index")"
            if [[ -n "${seen_envelopes[$envelope_name]:-}" ]]; then
              echo "Two asset indexes bind the same evidence envelope" >&2
              exit 1
            fi
            seen_envelopes[$envelope_name]=1
            envelope="$ASSET_DIR/$envelope_name"
            if [[ ! -f "$envelope" ]]; then
              echo "The indexed evidence envelope is missing" >&2
              exit 1
            fi
            result_number=$((result_number + 1))
            python tests/openai_phase8/verify_preview_evidence.py \
              --evidence-root "$ASSET_DIR" \
              --asset-index "$asset_index" \
              --envelope "$envelope" \
              --expected-source-identity "$EXPECTED_IDENTITY" \
              > "$PREVIEW_RESULT_DIR/$result_number.json"
          done
          mapfile -d '' preview_results < <(find "$PREVIEW_RESULT_DIR" -maxdepth 1 -type f -name '*.json' -print0)
          if [[ ${#preview_results[@]} -eq 0 ]]; then
            echo "Authenticated Preview verifier produced no result" >&2
            exit 1
          fi
          PREVIEW_RESULT_DIR="$PREVIEW_RESULT_DIR" EXPECTED_RESULT_COUNT="${#asset_indexes[@]}" python -c 'import json,os,sys; from pathlib import Path; results=[json.load(open(path,encoding="utf-8")) for path in sorted(Path(os.environ["PREVIEW_RESULT_DIR"]).glob("*.json"))]; preview=sum(item.get("counts_as_preview_attested") is True for item in results); provider=sum(item.get("counts_as_provider_verified") is True for item in results); ok=len(results)==int(os.environ["EXPECTED_RESULT_COUNT"]) and preview==len(results) and provider==0 and all(item.get("verdict")=="preview_attested" and item.get("gate_eligible") is True and item.get("synthetic_self_test") is False for item in results); sys.exit(0 if ok else "authenticated workflow accepts exactly one Preview result per asset index and forbids provider promotion")'
      - name: Validate Phase 7 runtime semantics
        if: ${{ inputs.phase7_runtime_receipts_name != '' }}
        env:
          ASSET_DIR: ${{ runner.temp }}/openai-preview-phase7-evidence
          ASSET_INDEX_PATTERN: ${{ inputs.phase7_asset_index_pattern }}
          RUNTIME_RECEIPTS_NAME: ${{ inputs.phase7_runtime_receipts_name }}
          EXPECTED_IDENTITY: ${{ runner.temp }}/openai-preview-expected-source.json
          PHASE7_RESULT: ${{ runner.temp }}/openai-phase7-runtime-result.json
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import os,sys; from pathlib import Path; name=os.environ["RUNTIME_RECEIPTS_NAME"]; sys.exit(0 if bool(name) and Path(name).name==name else "Phase 7 runtime receipt name must be a single safe filename")'
          runtime_receipts="$ASSET_DIR/$RUNTIME_RECEIPTS_NAME"
          if [[ ! -f "$runtime_receipts" ]]; then
            echo "The requested Phase 7 runtime receipt collection is missing" >&2
            exit 1
          fi
          python scripts/validate_openai_phase7_runtime_evidence.py \
            --evidence-root "$ASSET_DIR" \
            --runtime-receipts "$runtime_receipts" \
            --expected-source-identity "$EXPECTED_IDENTITY" \
            --asset-index-pattern "$ASSET_INDEX_PATTERN" \
            > "$PHASE7_RESULT"
          python -c 'import json,os,sys; result=json.load(open(os.environ["PHASE7_RESULT"],encoding="utf-8")); ok=result.get("accepted") is True and result.get("verification_level")=="preview_attested" and result.get("provider_verified") is False and result.get("bundle_count")==10 and result.get("receipt_count")==10 and result.get("source_immutability_verified") is True and result.get("temporary_workspace_immutability_verified") is True; sys.exit(0 if ok else "Phase 7 external runtime evidence did not satisfy all ten Preview slots")'
      - name: Validate Phase 8 reviewer and retrieval semantics
        if: ${{ inputs.phase8_reviewer_receipts_name != '' || inputs.phase8_retrieval_receipts_name != '' }}
        env:
          ASSET_DIR: ${{ runner.temp }}/openai-preview-phase8-evidence
          ASSET_INDEX_PATTERN: ${{ inputs.phase8_asset_index_pattern }}
          REVIEWER_RECEIPTS_NAME: ${{ inputs.phase8_reviewer_receipts_name }}
          RETRIEVAL_RECEIPTS_NAME: ${{ inputs.phase8_retrieval_receipts_name }}
          EXPECTED_IDENTITY: ${{ runner.temp }}/openai-preview-expected-source.json
          PHASE8_RESULT: ${{ runner.temp }}/openai-phase8-external-result.json
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import os,sys; from pathlib import Path; names=[os.environ["REVIEWER_RECEIPTS_NAME"],os.environ["RETRIEVAL_RECEIPTS_NAME"]]; ok=all(bool(name) and Path(name).name==name for name in names); sys.exit(0 if ok else "both Phase 8 receipt names must be safe single filenames")'
          reviewer_receipts="$ASSET_DIR/$REVIEWER_RECEIPTS_NAME"
          retrieval_receipts="$ASSET_DIR/$RETRIEVAL_RECEIPTS_NAME"
          if [[ ! -f "$reviewer_receipts" || ! -f "$retrieval_receipts" ]]; then
            echo "One or both requested Phase 8 receipt collections are missing" >&2
            exit 1
          fi
          python scripts/validate_openai_phase8_external_evidence.py \
            --evidence-root "$ASSET_DIR" \
            --reviewer-receipts "$reviewer_receipts" \
            --retrieval-receipts "$retrieval_receipts" \
            --expected-source-identity "$EXPECTED_IDENTITY" \
            --asset-index-pattern "$ASSET_INDEX_PATTERN" \
            > "$PHASE8_RESULT"
          python -c 'import json,os,sys; result=json.load(open(os.environ["PHASE8_RESULT"],encoding="utf-8")); distribution=result.get("retrieval_distribution",{}); ok=result.get("accepted") is True and result.get("verification_level")=="preview_attested" and result.get("provider_verified") is False and result.get("bundle_count")==12 and result.get("reviewer_slot_count")==6 and result.get("retrieval_slot_count")==6 and distribution=={"deep_research_completed":2,"deep_research_inactive_control":1,"search":3} and result.get("live_requery_count")==12 and result.get("source_immutability_verified") is True and result.get("temporary_workspace_immutability_verified") is True; sys.exit(0 if ok else "Phase 8 external evidence did not satisfy all twelve Preview slots")'
      - name: Build immutable live-verifier run summary
        env:
          ASSET_DIR: ${{ runner.temp }}/openai-preview-assets
          PREVIEW_RESULT_DIR: ${{ runner.temp }}/openai-preview-semantic-results
          RELEASE_JSON: ${{ runner.temp }}/openai-preview-release.json
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SUMMARY_PATH: ${{ runner.temp }}/openai-preview-live-verifier-summary/openai-preview-live-verifier-summary.json
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_openai_preview_verifier_summary.py \
            --result-dir "$PREVIEW_RESULT_DIR" \
            --asset-dir "$ASSET_DIR" \
            --release-json "$RELEASE_JSON" \
            --source-commit "$SOURCE_COMMIT" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --output "$SUMMARY_PATH"
      - name: Publish immutable live-verifier run summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openai-preview-live-verifier-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/openai-preview-live-verifier-summary/openai-preview-live-verifier-summary.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false
