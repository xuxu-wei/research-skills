name: OpenAI Preview Accepted Evidence

on:
  workflow_dispatch:
    inputs:
      evidence_release_tag:
        description: Immutable prerelease tag containing only the R/E/V/I evidence bundles
        required: true
        type: string
      candidate_release_tag:
        description: Separate immutable prerelease tag containing the candidate ledger and collections
        required: true
        type: string
      candidate_ledger_name:
        description: Candidate release-ledger JSON asset filename
        required: true
        default: openai-preview-accepted-release-ledger.json
        type: string
      phase7_asset_index_pattern:
        description: Filename pattern selecting exactly ten Phase 7 evidence indexes
        required: true
        default: openai-phase7-release-asset-index-*.json
        type: string
      phase8_asset_index_pattern:
        description: Filename pattern selecting exactly twelve Phase 8 evidence indexes
        required: true
        default: openai-phase8-release-asset-index-*.json
        type: string
      phase7_runtime_receipts_name:
        description: Phase 7 ten-slot runtime receipt collection asset filename
        required: true
        default: openai-phase7-runtime-receipts.yaml
        type: string
      phase8_reviewer_receipts_name:
        description: Phase 8 six-review receipt collection asset filename
        required: true
        default: openai-phase8-reviewer-receipts.yaml
        type: string
      phase8_retrieval_receipts_name:
        description: Phase 8 six-retrieval receipt collection asset filename
        required: true
        default: openai-phase8-retrieval-receipts.yaml
        type: string

permissions: {}

concurrency:
  group: openai-preview-accepted-evidence
  cancel-in-progress: false

jobs:
  validate-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Reject non-default or unsafe dispatch inputs
        env:
          CANDIDATE_LEDGER_NAME: ${{ inputs.candidate_ledger_name }}
          PHASE7_ASSET_INDEX_PATTERN: ${{ inputs.phase7_asset_index_pattern }}
          PHASE8_ASSET_INDEX_PATTERN: ${{ inputs.phase8_asset_index_pattern }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref }}
          PHASE7_RUNTIME_RECEIPTS_NAME: ${{ inputs.phase7_runtime_receipts_name }}
          PHASE8_RETRIEVAL_RECEIPTS_NAME: ${{ inputs.phase8_retrieval_receipts_name }}
          PHASE8_REVIEWER_RECEIPTS_NAME: ${{ inputs.phase8_reviewer_receipts_name }}
          CANDIDATE_RELEASE_TAG: ${{ inputs.candidate_release_tag }}
          EVIDENCE_RELEASE_TAG: ${{ inputs.evidence_release_tag }}
          TRUSTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Accepted-state verification may be dispatched only from the default branch" >&2
            exit 1
          fi
          if [[ ! "$TRUSTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The trusted default-branch commit is not a full SHA" >&2
            exit 1
          fi
          for tag in "$EVIDENCE_RELEASE_TAG" "$CANDIDATE_RELEASE_TAG"; do
            if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ || "$tag" == *..* ]]; then
              echo "release tag contains unsupported characters" >&2
              exit 1
            fi
          done
          [[ "$EVIDENCE_RELEASE_TAG" != "$CANDIDATE_RELEASE_TAG" ]] || { echo "evidence and candidate release tags must differ" >&2; exit 1; }
          for name in \
            "$CANDIDATE_LEDGER_NAME" \
            "$PHASE7_RUNTIME_RECEIPTS_NAME" \
            "$PHASE8_REVIEWER_RECEIPTS_NAME" \
            "$PHASE8_RETRIEVAL_RECEIPTS_NAME"; do
            if [[ ! "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ || "$name" == *..* ]]; then
              echo "Every evidence input must be one safe asset filename" >&2
              exit 1
            fi
          done
          [[ "$CANDIDATE_LEDGER_NAME" == *.json ]] || { echo "candidate ledger must be JSON" >&2; exit 1; }
          for pattern in "$PHASE7_ASSET_INDEX_PATTERN" "$PHASE8_ASSET_INDEX_PATTERN"; do
            [[ -n "$pattern" && "$pattern" != */* && "$pattern" != *\\* ]] || { echo "asset index pattern must be a single-directory pattern" >&2; exit 1; }
          done
          [[ "$PHASE7_ASSET_INDEX_PATTERN" != "$PHASE8_ASSET_INDEX_PATTERN" ]] || { echo "Phase 7 and Phase 8 asset index patterns must differ" >&2; exit 1; }
          [[ "$PHASE7_RUNTIME_RECEIPTS_NAME" == *.yaml || "$PHASE7_RUNTIME_RECEIPTS_NAME" == *.yml ]] || { echo "Phase 7 receipts must be YAML" >&2; exit 1; }
          [[ "$PHASE8_REVIEWER_RECEIPTS_NAME" == *.yaml || "$PHASE8_REVIEWER_RECEIPTS_NAME" == *.yml ]] || { echo "Phase 8 reviewer receipts must be YAML" >&2; exit 1; }
          [[ "$PHASE8_RETRIEVAL_RECEIPTS_NAME" == *.yaml || "$PHASE8_RETRIEVAL_RECEIPTS_NAME" == *.yml ]] || { echo "Phase 8 retrieval receipts must be YAML" >&2; exit 1; }

  validate-accepted-evidence:
    needs: validate-dispatch
    if: ${{ needs.validate-dispatch.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: openai-preview-governance
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the fixed trusted default-branch commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Bind runner-temp paths for subsequent steps
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'BUNDLE_ROOT=%s\n' "$RUNNER_TEMP/openai-preview-accepted-bundles"
            printf 'CANDIDATE_ASSET_DIR=%s\n' "$RUNNER_TEMP/openai-preview-candidate-assets"
            printf 'CURRENT_ASSET_DIR=%s\n' "$RUNNER_TEMP/openai-preview-accepted-bundles/current-release"
            printf 'ISOLATED_WORKSPACE=%s\n' "$RUNNER_TEMP/accepted-workspace"
            printf 'RELEASE_RUNNER_WORKSPACE=%s\n' "$RUNNER_TEMP/accepted-release-runner-workspace"
            printf 'TRUSTED_WORKSPACE_HASH=%s\n' "$RUNNER_TEMP/trusted-workspace.sha256"
            printf 'EXPECTED_IDENTITY=%s\n' "$RUNNER_TEMP/openai-preview-accepted-source-identity.json"
            printf 'EVIDENCE_RELEASE_JSON=%s\n' "$RUNNER_TEMP/openai-preview-evidence-release.json"
            printf 'CANDIDATE_RELEASE_JSON=%s\n' "$RUNNER_TEMP/openai-preview-candidate-release.json"
            printf 'EVIDENCE_ASSETS_JSON=%s\n' "$RUNNER_TEMP/openai-preview-evidence-assets.json"
            printf 'CANDIDATE_ASSETS_JSON=%s\n' "$RUNNER_TEMP/openai-preview-candidate-assets.json"
            printf 'EVIDENCE_COMMIT_FILE=%s\n' "$RUNNER_TEMP/openai-preview-evidence-commit.txt"
            printf 'CANDIDATE_COMMIT_FILE=%s\n' "$RUNNER_TEMP/openai-preview-candidate-commit.txt"
            printf 'RELEASE_RUNNER_RESULT=%s\n' "$RUNNER_TEMP/openai-preview-release-runner-result.json"
            printf 'PHASE78_BRIDGE_RESULT=%s\n' "$RUNNER_TEMP/openai-preview-phase78-bridge-result.json"
            printf 'ACCEPTED_SUMMARY=%s\n' "$RUNNER_TEMP/openai-preview-accepted-summary/openai-preview-accepted-summary.json"
          } >> "$GITHUB_ENV"
      - name: Hash the immutable trusted checkout
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref }}
          TRUSTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DISPATCH_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo "dispatch ref changed" >&2; exit 1; }
          [[ "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" == "$TRUSTED_COMMIT" ]] || { echo "trusted checkout SHA mismatch" >&2; exit 1; }
          [[ -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain=v1 --untracked-files=all)" ]] || { echo "trusted checkout is not clean" >&2; exit 1; }
          (
            cd "$GITHUB_WORKSPACE"
            git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum -- | sha256sum | awk '{print $1}'
          ) > "$TRUSTED_WORKSPACE_HASH"
          [[ "$(wc -c < "$TRUSTED_WORKSPACE_HASH")" -eq 65 ]] || { echo "trusted checkout hash is invalid" >&2; exit 1; }
      - name: Create an isolated accepted-evidence workspace
        env:
          TRUSTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ ! -e "$ISOLATED_WORKSPACE" ]] || { echo "isolated workspace already exists" >&2; exit 1; }
          git clone --no-hardlinks "$GITHUB_WORKSPACE" "$ISOLATED_WORKSPACE"
          git -C "$ISOLATED_WORKSPACE" checkout --detach "$TRUSTED_COMMIT"
          [[ "$(git -C "$ISOLATED_WORKSPACE" rev-parse HEAD)" == "$TRUSTED_COMMIT" ]] || { echo "isolated workspace SHA mismatch" >&2; exit 1; }
          [[ -z "$(git -C "$ISOLATED_WORKSPACE" status --porcelain=v1 --untracked-files=all)" ]] || { echo "isolated workspace is not clean" >&2; exit 1; }
          [[ ! -e "$RELEASE_RUNNER_WORKSPACE" ]] || { echo "release-runner workspace already exists" >&2; exit 1; }
          git clone --no-hardlinks "$GITHUB_WORKSPACE" "$RELEASE_RUNNER_WORKSPACE"
          git -C "$RELEASE_RUNNER_WORKSPACE" checkout --detach "$TRUSTED_COMMIT"
          [[ "$(git -C "$RELEASE_RUNNER_WORKSPACE" rev-parse HEAD)" == "$TRUSTED_COMMIT" ]] || { echo "release-runner workspace SHA mismatch" >&2; exit 1; }
          [[ -z "$(git -C "$RELEASE_RUNNER_WORKSPACE" status --porcelain=v1 --untracked-files=all)" ]] || { echo "release-runner workspace is not clean" >&2; exit 1; }
      - name: Verify both immutable release and tag identities
        env:
          CANDIDATE_RELEASE_TAG: ${{ inputs.candidate_release_tag }}
          EVIDENCE_RELEASE_TAG: ${{ inputs.evidence_release_tag }}
          GH_TOKEN: ${{ github.token }}
          TRUSTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${EVIDENCE_RELEASE_TAG}" > "$EVIDENCE_RELEASE_JSON"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${CANDIDATE_RELEASE_TAG}" > "$CANDIDATE_RELEASE_JSON"
          python -c 'import json,os,sys; pairs=((os.environ["EVIDENCE_RELEASE_JSON"],os.environ["EVIDENCE_RELEASE_TAG"]),(os.environ["CANDIDATE_RELEASE_JSON"],os.environ["CANDIDATE_RELEASE_TAG"])); values=[json.load(open(path,encoding="utf-8")) for path,_ in pairs]; ok=all(data.get("tag_name")==tag and data.get("prerelease") is True and data.get("draft") is False and data.get("immutable") is True for data,(_,tag) in zip(values,pairs)); sys.exit(0 if ok else "both releases must be published immutable prereleases for their requested tags")'
          PYTHONPATH=tests/openai_phase8 python -c 'import os; from verify_preview_evidence import validate_release_tag_target; repository=os.environ["GITHUB_REPOSITORY"]; commit=os.environ["TRUSTED_COMMIT"]; validate_release_tag_target(repository,os.environ["EVIDENCE_RELEASE_TAG"],commit); validate_release_tag_target(repository,os.environ["CANDIDATE_RELEASE_TAG"],commit)'
          printf '%s\n' "$TRUSTED_COMMIT" > "$EVIDENCE_COMMIT_FILE"
          printf '%s\n' "$TRUSTED_COMMIT" > "$CANDIDATE_COMMIT_FILE"
          evidence_release_id="$(python -c 'import json,os; print(json.load(open(os.environ["EVIDENCE_RELEASE_JSON"],encoding="utf-8"))["id"])')"
          candidate_release_id="$(python -c 'import json,os; print(json.load(open(os.environ["CANDIDATE_RELEASE_JSON"],encoding="utf-8"))["id"])')"
          collect_asset_pages() {
            local release_id="$1"
            local output="$2"
            local page_dir
            page_dir="$(mktemp -d)"
            local page=1
            while (( page <= 10000 )); do
              gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100&page=${page}" > "$page_dir/$page.json"
              count="$(python -c 'import json,sys; value=json.load(open(sys.argv[1],encoding="utf-8")); assert isinstance(value,list); print(len(value))' "$page_dir/$page.json")"
              [[ "$count" =~ ^[0-9]+$ ]] || { echo "asset page count is invalid" >&2; exit 1; }
              if [[ "$count" -eq 0 ]]; then
                break
              fi
              page=$((page + 1))
            done
            [[ "$page" -le 10000 ]] || { echo "asset pagination exceeded its hard limit" >&2; exit 1; }
            python -c 'import json,sys; from pathlib import Path; root=Path(sys.argv[1]); pages=[json.load(open(root/f"{number}.json",encoding="utf-8")) for number in range(1,int(sys.argv[2])+1)]; json.dump(pages,open(sys.argv[3],"w",encoding="utf-8"),sort_keys=True,separators=(",",":"))' "$page_dir" "$page" "$output"
          }
          collect_asset_pages "$evidence_release_id" "$EVIDENCE_ASSETS_JSON"
          collect_asset_pages "$candidate_release_id" "$CANDIDATE_ASSETS_JSON"
      - name: Download evidence release bundles into the bundle root
        env:
          CANDIDATE_LEDGER_NAME: ${{ inputs.candidate_ledger_name }}
          EVIDENCE_RELEASE_TAG: ${{ inputs.evidence_release_tag }}
          GH_TOKEN: ${{ github.token }}
          PHASE7_RUNTIME_RECEIPTS_NAME: ${{ inputs.phase7_runtime_receipts_name }}
          PHASE8_RETRIEVAL_RECEIPTS_NAME: ${{ inputs.phase8_retrieval_receipts_name }}
          PHASE8_REVIEWER_RECEIPTS_NAME: ${{ inputs.phase8_reviewer_receipts_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CURRENT_ASSET_DIR"
          [[ -z "$(find "$CURRENT_ASSET_DIR" -mindepth 1 -maxdepth 1 -print -quit)" ]] || { echo "current asset directory is not empty" >&2; exit 1; }
          gh release download "$EVIDENCE_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$CURRENT_ASSET_DIR"
          mapfile -d '' current_assets < <(find "$CURRENT_ASSET_DIR" -mindepth 1 -maxdepth 1 -type f -print0)
          [[ ${#current_assets[@]} -gt 0 ]] || { echo "evidence release downloaded no assets" >&2; exit 1; }
          [[ -z "$(find "$CURRENT_ASSET_DIR" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" ]] || { echo "evidence release contains a non-file entry" >&2; exit 1; }
          for name in \
            "$CANDIDATE_LEDGER_NAME" \
            "$PHASE7_RUNTIME_RECEIPTS_NAME" \
            "$PHASE8_REVIEWER_RECEIPTS_NAME" \
            "$PHASE8_RETRIEVAL_RECEIPTS_NAME"; do
            path="$CURRENT_ASSET_DIR/$name"
            [[ ! -e "$path" ]] || { echo "candidate asset leaked into the evidence bundle root: $name" >&2; exit 1; }
          done
      - name: Download candidate ledger and collections outside the bundle root
        env:
          CANDIDATE_LEDGER_NAME: ${{ inputs.candidate_ledger_name }}
          CANDIDATE_RELEASE_TAG: ${{ inputs.candidate_release_tag }}
          GH_TOKEN: ${{ github.token }}
          PHASE7_RUNTIME_RECEIPTS_NAME: ${{ inputs.phase7_runtime_receipts_name }}
          PHASE8_RETRIEVAL_RECEIPTS_NAME: ${{ inputs.phase8_retrieval_receipts_name }}
          PHASE8_REVIEWER_RECEIPTS_NAME: ${{ inputs.phase8_reviewer_receipts_name }}
        shell: bash
        run: |
          set -euo pipefail
          bundle_real="$(realpath -m "$BUNDLE_ROOT")"
          candidate_real="$(realpath -m "$CANDIDATE_ASSET_DIR")"
          [[ "$candidate_real" != "$bundle_real" && "$candidate_real" != "$bundle_real/"* ]] || { echo "candidate asset directory must remain outside the evidence bundle root" >&2; exit 1; }
          mkdir -p "$CANDIDATE_ASSET_DIR"
          [[ -z "$(find "$CANDIDATE_ASSET_DIR" -mindepth 1 -maxdepth 1 -print -quit)" ]] || { echo "candidate asset directory is not empty" >&2; exit 1; }
          gh release download "$CANDIDATE_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$CANDIDATE_ASSET_DIR"
          mapfile -d '' candidate_assets < <(find "$CANDIDATE_ASSET_DIR" -mindepth 1 -maxdepth 1 -type f -print0)
          [[ ${#candidate_assets[@]} -gt 0 ]] || { echo "candidate release downloaded no assets" >&2; exit 1; }
          [[ -z "$(find "$CANDIDATE_ASSET_DIR" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" ]] || { echo "candidate release contains a non-file entry" >&2; exit 1; }
          for name in \
            "$CANDIDATE_LEDGER_NAME" \
            "$PHASE7_RUNTIME_RECEIPTS_NAME" \
            "$PHASE8_REVIEWER_RECEIPTS_NAME" \
            "$PHASE8_RETRIEVAL_RECEIPTS_NAME"; do
            path="$CANDIDATE_ASSET_DIR/$name"
            [[ -f "$path" && ! -L "$path" ]] || { echo "required candidate asset is missing: $name" >&2; exit 1; }
          done
      - name: Download accepted previous release assets
        env:
          CANDIDATE_LEDGER_NAME: ${{ inputs.candidate_ledger_name }}
          EVIDENCE_RELEASE_TAG: ${{ inputs.evidence_release_tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$ISOLATED_WORKSPACE"
          python scripts/download_openai_release_ledger_assets.py \
            --ledger "$CANDIDATE_ASSET_DIR/$CANDIDATE_LEDGER_NAME" \
            --bundle-root "$BUNDLE_ROOT" \
            --current-repository "$GITHUB_REPOSITORY" \
            --current-release-tag "$EVIDENCE_RELEASE_TAG"
      - name: Stage only candidate evidence and bind the trusted source identity
        env:
          CANDIDATE_LEDGER_NAME: ${{ inputs.candidate_ledger_name }}
          PHASE7_RUNTIME_RECEIPTS_NAME: ${{ inputs.phase7_runtime_receipts_name }}
          PHASE8_RETRIEVAL_RECEIPTS_NAME: ${{ inputs.phase8_retrieval_receipts_name }}
          PHASE8_REVIEWER_RECEIPTS_NAME: ${{ inputs.phase8_reviewer_receipts_name }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 "$CANDIDATE_ASSET_DIR/$CANDIDATE_LEDGER_NAME" "$ISOLATED_WORKSPACE/research-skills-openai/reports/release-ledger.json"
          install -m 0644 "$CANDIDATE_ASSET_DIR/$CANDIDATE_LEDGER_NAME" "$RELEASE_RUNNER_WORKSPACE/research-skills-openai/reports/release-ledger.json"
          install -m 0644 "$CANDIDATE_ASSET_DIR/$PHASE7_RUNTIME_RECEIPTS_NAME" "$ISOLATED_WORKSPACE/tests/openai_phase7/current-version-runtime-receipts.yaml"
          install -m 0644 "$CANDIDATE_ASSET_DIR/$PHASE8_REVIEWER_RECEIPTS_NAME" "$ISOLATED_WORKSPACE/tests/openai_phase8/live-repeat-receipts.yaml"
          install -m 0644 "$CANDIDATE_ASSET_DIR/$PHASE8_RETRIEVAL_RECEIPTS_NAME" "$ISOLATED_WORKSPACE/tests/openai_phase8/retrieval-receipts.yaml"
          cd "$ISOLATED_WORKSPACE"
          TRUSTED_COMMIT="${{ github.sha }}" python -c 'import json,os; ledger=json.load(open("research-skills-openai/reports/release-ledger.json",encoding="utf-8"))["release"]; contracts=ledger["installable_contracts"]; identity={"plugin_version":ledger["version"],"source_commit":os.environ["TRUSTED_COMMIT"],"manifest_sha256":contracts["manifest_sha256"],"registry_sha256":contracts["registry_sha256"],"skill_tree_sha256":ledger["installable_skill_tree"]["sha256"]}; json.dump({"source_identity":identity},open(os.environ["EXPECTED_IDENTITY"],"w",encoding="utf-8"),sort_keys=True)'
          mapfile -t changed_paths < <(git diff --name-only)
          for path in "${changed_paths[@]}"; do
            case "$path" in
              research-skills-openai/reports/release-ledger.json|tests/openai_phase7/current-version-runtime-receipts.yaml|tests/openai_phase8/live-repeat-receipts.yaml|tests/openai_phase8/retrieval-receipts.yaml) ;;
              *) echo "isolated workspace changed outside the evidence allowlist: $path" >&2; exit 1 ;;
            esac
          done
          [[ -z "$(git ls-files --others --exclude-standard)" ]] || { echo "isolated workspace created an untracked file" >&2; exit 1; }
          mapfile -t runner_changed_paths < <(git -C "$RELEASE_RUNNER_WORKSPACE" diff --name-only)
          [[ ${#runner_changed_paths[@]} -eq 1 && "${runner_changed_paths[0]}" == "research-skills-openai/reports/release-ledger.json" ]] || { echo "release-runner workspace changed outside its ledger input" >&2; exit 1; }
          [[ -z "$(git -C "$RELEASE_RUNNER_WORKSPACE" ls-files --others --exclude-standard)" ]] || { echo "release-runner workspace created an untracked file" >&2; exit 1; }
      - name: Build Phase 7 and Phase 8 reports and validate complete Preview in one process
        env:
          PHASE7_ASSET_INDEX_PATTERN: ${{ inputs.phase7_asset_index_pattern }}
          PHASE8_ASSET_INDEX_PATTERN: ${{ inputs.phase8_asset_index_pattern }}
          GH_TOKEN: ${{ secrets.OPENAI_PREVIEW_GOVERNANCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo "OPENAI_PREVIEW_GOVERNANCE_TOKEN is required" >&2; exit 1; }
          mapfile -d '' phase7_indexes < <(find "$CURRENT_ASSET_DIR" -maxdepth 1 -type f -name "$PHASE7_ASSET_INDEX_PATTERN" -print0 | sort -z)
          mapfile -d '' phase8_indexes < <(find "$CURRENT_ASSET_DIR" -maxdepth 1 -type f -name "$PHASE8_ASSET_INDEX_PATTERN" -print0 | sort -z)
          [[ ${#phase7_indexes[@]} -eq 10 ]] || { echo "Phase 7 pattern must select exactly ten asset indexes" >&2; exit 1; }
          [[ ${#phase8_indexes[@]} -eq 12 ]] || { echo "Phase 8 pattern must select exactly twelve asset indexes" >&2; exit 1; }
          declare -A phase7_index_set=()
          for path in "${phase7_indexes[@]}"; do phase7_index_set["$path"]=1; done
          for path in "${phase8_indexes[@]}"; do
            [[ -z "${phase7_index_set[$path]:-}" ]] || { echo "Phase 7 and Phase 8 asset index selections overlap" >&2; exit 1; }
          done
          cd "$ISOLATED_WORKSPACE"
          python scripts/validate_openai_preview_accepted_phase78.py \
            --bundle-root "$BUNDLE_ROOT" \
            --evidence-root "$CURRENT_ASSET_DIR" \
            --runtime-receipts tests/openai_phase7/current-version-runtime-receipts.yaml \
            --reviewer-receipts tests/openai_phase8/live-repeat-receipts.yaml \
            --retrieval-receipts tests/openai_phase8/retrieval-receipts.yaml \
            --expected-source-identity "$EXPECTED_IDENTITY" \
            --phase7-asset-index-pattern "$PHASE7_ASSET_INDEX_PATTERN" \
            --phase8-asset-index-pattern "$PHASE8_ASSET_INDEX_PATTERN" \
            --phase7-report-output research-skills-openai/reports/phase7-mode-results.json \
            --phase8-report-output research-skills-openai/reports/phase8-corpus-results.json \
            > "$PHASE78_BRIDGE_RESULT"
          mapfile -t changed_paths < <(git diff --name-only)
          for path in "${changed_paths[@]}"; do
            case "$path" in
              research-skills-openai/reports/release-ledger.json|research-skills-openai/reports/phase7-mode-results.json|research-skills-openai/reports/phase8-corpus-results.json|tests/openai_phase7/current-version-runtime-receipts.yaml|tests/openai_phase8/live-repeat-receipts.yaml|tests/openai_phase8/retrieval-receipts.yaml) ;;
              *) echo "live bridge changed the trusted executable or contract tree: $path" >&2; exit 1 ;;
            esac
          done
          [[ -z "$(git ls-files --others --exclude-standard)" ]] || { echo "live bridge created an untracked workspace file" >&2; exit 1; }
      - name: Run standalone production release-evidence verifier
        env:
          GH_TOKEN: ${{ secrets.OPENAI_PREVIEW_GOVERNANCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo "OPENAI_PREVIEW_GOVERNANCE_TOKEN is required" >&2; exit 1; }
          cd "$RELEASE_RUNNER_WORKSPACE"
          python scripts/validate_openai_release_evidence.py \
            --bundle-root "$BUNDLE_ROOT" \
            --ledger research-skills-openai/reports/release-ledger.json \
            > "$RELEASE_RUNNER_RESULT"
          mapfile -t changed_paths < <(git diff --name-only)
          [[ ${#changed_paths[@]} -eq 1 && "${changed_paths[0]}" == "research-skills-openai/reports/release-ledger.json" ]] || { echo "standalone verifier changed its trusted workspace" >&2; exit 1; }
          [[ -z "$(git ls-files --others --exclude-standard)" ]] || { echo "standalone verifier created an untracked workspace file" >&2; exit 1; }
      - name: Build the non-overwriting accepted-run summary
        env:
          CANDIDATE_LEDGER_NAME: ${{ inputs.candidate_ledger_name }}
          CANDIDATE_RELEASE_TAG: ${{ inputs.candidate_release_tag }}
          EVIDENCE_RELEASE_TAG: ${{ inputs.evidence_release_tag }}
          PHASE7_RUNTIME_RECEIPTS_NAME: ${{ inputs.phase7_runtime_receipts_name }}
          PHASE8_RETRIEVAL_RECEIPTS_NAME: ${{ inputs.phase8_retrieval_receipts_name }}
          PHASE8_REVIEWER_RECEIPTS_NAME: ${{ inputs.phase8_reviewer_receipts_name }}
          TRUSTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$ISOLATED_WORKSPACE"
          python scripts/build_openai_preview_accepted_summary.py \
            --evidence-release-json "$EVIDENCE_RELEASE_JSON" \
            --candidate-release-json "$CANDIDATE_RELEASE_JSON" \
            --evidence-assets-json "$EVIDENCE_ASSETS_JSON" \
            --candidate-assets-json "$CANDIDATE_ASSETS_JSON" \
            --evidence-asset-dir "$CURRENT_ASSET_DIR" \
            --candidate-asset-dir "$CANDIDATE_ASSET_DIR" \
            --candidate-ledger "$CANDIDATE_ASSET_DIR/$CANDIDATE_LEDGER_NAME" \
            --candidate-asset-name "$CANDIDATE_LEDGER_NAME" \
            --candidate-asset-name "$PHASE7_RUNTIME_RECEIPTS_NAME" \
            --candidate-asset-name "$PHASE8_REVIEWER_RECEIPTS_NAME" \
            --candidate-asset-name "$PHASE8_RETRIEVAL_RECEIPTS_NAME" \
            --phase7-report research-skills-openai/reports/phase7-mode-results.json \
            --phase8-report research-skills-openai/reports/phase8-corpus-results.json \
            --phase78-bridge-result "$PHASE78_BRIDGE_RESULT" \
            --release-runner-result "$RELEASE_RUNNER_RESULT" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$TRUSTED_COMMIT" \
            --evidence-release-tag "$EVIDENCE_RELEASE_TAG" \
            --candidate-release-tag "$CANDIDATE_RELEASE_TAG" \
            --evidence-final-commit "$(tr -d '\r\n' < "$EVIDENCE_COMMIT_FILE")" \
            --candidate-final-commit "$(tr -d '\r\n' < "$CANDIDATE_COMMIT_FILE")" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$ACCEPTED_SUMMARY"
      - name: Prove all validation workspaces remained immutable
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -f "$TRUSTED_WORKSPACE_HASH" ]] || { echo "trusted checkout baseline hash is missing" >&2; exit 1; }
          after_hash="$(
            cd "$GITHUB_WORKSPACE"
            git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum -- | sha256sum | awk '{print $1}'
          )"
          [[ "$after_hash" == "$(tr -d '\r\n' < "$TRUSTED_WORKSPACE_HASH")" ]] || { echo "trusted checkout content changed" >&2; exit 1; }
          [[ -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain=v1 --untracked-files=all)" ]] || { echo "trusted checkout worktree changed" >&2; exit 1; }
          mapfile -t isolated_changes < <(git -C "$ISOLATED_WORKSPACE" diff --name-only)
          expected_isolated_changes=(
            research-skills-openai/reports/phase7-mode-results.json
            research-skills-openai/reports/phase8-corpus-results.json
            research-skills-openai/reports/release-ledger.json
            tests/openai_phase7/current-version-runtime-receipts.yaml
            tests/openai_phase8/live-repeat-receipts.yaml
            tests/openai_phase8/retrieval-receipts.yaml
          )
          mapfile -t expected_isolated_changes < <(printf '%s\n' "${expected_isolated_changes[@]}" | LC_ALL=C sort)
          mapfile -t isolated_changes < <(printf '%s\n' "${isolated_changes[@]}" | LC_ALL=C sort)
          [[ "${isolated_changes[*]}" == "${expected_isolated_changes[*]}" ]] || { echo "isolated workspace final allowlist mismatch" >&2; exit 1; }
          [[ -z "$(git -C "$ISOLATED_WORKSPACE" ls-files --others --exclude-standard)" ]] || { echo "isolated workspace created an untracked file" >&2; exit 1; }
          mapfile -t runner_changes < <(git -C "$RELEASE_RUNNER_WORKSPACE" diff --name-only)
          [[ ${#runner_changes[@]} -eq 1 && "${runner_changes[0]}" == "research-skills-openai/reports/release-ledger.json" ]] || { echo "release-runner workspace final allowlist mismatch" >&2; exit 1; }
          [[ -z "$(git -C "$RELEASE_RUNNER_WORKSPACE" ls-files --others --exclude-standard)" ]] || { echo "release-runner workspace created an untracked file" >&2; exit 1; }
      - name: Publish the non-overwriting accepted-run summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openai-preview-accepted-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openai-preview-accepted-summary/openai-preview-accepted-summary.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false
