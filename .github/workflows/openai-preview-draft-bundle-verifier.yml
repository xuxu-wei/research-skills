name: OpenAI Preview Draft Bundle Verifier

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Frozen A commit; must equal the current main dispatch SHA
        required: true
        type: string
      release_id:
        description: Existing draft evidence-prerelease numeric ID
        required: true
        type: string
      source_ci_run_id:
        description: Successful main-push OpenAI Plugin Preview run ID
        required: true
        type: string
      raw_asset_name:
        description: Already uploaded R asset name
        required: true
        type: string
      envelope_asset_name:
        description: Already uploaded E asset name
        required: true
        type: string
      verifier_asset_name:
        description: New V asset name; must not already exist
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: openai-preview-draft-verifier-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  verify-uploaded-r-e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the exact frozen source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install verifier dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Validate immutable inputs
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_ID: ${{ inputs.release_id }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          RAW_NAME: ${{ inputs.raw_asset_name }}
          ENVELOPE_NAME: ${{ inputs.envelope_asset_name }}
          VERIFIER_NAME: ${{ inputs.verifier_asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import os,re,sys; sha=os.environ["SOURCE_COMMIT"]; ids=(os.environ["RELEASE_ID"],os.environ["SOURCE_CI_RUN_ID"]); names=(os.environ["RAW_NAME"],os.environ["ENVELOPE_NAME"],os.environ["VERIFIER_NAME"]); ok=bool(re.fullmatch(r"[0-9a-f]{40}",sha)) and all(value.isdigit() and int(value)>0 for value in ids) and len(set(name.casefold() for name in names))==3 and all(bool(re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,255}",name)) for name in names); sys.exit(0 if ok else "invalid source, numeric ID, or asset name input")'
          [[ "$GITHUB_REF_NAME" == "main" && "$GITHUB_SHA" == "$SOURCE_COMMIT" ]] || { echo "workflow must be dispatched from main at source_commit" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]] || { echo "checkout does not match source_commit" >&2; exit 1; }
      - name: Snapshot draft Release, source CI, and uploaded asset API objects
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          RAW_NAME: ${{ inputs.raw_asset_name }}
          ENVELOPE_NAME: ${{ inputs.envelope_asset_name }}
          STAGING_ROOT: ${{ runner.temp }}/openai-preview-draft-verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STAGING_ROOT/api" "$STAGING_ROOT/bundle"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "$STAGING_ROOT/api/release.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_CI_RUN_ID}" > "$STAGING_ROOT/api/source-ci.json"
          python -c 'import json,os,sys; from pathlib import Path; root=Path(os.environ["STAGING_ROOT"]); release=json.load(open(root/"api/release.json",encoding="utf-8")); names={"raw":os.environ["RAW_NAME"],"envelope":os.environ["ENVELOPE_NAME"]}; ok=release.get("draft") is True and release.get("prerelease") is True; sys.exit("release must remain a draft prerelease") if not ok else None; assets=release.get("assets",[]); [(root/"api"/f"{role}-asset.json").write_text(json.dumps(next(item for item in assets if item.get("name")==name),sort_keys=True)+"\n",encoding="utf-8") for role,name in names.items() if len([item for item in assets if item.get("name")==name])==1]; sys.exit("R or E does not resolve to exactly one uploaded asset") if any(not (root/"api"/f"{role}-asset.json").is_file() for role in names) else None'
          raw_id="$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["STAGING_ROOT"],"api/raw-asset.json"),encoding="utf-8"))["id"])')"
          envelope_id="$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["STAGING_ROOT"],"api/envelope-asset.json"),encoding="utf-8"))["id"])')"
          gh api -H "Accept: application/octet-stream" "repos/${GITHUB_REPOSITORY}/releases/assets/${raw_id}" > "$STAGING_ROOT/bundle/$RAW_NAME"
          gh api -H "Accept: application/octet-stream" "repos/${GITHUB_REPOSITORY}/releases/assets/${envelope_id}" > "$STAGING_ROOT/bundle/$ENVELOPE_NAME"
      - name: Independently verify R and E and emit V
        env:
          STAGING_ROOT: ${{ runner.temp }}/openai-preview-draft-verifier
          RAW_NAME: ${{ inputs.raw_asset_name }}
          ENVELOPE_NAME: ${{ inputs.envelope_asset_name }}
          VERIFIER_NAME: ${{ inputs.verifier_asset_name }}
          VERIFY_RESULT: ${{ runner.temp }}/openai-preview-draft-verifier/verification-result.json
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_openai_preview_draft_bundle.py \
            --staging-root "$STAGING_ROOT" \
            --raw-export "bundle/$RAW_NAME" \
            --envelope "bundle/$ENVELOPE_NAME" \
            --release-snapshot api/release.json \
            --source-ci-run-snapshot api/source-ci.json \
            --raw-asset-snapshot api/raw-asset.json \
            --envelope-asset-snapshot api/envelope-asset.json \
            --output "bundle/$VERIFIER_NAME" \
            > "$VERIFY_RESULT"
          python -c 'import json,os,sys; result=json.load(open(os.environ["VERIFY_RESULT"],encoding="utf-8")); ok=result.get("verified") is True and result.get("gate_eligible") is False and result.get("accepted") is False; sys.exit(0 if ok else "draft verifier did not return its non-gating success contract")'
      - name: Upload V once and capture its GitHub API identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          VERIFIER_NAME: ${{ inputs.verifier_asset_name }}
          STAGING_ROOT: ${{ runner.temp }}/openai-preview-draft-verifier
        shell: bash
        run: |
          set -euo pipefail
          tag="$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["STAGING_ROOT"],"api/release.json"),encoding="utf-8"))["tag_name"])')"
          python -c 'import json,os,sys; release=json.load(open(os.path.join(os.environ["STAGING_ROOT"],"api/release.json"),encoding="utf-8")); name=os.environ["VERIFIER_NAME"]; sys.exit("V asset name already exists" if any(item.get("name")==name for item in release.get("assets",[])) else 0)'
          gh release upload "$tag" "$STAGING_ROOT/bundle/$VERIFIER_NAME" --repo "$GITHUB_REPOSITORY"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "$STAGING_ROOT/api/release-after-v.json"
          python -c 'import json,os,sys; from pathlib import Path; root=Path(os.environ["STAGING_ROOT"]); release=json.load(open(root/"api/release-after-v.json",encoding="utf-8")); matches=[item for item in release.get("assets",[]) if item.get("name")==os.environ["VERIFIER_NAME"]]; sys.exit("uploaded V did not resolve exactly once") if len(matches)!=1 else (root/"api/v-asset.json").write_text(json.dumps(matches[0],sort_keys=True)+"\n",encoding="utf-8")'
      - name: Retain V and its immutable upload receipt for I construction
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openai-preview-draft-v-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/openai-preview-draft-verifier/bundle/${{ inputs.verifier_asset_name }}
            ${{ runner.temp }}/openai-preview-draft-verifier/api/v-asset.json
            ${{ runner.temp }}/openai-preview-draft-verifier/verification-result.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false
