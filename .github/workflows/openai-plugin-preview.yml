name: OpenAI Plugin Preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install PyYAML
      - name: Check installable behavior version bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_openai_version_bump.py --base "$BASE_SHA"
      - name: Regenerate deterministic plugin metadata
        run: |
          python scripts/normalize_openai_skills.py
          python scripts/normalize_openai_references.py
          python scripts/generate_openai_workflow_registry.py
      - name: Run plugin audits and scenario evaluations
        run: |
          python scripts/audit_openai_research_plugin.py
          python scripts/audit_openai_research_proposal.py
          python scripts/audit_openai_research_perspective.py
          python scripts/test_openai_phase2_phase3.py
          python scripts/test_openai_phase4_scenarios.py --check-report
      - name: Validate plugin package and release channel
        run: |
          python scripts/codex_plugin_converter.py --mode codex --fail-on-invalid
          python scripts/validate_openai_preview_release.py
      - name: Check generated artifacts are committed
        run: git diff --exit-code
