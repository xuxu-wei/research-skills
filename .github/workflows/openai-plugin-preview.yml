name: OpenAI Plugin Preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  validate:
    name: OpenAI Plugin Preview / validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python -m pip install PyYAML==6.0.2 python-docx==1.2.0 Pillow==12.2.0
      - name: Check installable behavior version bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_openai_version_bump.py --base "$BASE_SHA"
      - name: Regenerate deterministic plugin metadata
        run: |
          python scripts/normalize_openai_skills.py
          python scripts/normalize_openai_references.py
          python scripts/generate_openai_workflow_registry.py
          python scripts/sync_openai_fixture_versions.py
      - name: Run structure and documentation audits
        run: |
          python scripts/audit_openai_research_plugin.py
          python scripts/audit_openai_research_proposal.py
          python scripts/audit_openai_research_perspective.py
          python scripts/test_openai_roadmap_contract.py
          python scripts/test_openai_release_contract.py
      - name: Run workflow contract evaluations
        run: |
          python scripts/test_openai_phase2_phase3.py
          python scripts/test_openai_phase4_scenarios.py --check-report
          python scripts/test_openai_phase6_context.py
      - name: Run artifact delivery validations
        run: |
          python scripts/test_openai_artifact_completeness.py
          python scripts/test_openai_article_docx_contract.py
      - name: Run personal readiness validations
        run: |
          python scripts/test_openai_phase7_modes.py --check-report
          python scripts/test_openai_phase8_corpus.py --check-report
          python scripts/test_validate_openai_personal_readiness.py
          python scripts/validate_openai_personal_readiness.py --check-report
      - name: Run canonical OpenAI plugin validator
        env:
          OPENAI_CODEX_VALIDATOR_COMMIT: 4ebc61c0f8df9852e709ff4b477b750fc816a69b
          OPENAI_CODEX_VALIDATOR_SHA256: ebda00d55d7518b127f675f062fb5c6e7a1ffdc0a99df1a55ac594400d7d3228
          OPENAI_CODEX_VALIDATOR_PATH: ${{ runner.temp }}/openai-validate-plugin.py
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/openai/codex/${OPENAI_CODEX_VALIDATOR_COMMIT}/codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py" \
            --output "$OPENAI_CODEX_VALIDATOR_PATH"
          echo "${OPENAI_CODEX_VALIDATOR_SHA256}  ${OPENAI_CODEX_VALIDATOR_PATH}" | sha256sum --check --strict
          python "$OPENAI_CODEX_VALIDATOR_PATH" research-skills-openai
      - name: Validate personal plugin package
        run: python scripts/codex_plugin_converter.py --mode codex --fail-on-invalid
      - name: Check generated artifacts are committed
        run: git diff --exit-code
